<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Network upgrades</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#results">Skip to upgrades</a>
  <main>
    <header><p class="eyebrow">Tempo</p><h1>Network upgrades</h1></header>
    <div class="controls">
      <label>View<select id="scope"><option value="latest">Latest upgrades</option><option value="all">All upgrades</option></select></label>
      <label class="search-control">Search<input id="search" type="search" placeholder="Search TIPs"></label>
      <label id="report-picker" hidden>Revision<select id="reports"></select></label>
    </div>
    <p class="sr-only" id="load-status" role="status" aria-live="polite">Loading report…</p>
    <div id="snapshot"></div>
    <p id="result-count" role="status" aria-live="polite"></p>
    <div id="results" tabindex="-1"></div>
  </main>
</body>
</html>
