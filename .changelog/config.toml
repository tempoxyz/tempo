# Changelogs configuration for alloy-tempo crate publishing.
# See https://github.com/wevm/changelogs for docs.

# How to bump packages that depend on changed packages.
dependent_bump = "patch"

# Ignore all workspace-only crates (not published to crates.io).
ignore = [
    "antithesis-trie-shapes",
    "exithatch",
    "reth-state-root-antithesis",
    "tempo",
    "tempo-consensus",
    "tempo-consensus-config",
    "tempo-corpus",
    "tempo-dkg-onchain-artifacts",
    "tempo-e2e",
    "tempo-evm",
    "tempo-ext",
    "tempo-eyre",
    "tempo-faucet",
    "tempo-fuzz-harness",
    "tempo-fuzz-types",
    "tempo-invariants",
    "tempo-nitro-attestation",
    "tempo-nitro-attestation-fuzz",
    "tempo-node",
    "tempo-node-launcher",
    "tempo-payload-builder",
    "tempo-payload-types",
    "tempo-precompiles",
    "tempo-precompiles-macros",
    "tempo-state-bloat",
    "tempo-telemetry-util",
    "tempo-transaction-pool",
    "tempo-validator-config",
    "tempo-vsock-proxy",
    "tempo-xtask",
    "tempo-zone",
    "tempo-zone-prover-enclave",
    "tempo-zone-prover-utils",
    "tempo-zones-antithesis",
    "zone-chainspec",
    "zone-checker",
    "zone-evm",
    "zone-fuzz-harness",
    "zone-l1",
    "zone-node",
    "zone-p2p",
    "zone-payload",
    "zone-precompiles",
    "zone-primitives",
    "zone-prover",
    "zone-rpc",
    "zone-sequencer",
    "zone-spf",
]

# Release PR runs never upload to crates.io (publish.yml does), so track the SDK
# crates by git tag instead of registry state. Otherwise a failed crates.io
# publish makes every later run re-create the existing release tags.
private = ["tempo-alloy", "tempo-chainspec", "tempo-contracts", "tempo-hardfork", "tempo-primitives"]

[changelog]
format = "per-crate"

# The published SDK crates release together and share one version.
[[fixed]]
members = ["tempo-contracts", "tempo-primitives", "tempo-alloy", "tempo-chainspec", "tempo-hardfork"]
