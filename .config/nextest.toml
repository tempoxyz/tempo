[profile.default]
slow-timeout = { period = "3m", terminate-after = 1 }

[profile.ci]
fail-fast = false
retries = 2
test-threads = "num-cpus"

[profile.ci.junit]
path = "junit.xml"

# Start the longest e2e tests first so they overlap with the rest of their
# partition instead of extending its tail.
[[profile.ci.overrides]]
filter = """
  package(tempo-e2e) & (
    test(/^tests::dkg::fast_sync_after_full_dkg::/) |
    test(=tests::restart::validator_catches_up_with_gap_of_three_epochs) |
    test(=tests::sync::can_restart_after_joining_from_snapshot) |
    test(=tests::backfill::validator_joins_on_large_gap_without_triggering_pipeline_sync)
  )
"""
priority = 100

# tempo-e2e tests spawn multiple execution nodes, each creating 4 rayon thread
# pools (cpu, rpc, trie, storage) via reth's Runtime. Even with test_with_handle()
# (2 threads per pool), running many in parallel causes OOM on CI.
# threads-required = 4 means nextest counts each test as needing 4 of the -j slots,
# so on a 32-vCPU runner (-j 32) at most 8 e2e tests run concurrently.
[[profile.ci.overrides]]
filter = "package(tempo-e2e)"
failure-output = "never"
threads-required = 4

# Dedicated profile for live RPC matrix tests (testnet/devnet).
# These hit rate-limited external endpoints, so we serialize them and allow
# more retries than regular tests.
[profile.ci-rpc]
inherits = "ci"
test-threads = 1
retries = 3
slow-timeout = { period = "5m", terminate-after = 1 }

# tempo-node integration tests (pool, block_building, etc.) also launch full
# execution nodes with rayon pools. Limit to 4 slots so at most 8 run in parallel.
[[profile.ci.overrides]]
filter = "package(tempo-node) & binary(it)"
threads-required = 4

[[profile.default.overrides]]
filter = "test(can_restart_after_joining_from_snapshot)"
failure-output = "final"

# Local development defaults (same constraints apply)
[[profile.default.overrides]]
filter = """
  package(tempo-e2e) & (
    test(=tests::sync::can_restart_after_joining_from_snapshot) |
    test(=tests::dkg::fast_sync_after_full_dkg::validator_can_fast_sync_after_full_dkg)
  )
"""
threads-required = "num-test-threads"
priority = -100

[[profile.default.overrides]]
filter = "package(tempo-e2e)"
threads-required = 4

[[profile.default.overrides]]
filter = "package(tempo-node) & binary(it)"
threads-required = 4

# The longest Zone integration tests start first so they don't extend the tail
# of their test partition.
[[profile.ci.overrides]]
filter = """
  package(zone-node) & binary(it) &
    test(/^(network_chaos_e2e|network_chaos_p2p_e2e|hardfork_e2e|hardfork_settlement_e2e)::/)
"""
priority = 100

# Integration tests spin up full reth nodes — limit concurrency to avoid
# resource contention and flaky timeouts on CI runners.
[[profile.ci.overrides]]
filter = """
  package(/^zone-/) & (
    test(/^(e2e|earn_zone_e2e|l1_e2e|network_chaos_e2e|network_chaos_p2p_e2e|restart_e2e|handoff_e2e)::/) |
    test(advance_tempo)
  )
"""
threads-required = 4
