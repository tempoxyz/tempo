[package]
name = "tempo-ext"
description = "Extension dispatch and management for the Tempo CLI"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Release signing (`tempo-sign`). Off by default so the launcher only links verification.
sign = ["dep:minisign"]

[[bin]]
name = "tempo-sign"
path = "src/bin/tempo-sign.rs"
required-features = ["sign"]

[dependencies]
clap.workspace = true
dirs-next.workspace = true
semver.workspace = true
minisign = { workspace = true, optional = true }
minisign-verify.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
minisign.workspace = true
# Run the signer-to-installer tests without `--features sign`.
tempo-ext = { path = ".", features = ["sign"] }
