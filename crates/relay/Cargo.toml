[package]
name = "tempo-relay"
description = "Composable Tempo JSON-RPC relay and development fee payer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["http"]
http = ["dep:axum", "dep:jsonrpsee"]
storage = ["dep:sqlx"]

[[test]]
name = "relay"
required-features = ["http"]

[dependencies]
tempo-alloy.workspace = true
tempo-primitives = { workspace = true, features = ["std"] }
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
jsonrpsee = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
futures.workspace = true
alloy-sol-types.workspace = true
alloy-json-abi.workspace = true
alloy-dyn-abi = { version = "1.7.2", default-features = false }
url.workspace = true
indexmap.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres"], optional = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
alloy-signer.workspace = true
rustls.workspace = true
tempfile.workspace = true
