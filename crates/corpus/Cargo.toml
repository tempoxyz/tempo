[package]
name = "tempo-corpus"
description = "Historical execution corpus: capture and database-free replay of archive ranges"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["exec"]
# Capture and replay (the `exec` module), with the EVM and database crates they need. The
# format, store, gc and reading blocks as fuzz inputs (`fuzz`) need none of them.
exec = [
  "dep:alloy-eip7928",
  "dep:reth-execution-types",
  "dep:reth-cli-util",
  "dep:crossbeam-channel",
  "dep:reth-consensus",
  "dep:reth-trie-common",
  "dep:reth-storage-api",
  "dep:reth-evm",
  "dep:reth-provider",
  "dep:evm2",
  "dep:tempo-evm",
  "dep:schnellru",
]
# Parquet corpus index (`tempo corpus index/select`).
index = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema", "dep:parquet"]

[dependencies]
alloy-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-execution-types = { workspace = true, optional = true }
evm2 = { workspace = true, optional = true }
tempo-contracts.workspace = true
tempo-evm = { workspace = true, features = ["default"], optional = true }
tempo-primitives = { workspace = true, features = ["default"] }
reth-evm = { workspace = true, optional = true }
reth-provider = { workspace = true, optional = true }
reth-chainspec.workspace = true
reth-cli-util = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
reth-consensus = { workspace = true, optional = true }
reth-trie-common = { workspace = true, optional = true }
reth-storage-api = { workspace = true, features = ["db-api"], optional = true }
alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-eip7928 = { workspace = true, optional = true }
alloy-eips.workspace = true
tempo-chainspec = { workspace = true, features = ["reth"] }
tempo-fuzz-types.workspace = true

bincode.workspace = true
bytes.workspace = true
eyre.workspace = true
futures.workspace = true
object_store = { version = "0.14.2", features = ["aws"] }
parking_lot.workspace = true
schnellru = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
slatedb = { version = "=0.17.0", default-features = false, features = ["aws", "moka", "zstd"] }
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
wincode = { version = "0.6", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
arrow-array = { version = "60", optional = true }
arrow-buffer = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"], optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
