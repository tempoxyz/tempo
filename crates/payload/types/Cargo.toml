[package]
name = "tempo-payload-types"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-dkg-onchain-artifacts.workspace = true
tempo-primitives = { workspace = true, features = ["reth-codec", "serde"] }

reth-ethereum-engine-primitives.workspace = true
# Only to enable its `account-ext` feature.
reth-evm.workspace = true
reth-node-api.workspace = true
reth-payload-primitives.workspace = true
reth-primitives-traits.workspace = true

alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-engine.workspace = true

derive_more.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

antithesis_sdk = { workspace = true, optional = true }
serde_json = { workspace = true, default-features = true, optional = true }

[dev-dependencies]
tempo-primitives = { workspace = true, features = ["arbitrary", "reth-codec", "serde", "test-utils"] }
serde_json.workspace = true

[features]
fuzz = ["dep:antithesis_sdk", "antithesis_sdk/full", "dep:serde_json"]
