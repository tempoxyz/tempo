[package]
name = "tempo-fuzz-engine"
description = "Tempo's stateless block executor that fuzzing and replay harnesses build on"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["asm-keccak"] }
alloy-genesis.workspace = true
alloy-rlp.workspace = true
bincode.workspace = true
evm2.workspace = true
serde.workspace = true
invariants-core.workspace = true
reth-primitives-traits.workspace = true
reth-chainspec.workspace = true
reth-consensus.workspace = true
reth-evm.workspace = true
reth-execution-types.workspace = true
reth-trie-common.workspace = true
tempo-fuzz-types.workspace = true
tempo-invariants.workspace = true
tempo-chainspec.workspace = true
tempo-contracts.workspace = true
tempo-evm.workspace = true
tempo-precompiles.workspace = true
tempo-primitives = { workspace = true, features = ["reth", "mock-crypto"] }

[dev-dependencies]
tempo-primitives = { workspace = true, features = ["test-utils"] }
alloy-sol-types.workspace = true
commonware-codec.workspace = true
tempo-dkg-onchain-artifacts = { workspace = true, features = ["test-utils"] }
