[package]
name = "tempo-chainspec"
description = "Tempo hardfork configuration and chain specification helpers"

version = "1.11.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
tempo-finality = { workspace = true, optional = true }
tempo-hardfork.workspace = true
tempo-primitives.workspace = true

reth-cli = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-network-peers = { workspace = true, optional = true }

alloy-evm = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
alloy-genesis.workspace = true
once_cell.workspace = true
alloy-primitives.workspace = true
alloy-eips.workspace = true
eyre = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
paste.workspace = true

[dev-dependencies]
commonware-codec.workspace = true

[features]
default = ["std", "serde", "reth", "cli"]
std = [
    "tempo-hardfork/std",
    "alloy-eips/std",
    "alloy-evm?/std",
    "alloy-genesis/std",
    "alloy-primitives/std",
    "once_cell/std",
    "reth-chainspec?/std",
    "reth-network-peers?/std",
    "serde/std",
    "serde_json/std",
    "tempo-primitives/std",
]
serde = [
    "tempo-hardfork/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "tempo-primitives/serde"
]
evm = ["dep:alloy-evm", "tempo-hardfork/evm", "tempo-primitives/evm"]
reth = [
    "std",
    "dep:tempo-finality",
    "evm",
    "dep:reth-chainspec",
    "dep:reth-network-peers",
    "tempo-primitives/reth",
]
cli = [
    "reth",
    "dep:clap",
    "dep:reth-cli",
    "dep:eyre",
    "tempo-primitives/reth-codec",
]
