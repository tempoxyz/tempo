[package]
name = "tempo-revm"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-precompiles.workspace = true
tempo-primitives = { workspace = true, features = ["reth", "evm"] }
tempo-contracts.workspace = true
tempo-chainspec.workspace = true
tempo-zk.workspace = true

reth-evm.workspace = true
reth-storage-api = { workspace = true, optional = true }

revm.workspace = true

alloy-evm = { workspace = true, features = ["std"] }
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-sol-types.workspace = true

auto_impl.workspace = true
derive_more.workspace = true
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
rayon.workspace = true
schnellru.workspace = true

[dev-dependencies]
tempo-zk = { workspace = true, features = ["test-utils"] }
eyre.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
base64.workspace = true
p256.workspace = true
proptest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempo-evm.workspace = true
tempo-precompiles = { workspace = true, features = ["test-utils"] }
test-case.workspace = true

[features]
reth = ["dep:reth-storage-api"]
serde = [
	"revm/serde",
	"alloy-consensus/serde",
	"alloy-eips/serde",
	"alloy-primitives/serde",
	"p256/serde",
	"reth-storage-api?/serde",
	"tempo-chainspec/serde",
	"tempo-contracts/serde",
	"tempo-primitives/serde",
	"tempo-precompiles/serde"
]
