[package]
name = "tempo-nitro-attestation"
description = "Consensus-critical AWS Nitro attestation parsing and verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
aws-lc = ["dep:aws-lc-rs"]
# Builds development attestation documents under `NITRO_DEV_ROOT_DER`.
test-utils = ["dep:p384", "dep:sha2", "minicbor/std", "x509-cert/builder"]

[dependencies]
arrayvec = { version = "=0.7.8", default-features = false, features = ["serde"] }
hex-literal = "1"
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc"] }
minicbor-serde = { version = "=0.7.1", default-features = false, features = ["alloc"] }
serde = { workspace = true, features = ["alloc"] }
serde_with = { version = "=3.21.0", default-features = false, features = ["alloc"] }
x509-cert = { version = "=0.2.5", default-features = false }

# aws-lc
aws-lc-rs = { workspace = true, optional = true }

# test-utils
p384 = { workspace = true, features = ["pem"], optional = true }
sha2 = { workspace = true, features = ["oid"], optional = true }

[dev-dependencies]
base64.workspace = true
