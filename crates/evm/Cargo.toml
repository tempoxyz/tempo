[package]
name = "tempo-evm"
description = "TODO:"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-chainspec = { workspace = true, features = ["evm"] }
tempo-contracts.workspace = true
tempo-dkg-onchain-artifacts.workspace = true
tempo-payload-types = { workspace = true, optional = true }
tempo-precompiles.workspace = true
tempo-primitives = { workspace = true, features = ["evm", "std"] }

commonware-codec.workspace = true

reth-consensus = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
reth-evm-ethereum = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true, optional = true }
reth-rpc-eth-api = { workspace = true, optional = true }
reth-storage-api = { workspace = true, optional = true }

rayon = { workspace = true, optional = true }
alloy-consensus.workspace = true
alloy-eip7928.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true
alloy-rpc-types-eth = { workspace = true, optional = true }
auto_impl.workspace = true
evm2 = { workspace = true, features = ["block", "std"] }
evm2-macros.workspace = true

alloy-genesis = { workspace = true, features = ["std"], optional = true }
eyre = { workspace = true, optional = true }

derive_more.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# jit
evm2-jit = { workspace = true, features = ["llvm"], optional = true }

[dev-dependencies]
alloy-eips.workspace = true
alloy-genesis = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["asm-keccak", "keccak-cache-global"] }
alloy-signer-local = { workspace = true, features = ["mnemonic"] }
alloy-signer.workspace = true
alloy-sol-types.workspace = true
base64.workspace = true
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
criterion.workspace = true
eyre.workspace = true
indexmap = { workspace = true, features = ["serde"] }
insta.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
proptest.workspace = true
rand_08.workspace = true
reth-execution-cache.workspace = true
reth-execution-types.workspace = true
reth-ethereum-primitives.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
reth-storage-api.workspace = true
reth-stages.workspace = true
reth-trie.workspace = true
reth-trie-common.workspace = true
reth-trie-db.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempo-dkg-onchain-artifacts = { workspace = true, features = ["test-utils"] }
tempo-precompiles = { workspace = true, features = ["test-utils"] }
tempo-primitives = { workspace = true, features = ["arbitrary", "test-utils"] }
test-case.workspace = true
tikv-jemallocator = "0.6.1"

[features]
default = ["reth", "rpc", "engine"]
# reth integration: EVM configuration, block assembly, consensus and reth trait impls.
reth = [
    "dep:reth-chainspec",
    "dep:reth-consensus",
    "dep:reth-evm",
    "dep:reth-evm-ethereum",
    "dep:reth-primitives-traits",
    "dep:reth-storage-api",
    "tempo-chainspec/reth",
    "tempo-primitives/reth",
]
rpc = ["reth", "dep:alloy-rpc-types-eth", "dep:reth-rpc-eth-api", "tempo-primitives/serde", "tempo-primitives/reth-codec"]
engine = ["reth", "dep:tempo-payload-types", "dep:rayon"]
# Shared genesis state initialization helpers for genesis generators.
genesis = ["dep:alloy-genesis", "dep:eyre"]
# Native EVM2 JIT compilation; building requires LLVM.
jit = ["reth", "dep:evm2-jit", "reth-evm-ethereum?/jit"]

[[bench]]
name = "tip20_execution"
harness = false

[[bench]]
name = "dex_execution"
harness = false
