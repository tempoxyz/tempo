    { path = "evm2::interpreter::MessageInput::as_bytes", reason = "call input is readable only once gas covers its cost, use `tempo_precompiles::UnmeteredInput`" },
    { path = "evm2::interpreter::MessageInput::to_bytes", reason = "call input is readable only once gas covers its cost, use `tempo_precompiles::UnmeteredInput`" },
