[package]
name = "zone-p2p"
description = "Static authenticated P2P networking for Tempo Zones"
readme = "README.md"
version = "0.3.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
alloy-signer-local = { workspace = true }

commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true, default-features = true }
commonware-p2p = { workspace = true }
commonware-runtime = { workspace = true, features = ["external"] }
commonware-utils = { workspace = true }

const-hex = { workspace = true }
derive_more = { workspace = true, default-features = true }
eyre = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["alloc", "derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml.workspace = true
tracing = { workspace = true }

[dev-dependencies]
commonware-actor = { workspace = true }
