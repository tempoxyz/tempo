[package]
name = "zone-payload"
description = "Tempo Zone payload types and builder"
version = "0.3.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# tempo
tempo-evm.workspace = true
tempo-node.workspace = true
tempo-payload-types.workspace = true
tempo-primitives = { workspace = true, features = ["reth", "reth-codec", "serde", "serde-bincode-compat"] }
tempo-revm.workspace = true
tempo-transaction-pool.workspace = true
tempo-zone-contracts = { workspace = true, features = ["rpc", "serde", "std"] }
zone-chainspec.workspace = true
zone-evm.workspace = true
zone-l1.workspace = true
zone-primitives.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }

# reth
reth-basic-payload-builder.workspace = true
reth-chainspec = { workspace = true, default-features = true }
reth-errors.workspace = true
reth-evm.workspace = true
reth-node-api.workspace = true
reth-node-builder.workspace = true
reth-payload-builder.workspace = true
reth-payload-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-revm.workspace = true
reth-storage-api.workspace = true
reth-tasks.workspace = true
reth-transaction-pool.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true

# misc
eyre.workspace = true
serde = { workspace = true, features = ["alloc", "derive"] }
tracing.workspace = true
