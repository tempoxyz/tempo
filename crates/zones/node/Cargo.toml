[package]
name = "zone-node"
description = "Tempo Zone node assembly"
version = "0.3.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# tempo
tempo-chainspec.workspace = true
tempo-evm = { workspace = true, features = ["engine", "rpc"] }
tempo-node.workspace = true
tempo-precompiles.workspace = true
tempo-primitives.workspace = true
tempo-transaction-pool.workspace = true
tempo-alloy.workspace = true
tempo-contracts = { workspace = true, features = ["std", "serde", "rpc"] }
tempo-state-bloat = { workspace = true, optional = true }
zone-chainspec.workspace = true
zone-evm.workspace = true
zone-l1.workspace = true
zone-p2p.workspace = true
zone-payload.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }
zone-primitives = { workspace = true, features = ["serde", "std"] }
zone-prover.workspace = true
zone-rpc.workspace = true
zone-sequencer.workspace = true
zone-checker = { workspace = true, optional = true }

# reth
reth-chain-state.workspace = true
reth-chainspec = { workspace = true, default-features = true }
reth-consensus.workspace = true
reth-eth-wire-types.workspace = true
reth-ethereum = { workspace = true, features = ["cli", "node"], optional = true }
reth-evm.workspace = true
reth-node-api.workspace = true
reth-node-builder.workspace = true
reth-node-core.workspace = true
reth-payload-builder.workspace = true
reth-payload-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-provider.workspace = true
reth-revm = { workspace = true, features = ["witness"] }
reth-rpc.workspace = true
reth-rpc-api.workspace = true
reth-rpc-builder.workspace = true
reth-rpc-eth-api.workspace = true
reth-rpc-eth-types.workspace = true
reth-storage-api.workspace = true
reth-tasks.workspace = true
reth-tracing = { workspace = true, optional = true }
reth-transaction-pool.workspace = true
reth-trie-common = { workspace = true, features = ["std"] }
reth-cli-runner = { workspace = true, optional = true }
reth-rpc-server-types = { workspace = true, optional = true }
reth-cli-commands = { workspace = true, optional = true }
reth-db-api = { workspace = true, optional = true }
reth-trie = { workspace = true, optional = true }
reth-trie-db = { workspace = true, optional = true }

# alloy
alloy-chains.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-genesis.workspace = true
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["ws"] }
alloy-rlp.workspace = true
alloy-rpc-client = { workspace = true, default-features = true }
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
alloy-transport.workspace = true

# misc
minicbor.workspace = true
minicbor-serde.workspace = true
clap = { workspace = true, optional = true }
eyre.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
jsonrpsee.workspace = true
k256.workspace = true
metrics.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, default-features = true }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { version = "2", optional = true }
zeroize = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[build-dependencies]
vergen.workspace = true
vergen-git2.workspace = true

[dev-dependencies]
zone-chainspec = { workspace = true, features = ["test-utils"] }
zone-node = { path = ".", features = ["test-utils"] }

alloy = { workspace = true, features = ["full", "genesis", "providers", "rpc-types", "signer-local", "signer-mnemonic-all-languages", "signers"] }
alloy-contract.workspace = true
alloy-signer.workspace = true
base64 = { workspace = true, default-features = true }
const-hex.workspace = true
commonware-codec.workspace = true
commonware-cryptography = { workspace = true, default-features = true }
p256 = { workspace = true, features = ["ecdsa"] }
reth-ethereum = { workspace = true, features = ["node", "test-utils"] }
reth-tracing.workspace = true
reth-trie-common = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
revm.workspace = true
serde = { workspace = true, features = ["alloc", "derive"] }
sha2 = { workspace = true, default-features = true }
tempo-payload-types.workspace = true
tempo-precompiles = { workspace = true, features = ["test-utils"] }
tempo-revm.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
zone-spf.workspace = true
url = "2"

[features]
default = []
asm-keccak = [
  "alloy/asm-keccak",
  "alloy-evm/asm-keccak",
  "alloy-primitives/asm-keccak",
  "reth-node-core/asm-keccak",
  "revm/asm-keccak",
  "tempo-alloy/asm-keccak",
  "tempo-node/asm-keccak",
  "zone-node/asm-keccak",
]
cli = [
  "dep:reth-cli-commands",
  "dep:reth-db-api",
  "dep:reth-trie",
  "dep:reth-trie-db",
  "dep:sha2",
  "dep:tempo-state-bloat",
  "dep:reth-cli-runner",
  "dep:reth-rpc-server-types",
  "dep:clap",
  "dep:reth-ethereum",
  "dep:reth-tracing",
  "dep:url",
  "dep:zeroize",
  "dep:zone-checker",
  "zone-chainspec/cli",
]
jemalloc = [
  "reth-ethereum?/jemalloc",
  "reth-node-core/jemalloc",
  "reth-provider/jemalloc",
  "tempo-node/jemalloc",
  "zone-node/jemalloc",
]
keccak-cache-global = [
  "alloy-primitives/keccak-cache-global",
  "reth-ethereum?/keccak-cache-global",
  "reth-node-core/keccak-cache-global",
  "zone-node/keccak-cache-global",
]
test-utils = [
  "reth-db-api?/test-utils",
  "reth-trie?/test-utils",
  "reth-trie-db?/test-utils",
  "reth-chainspec/test-utils",
  "reth-consensus/test-utils",
  "reth-ethereum?/test-utils",
  "reth-node-builder/test-utils",
  "reth-payload-builder/test-utils",
  "reth-primitives-traits/test-utils",
  "reth-provider/test-utils",
  "reth-transaction-pool/test-utils",
  "tempo-precompiles/test-utils",
  "tempo-transaction-pool/test-utils",
  "reth-chain-state/test-utils",
  "reth-evm/test-utils",
  "reth-revm/test-utils",
  "reth-tasks/test-utils",
  "reth-trie-common/test-utils",
  "tempo-primitives/test-utils",
  "zone-chainspec/test-utils",
  "zone-node/test-utils",
  "zone-precompiles/test-utils",
]
