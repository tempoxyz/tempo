[package]
name = "zone-prover"
description = "Prover protocol components for Tempo Zones"
version = "0.3.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-zone-contracts = { workspace = true, features = ["std"] }
zone-spf.workspace = true

tempo-chainspec = { workspace = true }
tempo-nitro-attestation = { workspace = true, features = ["aws-lc"] }
tempo-precompiles = { workspace = true }

alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
keccak-const = { workspace = true }

futures = { workspace = true }
minicbor.workspace = true
minicbor-serde.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, default-features = true }
sha2 = { workspace = true, default-features = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["codec"] }

[dev-dependencies]
aws-lc-rs = { workspace = true, default-features = true }
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
reth-trie-common = { workspace = true, features = ["std"] }
tempo-primitives = { workspace = true, features = ["reth", "reth-codec", "serde", "serde-bincode-compat"] }
