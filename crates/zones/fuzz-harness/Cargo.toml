[package]
name = "zone-fuzz-harness"
description = "Fuzz harness for Tempo Zone batches: proves fuzzed zone blocks with the stateless proof function and checks T15 invariants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-chainspec.workspace = true
tempo-contracts = { workspace = true, features = ["std"] }
tempo-precompiles = { workspace = true, features = ["test-utils"] }
tempo-primitives.workspace = true
zone-chainspec = { workspace = true, features = ["test-utils"] }
zone-primitives = { workspace = true, features = ["std"] }
zone-spf.workspace = true

reth-chainspec = { workspace = true, default-features = true }
reth-execution-types.workspace = true
reth-trie-common = { workspace = true, features = ["std"] }

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true

arbitrary = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

[dev-dependencies]
alloy-consensus.workspace = true
arbitrary = { workspace = true, features = ["derive"] }
proptest.workspace = true
