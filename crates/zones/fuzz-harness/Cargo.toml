[package]
name = "zone-fuzz-harness"
description = "Tempo Zone's stateless block executor for fuzzing and replay, loaded as a cdylib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tempo-chainspec.workspace = true
tempo-contracts = { workspace = true, features = ["std"] }
tempo-evm.workspace = true
tempo-fuzz-engine.workspace = true
tempo-fuzz-types.workspace = true
tempo-precompiles.workspace = true
tempo-primitives = { workspace = true, features = ["reth"] }
zone-chainspec.workspace = true
zone-evm.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }
zone-primitives = { workspace = true, features = ["std"] }

alloy-consensus.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true
evm2.workspace = true
reth-chainspec.workspace = true
reth-consensus.workspace = true
reth-evm.workspace = true
reth-primitives-traits.workspace = true
serde.workspace = true
serde_json = { workspace = true, default-features = true }
thiserror.workspace = true

[dev-dependencies]
alloy-eips.workspace = true
bincode.workspace = true
tempo-precompiles = { workspace = true, features = ["test-utils"] }
test-case.workspace = true
