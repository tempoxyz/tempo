[package]
name = "zone-evm"
description = "Tempo Zone EVM configuration and block execution"
version = "0.3.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# zones
tempo-contracts = { workspace = true, features = ["std", "serde", "rpc"] }
zone-chainspec.workspace = true
zone-l1.workspace = true
zone-primitives.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }

# tempo
tempo-alloy.workspace = true
tempo-chainspec.workspace = true
tempo-evm = { workspace = true, features = ["engine", "rpc"] }
tempo-payload-types.workspace = true
tempo-precompiles.workspace = true
tempo-primitives.workspace = true

# reth
reth-chainspec = { workspace = true, default-features = true }
reth-evm.workspace = true
reth-evm-ethereum.workspace = true
reth-execution-types.workspace = true
reth-primitives-traits.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-eip7928.workspace = true
alloy-primitives.workspace = true
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-sol-types.workspace = true
evm2.workspace = true

# misc
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
alloy-genesis.workspace = true
alloy-rlp.workspace = true
eyre.workspace = true
serde_json = { workspace = true, default-features = true }
zone-precompiles = { workspace = true, features = ["std", "test-utils"] }
tempo-precompiles = { workspace = true, features = ["test-utils"] }
