[package]
name = "zone-spf"
description = "Stateless proof function for Tempo Zones"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-contracts = { workspace = true, features = ["std"] }
zone-chainspec.workspace = true
zone-evm.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }
zone-primitives = { workspace = true, features = ["std"] }

# Tempo
tempo-chainspec.workspace = true
tempo-evm.workspace = true
tempo-primitives.workspace = true
tempo-precompiles.workspace = true

# Alloy / EVM
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true
evm2.workspace = true
reth-chainspec = { workspace = true, default-features = true }
reth-evm.workspace = true
reth-evm-ethereum.workspace = true
reth-execution-types.workspace = true
reth-primitives-traits.workspace = true
reth-storage-api.workspace = true
reth-trie-common = { workspace = true, features = ["std"] }
reth-trie-sparse.workspace = true
serde = { workspace = true, optional = true, features = ["alloc"] }
thiserror = "2"

[features]
default = ["serde"]
serde = [
    "dep:serde",
    "alloy-primitives/serde",
    "tempo-contracts/serde",
    "zone-primitives/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "reth-primitives-traits/serde",
    "reth-storage-api/serde",
    "reth-trie-common/serde",
    "tempo-chainspec/serde",
    "tempo-precompiles/serde",
    "tempo-primitives/serde",
    "evm2/serde",
    "reth-execution-types/serde",
]
