[package]
name = "tempo-zone-contracts"
description = "Compatibility exports for Tempo Zone contract bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-contracts = { path = "../../contracts", default-features = false }

[features]
default = ["std", "serde", "rpc"]
std = ["tempo-contracts/std"]
serde = ["tempo-contracts/serde"]
rpc = ["tempo-contracts/rpc"]
