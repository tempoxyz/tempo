[package]
name = "tempo-fuzz-harness"
description = "Loadable transaction fuzzing harness for Tempo"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# `rlib` lets the benchmark call the C ABI in-process.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tempo-fuzz-engine.workspace = true
tempo-fuzz-types.workspace = true

[dev-dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
bincode.workspace = true
criterion.workspace = true
tempo-chainspec.workspace = true
tempo-contracts.workspace = true
tempo-primitives.workspace = true

[[bench]]
name = "execute"
harness = false
