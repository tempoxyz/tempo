# Vendored from paradigmxyz/reth at 42fa3c5; see README.
[package]
name = "reth-chain-state"
version = "2.7.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
homepage = "https://paradigmxyz.github.io/reth"
repository = "https://github.com/paradigmxyz/reth"
description = "Reth state related types and functionality."

[lints]
workspace = true

[dependencies]
reth-chainspec = { default-features = false, git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5" }
reth-execution-types = { default-features = false, git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5" }
reth-metrics = { git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5" }
reth-ethereum-primitives = { default-features = false, git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5" }
reth-primitives-traits = { version = "0.8.2", default-features = false }
reth-trie-sparse = { default-features = false, git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5", features = ["std"] }
reth-trie = { git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5" }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["map-foldhash", "std"] }
alloy-consensus = { version = "2.5.0", default-features = false }
revm = { version = "43.0.3", default-features = false, optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["sync", "macros"] }
tokio-stream = { version = "0.1.11", features = ["sync"] }
tracing = { version = "0.1.0", default-features = false, features = ["attributes"] }
derive_more = { version = "2", default-features = false, features = ["full"] }
metrics = { version = "0.24.0" }
parking_lot = { version = "0.12" }
pin-project = { version = "1.1.12" }
serde = { version = "1.0", default-features = false, optional = true }
alloy-signer = { version = "2.5.0", default-features = false, optional = true }
alloy-signer-local = { version = "2.5.0", default-features = false, optional = true }
rand = { version = "0.9", optional = true }

[dev-dependencies]
reth-primitives-traits = { version = "0.8.2", default-features = false, features = ["test-utils"] }
reth-testing-utils = { git = "https://github.com/paradigmxyz/reth", rev = "42fa3c5" }
alloy-signer = { version = "2.5.0", default-features = false }
alloy-signer-local = { version = "2.5.0", default-features = false }
rand = { version = "0.9" }
revm = { version = "43.0.3", default-features = false }

[features]
serde = ["dep:serde", "alloy-consensus/serde", "alloy-eips/serde", "alloy-primitives/serde", "parking_lot/serde", "rand?/serde", "reth-ethereum-primitives/serde", "reth-execution-types/serde", "reth-primitives-traits/serde", "reth-trie/serde", "revm?/serde"]
test-utils = ["alloy-primitives/getrandom", "alloy-signer", "alloy-signer-local", "rand", "reth-chainspec/test-utils", "reth-primitives-traits/test-utils", "reth-trie/test-utils", "reth-ethereum-primitives/test-utils", "reth-trie-sparse/test-utils", "dep:revm"]
