# Path rules for the determinator, applied before its defaults. The first matching rule wins.
# A changed path that no rule matches and no package owns marks every package changed.

# CI configuration that changes how every test builds or runs.
[[path-rule]]
globs = [
  ".config/**",
  ".github/actions/**",
  ".github/affected-crates/**",
  ".github/scripts/native-libs.sh",
  ".github/workflows/test.yml",
]
mark-changed = "all"

# xtask's hardfork generator tests read the bench workflow.
[[path-rule]]
globs = [".github/workflows/bench.yml"]
mark-changed = ["tempo-xtask"]

# Files no Rust test reads.
[[path-rule]]
globs = [
  ".github/**",
  "*.md",
  "docs/**",
  "tempoup/**",
  "tips/*.md",
  "Dockerfile*",
  "*.hcl",
  "*.nu",
  "Justfile",
  "flake.nix",
  "flake.lock",
  "deny.toml",
  "osv-scanner.toml",
  "typos.toml",
  "review.yml",
  "CNAME",
]
mark-changed = []
