name: Reproducible Build

# Builds the byte-deterministic `tempo` binary for x86_64-unknown-linux-gnu
# from the pinned Dockerfile.reproducible recipe.

permissions: {}

# Coalesce push runs on main: when commits land in quick succession, only
# build the most recent. Manual dispatches are not cancelled — those are
# user-initiated work we don't want to silently abort.
concurrency:
  group: reproducible-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or full SHA) to build reproducibly"
        type: string
        required: false
        default: "main"

jobs:
  build:
    permissions:
      id-token: write
      contents: read
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-build.yml@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
    with:
      # `inputs.ref` is empty on push events (push has no inputs); checkout
      # falls back to github.sha, the pushed commit. On workflow_dispatch it's
      # the user-chosen ref (defaulted to main).
      ref: ${{ inputs.ref }}
      binary-name: tempo
      runs-on: depot-ubuntu-latest-16
      retention-days: 7
