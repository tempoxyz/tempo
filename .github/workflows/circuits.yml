name: Circuits

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "circuits/**"
      - ".github/workflows/circuits.yml"
  pull_request:
    paths:
      - "circuits/**"
      - ".github/workflows/circuits.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oidc-rs256:
    name: oidc-rs256
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: circuits/oidc-rs256
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install circom
        run: |
          curl -sSfL -o "$RUNNER_TEMP/circom" \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $RUNNER_TEMP/circom" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/circom"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
