name: Zones Nitro prover benchmark

on:
  schedule:
    - cron: "45 3 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      feature-sha:
        description: Exact 40-character Tempo monorepo commit for the feature phase (both phases in prover mode).
        type: string
        required: true
      comparison-mode:
        description: Compare revisions with Nitro, or one revision with proving off/on.
        type: choice
        required: true
        default: revision
        options: [revision, prover]
      tempo-hardfork:
        description: Tempo L1 hardfork for both phases (for example, t14).
        type: string
        required: true
        default: t13
      region:
        description: Existing AWS benchmark region.
        type: choice
        required: true
        default: us-east-1
        options: [us-east-1, us-west-2, eu-central-1, ap-southeast-1, ap-northeast-1]
      preset:
        description: Neobank scenario containing a withdrawal.
        type: choice
        required: true
        default: full-journey
        options: [full-journey, full-journey-pathusd-fees, private-withdrawal, swapped-lifecycle, swapped-redemption]
      accounts:
        type: string
        required: true
        default: "20"
      count:
        type: string
        required: true
        default: "20"
      tps:
        type: string
        required: true
        default: "5"
      max-concurrent:
        type: string
        required: true
        default: "4"
      state-bloat-mib:
        description: Tempo L1 bloat. Start with 0 for the Nitro smoke test.
        type: string
        required: true
        default: "0"
      zone-state-bloat-mib:
        description: Zone PathUSD dump MiB (0-16). Use full-journey-pathusd-fees; start with 1 and L1 bloat 0.
        type: string
        required: true
        default: "0"

permissions: {}

concurrency:
  group: zones-prover-benchmark-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'tempoxyz/tempo' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.ZONES_PROVER_NIGHTLY_ENABLED == 'true') ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, 'derek bench ')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    outputs:
      feature-sha: ${{ steps.request.outputs.feature-sha }}
      pr-number: ${{ steps.request.outputs.pr-number }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Mint benchmark repository read token
        id: benchmark-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          scope: tempoxyz/tempo-multi-region-benchmark
          policy: bench-e2e-multi-region
      - name: Check org membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.benchmark-token.outputs.token }}
          script: |
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              try {
                await github.rest.orgs.checkMembershipForUser({org: 'tempoxyz', username});
              } catch {
                core.setFailed(`@${username} must be a tempoxyz member`);
                return;
              }
            }
      - name: Resolve PR SHA
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FEATURE_SHA: ${{ inputs.feature-sha || '' }}
        with:
          script: |
            if (context.eventName === 'schedule') {
              core.setOutput('feature-sha', context.sha);
            } else if (context.eventName === 'issue_comment') {
              // Bind approval to the event's immutable comment payload, including on reruns.
              const match = /^derek bench(?: prover)? ([0-9a-f]{40})$/.exec(context.payload.comment.body);
              if (!match) {
                core.setFailed('Use derek bench <40-character SHA> or derek bench prover <40-character SHA>');
                return;
              }
              const sha = match[1];
              const number = context.issue.number;
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
              if (pr.head.repo?.full_name !== 'tempoxyz/tempo') {
                core.setFailed('Benchmark PR head must be in tempoxyz/tempo');
                return;
              }
              if (pr.head.sha !== sha) {
                core.setFailed('PR head must match the approved SHA; post a new benchmark comment for the current head');
                return;
              }
              core.setOutput('feature-sha', sha);
              core.setOutput('pr-number', number);
            } else if (/^[0-9a-f]{40}$/.test(process.env.FEATURE_SHA)) {
              core.setOutput('feature-sha', process.env.FEATURE_SHA);
            } else {
              core.setFailed('feature-sha must be an exact 40-character commit SHA');
            }

  benchmark:
    needs: authorize
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      BASELINE_ZONES_ROOT: ${{ github.workspace }}/baseline-zones
      FEATURE_ZONES_ROOT: ${{ github.workspace }}/feature-zones
      BENCH_TEMPO_ROOT: ${{ github.workspace }}/tempo
      BENCH_EARN_ROOT: ${{ github.workspace }}/earn
      BENCH_COMPARISON_MODE: ${{ github.event_name == 'schedule' && 'prover' || inputs.comparison-mode || 'revision' }}
      BENCH_REGION: ${{ inputs.region || 'us-east-1' }}
      BENCH_TEMPO_HARDFORK: ${{ inputs['tempo-hardfork'] || 't13' }}
      BENCH_PRESET: ${{ inputs.preset || 'full-journey' }}
      BENCH_ACCOUNTS: ${{ inputs.accounts || '20' }}
      BENCH_COUNT: ${{ inputs.count || '20' }}
      BENCH_TPS: ${{ inputs.tps || '5' }}
      BENCH_MAX_CONCURRENT: ${{ inputs.max-concurrent || '4' }}
      BENCH_L1_BLOAT_MIB: ${{ inputs.state-bloat-mib || '0' }}
      BENCH_ZONE_BLOAT_MIB: ${{ inputs.zone-state-bloat-mib || '0' }}
      BENCH_BATCH_INTERVAL_BLOCKS: "20"
      BENCH_RESULTS_PATH: ${{ github.workspace }}/zones-prover-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Mint benchmark repository read token
        id: benchmark-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          scope: tempoxyz/tempo-multi-region-benchmark
          policy: bench-e2e-multi-region
      # A benchmark-only rerun can reuse authorize outputs, so recheck membership here.
      - name: Check org membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          github-token: ${{ steps.benchmark-token.outputs.token }}
          script: |
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              try {
                await github.rest.orgs.checkMembershipForUser({org: 'tempoxyz', username});
              } catch {
                core.setFailed(`@${username} must be a tempoxyz member`);
                return;
              }
            }
      - name: Mint Earn read token
        id: earn-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          scope: tempoxyz/earn
          policy: zones-read
      - name: Check out benchmark infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/tempo-multi-region-benchmark
          ref: 9a36a896d293cda29cb6aa4e06524c2d9f877c77 # matched prover-off/on reporting
          path: benchmark
          token: ${{ steps.benchmark-token.outputs.token }}
          persist-credentials: false
      - name: Check out baseline Tempo with Zones
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/tempo
          ref: ${{ env.BENCH_COMPARISON_MODE == 'prover' && needs.authorize.outputs.feature-sha || 'main' }}
          path: baseline-zones
          submodules: recursive
          persist-credentials: false
      - name: Check out feature Tempo with Zones
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/tempo
          ref: ${{ needs.authorize.outputs.feature-sha }}
          path: feature-zones
          submodules: recursive
          persist-credentials: false
      - name: Check out Tempo with native Nitro verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/tempo
          ref: ${{ env.BENCH_COMPARISON_MODE == 'prover' && needs.authorize.outputs.feature-sha || 'main' }}
          path: tempo
          submodules: recursive
          persist-credentials: false
      - name: Check out Earn fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/earn
          ref: main
          path: earn
          token: ${{ steps.earn-token.outputs.token }}
          persist-credentials: false
      - name: Initialize Earn fixture dependencies
        working-directory: earn
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v0.15.0
      - uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: nightly-fc14f674bd853bc817c308a5202faa5be8df05e7
      - uses: tempoxyz/gh-actions/actions/setup-terraform@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: 1.14.7
      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Configure AWS benchmark role
        uses: tempoxyz/gh-actions/vendor/aws-actions/configure-aws-credentials@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          role-to-assume: arn:aws:iam::934822761402:role/benchmark-runner
          aws-region: ${{ env.BENCH_REGION }}
          role-duration-seconds: 21600
      - name: Configure S3 transfers
        run: bash benchmark/scripts/configure_aws_s3_transfer.sh
      - name: Run matched benchmark phases
        id: bench
        run: bash benchmark/scripts/zones_prover/run.sh
      - name: Attach comparison to PR
        if: steps.bench.outcome == 'success' && needs.authorize.outputs.pr-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY_PATH: ${{ env.BENCH_RESULTS_PATH }}/summary.md
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: fs.readFileSync(process.env.SUMMARY_PATH, 'utf8') + `\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            });
      - name: Publish latency metrics and nightly status
        if: always() && (github.event_name == 'schedule' || env.BENCH_COMPARISON_MODE == 'prover')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCH_OUTCOME: ${{ steps.bench.outcome }}
          BENCH_METRICS_URL: ${{ secrets.BENCH_VICTORIAMETRICS_URL }}
          SLACK_BENCH_BOT_TOKEN: ${{ secrets.SLACK_BENCH_BOT_TOKEN }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const root = path.join(process.env.BENCH_RESULTS_PATH, 'results');
            const success = process.env.BENCH_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            let published = false;
            if (success) {
              try {
                if (!process.env.BENCH_METRICS_URL) throw new Error('missing metrics destination');
                const url = new URL(process.env.BENCH_METRICS_URL);
                const headers = {'Content-Type': 'text/plain'};
                if (url.username || url.password) {
                  const credentials = `${decodeURIComponent(url.username)}:${decodeURIComponent(url.password)}`;
                  headers.Authorization = `Basic ${Buffer.from(credentials).toString('base64')}`;
                  core.setSecret(headers.Authorization);
                  url.username = ''; url.password = '';
                }
                url.pathname = url.pathname.replace(/\/$/, '') + '/api/v1/import/prometheus';
                // Manual smoke runs must not overwrite the nightly series.
                const kind = context.eventName === 'schedule' ? 'nightly' : 'manual';
                const body = fs.readFileSync(path.join(root, 'comparison.prom'), 'utf8')
                  .replace(/^(tempo_zone_benchmark_\w+)\{/gm, `$1{run_kind="${kind}",`);
                const response = await fetch(url, {method: 'POST', headers, body, signal: AbortSignal.timeout(30000)});
                if (!response.ok) throw new Error(`metrics HTTP ${response.status}`);
                published = true;
              } catch {
                // Do not log URLs or request errors that might contain credentials.
                core.setFailed('Zone latency metrics publication failed; comparison evidence remains in the artifact');
              }
            }
            if (context.eventName !== 'schedule') return;
            if (!process.env.SLACK_BENCH_BOT_TOKEN) {
              core.setFailed('Missing SLACK_BENCH_BOT_TOKEN for nightly Zone reporting');
              return;
            }
            let text = `*Zone prover off/on nightly: ${success ? 'benchmark passed' : 'benchmark failed or did not run'}*\n<${runUrl}|Workflow and raw evidence>`;
            if (success) {
              const comparison = JSON.parse(fs.readFileSync(path.join(root, 'comparison.json'), 'utf8'));
              text += `\nRevision: \`${comparison.metadata.feature}\`; ${comparison.metadata.count} full journeys per phase.`;
              for (const name of ['journey', 'deposit', 'withdrawal']) {
                const off = comparison.latencies.baseline[name], on = comparison.latencies.feature[name];
                text += `\n${name} p50/p95 (ms), off → on: ${off.p50_ms.toFixed(1)}/${off.p95_ms.toFixed(1)} → ${on.p50_ms.toFixed(1)}/${on.p95_ms.toFixed(1)}`;
              }
              text += '\nDeposit/withdrawal measure source-event observation → destination-event observation.';
              text += published ? '\nGrafana metrics published.' : '\nGrafana metrics publication FAILED; see the artifact.';
            }
            const response = await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST', signal: AbortSignal.timeout(30000),
              headers: {Authorization: `Bearer ${process.env.SLACK_BENCH_BOT_TOKEN}`, 'Content-Type': 'application/json'},
              body: JSON.stringify({channel: 'C0B96B0RRMJ', text, unfurl_links: false, unfurl_media: false}),
            });
            if (!response.ok || !(await response.json()).ok) core.setFailed('Nightly Zone Slack delivery failed');
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zones-prover-${{ github.run_id }}-${{ github.run_attempt }}-l1-${{ inputs.state-bloat-mib || '0' }}-zone-${{ inputs.zone-state-bloat-mib || '0' }}
          path: |
            ${{ env.BENCH_RESULTS_PATH }}/results
            ${{ env.BENCH_RESULTS_PATH }}/summary.md
          if-no-files-found: warn
