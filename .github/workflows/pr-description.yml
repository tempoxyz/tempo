name: PR description

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- checks trusted base code and PR metadata only
    types: [opened, reopened, edited, synchronize, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Never execute code from the PR or merge-group branch with this token.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
          sparse-checkout: .github/assets
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { run } = require('./.github/assets/pr-description.cjs');
            await run({ github, context, core });
