name: Scan GitHub Actions

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/bench-*-storage-layout.sh"
      - "bench-e2e.nu"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "scripts/bench-*-storage-layout.sh"
      - "bench-e2e.nu"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  benchmark-helpers:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Test CI helpers
        run: |
          bash .github/scripts/bench-state-test.sh
          bash .github/scripts/bench-upload-charts-test.sh
          bash .github/scripts/bench-storage-layout-test.sh
          node --test .github/scripts/docker-pr.test.js
          node --test .github/scripts/docker-pr-status.test.js

  scan:
    name: Scan GitHub Actions
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo' }}
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819
    permissions:
      id-token: write
      actions: read
      contents: read
