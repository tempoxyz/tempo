name: Scan GitHub Actions

on:
  pull_request:
    paths:
      - ".github/**"
      - "zones/docker/**"
      - "zones/contrib/bench/l1-snapshot.sh"
      - "zones/contrib/bench/validate-spf-range.py"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "zones/docker/**"
      - "zones/contrib/bench/l1-snapshot.sh"
      - "zones/contrib/bench/validate-spf-range.py"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  benchmark-helpers:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: "0.12.16"
          enable-cache: false
      - name: Test Zones workflow helpers
        run: uv run --no-project --with pyyaml python -m unittest discover -s .github/scripts -p 'test_zones_*.py'
      - name: Test CI helpers
        run: |
          bash .github/scripts/bench-state-test.sh
          bash .github/scripts/bench-upload-charts-test.sh
          node --test .github/scripts/bench-multi-region-refs.test.js
          node --test .github/scripts/docker-pr.test.js
          node --test .github/scripts/docker-pr-status.test.js
          node --test .github/scripts/bench-nightly-failure.test.js
          node --test .github/scripts/bench-slack-notify.test.js

  scan:
    name: Scan GitHub Actions
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo' }}
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
    permissions:
      id-token: write
      actions: read
      contents: read
