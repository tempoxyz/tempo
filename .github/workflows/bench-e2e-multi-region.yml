name: Read saved multiregion benchmark logs
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  recover-logs:
    runs-on: depot-ubuntu-latest-8
    timeout-minutes: 10
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bce53819ffa60fcdf8f0f349686d807e5a66a71b
      - name: Configure benchmark AWS credentials
        uses: tempoxyz/gh-actions/vendor/aws-actions/configure-aws-credentials@bce53819ffa60fcdf8f0f349686d807e5a66a71b
        with:
          role-to-assume: arn:aws:iam::934822761402:role/benchmark-runner
          aws-region: us-east-1
      - name: Recover this experiment's saved load-generator logs
        shell: bash
        run: |
          set -euo pipefail
          bucket=tempo-benchmark-artifacts-934822761402-us-east-1
          prefix=runs/bench-e2e-multi-region-35876161973-1/artifacts/load-generator/baseline-1/
          mkdir -p diagnostics
          aws s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix" \
            --query 'Contents[?ends_with(Key, `-results.tar.gz`)].Key' --output json > result-keys.json
          jq -r '.[]?' result-keys.json | while IFS= read -r key; do
            [[ "$key" == "$prefix"*"-results.tar.gz" ]] || exit 1
            aws s3 cp "s3://$bucket/$key" saved-results.tar.gz --only-show-errors
            tar -tzf saved-results.tar.gz > diagnostics/archive-members.txt
            for member in load-generator.log txgen-send.err txgen-generate.err load-generator-exit-code.txt; do
              if tar -tzf saved-results.tar.gz | grep -Fx "./$member" >/dev/null; then
                tar -xOzf saved-results.tar.gz "./$member" > "diagnostics/$member"
              fi
            done
          done
          test -s diagnostics/load-generator.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: multiregion-saved-load-generator-logs
          path: diagnostics/
          retention-days: 7
