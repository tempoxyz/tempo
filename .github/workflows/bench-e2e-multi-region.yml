name: Read saved multiregion benchmark logs
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  recover-logs:
    runs-on: depot-ubuntu-latest-8
    timeout-minutes: 10
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bce53819ffa60fcdf8f0f349686d807e5a66a71b
      - name: Configure benchmark AWS credentials
        uses: tempoxyz/gh-actions/vendor/aws-actions/configure-aws-credentials@bce53819ffa60fcdf8f0f349686d807e5a66a71b
        with:
          role-to-assume: arn:aws:iam::934822761402:role/benchmark-runner
          aws-region: us-east-1
      - name: Recover this experiment's saved load-generator logs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bucket=tempo-benchmark-artifacts-934822761402-us-east-1
          prefix=runs/bench-e2e-multi-region-35883541989-1/artifacts/load-generator/baseline-1/
          mkdir -p diagnostics
          aws s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix" \
            --query 'Contents[?ends_with(Key, `-results.tar.gz`)].Key' --output json > result-keys.json
          jq -r '.[]?' result-keys.json | while IFS= read -r key; do
            [[ "$key" == "$prefix"*"-results.tar.gz" ]] || exit 1
            aws s3 cp "s3://$bucket/$key" saved-results.tar.gz --only-show-errors
            tar -tzf saved-results.tar.gz > diagnostics/archive-members.txt
            for member in load-generator.log txgen-send.err txgen-generate.err load-generator-exit-code.txt; do
              if tar -tzf saved-results.tar.gz | grep -Fx "./$member" >/dev/null; then
                tar -xOzf saved-results.tar.gz "./$member" > "diagnostics/$member"
              fi
            done
          done
          test -s diagnostics/load-generator.log
      - name: Read current experiment load-generator diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for region in us-east-1 us-west-2; do
            aws ec2 describe-instances --region "$region" --filters \
              Name=tag:BenchmarkRunId,Values=bench-e2e-multi-region-35883541989-1 \
              --query 'Reservations[].Instances[].{id:InstanceId,state:State.Name,reason:StateTransitionReason,launch:LaunchTime,role:Tags[?Key==`Role`].Value|[0]}' \
              --output json > "diagnostics/instances-$region.json"
          done
          instances=$(aws ec2 describe-instances --filters \
            Name=tag:BenchmarkRunId,Values=bench-e2e-multi-region-35883541989-1 \
            Name=tag:Role,Values=load-generator Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output json)
          if [[ "$(jq length <<< "$instances")" != 1 ]]; then
            echo 'No single running load generator; inspect scoped instance states.'
            exit 0
          fi
          instance=$(jq -r '.[0]' <<< "$instances")
          command='date -u; ps -eo pid,ppid,comm,wchan:30,etime,pcpu,pmem --sort=-pcpu | head -25; find /opt/tempo/load-generator -maxdepth 3 -type f \( -name txgen-send.err -o -name txgen-generate.err -o -name load-generator.log \) -exec tail -n 45 {} + | sed -E "s#(https?|wss?)://[^[:space:]]+#[endpoint]#g" | tail -c 20000'
          params=$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["60"]}')
          command_id=$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$instance" --comment 'Read-only diagnostics for benchmark 35883541989' \
            --parameters "$params" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --query StandardOutputContent --output text > diagnostics/current-load-generator.log
          command=$(cat <<'PROBE'
          date -u
          for bench_pid in $(pgrep -x bench); do
            ps -L -p "$bench_pid" -o pid,tid,comm,wchan:25,etime,pcpu --sort=-pcpu | head -20
            cat "/proc/$bench_pid/io"
            for fd in /proc/"$bench_pid"/fd/*; do
              target=$(readlink "$fd" || true)
              case "$target" in
                /tmp/*|/opt/tempo/load-generator/*)
                  printf '%s %s\n' "$fd" "$target"
                  stat -Lc 'size=%s' "$fd"
                  sed -n '1,2p' "/proc/$bench_pid/fdinfo/${fd##*/}"
                  ;;
              esac
            done
          done
          find /opt/tempo/load-generator -maxdepth 3 -type f \( -name 'txgen-report*' -o -name 'report.json' -o -name 'txgen.out' \) -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n'
          for diagnostic_tool in perf gdb strace; do command -v "$diagnostic_tool" || true; done
          PROBE
          )
          params=$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["60"]}')
          command_id=$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$instance" --comment 'Read process and report progress for benchmark 35883541989' \
            --parameters "$params" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
            --query StandardOutputContent --output text > diagnostics/current-report-progress.log
      - name: Verify all ten sharded validator layout logs
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for region in us-east-1 us-west-2; do
            instances=$(aws ec2 describe-instances --region "$region" --filters \
              Name=tag:BenchmarkRunId,Values=bench-e2e-multi-region-35883541989-1 \
              'Name=tag:Role,Values=validator*' Name=instance-state-name,Values=running \
              --query 'Reservations[].Instances[].InstanceId' --output json)
            test "$(jq length <<< "$instances")" = 5
            mapfile -t ids < <(jq -r '.[]' <<< "$instances")
            command='find /opt/tempo/artifacts -maxdepth 2 -name storage-layout-feature-1.log -exec tail -n 4 {} +'
            params=$(jq -cn --arg command "$command" '{commands:[$command],executionTimeout:["60"]}')
            command_id=$(aws ssm send-command --region "$region" --document-name AWS-RunShellScript \
              --instance-ids "${ids[@]}" --comment 'Read sharded schema verification for benchmark 35883541989' \
              --parameters "$params" --query Command.CommandId --output text)
            for instance in "${ids[@]}"; do
              aws ssm wait command-executed --region "$region" --command-id "$command_id" --instance-id "$instance"
              aws ssm get-command-invocation --region "$region" --command-id "$command_id" --instance-id "$instance" \
                --query StandardOutputContent --output text > "diagnostics/schema-$instance.log"
              grep -F 'Verified schema 3 for feature-1' "diagnostics/schema-$instance.log"
              total=$((total + 1))
            done
          done
          test "$total" = 10
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: multiregion-saved-load-generator-logs
          path: diagnostics/
          retention-days: 7
