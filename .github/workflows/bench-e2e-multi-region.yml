name: Queue sharded multiregion comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  queue-comparison:
    runs-on: depot-ubuntu-latest-8
    timeout-minutes: 40
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bce53819ffa60fcdf8f0f349686d807e5a66a71b
      - name: Wait for smoke success and teardown, then dispatch comparison once
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const repo = context.repo;
            const smoke = 35883541989;
            const feature = 'db4581536bc0a95a3b815a66df7ea867940dfd91';
            const ref = 'centaur/persistence-timings-sharded';
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let ready = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: smoke});
              core.info('Smoke run ' + smoke + ': ' + run.status + ' / ' + run.conclusion);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('Smoke did not succeed; full comparison will not be dispatched.');
                }
                const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({...repo, run_id: smoke});
                const job = jobs.jobs.find(job => job.name === 'bench-e2e-multi-region');
                for (const name of ['Start infrastructure teardown', 'Wait for infrastructure teardown']) {
                  if (!job?.steps?.some(step => step.name === name && step.conclusion === 'success')) {
                    throw new Error('Missing successful teardown: ' + name);
                  }
                }
                ready = true;
                break;
              }
              await sleep(30000);
            }
            if (!ready) throw new Error('Smoke still unfinished after 30 minutes; no new fleet started.');
            const {data: branch} = await github.rest.repos.getBranch({...repo, branch: ref});
            if (branch.commit.sha !== feature) throw new Error('Comparison branch changed; refusing stale dispatch.');
            const started = new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'bench-e2e-multi-region.yml', ref,
              inputs: {
                baseline: '701e7c37225f46da6582f88132774f73b11460a4',
                feature, bloat: '100', 'run-pairs': '3',
                'max-concurrent-requests': '500',
                'txgen-ref': '1b1ecb1747527158dbadc23d960461d12b14e4ff',
                valscope: 'false'
              }
            });
            core.info('Dispatch accepted. Do not repeat this mutation.');
            for (let attempt = 0; attempt < 20; attempt++) {
              const {data: runs} = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'bench-e2e-multi-region.yml',
                branch: ref, event: 'workflow_dispatch', per_page: 20
              });
              const run = runs.workflow_runs.find(run => run.head_sha === feature && run.created_at >= started);
              if (run) {
                core.info('Full comparison: ' + run.html_url);
                await core.summary.addHeading('Sharded multiregion comparison dispatched')
                  .addLink('Full comparison run', run.html_url)
                  .addRaw('\n10 validators, 5 default AWS regions, 100 GB preset, 90 seconds per phase, 3 pairs.\n')
                  .write();
                return;
              }
              await sleep(3000);
            }
            throw new Error('Dispatch accepted but run ID not observed yet. Check the Actions run list; do not redispatch.');
