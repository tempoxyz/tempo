name: Publish check

permissions: {}

on:
  pull_request:
    branches: [main]
    paths:
      - crates/hardfork/**
      - crates/contracts/**
      - crates/primitives/**
      - crates/chainspec/**
      - crates/alloy/**
      - scripts/publish-crates.sh
      - scripts/sanitize_source.py
      - scripts/sanitize_toml.py
      - Cargo.toml
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  cargo-cooldown:
    permissions:
      contents: read
    uses: ./.github/workflows/cargo-cooldown.yml

  publish-check:
    name: publish check
    needs: cargo-cooldown
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
      - name: Install Cargo cooldown verifier
        id: cargo_cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@db0a96e8a2efd76e585c669c1122580087a69b0d # gh-actions#101
        with:
          strict-project-config: "true"
      - name: Export verified Cargo cooldown location
        env:
          VERIFIER_PATH: ${{ steps.cargo_cooldown.outputs.verifier-path }}
          VERIFIER_SHA256: ${{ steps.cargo_cooldown.outputs.verifier-sha256 }}
        run: |
          echo "CARGO_COOLDOWN_BIN=$VERIFIER_PATH" >> "$GITHUB_ENV"
          echo "CARGO_COOLDOWN_SHA256=$VERIFIER_SHA256" >> "$GITHUB_ENV"
      - name: Verify crates are publishable
        run: ./scripts/publish-crates.sh
        env:
          CARGO_COOLDOWN_REQUIRED: "true"
