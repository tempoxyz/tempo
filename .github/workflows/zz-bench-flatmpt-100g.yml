# One-shot push-triggered wrapper around bench-e2e: the 100 GiB (~1.56B account)
# flat-vs-sparse comparison with feature-flatmpt. Comment-triggered runs execute
# main's bench.yml, which doesn't know the feature-flatmpt flag yet, so this
# trigger branch invokes the reusable workflow directly. Delete the branch after
# the run.
name: bench-flatmpt-100g
on:
  push:
    branches: ["centaur/bench-flatmpt-e2e-100g-trigger"]
permissions:
  contents: read
  id-token: write
jobs:
  bench:
    uses: ./.github/workflows/bench-e2e.yml
    with:
      pr: "7143"
      pr-head-sha: "d36c07fb52eed8dd63d31250537ee0b0c29228c7"
      pr-head-ref: "centaur/bench-flatmpt-e2e-1786443703"
      actor: "dankrad"
      mode: "e2e"
      preset: "default"
      # 30-minute measured windows: 5-minute runs are dominated by warmup and
      # sample too few blocks for stable percentiles (flat only showed its
      # steady-state advantage at the 30-minute horizon in the 1B suite).
      duration: "1800"
      bloat: "100"
      token-count: "4"
      tps: "50000"
      accounts: "1000"
      max-concurrent-requests: "5000"
      baseline: "centaur/bench-flatmpt-e2e-1786443703"
      # Fix-1 cycle: the feature node builds from this trigger branch, which
      # carries the lock-free tip-state read hook on top of the PR head.
      feature: "centaur/bench-flatmpt-e2e-100g-trigger"
      gas-limit: "1000000000000"
      general-gas-limit: "1000000000000"
      run-pairs: "2"
      run-side: "comparison"
      # samply off for 30-min windows: 1ms sampling across thousands of
      # threads for 6x the duration ballooned profiler memory; run 32110973807
      # took the runner offline mid-bench. Re-enable for short profile runs.
      samply: "false"
      otlp: "true"
      feature-flatmpt: "true"
    secrets: inherit
