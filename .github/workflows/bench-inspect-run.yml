name: bench-inspect-run
on:
  push:
    branches: [ejh/20k-tps-10v]
    paths: [.github/workflows/bench-inspect-run.yml]
  workflow_dispatch:
    inputs:
      benchmark-id:
        description: Existing benchmark ID whose validator and runner status should be read.
        type: string
        default: bench-e2e-multi-region-33869141764-1
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BENCHMARK_ID: ${{ inputs.benchmark-id || 'bench-e2e-multi-region-33869141764-1' }}
    steps:
      - name: Configure AWS credentials
        uses: tempoxyz/gh-actions/vendor/aws-actions/configure-aws-credentials@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          role-to-assume: arn:aws:iam::934822761402:role/benchmark-runner
          aws-region: us-east-1
          role-duration-seconds: 900
      - name: Read validator preparation and benchmark runner status
        run: |
          python3 - <<'PY'
          import concurrent.futures, gzip, hashlib, json, os, pathlib, re, subprocess
          benchmark = os.environ['BENCHMARK_ID']
          if not re.fullmatch(r'bench-e2e-multi-region-\d+-\d+', benchmark):
              raise SystemExit('Expected an existing global benchmark run ID')
          regions = ['us-east-1', 'us-west-2', 'eu-central-1', 'ap-southeast-1', 'ap-northeast-1']
          def inspect(index):
              region = regions[index % len(regions)]
              bucket = f'tempo-benchmark-artifacts-934822761402-{region}'
              key = f'runs/{benchmark}/artifacts/validator-{index}/schelk-prepare-status.json'
              command = ['aws', 's3', 'cp', f's3://{bucket}/{key}', '-', '--region', region, '--only-show-errors']
              result = subprocess.run(command, capture_output=True, text=True, timeout=60)
              output = {'validator': index, 'region': region}
              if result.returncode:
                  return {**output, 'status': 'status artifact unavailable'}
              data = json.loads(result.stdout)
              return {**output, **{key: data.get(key) for key in ('stage', 'status', 'updated_at', 'elapsed_secs')}}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as executor:
              results = list(executor.map(inspect, range(10)))
          runner = {}
          bucket = 'tempo-benchmark-artifacts-934822761402-us-east-1'
          for artifact in ('status.json', 'timings.json', 'txgen-report.json'):
              key = f'runs/{benchmark}/artifacts/runner/{artifact}'
              result = subprocess.run(['aws', 's3', 'cp', f's3://{bucket}/{key}', '-', '--region', 'us-east-1', '--only-show-errors'], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  runner[artifact] = {'status': 'artifact unavailable'}
                  continue
              data = json.loads(result.stdout)
              pathlib.Path(f'inspection-{artifact}').write_text(json.dumps(data))
              if artifact == 'txgen-report.json':
                  blocks = sorted(data.get('blocks', []), key=lambda block: block['number'])
                  measured = {'benchmark_id': data.get('benchmark_id'), 'metadata': data.get('metadata'), 'note': 'Latest uploaded report; receipt success has not been audited.'}
                  if len(blocks) >= 2:
                      if any(b['number'] != a['number'] + 1 or b['timestamp_ms'] <= a['timestamp_ms'] for a, b in zip(blocks, blocks[1:])):
                          raise ValueError('Report range is not contiguous and increasing')
                      span = (blocks[-1]['timestamp_ms'] - blocks[0]['timestamp_ms']) / 1000
                      txs = sum(block['tx_count'] for block in blocks[1:])
                      measured.update(start=blocks[0], end=blocks[-1], seconds=span, included_transactions=txs, canonical_tps=txs/span, block_time_mean_ms=span*1000/(len(blocks)-1))
                  runner[artifact] = measured
              else:
                  runner[artifact] = data
          report_file = pathlib.Path('inspection-txgen-report.json')
          if report_file.exists():
              report = json.loads(report_file.read_text())
              bounds = [block['timestamp_ms'] for block in report.get('blocks', [])]
              samples_file = pathlib.Path('inspection-metrics.ndjson.gz')
              key = f'runs/{benchmark}/artifacts/runner/txgen-report.samples.ndjson.gz'
              copied = subprocess.run(['aws', 's3', 'cp', f's3://{bucket}/{key}', str(samples_file), '--region', 'us-east-1', '--only-show-errors'], capture_output=True, text=True, timeout=90)
              if bounds and copied.returncode == 0:
                  names = {'reth_consensus_engine_persistence_save_blocks_duration_seconds', 'reth_database_transaction_commit_sync_duration_seconds', 'reth_database_transaction_commit_whole_duration_seconds', 'reth_storage_providers_database_save_blocks_commit_mdbx_last', 'reth_storage_providers_database_save_blocks_commit_sf_last', 'reth_storage_providers_database_save_blocks_write_trie_updates_last'}
                  rows = {}
                  sample_first = None
                  sample_last = None
                  with gzip.open(samples_file, 'rt') as samples:
                      for line in samples:
                          if not any(name in line for name in names):
                              continue
                          sample = json.loads(line)
                          if sample['name'] not in names:
                              continue
                          timestamp = sample['unix_ms']
                          sample_first = timestamp if sample_first is None else min(sample_first, timestamp)
                          sample_last = timestamp if sample_last is None else max(sample_last, timestamp)
                          labels = sample['labels']
                          quantile = labels.get('quantile', 'last')
                          if not min(bounds) <= timestamp <= max(bounds) or quantile not in ('0.99', 'last') or labels.get('outcome', 'commit') != 'commit':
                              continue
                          identity = (labels.get('node', labels.get('validator', '?')), sample['name'], quantile)
                          prior = rows.get(identity)
                          if prior is None or sample['value'] > prior['maximum_observed']:
                              rows[identity] = {'node': identity[0], 'metric': identity[1], 'quantile': quantile, 'maximum_observed': sample['value'], 'unix_ms': timestamp}
                  digest = hashlib.file_digest(samples_file.open('rb'), 'sha256').hexdigest()
                  metric_result = {'source_sha256': digest, 'source_key': key, 'report_first_ms': min(bounds), 'report_last_ms': max(bounds), 'sample_first_ms': sample_first, 'sample_last_ms': sample_last, 'note': 'Maxima of exported quantile or last-value samples within the report range; not pooled quantiles.', 'series': sorted(rows.values(), key=lambda row: (row['node'], row['metric']))}
                  pathlib.Path('inspection-persistence-metrics.json').write_text(json.dumps(metric_result, indent=2))
                  runner['persistence_metrics'] = metric_result
          print(json.dumps({'benchmark_id': benchmark, 'validators': results, 'runner': runner}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('```json\n' + json.dumps(results, indent=2) + '\n```\n')
          PY
      - name: Preserve inspected benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-inspection
          path: inspection-*.json
          if-no-files-found: ignore
