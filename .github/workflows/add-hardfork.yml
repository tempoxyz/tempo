name: Add hardfork

permissions: {}

on:
  workflow_dispatch:
    inputs:
      hardfork:
        description: "New hardfork identifier, for example T11"
        required: true
        type: string
      dry_run:
        description: "Generate and validate changes without opening PRs"
        default: false
        type: boolean

concurrency:
  group: add-hardfork-${{ inputs.hardfork }}
  cancel-in-progress: false

jobs:
  add-hardfork:
    name: Add ${{ inputs.hardfork }} hardfork
    if: ${{ github.repository == 'tempoxyz/tempo' && github.ref == 'refs/heads/main' }}
    runs-on: depot-ubuntu-latest-4
    environment: add-hardfork
    permissions:
      id-token: write
    steps:
      - name: Fetch Tempo GitHub token via STS
        id: tempo-token
        uses: tempoxyz/gh-actions/actions/github-sts@183a02178c660ce295e9a262edc5857cb7135f06
        with:
          policy: add-hardfork

      - name: Fetch workflows GitHub token via STS
        id: workflows-token
        uses: tempoxyz/gh-actions/actions/github-sts@183a02178c660ce295e9a262edc5857cb7135f06
        with:
          scope: tempoxyz/workflows
          policy: tempo-add-hardfork

      - name: Checkout Tempo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.tempo-token.outputs.token }}
          persist-credentials: false

      - name: Checkout workflows
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tempoxyz/workflows
          ref: main
          path: workflows
          fetch-depth: 1
          token: ${{ steps.workflows-token.outputs.token }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Generate Tempo hardfork plumbing
        id: hardfork
        env:
          HARDFORK: ${{ inputs.hardfork }}
        run: |
          set -euo pipefail
          metadata=$(cargo run --quiet --locked -p tempo-xtask -- add-hardfork --hardfork "$HARDFORK" --json)
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "$metadata"
          cargo +nightly fmt --all -- --check
          git diff --check

      - name: Generate coordinated workflows changes
        id: matrix
        env:
          HARDFORK: ${{ inputs.hardfork }}
          METADATA: ${{ steps.hardfork.outputs.metadata }}
        run: |
          set -euo pipefail
          matrix=$(python3 scripts/update-hardfork-workflows.py \
            --workflows-root workflows \
            --hardfork "$HARDFORK" \
            --metadata "$METADATA")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
          git -C workflows diff --check

      - name: Validate generated changes
        env:
          HARDFORK: ${{ inputs.hardfork }}
        run: |
          set -euo pipefail
          test -n "$(git status --short)"
          test -n "$(git -C workflows status --short)"
          grep -q "hardfork = \"tempo:$HARDFORK\"" tips/verify/foundry.toml
          grep -q "\"hardfork\":\"$HARDFORK\"" workflows/manifests/tempo-tests.yaml
          grep -q "\"hardfork\":\"$HARDFORK\"" workflows/manifests/invariant-tests.yaml

      - name: Open coordinated pull requests
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ steps.tempo-token.outputs.token }}
          WORKFLOWS_TOKEN: ${{ steps.workflows-token.outputs.token }}
          HARDFORK: ${{ inputs.hardfork }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          # gh's git credential helper resolves GH_TOKEN from the environment
          # of each git invocation, so per-command GH_TOKEN overrides below
          # select the token scoped to the repo being pushed.
          gh auth setup-git

          suffix=$(printf '%s' "$HARDFORK" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')
          branch="automation/add-hardfork-$suffix"

          existing_tempo=$(gh pr list --repo tempoxyz/tempo --head "$branch" --state open --json number,url --jq '.[0] // empty')
          existing_workflows=$(GH_TOKEN="$WORKFLOWS_TOKEN" gh pr list --repo tempoxyz/workflows --head "$branch" --state open --json number,url --jq '.[0] // empty')
          if [ -n "$existing_tempo" ] || [ -n "$existing_workflows" ]; then
            echo "An open coordinated PR already exists for $HARDFORK"
            echo "$existing_tempo"
            echo "$existing_workflows"
            exit 1
          fi

          git config user.name "tempo-github-sts[bot]"
          git config user.email "312736176+tempo-github-sts[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- . ':(exclude)workflows'
          git commit -m "feat(hardfork): add $HARDFORK plumbing"
          git push origin "$branch"

          tempo_pr=$(gh pr create \
            --repo tempoxyz/tempo \
            --base main \
            --head "$branch" \
            --draft \
            --title "feat(hardfork): add $HARDFORK plumbing" \
            --body "Generated by the Add hardfork workflow. This PR adds mechanical $HARDFORK plumbing and rotates the default/next Foundry profiles.")
          tempo_pr_number=$(gh pr view "$tempo_pr" --repo tempoxyz/tempo --json number --jq .number)

          git -C workflows config user.name "tempo-github-sts[bot]"
          git -C workflows config user.email "312736176+tempo-github-sts[bot]@users.noreply.github.com"
          git -C workflows checkout -b "$branch"
          git -C workflows add -A
          git -C workflows commit -m "feat(hardfork): test $HARDFORK lanes"
          GH_TOKEN="$WORKFLOWS_TOKEN" git -C workflows push origin "$branch"

          workflows_body=$(mktemp)
          cat > "$workflows_body" <<EOF
          Updates the current/next hardfork lanes to match tempoxyz/tempo#$tempo_pr_number. Merge the Tempo plumbing PR before merging this workflow PR.

          Generated by the Add hardfork workflow.

          Matrix: $MATRIX
          EOF

          GH_TOKEN="$WORKFLOWS_TOKEN" gh pr create \
            --repo tempoxyz/workflows \
            --base main \
            --head "$branch" \
            --draft \
            --title "feat(hardfork): test $HARDFORK lanes" \
            --body-file "$workflows_body"
