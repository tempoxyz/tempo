# This workflow is only intended to be used in forks/copies of tempoxyz/tempo.
# It syncs the main and release branches with the upstream repository hourly.

name: Sync main and release branches with upstream

on:
  schedule:
    - cron: "0 * * * *" # hourly, backup in case the webhook fails
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: ${{ github.repository_owner == 'tempoxyz' && github.repository != 'tempoxyz/tempo' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Fetch GitHub token via STS
        id: github-sts
        uses: tempoxyz/gh-actions/actions/github-sts@183a02178c660ce295e9a262edc5857cb7135f06
        with:
          policy: sync-from-upstream

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.github-sts.outputs.token }}
          fetch-depth: 0

      - name: Sync main and release branches with upstream
        run: |
          git remote add upstream https://github.com/tempoxyz/tempo.git
          git fetch upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/heads/release/*:refs/remotes/upstream/release/*'
          git checkout main
          git reset --hard upstream/main
          git push origin \
            '+refs/heads/main:refs/heads/main' \
            '+refs/remotes/upstream/release/*:refs/heads/release/*'
        env:
          GH_TOKEN: ${{ steps.github-sts.outputs.token }}
