name: Fuzz

permissions: {}

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/contracts/**"
      - "crates/primitives/**"
      - "fuzz/**"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - consensus-rlp
          - strict-abi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          toolchain: nightly
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          tool: cargo-fuzz@0.13.2
      - name: Run fuzz target
        env:
          ASAN_OPTIONS: detect_leaks=0
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- \
              -runs=10000 -max_len=1048576 -rss_limit_mb=4096 -timeout=10
          else
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- \
              -max_total_time=900 -max_len=1048576 -rss_limit_mb=4096 -timeout=10
          fi
      - name: Upload corpus and crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
