name: RPC Tests

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - 'crates/node/**'
      - 'crates/primitives/**'
      - 'crates/revm/**'
  pull_request:
    paths:
      - 'crates/node/**'
      - 'crates/primitives/**'
      - 'crates/revm/**'
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  TEMPO_TESTNET_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL || 'https://rpc.moderato.tempo.xyz' }}
  TEMPO_DEVNET_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL || 'https://rpc.devnet.tempoxyz.dev' }}

jobs:
  cargo-cooldown:
    name: Reject newly published crates
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@c15a165aab8fdb1b1dea82547cfab4f6ce380c38 # gh-actions#98
        with:
          toolchain: stable
      - name: Enforce Cargo dependency cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@c15a165aab8fdb1b1dea82547cfab4f6ce380c38 # gh-actions#98

  rpc-tests:
    name: rpc-tests (${{ matrix.network }})
    needs: cargo-cooldown
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: testnet
            allow_failure: false
          - network: devnet
            allow_failure: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
      - uses: tempoxyz/gh-actions/actions/setup-mold@ab45d76f6e7420a094281a22aee1973ecc0754f8
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          tool: nextest@0.9.127
      - name: Build RPC tests
        id: build
        continue-on-error: ${{ matrix.allow_failure }}
        run: cargo nextest run --profile ci-rpc -E 'package(tempo-node) & binary(it) & test(/test_matrices_${{ matrix.network }}/)' --no-run
      - name: Run RPC tests
        id: run
        if: steps.build.outcome == 'success'
        continue-on-error: ${{ matrix.allow_failure }}
        run: cargo nextest run --profile ci-rpc -E 'package(tempo-node) & binary(it) & test(/test_matrices_${{ matrix.network }}/)'
      - name: Report allowed devnet failure
        if: matrix.allow_failure && (steps.build.outcome == 'failure' || steps.run.outcome == 'failure')
        run: echo '::warning::Devnet RPC tests failed, but this check is allowed to fail so merge queue processing can continue.'
