name: RPC Tests

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - 'crates/node/**'
      - 'crates/primitives/**'
      - 'crates/evm/**'
      - '.github/workflows/rpc-tests.yml'
  pull_request:
    paths:
      - 'crates/node/**'
      - 'crates/primitives/**'
      - 'crates/evm/**'
      - '.github/workflows/rpc-tests.yml'
  merge_group:

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  # Test builds don't need debuginfo; dropping it halves link output and the target dir.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # rustc links with its bundled lld unless told otherwise; use the mold from setup-mold.
  # Steps that set RUSTFLAGS ignore this and keep linking with lld.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  TEMPO_TESTNET_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL || 'https://rpc.moderato.tempo.xyz' }}
  TEMPO_DEVNET_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL || 'https://rpc.devnet.tempoxyz.dev' }}

jobs:
  rpc-tests:
    name: rpc-tests (${{ matrix.network }})
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: testnet
            allow_failure: false
          - network: devnet
            allow_failure: true
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: ./.github/actions/native-libs # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          cargo-args: -p tempo-node
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tool: nextest@0.9.127
      - name: Build RPC tests
        id: build
        continue-on-error: ${{ matrix.allow_failure }}
        # Build only the binary the filter selects; without -p/--test nextest builds every
        # workspace test binary.
        run: cargo nextest run -p tempo-node --test it --profile ci-rpc -E 'package(tempo-node) & binary(it) & test(/test_matrices_${{ matrix.network }}/)' --no-run
      - name: Run RPC tests
        id: run
        if: steps.build.outcome == 'success'
        continue-on-error: ${{ matrix.allow_failure }}
        env:
          RUST_LOG: error,alloy_rpc_client=debug,alloy_transport_http=debug,alloy_transport::layers::retry=trace
        run: cargo nextest run -p tempo-node --test it --profile ci-rpc -E 'package(tempo-node) & binary(it) & test(/test_matrices_${{ matrix.network }}/)'
      - name: Report allowed devnet failure
        if: matrix.allow_failure && (steps.build.outcome == 'failure' || steps.run.outcome == 'failure')
        run: echo '::warning::Devnet RPC tests failed, but this check is allowed to fail so merge queue processing can continue.'
