name: Docker Build (Profiling)
run-name: "${{ inputs.pr_number && format('Docker PR #{0} profiling{1}', inputs.pr_number, inputs.request_id && format(' (request {0})', inputs.request_id) || '') || '' }}"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Source command comment ID for updating its receipt (optional)"
        type: string
        default: ""
      tag:
        description: "Tag for selected-ref builds; ignored when pr_number is set"
        type: string
        default: "profiling"
      pr_number:
        description: "Build this open PR number and tag profiling-pr-<number> (blank builds the selected ref)"
        type: string
        default: ""

# Profiling PR builds replace only earlier profiling builds of the same PR.
# Non-PR builds have unique groups and do not cancel each other.
concurrency:
  group: docker-profiling-build-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}

env:
  REGISTRY: ghcr.io/tempoxyz

jobs:
  build-and-push:
    name: Build and Push Profiling Docker Images
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Resolve build source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        with:
          script: |
            const number = process.env.PR_NUMBER || '';
            let sha = context.sha;
            let branch = process.env.BRANCH_NAME;
            if (number) {
              if (!/^[1-9][0-9]*$/.test(number) || !Number.isSafeInteger(Number(number))) {
                throw new Error('pr_number must be a positive integer');
              }
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: Number(number),
              });
              if (pr.state !== 'open') {
                throw new Error('Select an open PR');
              }
              // Publishing runs with registry credentials; only accept branches in this repository.
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('PR image publishing only supports branches in this repository, not forks');
              }
              sha = pr.head.sha;
              branch = pr.head.ref;
              if (!/^[0-9a-f]{40}$/.test(sha)) {
                throw new Error('PR head did not resolve to a commit SHA');
              }
            }
            core.setOutput('sha', sha);
            core.setOutput('short_sha', sha.slice(0, 7));
            core.setOutput('branch', branch);
            core.setOutput('revision_label', number ? `org.opencontainers.image.revision=${sha}` : '');
            await core.summary
              .addHeading('Docker build source')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['PR', number || 'Not specified'],
                ['Branch / ref', branch],
                ['Commit', sha],
              ])
              .write();

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Docker metadata for tempo-profiling
        id: meta-tempo
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          images: ${{ env.REGISTRY }}/tempo
          bake-target: tempo
          labels: ${{ steps.source.outputs.revision_label }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ inputs.pr_number == '' }}
            type=sha,prefix=${{ github.event.inputs.tag }}-sha-,enable=${{ inputs.pr_number == '' }}
            type=raw,value=profiling-sha-${{ steps.source.outputs.short_sha }},priority=100,enable=${{ inputs.pr_number != '' }}
            type=raw,value=profiling-pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Log in to Container Registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        id: build-and-push
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          files: |
            docker-bake.hcl
            docker-bake-profiling.hcl
            ${{ steps.meta-tempo.outputs.bake-file }}
          targets: tempo
          project: 0c6tg19qsp
          push: true
          no-cache: true
          pull: true
        env:
          VERGEN_GIT_SHA: ${{ steps.source.outputs.sha }}
          VERGEN_GIT_SHA_SHORT: ${{ steps.source.outputs.short_sha }}

      - name: Record published PR images
        id: image-report
        if: inputs.pr_number != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_METADATA: ${{ steps.build-and-push.outputs.metadata }}
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const metadata = JSON.parse(process.env.BUILD_METADATA || '{}');
            const images = [{ name: 'tempo',
              tags: (process.env.TEMPO_TAGS || '').split('\n').filter(Boolean),
              digest: metadata.tempo?.['containerimage.digest'] || '',
            }];
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'docker-pr-images.json'),
              JSON.stringify({ sha: process.env.SOURCE_SHA, images }));

      - name: Upload published PR image details
        if: inputs.pr_number != '' && steps.image-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-pr-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-pr-images.json
          if-no-files-found: error
          retention-days: 7
