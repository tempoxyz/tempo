name: Docker Build (Profiling)

on:
  workflow_dispatch:

permissions: {}

# Diagnostic branch only: dispatch the same no-op child using GITHUB_TOKEN.
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          script: |
            const { data } = await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'docker.yml',
              ref: context.ref,
              inputs: { pr_number: '7666' },
              return_run_details: true,
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            });
            core.info(JSON.stringify(data));
