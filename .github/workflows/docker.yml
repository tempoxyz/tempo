name: Docker Build
run-name: "${{ inputs.pr_number && format('Docker PR #{0}{1}{2}', inputs.pr_number, inputs.nightly && ' nightly' || '', inputs.request_id && format(' (request {0})', inputs.request_id) || '') || '' }}"

permissions: {}

on:
  push:
    branches:
      - main
      - "rc/*"
    tags:
      - "v*.*.*"
  merge_group:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Source command comment ID for updating its receipt (optional)"
        type: string
        default: ""
      verify_only:
        description: "Build and compare candidates without publishing images or events"
        type: boolean
        default: false
      prepared_run_id:
        description: "Reuse a successful verification run from this exact commit (blank rebuilds)"
        type: string
        default: ""
      nightly:
        description: "Tag nightly"
        type: boolean
        default: false
      pr_number:
        description: "Build this open PR number and tag pr-<number> (blank builds the selected ref)"
        type: string
        default: ""
  workflow_call:
    outputs:
      tempo_image_tag:
        description: Image tag published by this build attempt
        value: ${{ jobs.build-and-push.outputs.tempo_image_tag }}
  # We're building nightly only once a day to let the rollout cook for 24h without interruptions
  schedule:
    - cron: "5 9 * * *"

# A new PR build replaces the previous one, including requests to tag nightly.
# Non-PR builds have unique groups and do not cancel each other.
concurrency:
  group: docker-build-${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}

env:
  REGISTRY: ghcr.io/tempoxyz

jobs:
  resolve-build-source:
    name: Resolve immutable build source
    if: ${{ (github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo') && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'tempoxyz/tempo') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      branch: ${{ steps.source.outputs.branch }}
      revision_label: ${{ steps.source.outputs.revision_label }}
      epoch: ${{ steps.epoch.outputs.value }}
      prepared_run_id: ${{ steps.prepared.outputs.prepared_run_id }}
      artifact_run_id: ${{ steps.prepared.outputs.artifact_run_id || github.run_id }}
      artifact_attempt: ${{ steps.prepared.outputs.artifact_attempt || github.run_attempt }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Resolve build source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        with:
          script: |
            const number = process.env.PR_NUMBER || '';
            const pullRequest = context.payload.pull_request;
            // PR builds use the submitted commit, not GitHub's temporary merge commit.
            let sha = pullRequest?.head.sha || context.sha;
            if (pullRequest && pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('PR image publishing only supports branches in this repository, not forks');
            }
            let branch = process.env.BRANCH_NAME;
            if (number) {
              if (!/^[1-9][0-9]*$/.test(number) || !Number.isSafeInteger(Number(number))) {
                throw new Error('pr_number must be a positive integer');
              }
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: Number(number),
              });
              if (pr.state !== 'open') {
                throw new Error('Select an open PR');
              }
              // Publishing runs with registry credentials; only accept branches in this repository.
              if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                throw new Error('PR image publishing only supports branches in this repository, not forks');
              }
              sha = pr.head.sha;
              branch = pr.head.ref;
              if (!/^[0-9a-f]{40}$/.test(sha)) {
                throw new Error('PR head did not resolve to a commit SHA');
              }
            }
            core.setOutput('sha', sha);
            core.setOutput('short_sha', sha.slice(0, 7));
            core.setOutput('branch', branch);
            core.setOutput('revision_label', (number || pullRequest) ? `org.opencontainers.image.revision=${sha}` : '');
            await core.summary
              .addHeading('Docker build source')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['PR', number || 'Not specified'],
                ['Branch / ref', branch],
                ['Commit', sha],
              ])
              .write();

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record commit timestamp
        id: epoch
        run: echo "value=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate prepared Docker run
        if: inputs.prepared_run_id != '' || github.ref_type == 'tag'
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WORKFLOW_PATH: .github/workflows/docker.yml
          AUTO_REUSE: ${{ github.ref_type == 'tag' }}
        run: bash scripts/select-prepared-run.sh

  build-candidates:
    if: needs.resolve-build-source.outputs.prepared_run_id == ''
    name: ${{ matrix.mode }} Docker binaries (${{ matrix.arch }}, ${{ matrix.variant || 'all' }})
    needs: resolve-build-source
    # Configure GitHub-hosted larger-runner labels; never point these at Depot.
    runs-on: ${{ matrix.mode == 'candidate' && matrix.runner || (matrix.arch == 'amd64' && (vars.REPRO_RUNNER_AMD64 || 'ubuntu-latest') || (vars.REPRO_RUNNER_ARM64 || 'ubuntu-24.04-arm')) }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: candidate, arch: amd64, runner: depot-ubuntu-latest-16}
          - {mode: candidate, arch: arm64, runner: depot-ubuntu-latest-arm-16}
          - {mode: clean, arch: amd64, variant: production}
          - {mode: clean, arch: arm64, variant: production}
          - {mode: clean, arch: amd64, variant: devnet}
          - {mode: clean, arch: arm64, variant: devnet}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-build-source.outputs.epoch }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-build-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up isolated Docker builder
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Set up Depot
        if: matrix.mode == 'candidate'
        uses: tempoxyz/gh-actions/vendor/depot/setup-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Determine Docker labels
        id: docker-labels
        shell: bash
        run: |
          if [[ "${{ github.repository }}" != "tempoxyz/tempo" ]]; then
            cat <<'LABELS' >> "$GITHUB_OUTPUT"
          value<<EOF
          org.opencontainers.image.created=
          org.opencontainers.image.description=
          org.opencontainers.image.licenses=
          org.opencontainers.image.revision=
          org.opencontainers.image.source=
          org.opencontainers.image.title=
          org.opencontainers.image.url=
          org.opencontainers.image.version=
          EOF
          LABELS
          fi

      - name: Docker metadata for tempo
        id: meta-tempo
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo
            docker.io/tempoxyz/tempo
          bake-target: tempo
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ needs.resolve-build-source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ needs.resolve-build-source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-devnet
        id: meta-tempo-devnet
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-devnet
            docker.io/tempoxyz/tempo-devnet
          bake-target: tempo-devnet
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ needs.resolve-build-source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ needs.resolve-build-source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-localnet
        id: meta-tempo-localnet
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-localnet
            docker.io/tempoxyz/tempo-localnet
          bake-target: tempo-localnet
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ needs.resolve-build-source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ needs.resolve-build-source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-sidecar
        id: meta-tempo-sidecar
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-sidecar
            docker.io/tempoxyz/tempo-sidecar
          bake-target: tempo-sidecar
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ needs.resolve-build-source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ needs.resolve-build-source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-xtask
        id: meta-tempo-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-xtask
            docker.io/tempoxyz/tempo-xtask
          bake-target: tempo-xtask
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ needs.resolve-build-source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ needs.resolve-build-source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Prepare candidate exports
        run: mkdir -p "$RUNNER_TEMP/candidate-images"

      - name: Build candidate images without publishing
        if: matrix.mode == 'candidate'
        uses: tempoxyz/gh-actions/vendor/depot/bake-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          files: |
            docker-bake.hcl
            ${{ steps.meta-tempo.outputs.bake-file }}
            ${{ steps.meta-tempo-devnet.outputs.bake-file }}
            ${{ steps.meta-tempo-localnet.outputs.bake-file }}
            ${{ steps.meta-tempo-sidecar.outputs.bake-file }}
            ${{ steps.meta-tempo-xtask.outputs.bake-file }}
          targets: default
          project: 0c6tg19qsp
          push: false
          provenance: false
          pull: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            tempo.tags=tempo:candidate-${{ matrix.arch }}
            tempo.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo.tar
            tempo-devnet.tags=tempo-devnet:candidate-${{ matrix.arch }}
            tempo-devnet.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-devnet.tar
            tempo-localnet.tags=tempo-localnet:candidate-${{ matrix.arch }}
            tempo-localnet.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-localnet.tar
            tempo-sidecar.tags=tempo-sidecar:candidate-${{ matrix.arch }}
            tempo-sidecar.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-sidecar.tar
            tempo-xtask.tags=tempo-xtask:candidate-${{ matrix.arch }}
            tempo-xtask.output=type=docker,dest=${{ runner.temp }}/candidate-images/tempo-xtask.tar

      - name: Free space for independent rebuild
        if: matrix.mode == 'clean'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Rebuild shipped binaries without Depot or shared cache
        if: matrix.mode == 'clean'
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          CARGO_BUILD_JOBS: ${{ vars.REPRO_BUILD_JOBS || (matrix.arch == 'arm64' && '2' || '4') }}
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$ARCH" --no-cache --pull \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --build-arg "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS" \
            -f Dockerfile.reproducible --target "docker-$VARIANT-artifacts" \
            --output "type=local,dest=$RUNNER_TEMP/clean-binaries" .
          cd "$RUNNER_TEMP/clean-binaries"
          if [[ "$VARIANT" == devnet ]]; then
            sha256sum tempo-devnet > "$RUNNER_TEMP/candidate-images/clean.sha256"
          else
            sha256sum tempo tempo-localnet tempo-sidecar tempo-xtask > "$RUNNER_TEMP/candidate-images/clean.sha256"
          fi

      - name: Upload candidates or independent checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-${{ matrix.mode }}${{ matrix.variant == 'devnet' && '-devnet' || '' }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-images/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-and-push:
    name: Verify and publish Docker images
    needs: [resolve-build-source, build-candidates]
    outputs:
      tempo_image_tag: ${{ inputs.verify_only != true && steps.meta-tempo.outputs.version || '' }}
    if: ${{ !cancelled() && needs.resolve-build-source.result == 'success' && (needs.build-candidates.result == 'success' || (needs.resolve-build-source.outputs.prepared_run_id != '' && needs.build-candidates.result == 'skipped')) && (github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo') && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'tempoxyz/tempo') }}
    runs-on: depot-ubuntu-latest-16
    permissions:
      actions: read
      contents: read
      pull-requests: read
      packages: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Use resolved build source
        id: source
        env:
          SHA: ${{ needs.resolve-build-source.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve-build-source.outputs.short_sha }}
          BRANCH: ${{ needs.resolve-build-source.outputs.branch }}
          REVISION_LABEL: ${{ needs.resolve-build-source.outputs.revision_label }}
        run: |
          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "branch=$BRANCH"
            echo "revision_label=$REVISION_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-build-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up isolated Docker builder
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Determine Docker labels
        id: docker-labels
        shell: bash
        run: |
          if [[ "${{ github.repository }}" != "tempoxyz/tempo" ]]; then
            cat <<'LABELS' >> "$GITHUB_OUTPUT"
          value<<EOF
          org.opencontainers.image.created=
          org.opencontainers.image.description=
          org.opencontainers.image.licenses=
          org.opencontainers.image.revision=
          org.opencontainers.image.source=
          org.opencontainers.image.title=
          org.opencontainers.image.url=
          org.opencontainers.image.version=
          EOF
          LABELS
          fi

      - name: Docker metadata for tempo
        id: meta-tempo
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo
            docker.io/tempoxyz/tempo
          bake-target: tempo
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ steps.source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-devnet
        id: meta-tempo-devnet
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-devnet
            docker.io/tempoxyz/tempo-devnet
          bake-target: tempo-devnet
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ steps.source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-localnet
        id: meta-tempo-localnet
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-localnet
            docker.io/tempoxyz/tempo-localnet
          bake-target: tempo-localnet
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ steps.source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-sidecar
        id: meta-tempo-sidecar
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-sidecar
            docker.io/tempoxyz/tempo-sidecar
          bake-target: tempo-sidecar
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ steps.source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Docker metadata for tempo-xtask
        id: meta-tempo-xtask
        uses: tempoxyz/gh-actions/vendor/docker/metadata-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          images: |
            ${{ env.REGISTRY }}/tempo-xtask
            docker.io/tempoxyz/tempo-xtask
          bake-target: tempo-xtask
          labels: |
            ${{ steps.docker-labels.outputs.value }}
            ${{ steps.source.outputs.revision_label }}
          tags: |
            type=schedule,pattern=nightly,enable=${{ inputs.pr_number == '' }}
            type=raw,value=nightly,enable=${{ github.event.inputs.nightly == 'true' }}
            type=semver,pattern={{version}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.pr_number == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.pr_number == '' }}
            type=raw,value=stable,enable=${{ inputs.pr_number == '' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ inputs.pr_number == '' && '{{is_default_branch}}' || 'false' }}
            type=edge,branch=main,enable=${{ inputs.pr_number == '' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
            type=raw,value=pr-${{ inputs.pr_number }},enable=${{ inputs.pr_number != '' }}

      - name: Log in to Container Registry
        if: inputs.verify_only != true
        uses: tempoxyz/gh-actions/vendor/docker/login-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.verify_only != true
        uses: tempoxyz/gh-actions/vendor/docker/login-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Download candidate images and independent checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-*-${{ needs.resolve-build-source.outputs.artifact_attempt }}
          path: ${{ runner.temp }}/verified-images
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-build-source.outputs.artifact_run_id }}

      - name: Compare every shipped executable before any publication
        id: verify
        env:
          IMAGE_DIR: ${{ runner.temp }}/verified-images
          ARTIFACT_RUN_ATTEMPT: ${{ needs.resolve-build-source.outputs.artifact_attempt }}
        run: scripts/verify-docker-rebuild.sh

      - name: Publish the verified images without rebuilding
        if: inputs.verify_only != true
        id: build-and-push
        env:
          IMAGE_DIR: ${{ runner.temp }}/verified-images
          ARTIFACT_RUN_ATTEMPT: ${{ needs.resolve-build-source.outputs.artifact_attempt }}
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
          TEMPO_DEVNET_TAGS: ${{ steps.meta-tempo-devnet.outputs.tags }}
          TEMPO_LOCALNET_TAGS: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TEMPO_SIDECAR_TAGS: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TEMPO_XTASK_TAGS: ${{ steps.meta-tempo-xtask.outputs.tags }}
        run: scripts/publish-verified-images.sh

      - name: Record published PR images
        id: image-report
        if: inputs.pr_number != '' && inputs.verify_only != true
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_METADATA: ${{ steps.build-and-push.outputs.metadata }}
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
          TEMPO_DEVNET_TAGS: ${{ steps.meta-tempo-devnet.outputs.tags }}
          TEMPO_LOCALNET_TAGS: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TEMPO_SIDECAR_TAGS: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TEMPO_XTASK_TAGS: ${{ steps.meta-tempo-xtask.outputs.tags }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const metadata = JSON.parse(process.env.BUILD_METADATA || '{}');
            const images = ['tempo', 'tempo-devnet', 'tempo-localnet', 'tempo-sidecar', 'tempo-xtask'].map(name => ({
              name,
              tags: (process.env[`${name.toUpperCase().replaceAll('-', '_')}_TAGS`] || '').split('\n').filter(Boolean),
              digest: metadata[name]?.['containerimage.digest'] || '',
            }));
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'docker-pr-images.json'),
              JSON.stringify({ sha: process.env.SOURCE_SHA, images }));

      - name: Upload published PR image details
        if: inputs.pr_number != '' && steps.image-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-pr-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-pr-images.json
          if-no-files-found: error
          retention-days: 7

      - name: Install cosign
        if: inputs.verify_only != true
        uses: tempoxyz/gh-actions/vendor/sigstore/cosign-installer@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Sign Docker images
        if: inputs.verify_only != true
        id: sign-images
        shell: bash
        env:
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
          TEMPO_DEVNET_TAGS: ${{ steps.meta-tempo-devnet.outputs.tags }}
          TEMPO_LOCALNET_TAGS: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TEMPO_SIDECAR_TAGS: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TEMPO_XTASK_TAGS: ${{ steps.meta-tempo-xtask.outputs.tags }}
        run: |
          set -euo pipefail
          sign_image() {
            local image="$1"
            local attempt

            for attempt in 1 2 3; do
              if cosign sign --yes --recursive "$image"; then
                return 0
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to sign $image after $attempt attempts" >&2
                return 1
              fi

              sleep_seconds=$((attempt * 15))
              echo "cosign sign failed for $image; retrying in ${sleep_seconds}s (attempt $((attempt + 1))/3)" >&2
              sleep "$sleep_seconds"
            done
          }

          images=(
            "$TEMPO_TAGS"
            "$TEMPO_DEVNET_TAGS"
            "$TEMPO_LOCALNET_TAGS"
            "$TEMPO_SIDECAR_TAGS"
            "$TEMPO_XTASK_TAGS"
          )
          sign_failures=0
          for tags in "${images[@]}"; do
            while IFS= read -r image; do
              [ -n "$image" ] || continue
              if ! sign_image "$image"; then
                sign_failures=$((sign_failures + 1))
              fi
            done <<< "$tags"
          done

          if [ "$sign_failures" -ne 0 ]; then
            echo "Failed to sign $sign_failures image reference(s)" >&2
            exit 1
          fi

      - name: Publish event (sha tag)
        id: publish-sha-event
        if: ${{ inputs.verify_only != true && github.repository == 'tempoxyz/tempo' && github.event_name != 'merge_group' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_REPO: ${{ github.repository }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          COMMIT_SHA: ${{ steps.source.outputs.sha }}
          BRANCH_NAME: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail

          echo "$EVENTS_KEY" > "${RUNNER_TEMP}/key"
          echo "$EVENTS_CERT" > "${RUNNER_TEMP}/cert"

          # EVENTS_ARGS may contain additional curl arguments, not just a URL.
          curl -sf -o /dev/null -X POST ${{ secrets.EVENTS_ARGS }} \
            --key "${RUNNER_TEMP}/key" \
            --cert "${RUNNER_TEMP}/cert" \
            -H "Content-Type: application/json" \
            -d "{
              \"repository\": \"${GH_REPO}\",
              \"event\": \"registry_package\",
              \"data\": {
                \"tag\": \"sha-${SHORT_SHA}\",
                \"sha\": \"${COMMIT_SHA}\",
                \"branch\": \"${BRANCH_NAME}\"
              }
            }"

      - name: Publish event (nightly tag)
        id: publish-nightly-event
        if: ${{ inputs.verify_only != true && github.repository == 'tempoxyz/tempo' && ((inputs.pr_number == '' && github.event_name == 'schedule') || github.event.inputs.nightly == 'true') }}
        shell: bash
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.source.outputs.sha }}
          BRANCH_NAME: ${{ steps.source.outputs.branch }}
        run: |
          set -euo pipefail

          DAY_OF_WEEK="$(date -u +%u)"
          if [ "$DAY_OF_WEEK" = "5" ]; then
            INVARIANT_TIMEOUT="172800"
          else
            INVARIANT_TIMEOUT="18000"
          fi

          echo "$EVENTS_KEY" > "${RUNNER_TEMP}/key"
          echo "$EVENTS_CERT" > "${RUNNER_TEMP}/cert"

          # EVENTS_ARGS may contain additional curl arguments, not just a URL.
          curl -sf -o /dev/null -X POST ${{ secrets.EVENTS_ARGS }} \
            --key "${RUNNER_TEMP}/key" \
            --cert "${RUNNER_TEMP}/cert" \
            -H "Content-Type: application/json" \
            -d "{
              \"repository\": \"${GH_REPO}\",
              \"event\": \"registry_package\",
              \"data\": {
                \"tag\": \"nightly\",
                \"sha\": \"${COMMIT_SHA}\",
                \"branch\": \"${BRANCH_NAME}\",
                \"invariant_timeout\": \"${INVARIANT_TIMEOUT}\"
              }
            }"

      - name: Summarize Docker build
        if: ${{ always() }}
        shell: bash
        env:
          TEMPO_TAGS: ${{ steps.meta-tempo.outputs.tags }}
          TEMPO_DEVNET_TAGS: ${{ steps.meta-tempo-devnet.outputs.tags }}
          TEMPO_LOCALNET_TAGS: ${{ steps.meta-tempo-localnet.outputs.tags }}
          TEMPO_SIDECAR_TAGS: ${{ steps.meta-tempo-sidecar.outputs.tags }}
          TEMPO_XTASK_TAGS: ${{ steps.meta-tempo-xtask.outputs.tags }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
          COMMIT_SHA: ${{ steps.source.outputs.sha }}
          BRANCH_NAME: ${{ steps.source.outputs.branch }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BUILD_OUTCOME: ${{ steps.build-and-push.outcome }}
          SIGN_OUTCOME: ${{ steps.sign-images.outcome }}
          SHA_EVENT_OUTCOME: ${{ steps.publish-sha-event.outcome }}
          NIGHTLY_EVENT_OUTCOME: ${{ steps.publish-nightly-event.outcome }}
          BUILD_METADATA: ${{ steps.build-and-push.outputs.metadata }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          job_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if command -v gh >/dev/null 2>&1; then
            resolved_job_url="$(gh api \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --paginate \
              --jq '.jobs[] | select(.name == "Verify and publish Docker images") | .html_url' \
              | head -n 1 || true)"
            if [ -n "$resolved_job_url" ]; then
              job_url="$resolved_job_url"
            fi
          fi

          {
            echo "## Docker build"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | [\`${COMMIT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}) |"
            echo "| Ref | \`${BRANCH_NAME}\` |"
            echo "| Workflow run | [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Workflow run ID | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Job summary | [Verify and publish Docker images](${job_url}) |"
            echo "| Short SHA tag | \`sha-${SHORT_SHA}\` |"
            echo "| Verify | \`${VERIFY_OUTCOME:-unknown}\` |"
            echo "| Publish | \`${BUILD_OUTCOME:-unknown}\` |"
            echo "| Sign | \`${SIGN_OUTCOME:-unknown}\` |"
            echo
            echo "## Images"
            echo
            echo "| Image | Package | Tags | Digest |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERIFY_ONLY" == true ]]; then
            echo "Verification-only run: no images or deployment events were published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          summarize_image() {
            local image="$1"
            local package_url="$2"
            local tags="$3"
            local target="$4"
            local formatted=""
            local digest
            local tag

            digest="$(jq -r --arg target "$target" '.[$target]["containerimage.digest"] // empty' <<< "$BUILD_METADATA" 2>/dev/null || true)"

            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              if [ -n "$formatted" ]; then
                formatted="${formatted}<br>${tag}"
              else
                formatted="$tag"
              fi
            done <<< "$tags"

            echo "| ${image} | [GHCR package](${package_url}) | ${formatted:-None} | \`${digest:-None}\` |" >> "$GITHUB_STEP_SUMMARY"
          }

          summarize_image "tempo" "${{ github.server_url }}/orgs/tempoxyz/packages/container/package/tempo" "$TEMPO_TAGS" "tempo"
          summarize_image "tempo-devnet" "${{ github.server_url }}/orgs/tempoxyz/packages/container/package/tempo-devnet" "$TEMPO_DEVNET_TAGS" "tempo-devnet"
          summarize_image "tempo-localnet" "${{ github.server_url }}/orgs/tempoxyz/packages/container/package/tempo-localnet" "$TEMPO_LOCALNET_TAGS" "tempo-localnet"
          summarize_image "tempo-sidecar" "${{ github.server_url }}/orgs/tempoxyz/packages/container/package/tempo-sidecar" "$TEMPO_SIDECAR_TAGS" "tempo-sidecar"
          summarize_image "tempo-xtask" "${{ github.server_url }}/orgs/tempoxyz/packages/container/package/tempo-xtask" "$TEMPO_XTASK_TAGS" "tempo-xtask"

          {
            echo
            echo "## Publish events"
            echo
            echo "| Event | Tag | Outcome |"
            echo "| --- | --- | --- |"
            echo "| registry_package | \`sha-${SHORT_SHA}\` | \`${SHA_EVENT_OUTCOME:-skipped}\` |"
            echo "| registry_package | \`nightly\` | \`${NIGHTLY_EVENT_OUTCOME:-skipped}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
