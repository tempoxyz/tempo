name: Docker Build
run-name: "${{ inputs.pr_number && format('Docker PR #{0}', inputs.pr_number) || '' }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        default: ""

permissions: {}

# Diagnostic branch only: no checkout, build, artifacts, or publishing.
jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'
