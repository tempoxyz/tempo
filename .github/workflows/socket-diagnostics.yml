name: Socket package diagnostics

on:
  pull_request:

permissions: {}

jobs:
  cargo-comparison:
    name: ${{ matrix.client }} fetch ${{ matrix.crate }}
    if: github.event.pull_request.number == 7653 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        client: [aegis, sfw]
        # Cross-product keeps each client/package on a fresh runner.
        crate: [serde_yaml_ng, libflate_lz77]
    steps:
      - name: Secure runner with Aegis
        if: matrix.client == 'aegis'
        uses: tempoxyz/gh-actions/actions/secure-runner@b61457a6d6d06485b118a3c0e9637c94186c8c5a

      - name: Secure runner with Socket Firewall Enterprise
        if: matrix.client == 'sfw'
        # Last SFW-based runner: authenticates through STS; does not install Aegis.
        uses: tempoxyz/gh-actions/actions/secure-runner@ce1ecb54c67d188971dd0a3df1577256e3d39dc5

      - name: Install Rust
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          toolchain: stable

      - name: Fetch exact package with a fresh Cargo cache
        env:
          CLIENT: ${{ matrix.client }}
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.crate == 'serde_yaml_ng' && '0.10.0' || '1.2.0' }}
          CARGO_HTTP_TIMEOUT: "180"
          CARGO_NET_RETRY: "0"
          CARGO_TERM_COLOR: never
        run: |
          # Resolve the real Cargo binary to avoid invoking SFW's shim twice.
          cargo_binary=$(rustup which cargo)
          "$cargo_binary" --version
          command_line=("$cargo_binary")
          if [[ "$CLIENT" == sfw ]]; then
            test -n "${SOCKET_API_KEY:-}"
            sfw --version
            command_line=(sfw "$cargo_binary")
          fi

          export CARGO_HOME="$RUNNER_TEMP/diagnostic-cargo-home"
          fixture="$RUNNER_TEMP/socket-fixture"
          mkdir -p "$CARGO_HOME" "$fixture/src"
          printf '[package]\nname = "socket-diagnostic"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\n%s = "=%s"\n' "$CRATE" "$VERSION" > "$fixture/Cargo.toml"
          touch "$fixture/src/lib.rs"

          # Normal vendor output only: no HTTP tracing, environment dumps, or raw reports.
          started=$(date +%s)
          date -u '+Started: %Y-%m-%dT%H:%M:%SZ'
          result=0
          timeout 600 "${command_line[@]}" fetch --manifest-path "$fixture/Cargo.toml" || result=$?
          elapsed=$(( $(date +%s) - started ))
          printf 'Client: %s; package: %s@%s; exit: %s; elapsed: %ss\n' \
            "$CLIENT" "$CRATE" "$VERSION" "$result" "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$result"

  download:
    name: Inspect ${{ matrix.crate }}
    # Temporary investigation for the secure-runner rollout.
    if: github.event.pull_request.number == 7653 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: serde_yaml_ng
            version: 0.10.0
          - crate: libflate_lz77
            version: 1.2.0
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@b61457a6d6d06485b118a3c0e9637c94186c8c5a

      - name: Download crate through Aegis
        env:
          CRATE: ${{ matrix.crate }}
          VERSION: ${{ matrix.version }}
        run: |
          # Direct GET avoids Cargo's package/binary caches. No client retries;
          # Aegis owns the bounded Socket lookup and retry budget.
          curl_exit=0
          result=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 180 \
            --dump-header "$RUNNER_TEMP/crate-headers.txt" \
            --output /dev/null --write-out '%{http_code} %{time_total}' \
            "https://static.crates.io/crates/$CRATE/$VERSION/download") || curl_exit=$?

          CURL_EXIT_CODE="$curl_exit" CURL_RESULT="$result" python3 - <<'PY'
          import os
          from pathlib import Path

          headers = {}
          for line in Path(os.environ["RUNNER_TEMP"], "crate-headers.txt").read_text().splitlines():
              if line.startswith("HTTP/"):
                  headers = {}
              elif ":" in line:
                  key, value = line.split(":", 1)
                  headers[key.lower()] = value.strip()

          status, elapsed = os.environ["CURL_RESULT"].split()
          decision = headers.get("x-aegis-decision", "missing")
          reason = headers.get("x-aegis-reason", "")
          # Export only fixed classifications, never raw bodies or headers.
          reasons = [label for label in (
              "pendingScan", "recentlyPublished", "context deadline exceeded",
              "context canceled", "HTTP 429", "notFound",
          ) if label in reason]
          if reason and not reasons:
              reasons = ["other (details omitted)"]
          safe_decision = decision if decision in {"allow", "warn", "block", "missing"} else "unknown"
          lines = [
              f"Package: {os.environ['CRATE']}@{os.environ['VERSION']}",
              f"HTTP status: {status}; elapsed: {elapsed}s; curl exit: {os.environ['CURL_EXIT_CODE']}",
              f"Aegis decision: {safe_decision}; reason: {', '.join(reasons) or 'none'}",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(f"- {line}" for line in lines) + "\n")
          # A successful download without an Aegis verdict is not evidence of inspection.
          passed = os.environ["CURL_EXIT_CODE"] == "0" and status == "200" and decision in {"allow", "warn"}
          raise SystemExit(0 if passed else 1)
          PY
