# Scheduled multi-region e2e regression benchmarks.
#
# Runs nightly at 03:00 UTC. The feature is the current tempoxyz/tempo main
# commit, and the baseline is main from the last successful scheduled run.
# Manual runs accept sizing overrides so this workflow can be tested cheaply.

name: bench-e2e-multi-region-scheduled

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider used for disposable benchmark infrastructure.
        type: choice
        required: true
        default: gcp
        options:
          - aws
          - gcp
      force:
        description: Force a run when Tempo main has not changed.
        type: boolean
        required: false
        default: false
      duration:
        description: Benchmark duration in seconds.
        type: string
        required: true
        default: "90"
      bloat:
        description: State bloat size in GB.
        type: choice
        required: true
        default: "100"
        options:
          - "0"
          - "1"
          - "10"
          - "100"
      validator-count:
        description: Number of validators.
        type: string
        required: true
        default: "10"
      regions:
        description: Comma-separated cloud regions. Empty uses the selected cloud's defaults.
        type: string
        required: false
        default: ""
      tps:
        description: Target transactions per second.
        type: string
        required: true
        default: "50000"
      accounts:
        description: Number of benchmark accounts.
        type: string
        required: true
        default: "1000"
      max-concurrent-requests:
        description: Max concurrent sender requests.
        type: string
        required: true
        default: "5000"
      run-pairs:
        description: Number of baseline/feature run pairs.
        type: string
        required: true
        default: "1"

permissions: {}

jobs:
  resolve-refs:
    name: resolve-refs
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
    outputs:
      baseline-ref: ${{ steps.refs.outputs.baseline-ref }}
      baseline-name: ${{ steps.refs.outputs.baseline-name }}
      feature-ref: ${{ steps.refs.outputs.feature-ref }}
      feature-name: ${{ steps.refs.outputs.feature-name }}
      should-run: ${{ steps.refs.outputs.should-run }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout Tempo main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tempoxyz/tempo
          ref: main
          fetch-depth: 0
          path: tempo
          persist-credentials: false

      - name: Resolve nightly refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
          STATE_ARTIFACT: tempo-e2e-multi-region-nightly-state
        run: |
          feature_ref="$(git -C tempo rev-parse HEAD)"
          baseline_ref=""
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT" \
            --jq '.artifacts | map(select(.expired == false)) | first | .id // empty')"

          if [ -n "$artifact_id" ]; then
            state_dir="$(mktemp -d)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_dir/state.zip"
            unzip -q "$state_dir/state.zip" -d "$state_dir"
            baseline_ref="$(tr -d '[:space:]' < "$state_dir/tempo-main-ref")"
            rm -rf "$state_dir"
            git -C tempo cat-file -e "${baseline_ref}^{commit}"
            echo "Using Tempo main from the last successful scheduled run: $baseline_ref"
          else
            baseline_ref="$feature_ref"
            echo "No successful scheduled state exists; comparing main against itself"
          fi

          should_run="true"
          if [ "$baseline_ref" = "$feature_ref" ] && [ "$INPUT_FORCE" != "true" ] && [ -n "$artifact_id" ]; then
            should_run="false"
            echo "Tempo main has not changed since the last successful scheduled run; skipping"
          fi

          baseline_date="$(git -C tempo show -s --format=%cs "$baseline_ref")"
          feature_date="$(git -C tempo show -s --format=%cs "$feature_ref")"

          {
            echo "baseline-ref=$baseline_ref"
            echo "baseline-name=nightly-${baseline_date}-${baseline_ref:0:8}"
            echo "feature-ref=$feature_ref"
            echo "feature-name=main-${feature_date}-${feature_ref:0:8}"
            echo "should-run=$should_run"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Tempo refs"
            echo ""
            echo "- Baseline: \`$baseline_ref\` (last successful scheduled main)"
            echo "- Feature: \`$feature_ref\` (current main)"
            echo "- Run: \`$should_run\`"
          } >> "$GITHUB_STEP_SUMMARY"

  bench-e2e-multi-region:
    needs: resolve-refs
    if: needs.resolve-refs.outputs.should-run == 'true'
    name: bench-e2e-multi-region-scheduled
    uses: ./.github/workflows/bench-e2e-multi-region.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    with:
      cloud: ${{ inputs.cloud || 'gcp' }}
      baseline: ${{ needs.resolve-refs.outputs.baseline-ref }}
      baseline-name: ${{ needs.resolve-refs.outputs.baseline-name }}
      feature: ${{ needs.resolve-refs.outputs.feature-ref }}
      feature-name: ${{ needs.resolve-refs.outputs.feature-name }}
      preset: default
      duration: ${{ inputs.duration || '90' }}
      bloat: ${{ inputs.bloat || '100' }}
      validator-count: ${{ inputs['validator-count'] || '10' }}
      regions: ${{ inputs.regions || '' }}
      tps: ${{ inputs.tps || '50000' }}
      accounts: ${{ inputs.accounts || '1000' }}
      max-concurrent-requests: ${{ inputs['max-concurrent-requests'] || '5000' }}
      run-pairs: ${{ inputs['run-pairs'] || '1' }}
      clickhouse-run: feature-1
      otlp: true
      tcp-highres: true
      valscope: true
    secrets:
      BENCH_LOGS_PUSH_URL: ${{ secrets.BENCH_LOGS_PUSH_URL }}
      TEMPO_TELEMETRY_URL: ${{ secrets.TEMPO_TELEMETRY_URL }}
      BENCH_VICTORIAMETRICS_URL: ${{ secrets.BENCH_VICTORIAMETRICS_URL }}
      CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
      VICTORIALOGS_URL: ${{ secrets.VICTORIALOGS_URL }}
      VICTORIAMETRICS_URL: ${{ secrets.VICTORIAMETRICS_URL }}
      VALSCOPE_CONTROL_URL: ${{ secrets.VALSCOPE_CONTROL_URL }}
      VALSCOPE_INTERNAL_TOKEN: ${{ secrets.VALSCOPE_INTERNAL_TOKEN }}

  save-state:
    needs: [resolve-refs, bench-e2e-multi-region]
    if: |
      always() &&
      github.event_name == 'schedule' &&
      needs.bench-e2e-multi-region.result == 'success'
    name: save-state
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Write successful Tempo main ref
        env:
          FEATURE_REF: ${{ needs.resolve-refs.outputs.feature-ref }}
        run: |
          mkdir -p nightly-state
          printf '%s\n' "$FEATURE_REF" > nightly-state/tempo-main-ref

      - name: Upload nightly state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-e2e-multi-region-nightly-state
          path: nightly-state/tempo-main-ref
          retention-days: 90
          if-no-files-found: error

  # Pages reth on-call through incident.io's Reth CI source (which posts to
  # #eng-reth-alerts) when a scheduled run fails, and resolves the same alert on
  # the next scheduled run that benchmarks and saves state. Runs with no new main
  # commit leave the alert unchanged. Fails loudly if a failure cannot be sent.
  incident-io:
    needs: [resolve-refs, bench-e2e-multi-region, save-state]
    if: >-
      !cancelled() &&
      github.event_name == 'schedule' &&
      github.repository == 'tempoxyz/tempo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Update incident.io alert
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INCIDENT_IO_URL: ${{ secrets.INCIDENT_IO_RETH_CI_URL }}
          INCIDENT_IO_TOKEN: ${{ secrets.INCIDENT_IO_RETH_CI_TOKEN }}
          BENCH_JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          retries: 0
          script: |
            if (context.eventName !== 'schedule' ||
                `${context.repo.owner}/${context.repo.repo}` !== 'tempoxyz/tempo') return;
            const jobs = JSON.parse(process.env.BENCH_JOB_RESULTS);
            const failedJobs = Object.entries(jobs)
              .filter(([, job]) => job.result === 'failure').map(([name]) => name);
            let status;
            if (failedJobs.length) status = 'firing';
            else if (jobs['bench-e2e-multi-region']?.result === 'success' &&
                     jobs['save-state']?.result === 'success') status = 'resolved';
            if (status === 'resolved' && process.env.GITHUB_RUN_ATTEMPT !== '1') {
              // A rerun may be an older night: don't clear a page a newer night raised.
              core.info('Rerun of a scheduled run; leaving the incident.io alert unchanged');
              return;
            }
            if (!status) {
              core.info('Benchmark did not run; leaving the incident.io alert unchanged');
              return;
            }

            const url = process.env.INCIDENT_IO_URL;
            const token = process.env.INCIDENT_IO_TOKEN;
            if (!url || !token) {
              if (status === 'firing') {
                throw new Error('INCIDENT_IO_RETH_CI_URL or INCIDENT_IO_RETH_CI_TOKEN is not set; cannot alert reth on-call');
              }
              core.notice('INCIDENT_IO_RETH_CI_URL or INCIDENT_IO_RETH_CI_TOKEN is not set; skipping incident.io alert');
              return;
            }

            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            const runUrl = `https://github.com/tempoxyz/tempo/actions/runs/${context.runId}/attempts/${attempt}`;
            const refs = jobs['resolve-refs']?.outputs || {};
            const workflow = 'bench-e2e-multi-region-scheduled.yml';
            const payload = {
              title: status === 'firing'
                ? `Nightly multi-region benchmark failed: ${failedJobs.join(', ')}`
                : 'Nightly multi-region benchmark recovered',
              description: [
                status === 'firing'
                  ? `The nightly multi-region benchmark (${workflow}) failed.\nFailed jobs: ${failedJobs.join(', ')}`
                  : `The nightly multi-region benchmark (${workflow}) succeeded.`,
                `Baseline: ${refs['baseline-ref'] || 'unknown'}`,
                `Feature: ${refs['feature-ref'] || 'unknown'}`,
                `Attempt: ${attempt}`,
                `Run: ${runUrl}`,
              ].join('\n'),
              status,
              deduplication_key: 'tempo:bench-e2e-multi-region-nightly',
              source_url: runUrl,
              metadata: {
                team: 'reth',
                repository: 'tempoxyz/tempo',
                workflow,
                failed_jobs: failedJobs.join(','),
                baseline_ref: refs['baseline-ref'] || '',
                feature_ref: refs['feature-ref'] || '',
                run_id: String(context.runId),
                run_attempt: String(attempt),
                run_url: runUrl,
              },
            };

            // The deduplication key makes a repeated event idempotent, so retrying is safe.
            let lastError;
            for (let i = 0; i < 3; i++) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload),
                  signal: AbortSignal.timeout(15000),
                });
                if (response.ok) {
                  core.info(`Sent incident.io ${status} event for ${payload.deduplication_key}`);
                  return;
                }
                lastError = new Error(`HTTP ${response.status}`);
                // Other 4xx (such as a bad token) won't succeed on retry.
                if (response.status < 500 && response.status !== 429) break;
              } catch (error) { lastError = error; }
              if (i < 2) await new Promise(resolve => setTimeout(resolve, 2 ** i * 2000));
            }
            // A failed resolve must not fail an otherwise green run; a failed page must.
            if (status === 'resolved') {
              core.warning(`Failed to send the incident.io resolved event: ${lastError.message}`);
              return;
            }
            throw new Error(`Failed to send the incident.io firing event: ${lastError.message}`);
