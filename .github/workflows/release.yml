name: Release

permissions: {}

on:
  push:
    branches:
      - "rc/*"
    tags:
      - "tempo/v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., tempo/v1.17.0)"
        required: true
        type: string
      profile:
        description: "Build profile"
        default: "profiling"
        type: choice
        options:
          - "release"
          - "profiling"
          - "maxperf"
      dry_run:
        description: "Dry run (build binaries without creating release)"
        default: false
        type: boolean

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Get version from tag or branch
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # VK picks the approving code owners from the dispatched ref, so a
            # publishing dispatch must run from the tempo/v* tag it releases.
            # Another product's tag would get that product's code owners.
            if [ "$DRY_RUN" != "true" ]; then
              if [[ "$tag" != tempo/v* ]]; then
                echo "::error::Publishing dispatches release a tempo/vX.Y.Z tag, not $tag"
                exit 1
              fi
              if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
                echo "::error::Dispatch release.yml from refs/tags/$tag, not $GITHUB_REF"
                exit 1
              fi
            fi
          elif [[ "$GITHUB_REF" == refs/heads/rc/* ]]; then
            tag="sha-${SHA::7}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Releases are tagged tempo/vX.Y.Z (earlier ones vX.Y.Z): the GitHub
          # release uses the tag, and artifacts keep the unprefixed vX.Y.Z.
          {
            echo "tag=$tag"
            echo "version=${tag#tempo/}"
          } >> "$GITHUB_OUTPUT"
  check-version:
    name: check version
    runs-on: ubuntu-latest
    needs: get-version
    if: ${{ !startsWith(github.ref, 'refs/heads/rc/') && github.event.inputs.dry_run != 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Verify crate version matches tag
        # Check that the Cargo version starts with the tag,
        # so that Cargo version 1.4.8 can be matched against both v1.4.8 and v1.4.8-rc.1
        env:
          TAG: ${{ needs.get-version.outputs.version }}
        run: |
          tag="$TAG"
          tag=${tag#v}
          cargo_ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempo").version')
          [[ "$tag" == "$cargo_ver"* ]] || { echo "Tag $tag doesn't match the Cargo version $cargo_ver"; exit 1; }

  build-release:
    name: Build Release Binaries
    needs: get-version
    # Dry runs publish nothing, so they skip the release environment (which
    # only admits release tags) and the signing and attestation that need it.
    environment: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'release' || '' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
      # Required by actions/attest-build-provenance and actions/attest-sbom for
      # keyless Sigstore signing via GitHub OIDC, and to upload the resulting
      # in-toto attestations to the repository's attestation store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - name: tempo
            features: "asm-keccak,jemalloc,otlp"
        platform:
          - os: depot-ubuntu-latest-16
            target: x86_64-unknown-linux-gnu
          - os: depot-ubuntu-latest-arm-16
            target: aarch64-unknown-linux-gnu
          - os: depot-macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup mold linker
        uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Get build profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=maxperf" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build binary
        env:
          CARGO_TARGET_DIR: target
          BIN_NAME: ${{ matrix.binary.name }}
          BIN_FEATURES: ${{ matrix.binary.features }}
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
          TARGET: ${{ matrix.platform.target }}
          # Release binaries carry the real build timestamp.
          VERGEN_IDEMPOTENT: "0"
        run: cargo build --locked --bin "$BIN_NAME" --features "$BIN_FEATURES" --profile "$BUILD_PROFILE" --target "$TARGET"

      - name: Prepare binary
        id: prepare
        shell: bash
        env:
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
          TARGET: ${{ matrix.platform.target }}
          BIN_NAME: ${{ matrix.binary.name }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          PROFILE="$BUILD_PROFILE"
          if [ "$PROFILE" = "dev" ]; then
            PROFILE_DIR="debug"
          else
            PROFILE_DIR="$PROFILE"
          fi

          BINARY_PATH="target/${TARGET}/${PROFILE_DIR}/${BIN_NAME}"
          BINARY_NAME="${BIN_NAME}-${VERSION}-${TARGET}"
          ARCHIVE_NAME="${BIN_NAME}-${VERSION}-${TARGET}.tar.gz"

          cp "$BINARY_PATH" "$BINARY_NAME"
          tar czf "$ARCHIVE_NAME" "$BINARY_NAME"

          {
            echo "archive_name=$ARCHIVE_NAME"
            echo "archive_path=$ARCHIVE_NAME"
            echo "binary_name=$BINARY_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        # Two separate single-line .sha256 files, one per artifact, so that
        # `sha256sum -c <file>.sha256` works cleanly for whichever artifact
        # the user downloaded. The bare-binary checksum is what an
        # independent rebuilder will compare against once the reproducible
        # build path lands (ELF hashes reproduce far more reliably than
        # tar/gzip hashes).
        env:
          ARCHIVE_PATH: ${{ steps.prepare.outputs.archive_path }}
          ARCHIVE_NAME: ${{ steps.prepare.outputs.archive_name }}
          BINARY_NAME: ${{ steps.prepare.outputs.binary_name }}
        run: |
          shasum -a 256 "$ARCHIVE_PATH" > "${ARCHIVE_NAME}.sha256"
          shasum -a 256 "$BINARY_NAME"  > "${BINARY_NAME}.sha256"

      - name: GPG sign archive
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ARCHIVE_PATH: ${{ steps.prepare.outputs.archive_path }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" | gpg --passphrase-fd 0 --pinentry-mode loopback --batch -ab "$ARCHIVE_PATH"

      - name: Generate SBOM (SPDX-JSON) for archive
        uses: tempoxyz/gh-actions/vendor/anchore/sbom-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          file: ${{ steps.prepare.outputs.archive_path }}
          format: spdx-json
          output-file: ${{ steps.prepare.outputs.archive_name }}.spdx.json
          # The release workflow uploads SBOMs explicitly via actions/upload-artifact
          # below, so disable the action's own artifact / release upload to keep
          # the asset list deterministic.
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        if: env.DRY_RUN != 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          # Attest both the archive and the bare binary so consumers can verify
          # provenance whether they hold the .tar.gz or the unpacked ELF
          # (containers, distro packages, the independent rebuilder).
          # `sbom-path` switches actions/attest into SBOM-attestation mode.
          subject-path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.binary_name }}
          sbom-path: ${{ steps.prepare.outputs.archive_name }}.spdx.json

      - name: Attest build provenance (SLSA v1)
        if: env.DRY_RUN != 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          # No `sbom-path` / `predicate-*` → actions/attest auto-emits a SLSA
          # build provenance predicate.
          subject-path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.binary_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary.name }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.archive_name }}.sha256
            ${{ steps.prepare.outputs.archive_name }}.asc
            ${{ steps.prepare.outputs.archive_name }}.spdx.json
            ${{ steps.prepare.outputs.binary_name }}.sha256
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [get-version, build-release]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      # This is necessary for generating the changelog.
      # It has to come before "Download Artifacts" or else it deletes the artifacts.
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tempo-*
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.get-version.outputs.tag }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          # Determine if this is a prerelease
          PRERELEASE=""
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE="--prerelease"
          fi

          # Create draft release with all artifacts
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "Release $VERSION" \
            --draft \
            --notes "" \
            $PRERELEASE \
            artifacts/**/*

  bump-main-cargo-version:
    name: Open Cargo Version Bump PR
    needs: [get-version, create-release, upload-cloudflare]
    if: ${{ startsWith(needs.get-version.outputs.version, 'v') && !contains(needs.get-version.outputs.version, 'alpha') && !contains(needs.get-version.outputs.version, 'beta') && !contains(needs.get-version.outputs.version, 'rc') }}
    runs-on: depot-ubuntu-latest
    environment: release-pr
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: release-pr

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Open Cargo version bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail

          cargo_version="${VERSION#v}"
          branch="automation/bump-cargo-${VERSION}"
          current_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempo").version')

          if [ "$current_version" = "$cargo_version" ]; then
            echo "main already has tempo version $cargo_version"
            exit 0
          fi

          git config user.name "tempo-github-sts[bot]"
          git config user.email "312736176+tempo-github-sts[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          path = Path("Cargo.toml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          in_workspace_package = False
          updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[workspace.package]":
                  in_workspace_package = True
                  continue
              if in_workspace_package and stripped.startswith("[") and stripped.endswith("]"):
                  break
              if in_workspace_package and stripped.startswith("version = "):
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f'version = "{version}"{newline}'
                  updated = True
                  break

          if not updated:
              raise SystemExit("failed to update [workspace.package] version in Cargo.toml")

          path.write_text("".join(lines), encoding="utf-8")
          PY

          cargo update -p tempo

          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "No Cargo version changes needed"
            exit 0
          fi

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${VERSION}"
          git push --force-with-lease origin "$branch"

          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Bumps the Cargo workspace release version to ${VERSION} after the release workflow creates the release artifacts.

          Generated by the release workflow.
          EOF

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$branch" \
            --title "chore(release): ${VERSION}" \
            --body-file "$body_file"
  upload-cloudflare:
    name: Upload to R2 bucket
    needs: [get-version, build-release]
    environment: upload-binaries
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      # The tempo-binaries bucket in tempo-prd, which download.tempo.xyz serves.
      R2_BUCKET: tempo-binaries
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tempo-*
          path: artifacts

      - name: Create binary directory
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir "$VERSION"
          mv artifacts/**/* "$VERSION/"

      - name: Determine destination directory
        id: dest
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.repository }}" == "tempoxyz/tempo-private-fork" ]]; then
            echo "dir=${SHA}/${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Otherwise these are being stored in a generic bucket with many other subdirectories
            echo "dir=binaries/${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      # Requested after the checkout and artifact download, so a slow download
      # can't use up the token's lifetime; the readiness check below waits for
      # R2 to honor it. The upload-binaries policy lives in
      # tempoxyz/cloudflare-sts under policies/tempo-994992847/ and admits only
      # this workflow on tempo/v* tags in the upload-binaries environment of
      # this repository, so copies of the repository skip the upload. The
      # action revokes the token after the job.
      - name: Fetch Cloudflare token for the binaries bucket
        id: cloudflare-sts
        if: github.repository == 'tempoxyz/tempo'
        uses: tempoxyz/gh-actions/actions/cloudflare-sts@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          account: prd
          policy: upload-binaries
          ttl: 10m

      # R2's S3 access key ID is the API token's ID, and its secret is the
      # SHA-256 of the token value.
      - name: Derive R2 credentials
        id: r2-credentials
        if: github.repository == 'tempoxyz/tempo'
        env:
          TOKEN: ${{ steps.cloudflare-sts.outputs.token }}
          ACCOUNT_ID: ${{ steps.cloudflare-sts.outputs.account-id }}
        run: |
          set -euo pipefail
          # The bucket is in the account STS issued the token for.
          if [[ ! "$ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Cloudflare STS returned an invalid account ID"
            exit 1
          fi
          endpoint="https://$ACCOUNT_ID.r2.cloudflarestorage.com"
          # The header goes in on stdin so the token stays out of curl's argv.
          id="$(printf 'Authorization: Bearer %s\n' "$TOKEN" \
            | curl --fail --silent --show-error --retry 3 --max-time 15 -H @- \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/tokens/verify" \
            | jq -er '.result | select(.status == "active") | .id')" \
            || { echo "::error::Cloudflare did not verify the R2 token as active"; exit 1; }
          [[ "$id" =~ ^[0-9a-f]{32}$ ]] \
            || { echo "::error::Cloudflare returned a malformed R2 token ID"; exit 1; }
          secret="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          # R2 can take up to a minute to honor a new token even after it
          # verifies as active: https://developers.cloudflare.com/r2/reference/consistency/
          # Not every R2 server honors it at once, so wait for three listings
          # in a row, which write nothing. The token is only seconds old here,
          # so allow two minutes: the full minute plus the confirming listings.
          accepted=0
          attempt=0
          deadline=$((SECONDS + 120))
          while true; do
            attempt=$((attempt + 1))
            status="$(curl --silent --show-error --retry 2 --max-time 15 \
              --aws-sigv4 'aws:amz:auto:s3' --user "$id:$secret" \
              --output /dev/null --write-out '%{http_code}' \
              "$endpoint/$R2_BUCKET?list-type=2&max-keys=1")"
            case "$status" in
              200) accepted=$((accepted + 1)) ;;
              401|403) accepted=0 ;;
              *) echo "::error::R2 readiness check failed (HTTP $status)"; exit 1 ;;
            esac
            if (( accepted == 3 )); then
              echo "R2 accepted the credentials"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::R2 did not consistently accept the credentials within two minutes (last HTTP $status)"
              exit 1
            fi
            if [ "$status" != 200 ]; then
              echo "Waiting for R2 to accept the credentials (attempt $attempt)"
            fi
            sleep 2
          done
          {
            echo "endpoint-url=$endpoint"
            echo "access-key-id=$id"
            echo "secret-access-key=$secret"
          } >> "$GITHUB_OUTPUT"

      - uses: tempoxyz/gh-actions/vendor/shallwefootball/upload-s3-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        if: github.repository == 'tempoxyz/tempo'
        with:
          aws_key_id: ${{ steps.r2-credentials.outputs.access-key-id }}
          aws_secret_access_key: ${{ steps.r2-credentials.outputs.secret-access-key }}
          aws_bucket: ${{ env.R2_BUCKET }}
          endpoint: ${{ steps.r2-credentials.outputs.endpoint-url }}
          source_dir: "${{ needs.get-version.outputs.version }}"
          destination_dir: "${{ steps.dest.outputs.dir }}"

      - name: Report the skipped upload outside tempoxyz/tempo
        if: github.repository != 'tempoxyz/tempo'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # tempo-private-fork uploaded to its private sharing path behind
          # download.tempo.xyz, so fail its release rather than finish green
          # without the binaries. Other copies never relied on the upload.
          if [ "$REPOSITORY" = "tempoxyz/tempo-private-fork" ]; then
            echo "::error::Did not upload this release to R2. The Cloudflare STS upload-binaries policy authorizes only tempoxyz/tempo; tempo-private-fork needs its own policy and a matching guard here."
            exit 1
          fi
          echo "::notice::Skipped the R2 upload. The Cloudflare STS upload-binaries policy authorizes only tempoxyz/tempo."
