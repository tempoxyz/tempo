name: Release

permissions: {}

on:
  push:
    branches:
      - "rc/*"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true
        type: string
      source_sha:
        description: "Full release commit to prepare before creating the tag (optional)"
        type: string
        default: ""
      prepared_run_id:
        description: "Promote a successful dry run from the same commit and version (blank rebuilds)"
        type: string
        default: ""
      profile:
        description: "macOS build profile (Linux always uses the canonical reproducible profile)"
        default: "profiling"
        type: choice
        options:
          - "release"
          - "profiling"
          - "maxperf"
      dry_run:
        description: "Dry run (build binaries without creating release)"
        default: false
        type: boolean

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      prepared_run_id: ${{ steps.prepared.outputs.prepared_run_id }}
      artifact_run_id: ${{ steps.prepared.outputs.artifact_run_id || github.run_id }}
      macos_profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'maxperf' }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Get version from tag or branch
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/rc/* ]]; then
            echo "version=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve immutable release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha || (github.event_name == 'workflow_dispatch' && inputs.tag || github.sha) }}
          persist-credentials: false

      - name: Record release commit
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$DRY_RUN" == true ]]
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate prepared release run
        if: inputs.prepared_run_id != '' || github.ref_type == 'tag'
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WORKFLOW_PATH: .github/workflows/release.yml
          AUTO_REUSE: ${{ github.ref_type == 'tag' }}
          VERSION: ${{ steps.get_version.outputs.version }}
          MACOS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'maxperf' }}
        run: bash scripts/select-prepared-run.sh

  check-version:
    name: check version
    runs-on: ubuntu-latest
    needs: get-version
    if: ${{ !startsWith(github.ref, 'refs/heads/rc/') && github.event.inputs.dry_run != 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
      - name: Verify crate version matches tag
        # Check that the Cargo version starts with the tag,
        # so that Cargo version 1.4.8 can be matched against both v1.4.8 and v1.4.8-rc.1
        env:
          TAG: ${{ needs.get-version.outputs.version }}
        run: |
          tag="$TAG"
          tag=${tag#v}
          cargo_ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempo").version')
          [[ "$tag" == "$cargo_ver"* ]] || { echo "Tag $tag doesn't match the Cargo version $cargo_ver"; exit 1; }

  build-release:
    if: needs.get-version.outputs.prepared_run_id == ''
    name: Build Release Binaries
    needs: get-version
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
      # Required by actions/attest-build-provenance and actions/attest-sbom for
      # keyless Sigstore signing via GitHub OIDC, and to upload the resulting
      # in-toto attestations to the repository's attestation store.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - name: tempo
            features: "asm-keccak,jemalloc,otlp"
          - name: tempo-sidecar
            features: ""
        platform:
          - os: depot-ubuntu-latest-16
            target: x86_64-unknown-linux-gnu
          - os: depot-ubuntu-latest-arm-16
            target: aarch64-unknown-linux-gnu
          - os: depot-macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: matrix.platform.target != 'aarch64-apple-darwin'
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          targets: ${{ matrix.platform.target }}

      - name: Setup mold linker
        uses: tempoxyz/gh-actions/actions/setup-mold@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Get build profile
        id: profile
        run: |
          if [[ "${{ matrix.platform.target }}" != aarch64-apple-darwin ]]; then
            echo "profile=reproducible" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=maxperf" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build canonical Linux binary
        if: matrix.platform.target != 'aarch64-apple-darwin'
        env:
          PLATFORM: ${{ matrix.platform.target == 'x86_64-unknown-linux-gnu' && 'linux/amd64' || 'linux/arm64' }}
          BINARY: ${{ matrix.binary.name }}
          FEATURES: ${{ matrix.binary.features }}
          OUT_DIR: target/${{ matrix.platform.target }}/${{ steps.profile.outputs.profile }}
        run: scripts/reproducible-build.sh

      - name: Build binary
        if: matrix.platform.target == 'aarch64-apple-darwin'
        env:
          CARGO_TARGET_DIR: target
          BIN_NAME: ${{ matrix.binary.name }}
          BIN_FEATURES: ${{ matrix.binary.features }}
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
          TARGET: ${{ matrix.platform.target }}
        run: cargo build --locked --bin "$BIN_NAME" --features "$BIN_FEATURES" --profile "$BUILD_PROFILE" --target "$TARGET"

      - name: Prepare binary
        id: prepare
        shell: bash
        env:
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
          TARGET: ${{ matrix.platform.target }}
          BIN_NAME: ${{ matrix.binary.name }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          PROFILE="$BUILD_PROFILE"
          if [ "$PROFILE" = "dev" ]; then
            PROFILE_DIR="debug"
          else
            PROFILE_DIR="$PROFILE"
          fi

          BINARY_PATH="target/${TARGET}/${PROFILE_DIR}/${BIN_NAME}"
          BINARY_NAME="${BIN_NAME}-${VERSION}-${TARGET}"
          ARCHIVE_NAME="${BIN_NAME}-${VERSION}-${TARGET}.tar.gz"

          cp "$BINARY_PATH" "$BINARY_NAME"
          tar czf "$ARCHIVE_NAME" "$BINARY_NAME"

          {
            echo "archive_name=$ARCHIVE_NAME"
            echo "archive_path=$ARCHIVE_NAME"
            echo "binary_name=$BINARY_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        # Two separate single-line .sha256 files, one per artifact, so that
        # `sha256sum -c <file>.sha256` works cleanly for whichever artifact
        # the user downloaded. The bare-binary checksum is what an
        # independent rebuild is compared against before publication
        # (ELF hashes reproduce more reliably than tar/gzip hashes).
        env:
          ARCHIVE_PATH: ${{ steps.prepare.outputs.archive_path }}
          ARCHIVE_NAME: ${{ steps.prepare.outputs.archive_name }}
          BINARY_NAME: ${{ steps.prepare.outputs.binary_name }}
        run: |
          shasum -a 256 "$ARCHIVE_PATH" > "${ARCHIVE_NAME}.sha256"
          shasum -a 256 "$BINARY_NAME"  > "${BINARY_NAME}.sha256"

      - name: Generate SBOM (SPDX-JSON) for archive
        uses: tempoxyz/gh-actions/vendor/anchore/sbom-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          file: ${{ steps.prepare.outputs.archive_path }}
          format: spdx-json
          output-file: ${{ steps.prepare.outputs.archive_name }}.spdx.json
          # The release workflow uploads SBOMs explicitly via actions/upload-artifact
          # below, so disable the action's own artifact / release upload to keep
          # the asset list deterministic.
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          # Attest both the archive and the bare binary so consumers can verify
          # provenance whether they hold the .tar.gz or the unpacked ELF
          # (containers, distro packages, the independent rebuilder).
          # `sbom-path` switches actions/attest into SBOM-attestation mode.
          subject-path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.binary_name }}
          sbom-path: ${{ steps.prepare.outputs.archive_name }}.spdx.json

      - name: Attest build provenance (SLSA v1)
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          # No `sbom-path` / `predicate-*` → actions/attest auto-emits a SLSA
          # build provenance predicate.
          subject-path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.binary_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary.name }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.archive_name }}.sha256
            ${{ steps.prepare.outputs.archive_name }}.spdx.json
            ${{ steps.prepare.outputs.binary_name }}.sha256
          if-no-files-found: error

  rebuild-linux-release:
    if: needs.get-version.outputs.prepared_run_id == ''
    name: Clean rebuild ${{ matrix.binary.name }} (${{ matrix.platform.target }})
    needs: get-version
    runs-on: ${{ matrix.platform.platform == 'linux/amd64' && (vars.REPRO_RUNNER_AMD64 || 'ubuntu-latest') || (vars.REPRO_RUNNER_ARM64 || 'ubuntu-24.04-arm') }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - {name: tempo, features: 'asm-keccak,jemalloc,otlp'}
          - {name: tempo-sidecar, features: ''}
        platform:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux/amd64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux/arm64}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up isolated Docker builder
        uses: tempoxyz/gh-actions/vendor/docker/setup-buildx-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Free space for independent rebuild
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Rebuild without Depot or shared cache
        env:
          NO_CACHE: "1"
          CARGO_BUILD_JOBS: ${{ vars.REPRO_BUILD_JOBS || (matrix.platform.platform == 'linux/arm64' && '2' || '4') }}
          PLATFORM: ${{ matrix.platform.platform }}
          BINARY: ${{ matrix.binary.name }}
          FEATURES: ${{ matrix.binary.features }}
          OUT_DIR: ${{ runner.temp }}/clean-binary
        run: |
          set -euo pipefail
          scripts/reproducible-build.sh
          cd "$OUT_DIR"
          sha256sum "$BINARY" > "$RUNNER_TEMP/clean.sha256"

      - name: Upload independent checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-${{ matrix.binary.name }}-${{ matrix.platform.target }}
          path: ${{ runner.temp }}/clean.sha256
          if-no-files-found: error

  verify-linux-release:
    name: Compare packaged Linux releases with independent rebuilds
    needs: [get-version, build-release, rebuild-linux-release]
    if: ${{ !cancelled() && needs.get-version.result == 'success' && ((needs.build-release.result == 'success' && needs.rebuild-linux-release.result == 'success') || (needs.get-version.outputs.prepared_run_id != '' && needs.build-release.result == 'skipped' && needs.rebuild-linux-release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout verification scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          persist-credentials: false

      - name: Download release archives and independent checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-verification
          github-token: ${{ github.token }}
          run-id: ${{ needs.get-version.outputs.artifact_run_id }}

      - name: Validate prepared release identity
        if: needs.get-version.outputs.prepared_run_id != ''
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-verification
          SOURCE_SHA: ${{ needs.get-version.outputs.sha }}
          VERSION: ${{ needs.get-version.outputs.version }}
          MACOS_PROFILE: ${{ needs.get-version.outputs.macos_profile }}
        run: |
          jq -e --arg sha "$SOURCE_SHA" --arg version "$VERSION" --arg profile "$MACOS_PROFILE" \
            '.sha == $sha and .version == $version and .macos_profile == $profile and .dry_run == true' \
            "$ARTIFACT_DIR/release-preparation/manifest.json"

      - name: Verify actual archived executables
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-verification
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail
          for binary in tempo tempo-sidecar; do
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
              name="$binary-$VERSION-$target"
              archive="$ARTIFACT_DIR/$binary-$target/$name.tar.gz"
              checksum="$ARTIFACT_DIR/clean-$binary-$target/clean.sha256"
              extracted="$(mktemp -d)"
              tar -xzf "$archive" -C "$extracted" -- "$name"
              expected="$(awk '{print $1}' "$checksum")"
              [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
              printf '%s  %s\n' "$expected" "$extracted/$name" | sha256sum --check
              # Validate the published bare-binary checksum against the archive too.
              (cd "$extracted" && sha256sum --check "$ARTIFACT_DIR/$binary-$target/$name.sha256")
              rm -rf "$extracted"
            done
          done

      - name: Record prepared release identity
        if: needs.get-version.outputs.prepared_run_id == ''
        env:
          SOURCE_SHA: ${{ needs.get-version.outputs.sha }}
          VERSION: ${{ needs.get-version.outputs.version }}
          MACOS_PROFILE: ${{ needs.get-version.outputs.macos_profile }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          jq -n --arg sha "$SOURCE_SHA" --arg version "$VERSION" --arg profile "$MACOS_PROFILE" \
            --argjson dry_run "$DRY_RUN" \
            '{sha: $sha, version: $version, macos_profile: $profile, dry_run: $dry_run}' \
            > "$RUNNER_TEMP/manifest.json"

      - name: Upload prepared release identity
        if: needs.get-version.outputs.prepared_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preparation
          path: ${{ runner.temp }}/manifest.json
          if-no-files-found: error

  sign-release:
    name: Sign verified release archives
    needs: [get-version, check-version, verify-linux-release]
    if: ${{ !cancelled() && needs.verify-linux-release.result == 'success' && (needs.check-version.result == 'success' || (startsWith(github.ref, 'refs/heads/rc/') && needs.check-version.result == 'skipped')) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    environment: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Download verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tempo-*
          path: ${{ runner.temp }}/release-signing
          github-token: ${{ github.token }}
          run-id: ${{ needs.get-version.outputs.artifact_run_id }}

      - name: GPG sign verified archives
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          mkdir -p "$RUNNER_TEMP/release-signatures"
          for archive in "$RUNNER_TEMP"/release-signing/tempo-*/*.tar.gz; do
            printf '%s' "$GPG_PASSPHRASE" | gpg --passphrase-fd 0 --pinentry-mode loopback \
              --batch --output "$RUNNER_TEMP/release-signatures/$(basename "$archive").asc" -ab "$archive"
          done

      - name: Upload release signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signatures
          path: ${{ runner.temp }}/release-signatures/*.asc
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [get-version, check-version, build-release, verify-linux-release, sign-release]
    if: ${{ !cancelled() && needs.verify-linux-release.result == 'success' && needs.sign-release.result == 'success' && (needs.check-version.result == 'success' || (startsWith(github.ref, 'refs/heads/rc/') && needs.check-version.result == 'skipped')) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      # This is necessary for generating the changelog.
      # It has to come before "Download Artifacts" or else it deletes the artifacts.
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tempo-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.get-version.outputs.artifact_run_id }}

      - name: Download release signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signatures
          path: artifacts/signatures

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
          SOURCE_SHA: ${{ needs.get-version.outputs.sha }}
        run: |
          # Determine if this is a prerelease
          PRERELEASE=""
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE="--prerelease"
          fi

          # Create draft release with all artifacts
          gh release create "$VERSION" \
            --repo ${{ github.repository }} \
            --title "Release $VERSION" \
            --target "$SOURCE_SHA" \
            --draft \
            --notes "" \
            $PRERELEASE \
            artifacts/**/*

  bump-main-cargo-version:
    name: Open Cargo Version Bump PR
    needs: [get-version, create-release, upload-cloudflare]
    if: ${{ startsWith(needs.get-version.outputs.version, 'v') && !contains(needs.get-version.outputs.version, 'alpha') && !contains(needs.get-version.outputs.version, 'beta') && !contains(needs.get-version.outputs.version, 'rc') }}
    runs-on: depot-ubuntu-latest
    environment: release-pr
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          policy: release-pr

      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Open Cargo version bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail

          cargo_version="${VERSION#v}"
          branch="automation/bump-cargo-${VERSION}"
          current_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempo").version')

          if [ "$current_version" = "$cargo_version" ]; then
            echo "main already has tempo version $cargo_version"
            exit 0
          fi

          git config user.name "tempo-github-sts[bot]"
          git config user.email "312736176+tempo-github-sts[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"].removeprefix("v")
          path = Path("Cargo.toml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          in_workspace_package = False
          updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[workspace.package]":
                  in_workspace_package = True
                  continue
              if in_workspace_package and stripped.startswith("[") and stripped.endswith("]"):
                  break
              if in_workspace_package and stripped.startswith("version = "):
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f'version = "{version}"{newline}'
                  updated = True
                  break

          if not updated:
              raise SystemExit("failed to update [workspace.package] version in Cargo.toml")

          path.write_text("".join(lines), encoding="utf-8")
          PY

          cargo update -p tempo

          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "No Cargo version changes needed"
            exit 0
          fi

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): ${VERSION}"
          git push --force-with-lease origin "$branch"

          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Bumps the Cargo workspace release version to ${VERSION} after the release workflow creates the release artifacts.

          Generated by the release workflow.
          EOF

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$branch" \
            --title "chore(release): ${VERSION}" \
            --body-file "$body_file"
  upload-cloudflare:
    name: Upload to R2 bucket
    needs: [get-version, check-version, build-release, verify-linux-release, sign-release]
    environment: upload-binaries
    if: ${{ !cancelled() && needs.verify-linux-release.result == 'success' && needs.sign-release.result == 'success' && (needs.check-version.result == 'success' || (startsWith(github.ref, 'refs/heads/rc/') && needs.check-version.result == 'skipped')) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tempo-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.get-version.outputs.artifact_run_id }}

      - name: Download release signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signatures
          path: artifacts/signatures

      - name: Create binary directory
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir "$VERSION"
          mv artifacts/**/* "$VERSION/"

      - name: Determine destination directory
        id: dest
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          SHA: ${{ needs.get-version.outputs.sha }}
        run: |
          if [[ "${{ github.repository }}" == "tempoxyz/tempo-private-fork" ]]; then
            echo "dir=${SHA}/${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Otherwise these are being stored in a generic bucket with many other subdirectories
            echo "dir=binaries/${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - uses: tempoxyz/gh-actions/vendor/shallwefootball/upload-s3-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          aws_key_id: ${{ secrets.R2_BINARIES_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_BINARIES_SECRET_KEY }}
          aws_bucket: ${{ secrets.R2_BINARIES_BUCKET }}
          endpoint: ${{ secrets.R2_BINARIES_ENDPOINT }}
          source_dir: "${{ needs.get-version.outputs.version }}"
          destination_dir: "${{ steps.dest.outputs.dir }}"
