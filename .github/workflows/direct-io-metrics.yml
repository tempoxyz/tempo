name: direct-io metric analysis
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed Tempo benchmark run to analyze
        type: string
        required: true
        default: "35087336997"
permissions:
  actions: read
  contents: read
jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reduce storage and pressure metrics
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_RUN_ID: ${{ inputs.run-id }}
        run: python3 .github/scripts/bench-direct-io-metrics.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-io-metrics
          path: |
            direct-io-metrics.json
            benchmark-evidence/
          if-no-files-found: error
          retention-days: 14
