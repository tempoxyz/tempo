name: direct-io metric analysis
on:
  push:
    branches: [onbjerg/static-file-direct-io]
    paths:
      - .github/scripts/bench-direct-io-metrics.py
      - .github/workflows/direct-io-metrics.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reduce storage and pressure metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/bench-direct-io-metrics.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-io-metrics
          path: direct-io-metrics.json
          if-no-files-found: error
          retention-days: 14
