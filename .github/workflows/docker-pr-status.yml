name: Docker PR Build Status

# Trusted default-branch code only; run provenance is checked before reading
# size-bounded, schema-validated image data in an isolated temporary directory.
on: # zizmor: ignore[dangerous-triggers]
  workflow_call:
    inputs:
      run_id:
        description: Docker build to acknowledge after dispatch
        type: string
        required: true
  workflow_run:
    workflows: [Docker Build, Docker Build (Profiling)]
    types: [requested, in_progress, completed]

permissions: {}

# Serialize upserts for each build, and fetch its current state rather than
# trusting event ordering. New builds have separate comments and groups.
concurrency:
  group: docker-pr-status-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.repository == 'tempoxyz/tempo' &&
      (inputs.run_id != '' || (
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6

      # Never check out the build/PR head or execute downloaded artifacts.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve Docker build status
        id: status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolve } = require('./.github/scripts/docker-pr-status.js');
            const status = await resolve(github, context, Number(process.env.BUILD_RUN_ID));
            if (!status) return;
            core.setOutput('report', JSON.stringify(status));
            core.setOutput('artifact-id', status.artifactId || '');

      - name: Download image details as data
        id: artifact
        if: steps.status.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.status.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/docker-pr-report

      - name: Create or update build comment
        if: steps.status.outputs.report != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ steps.status.outputs.report }}
          ARTIFACT_DOWNLOADED: ${{ steps.artifact.outcome == 'success' }}
        with:
          retries: 0
          script: |
            const { report } = require('./.github/scripts/docker-pr-status.js');
            await report(github, context, core, JSON.parse(process.env.REPORT));
