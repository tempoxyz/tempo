name: Zones Reproducible Build

# Builds and hashes the byte-deterministic `tempo-zone` binary via the shared
# reusable workflow in tempoxyz/gh-actions.

permissions: {}

concurrency:
  group: zones-reproducible-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or full SHA) to build reproducibly"
        type: string
        required: false
        default: "main"

jobs:
  build:
    if: >-
      github.repository == 'tempoxyz/tempo' &&
      (github.event_name == 'workflow_dispatch' || vars.ZONES_REPRODUCIBLE_ENABLED == 'true')
    uses: tempoxyz/gh-actions/.github/workflows/reproducible-build.yml@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
    permissions:
      contents: read
      id-token: write
    with:
      binary-name: tempo-zone
      build-script: ./zones/scripts/reproducible-build.sh
      ref: ${{ inputs.ref }}
