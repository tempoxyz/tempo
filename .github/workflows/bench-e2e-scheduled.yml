name: e2e artifact state smoke
on:
  workflow_dispatch:
    inputs:
      chain:
        type: string
        default: mainnet
      expected:
        type: string
        default: ""
      feature:
        type: string
        default: "71e43d6d6529b72ce55ae1726023cd28048cb3b5"
      fail:
        type: boolean
        default: false
permissions: {}
jobs:
  resolve-refs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      save-matrix: ${{ steps.refs.outputs.save-matrix }}
      has-nightly-benchmarks: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Restore previous successful state and verify branch isolation
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.expected }}
          FEATURE_REF: ${{ inputs.feature }}
          CHAIN: ${{ inputs.chain }}
        run: |
          for key in default tip20-existing-any; do
            test "$(bash .github/scripts/bench-state.sh "$GITHUB_REPOSITORY" e2e "$key")" = "$EXPECTED"
            test -z "$(GITHUB_REF_NAME=artifact-isolation-unwritten bash .github/scripts/bench-state.sh "$GITHUB_REPOSITORY" e2e "$key")"
          done
          matrix=$(jq -cn --arg sha "$FEATURE_REF" '{include:[{state_key:"default",feature_ref:$sha},{state_key:"tip20-existing-any",feature_ref:$sha}]}')
          echo "save-matrix=$matrix" >> "$GITHUB_OUTPUT"
  bench-e2e:
    needs: resolve-refs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fixture benchmark success
        run: "true"

  save-state:
    needs: [resolve-refs, bench-e2e]
    if: |
      always() &&
      needs.resolve-refs.outputs.has-nightly-benchmarks == 'true' &&
      needs.bench-e2e.result == 'success'
    name: save-state (${{ matrix.state_key }})
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-refs.outputs.save-matrix) }}
    steps:
      - name: Prepare benchmark state
        env:
          FEATURE_REF: ${{ matrix.feature_ref }}
        run: |
          [[ "$FEATURE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/bench-state"
          printf '%s\n' "$FEATURE_REF" > "$RUNNER_TEMP/bench-state/feature-ref"

      - name: Save benchmark state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-state-e2e-${{ matrix.state_key }}
          path: ${{ runner.temp }}/bench-state/feature-ref
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  intentional-failure:
    needs: save-state
    if: inputs.fail
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: exit 1
