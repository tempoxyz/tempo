name: E2E scheduler integration smoke
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: ""
      force:
        type: boolean
        default: false
permissions: {}
jobs:
  resolve-refs:
    name: resolve-refs
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      bench-matrix: ${{ steps.refs.outputs.bench-matrix }}
      save-matrix: ${{ steps.refs.outputs.save-matrix }}
      has-benchmarks: ${{ steps.refs.outputs.has-benchmarks }}
      has-nightly-benchmarks: ${{ steps.refs.outputs.has-nightly-benchmarks }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Resolve refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
          INPUT_REF: ${{ inputs.ref || '' }}
        run: |
          scenarios=(
            # Keep a distinct state key for each benchmark series.
            '{"preset":"public","state_key":"default","token_count":"1"}'
            '{"preset":"tip20:recipient=existing,fee-token=any_tip20","state_key":"tip20-existing-any","token_count":"4"}'
          )
          bench_entries=()
          save_entries=()
          stale_scenarios=()

          get_output() {
            local file="$1"
            local key="$2"
            grep -E "^${key}=" "$file" | tail -1 | sed "s/^${key}=//"
          }

          for scenario in "${scenarios[@]}"; do
            preset="$(jq -r '.preset' <<< "$scenario")"
            state_key="$(jq -r '.state_key' <<< "$scenario")"
            token_count="$(jq -r '.token_count' <<< "$scenario")"
            out="$(mktemp)"
            GITHUB_OUTPUT="$out" bash .github/scripts/bench-e2e-scheduled-refs.sh "$INPUT_FORCE" "$state_key"

            baseline_ref="$(get_output "$out" baseline-ref)"
            baseline_name="$(get_output "$out" baseline-name)"
            feature_ref="$(get_output "$out" feature-ref)"
            feature_name="$(get_output "$out" feature-name)"
            should_skip="$(get_output "$out" should-skip)"
            run_type="$(get_output "$out" run-type)"
            actor="$(get_output "$out" actor)"
            is_stale="$(get_output "$out" is-stale)"

            if [ "$is_stale" = "true" ]; then
              stale_scenarios+=("$preset")
            fi

            if [ "$should_skip" != "true" ] && [ "$is_stale" != "true" ]; then
              entry="$(jq -cn \
                --arg preset "$preset" \
                --arg actor "$actor" \
                --arg baseline_ref "$baseline_ref" \
                --arg feature_ref "$feature_ref" \
                --arg baseline_name "$baseline_name" \
                --arg feature_name "$feature_name" \
                --arg run_type "$run_type" \
                --arg token_count "$token_count" \
                --arg state_key "$state_key" \
                '{preset:$preset, state_key:$state_key, actor:$actor, baseline_ref:$baseline_ref, feature_ref:$feature_ref, baseline_name:$baseline_name, feature_name:$feature_name, run_type:$run_type, token_count:$token_count}')"
              bench_entries+=("$entry")
              if [ "$run_type" = "nightly" ]; then
                save_entries+=("$entry")
              fi
            fi

            rm -f "$out"
          done

          if [ "${#stale_scenarios[@]}" -gt 0 ]; then
            echo "::error::Nightly Docker build is stale (>24h old). Aborting e2e benchmark for scenario(s): ${stale_scenarios[*]}."
            exit 1
          fi

          if [ "${#bench_entries[@]}" -gt 0 ]; then
            bench_matrix="$(printf '%s\n' "${bench_entries[@]}" | jq -cs '{include:.}')"
            has_benchmarks="true"
          else
            bench_matrix='{"include":[]}'
            has_benchmarks="false"
          fi

          if [ "${#save_entries[@]}" -gt 0 ]; then
            save_matrix="$(printf '%s\n' "${save_entries[@]}" | jq -cs '{include:.}')"
            has_nightly_benchmarks="true"
          else
            save_matrix='{"include":[]}'
            has_nightly_benchmarks="false"
          fi

          {
            echo "bench-matrix=$bench_matrix"
            echo "save-matrix=$save_matrix"
            echo "has-benchmarks=$has_benchmarks"
            echo "has-nightly-benchmarks=$has_nightly_benchmarks"
          } >> "$GITHUB_OUTPUT"

  bench-e2e:
    needs: resolve-refs
    if: needs.resolve-refs.outputs.has-benchmarks == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-refs.outputs.bench-matrix) }}
    steps:
      - name: Validate resolved matrix (fixture only, no cloud benchmark)
        env:
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          jq -e '.run_type == "nightly" and
            (.state_key == "default" or .state_key == "tip20-existing-any") and
            (.feature_ref | test("^[0-9a-f]{40}$")) and
            (.baseline_ref | test("^[0-9a-f]{40}$"))' <<< "$ENTRY"

  save-state:
    needs: [resolve-refs, bench-e2e]
    if: |
      always() &&
      needs.resolve-refs.outputs.has-nightly-benchmarks == 'true' &&
      needs.bench-e2e.result == 'success'
    name: save-state (${{ matrix.state_key }})
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-refs.outputs.save-matrix) }}
    steps:
      - name: Prepare benchmark state
        env:
          FEATURE_REF: ${{ matrix.feature_ref }}
        run: |
          [[ "$FEATURE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/bench-state"
          printf '%s\n' "$FEATURE_REF" > "$RUNNER_TEMP/bench-state/feature-ref"

      - name: Save benchmark state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-state-e2e-${{ matrix.state_key }}
          path: ${{ runner.temp }}/bench-state/feature-ref
          retention-days: 90
          if-no-files-found: error
          overwrite: true
