name: Publish alloy crates

permissions: {}

on:
  pull_request:
    types: [closed]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  cargo-cooldown:
    permissions:
      contents: read
    uses: ./.github/workflows/cargo-cooldown.yml

  publish:
    name: Publish
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'changelog-release/')
    needs: cargo-cooldown
    runs-on: depot-ubuntu-latest-4
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - name: Install Cargo cooldown verifier
        id: cargo_cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@0aa93238d85fd085d7901320b670cc6adb7a02f3 # gh-actions#101
        with:
          strict-project-config: "true"
      - name: Export verified Cargo cooldown location
        env:
          VERIFIER_PATH: ${{ steps.cargo_cooldown.outputs.verifier-path }}
          VERIFIER_SHA256: ${{ steps.cargo_cooldown.outputs.verifier-sha256 }}
        run: |
          echo "CARGO_COOLDOWN_BIN=$VERIFIER_PATH" >> "$GITHUB_ENV"
          echo "CARGO_COOLDOWN_SHA256=$VERIFIER_SHA256" >> "$GITHUB_ENV"

      - name: Authenticate with crates.io
        uses: tempoxyz/gh-actions/vendor/rust-lang/crates-io-auth-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        id: auth

      - name: Publish crates via sanitize pipeline
        run: ./scripts/publish-crates.sh --publish
        env:
          CARGO_COOLDOWN_REQUIRED: "true"
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
