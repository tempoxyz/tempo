name: Publish alloy crates

permissions: {}

on:
  pull_request:
    types: [closed]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  cargo-cooldown:
    name: Reject newly published crates
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@636efecfbdc385738c8afc9dd3c13aa685e41054 # gh-actions#98
        with:
          toolchain: stable
      - name: Enforce Cargo dependency cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@636efecfbdc385738c8afc9dd3c13aa685e41054 # gh-actions#98

  publish:
    name: Publish
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'changelog-release/')
    needs: cargo-cooldown
    runs-on: depot-ubuntu-latest-4
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e

      - name: Authenticate with crates.io
        uses: tempoxyz/gh-actions/vendor/rust-lang/crates-io-auth-action@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        id: auth

      - name: Publish crates via sanitize pipeline
        run: ./scripts/publish-crates.sh --publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
