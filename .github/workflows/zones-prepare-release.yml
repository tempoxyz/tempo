name: Prepare Zones Release

run-name: Prepare zones/v${{ inputs.version }} from ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA from main
        required: true
        type: string
      version:
        description: Zones version without the v prefix (for example, 0.3.8)
        required: true
        type: string

# Each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: prepare-zones-release-v${{ inputs.version }}
  cancel-in-progress: false

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"

jobs:
  prepare:
    name: Prepare pre-release/zones-v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-pr
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Validate inputs
        id: release
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::This workflow must be dispatched from main"
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full, lowercase 40-character commit SHA"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be an X.Y.Z version without a v prefix"
            exit 1
          fi

          echo "release_branch=pre-release/zones-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out the requested source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release branch
        id: branch
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout did not resolve to the requested source SHA"
            exit 1
          fi

          # Zones Release and Zones Docker Build only publish commits on main,
          # or a single version-bump commit on top of one.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "::error::source_sha must be an ancestor of origin/main"
            exit 1
          fi

          # Every Zones crate shares one version, read from the tempo-zone binary.
          current_version="$(
            sed -n -E '/^\[package\]$/,/^\[/ s/^version = "([^"]+)"$/\1/p' \
              bin/tempo-zone/Cargo.toml
          )"
          if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Could not read an X.Y.Z version from bin/tempo-zone/Cargo.toml"
            exit 1
          fi
          for manifest in bin/tempo-zone/Cargo.toml crates/zones/*/Cargo.toml; do
            manifest_version="$(
              sed -n -E '/^\[package\]$/,/^\[/ s/^version = "([^"]+)"$/\1/p' "$manifest"
            )"
            if [[ "$manifest_version" != "$current_version" ]]; then
              echo "::error::${manifest} has version '${manifest_version}', expected ${current_version}"
              exit 1
            fi
          done

          if [[ "$current_version" == "$VERSION" ]] ||
             [[ "$(printf '%s\n%s\n' "$current_version" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "::error::version ${VERSION} must be greater than Zones version ${current_version}"
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/zones/v${VERSION}" >/dev/null
          tag_status=$?
          set -e

          case "$tag_status" in
            0)
              echo "::error::Tag zones/v${VERSION} already exists"
              exit 1
              ;;
            2)
              ;;
            *)
              echo "::error::Could not determine whether tag zones/v${VERSION} exists"
              exit 1
              ;;
          esac

          # An exact existing release branch is a successful retry. Record its
          # commit now; its generated tree is verified before it is reused.
          set +e
          branch_ref="$(
            git ls-remote --exit-code --heads origin \
              "refs/heads/${RELEASE_BRANCH}"
          )"
          branch_status=$?
          set -e

          case "$branch_status" in
            0)
              read -r existing_commit _ <<< "$branch_ref"
              git fetch --no-tags origin \
                "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
              fetched_commit="$(
                git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}"
              )"
              if [[ "$fetched_commit" != "$existing_commit" ]]; then
                echo "::error::Branch ${RELEASE_BRANCH} changed while it was being inspected"
                exit 1
              fi

              read -r -a ancestry <<< "$(
                git rev-list --parents -n 1 "$existing_commit"
              )"
              if [[ "${#ancestry[@]}" -ne 2 ]] ||
                 [[ "${ancestry[1]}" != "$SOURCE_SHA" ]]; then
                echo "::error::Existing ${RELEASE_BRANCH} is not a single release commit on ${SOURCE_SHA}"
                exit 1
              fi
              ;;
            2)
              existing_commit=""
              ;;
            *)
              echo "::error::Could not determine whether ${RELEASE_BRANCH} exists"
              exit 1
              ;;
          esac

          git switch --create "$RELEASE_BRANCH"
          echo "existing_commit=${existing_commit}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Update Zones versions
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for manifest in bin/tempo-zone/Cargo.toml crates/zones/*/Cargo.toml; do
            sed -i -E \
              "/^\[package\]$/,/^\[/ s/^version = \"[^\"]+\"$/version = \"${VERSION}\"/" \
              "$manifest"
          done

      - name: Refresh Cargo.lock
        shell: bash
        run: cargo update --workspace

      - name: Verify release changes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "$VERSION" \
              '.packages | any(.name == "tempo-zone" and .version == $version)'

          # Only Zones manifests and the lockfile, and only their version lines.
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all |
              grep -Ev '^ M (Cargo\.lock|bin/tempo-zone/Cargo\.toml|crates/zones/[^/]+/Cargo\.toml)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Release preparation changed unexpected files"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          unexpected="$(
            git diff -U0 | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' |
              grep -Ev '^[+-]version = "[^"]+"$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Release preparation changed more than versions"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if git diff --quiet -- Cargo.lock; then
            echo "::error::Expected Cargo.lock to change"
            exit 1
          fi

          git diff --check
          git diff --stat

      - name: Reuse or commit release preparation
        id: publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          EXISTING_COMMIT: ${{ steps.branch.outputs.existing_commit }}
        run: |
          set -euo pipefail

          if [[ -n "$EXISTING_COMMIT" ]]; then
            if ! git diff --quiet "$EXISTING_COMMIT" --; then
              echo "::error::Existing release branch does not exactly match the generated release changes"
              git diff "$EXISTING_COMMIT" --
              exit 1
            fi

            git reset --hard "$EXISTING_COMMIT"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore(zones): prepare zones/v${VERSION}"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

          release_commit="$(git rev-parse HEAD)"
          echo "release_commit=${release_commit}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${release_commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        if: steps.publish.outputs.reused == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          set -euo pipefail

          gh auth setup-git
          git push \
            --force-with-lease="refs/heads/${RELEASE_BRANCH}:" \
            origin \
            "HEAD:refs/heads/${RELEASE_BRANCH}"

      - name: Verify published release branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          RELEASE_COMMIT: ${{ steps.publish.outputs.release_commit }}
        run: |
          set -euo pipefail

          remote_ref="$(
            git ls-remote --exit-code --heads origin \
              "refs/heads/${RELEASE_BRANCH}"
          )"
          read -r remote_commit _ <<< "$remote_ref"
          if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo "::error::Remote ${RELEASE_BRANCH} points to ${remote_commit}, expected ${RELEASE_COMMIT}"
            exit 1
          fi

      - name: Summarize release preparation
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          RELEASE_COMMIT: ${{ steps.publish.outputs.release_commit }}
          IMAGE_TAG: ${{ steps.publish.outputs.image_tag }}
          REUSED: ${{ steps.publish.outputs.reused }}
        run: |
          {
            echo "## Zones release v${VERSION} prepared"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source commit | \`${SOURCE_SHA}\` |"
            echo "| Release branch | \`${RELEASE_BRANCH}\` |"
            echo "| Release commit | \`${RELEASE_COMMIT}\` |"
            echo "| Expected image tag | \`${IMAGE_TAG}\` |"
            echo "| Existing branch reused | \`${REUSED}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: release-pr

      - name: Open draft pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          pr_url="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$RELEASE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "$pr_url" ]]; then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$RELEASE_BRANCH" \
                --draft \
                --title "chore(zones): prepare zones/v${VERSION}" \
                --body "Prepares Zones v${VERSION} from ${SOURCE_SHA} by updating the Zones crate versions and lockfile."
            )"
          fi

          echo "Draft pull request: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
