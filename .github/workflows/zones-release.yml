name: Zones Release
# Adapted from Reth's release workflow
# https://github.com/paradigmxyz/reth/blob/main/.github/workflows/release.yml

on:
  push:
    tags:
      - "zones-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., zones-v0.1.0)"
        required: true
        type: string
      profile:
        description: "Build profile"
        default: "profiling"
        type: choice
        options:
          - "release"
          - "profiling"
          - "maxperf"
      dry_run:
        description: "Dry run (build binaries without creating release)"
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  get-version:
    if: github.repository == 'tempoxyz/tempo'
    permissions:
      contents: read
      id-token: write
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - name: Get version from tag
        id: get_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          [[ "$tag" =~ ^zones-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Expected an isolated zones-vX.Y.Z release tag" >&2
            exit 1
          }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  check-version:
    permissions:
      contents: read
      id-token: write
    name: check version
    runs-on: ubuntu-latest
    needs: get-version
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.version }}
          submodules: recursive
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          toolchain: stable
      - name: Verify crate version matches tag
        # Check that the Cargo version starts with the tag,
        # so that Cargo version 1.4.8 can be matched against both v1.4.8 and v1.4.8-rc.1
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          tag="$VERSION"
          tag=${tag#zones-v}
          cargo_ver=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempo-zone") | .version')
          [[ "$tag" == "$cargo_ver"* ]] || { echo "Tag $tag doesn’t match the Cargo version $cargo_ver"; exit 1; }

  build-release:
    permissions:
      contents: read
      id-token: write
    name: Build Release Binaries
    needs: get-version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        binary:
          - name: tempo-zone
            features: "asm-keccak,jemalloc"
        platform:
          - os: depot-ubuntu-latest-16
            target: x86_64-unknown-linux-gnu
          - os: depot-ubuntu-latest-arm-16
            target: aarch64-unknown-linux-gnu
          - os: depot-macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.version }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - name: Get build profile
        id: profile
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${INPUT_PROFILE}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=maxperf" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build binary
        env:
          CARGO_TARGET_DIR: target
          BINARY_NAME: ${{ matrix.binary.name }}
          FEATURES: ${{ matrix.binary.features }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          TARGET: ${{ matrix.platform.target }}
        run: cargo build --locked -p tempo-zone --bin "$BINARY_NAME" --features "$FEATURES" --profile "$PROFILE" --target "$TARGET"

      - name: Prepare binary
        id: prepare
        shell: bash
        env:
          BINARY: ${{ matrix.binary.name }}
          TARGET: ${{ matrix.platform.target }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          if [ "$PROFILE" = "dev" ]; then
            PROFILE_DIR="debug"
          else
            PROFILE_DIR="$PROFILE"
          fi

          BINARY_PATH="target/${TARGET}/${PROFILE_DIR}/${BINARY}"
          BINARY_NAME="${BINARY}-${VERSION}-${TARGET}"
          ARCHIVE_NAME="${BINARY}-${VERSION}-${TARGET}.tar.gz"

          cp "$BINARY_PATH" "$BINARY_NAME"
          tar czf "$ARCHIVE_NAME" "$BINARY_NAME"

          {
            echo "archive_name=$ARCHIVE_NAME"
            echo "archive_path=$ARCHIVE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.prepare.outputs.archive_path }}
          ARCHIVE_NAME: ${{ steps.prepare.outputs.archive_name }}
        run: |
          shasum -a 256 "$ARCHIVE_PATH" > "${ARCHIVE_NAME}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary.name }}-${{ matrix.platform.target }}
          path: |
            ${{ steps.prepare.outputs.archive_path }}
            ${{ steps.prepare.outputs.archive_name }}.sha256
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [get-version, check-version, build-release]
    if: ${{ !cancelled() && needs.build-release.result == 'success' && needs.check-version.result == 'success' && (github.event_name == 'push' || inputs.dry_run == false) }}
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      # This is necessary for generating the changelog.
      # It has to come before "Download Artifacts" or else it deletes the artifacts.
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.get-version.outputs.version }}
          submodules: recursive

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Exclude diagnostic artifacts uploaded by Secure Runner.
          pattern: tempo-zone-*
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          # Determine if this is a prerelease
          PRERELEASE=""
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            PRERELEASE="--prerelease"
          fi

          # Create draft release with all artifacts
          gh release create "$VERSION" \
            --repo ${{ github.repository }} \
            --title "Release $VERSION" \
            --draft \
            --latest=false \
            --notes "" \
            $PRERELEASE \
            artifacts/**/*
