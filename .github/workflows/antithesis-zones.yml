name: Antithesis Zones Images

# Builds the zones Antithesis node image, workload image (the node image plus the test
# template) and config image (contrib/antithesis/zones) and pushes them to the Antithesis registry,
# ready for a run on the tempo tenant.

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "contrib/antithesis/zones/**"
      - "bin/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/antithesis-zones.yml"
  workflow_dispatch:
    inputs:
      direct_handoffs:
        description: "Use only journaled admin handoffs for a focused recovery campaign"
        type: boolean
        default: false
        required: false
      validate_config_digest:
        description: "Validate an existing config image digest instead of building images"
        type: string
        required: false

# Pushes to main replace each other; a manual build of another ref runs on its own.
concurrency:
  group: antithesis-zones-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  REGISTRY: us-central1-docker.pkg.dev/molten-verve-216720/tempo-repository

jobs:
  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_config_digest == '' }}
    name: Build and push Antithesis zones images
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-60)
          tag="${branch}-${SHA:0:9}"
          {
            echo "tag=$tag"
            echo "short_sha=${SHA:0:8}"
            # The moving branch tag (such as main) always names the newest build of it.
            echo "image_tags=$REGISTRY/tempo-zones-antithesis:$tag,$REGISTRY/tempo-zones-antithesis:$branch"
          } >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Log in to the Antithesis registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_REGISTRY_KEY }}

      - name: Build and push the test image
        id: image
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: .
          file: contrib/antithesis/zones/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.image_tags }}
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_SHA_SHORT=${{ steps.tags.outputs.short_sha }}

      # Extend the exact node image instead of running the instrumented Rust build again.
      - name: Build and push the workload image
        id: workload
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          BRANCH: ${{ steps.tags.outputs.branch }}
          NODE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          dir="$RUNNER_TEMP/antithesis-workload"
          mkdir -p "$dir"
          cp -a contrib/antithesis/zones/test "$dir/test"
          printf 'FROM %s\nCOPY --chmod=755 test/ /opt/antithesis/test/\n' \
            "$REGISTRY/tempo-zones-antithesis@$NODE_DIGEST" > "$dir/Dockerfile"
          image="$REGISTRY/tempo-zones-antithesis-workload"
          docker build --platform linux/amd64 \
            -t "$image:$TAG" -t "$image:$BRANCH" "$dir"
          docker push "$image:$TAG"
          docker push "$image:$BRANCH"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$TAG")
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The config image's compose file runs the exact images just pushed, by digest, so a
      # run never picks up a later build under the same tag.
      - name: Build and push the config image
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          BRANCH: ${{ steps.tags.outputs.branch }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKLOAD_DIGEST: ${{ steps.workload.outputs.digest }}
          DIRECT_HANDOFFS: ${{ inputs.direct_handoffs || false }}
        run: |
          dir="$RUNNER_TEMP/antithesis-config"
          mkdir -p "$dir"
          cp contrib/antithesis/zones/docker-compose.yaml "$dir/"
          # Digest only: Antithesis turns a tag@digest reference into a file name, which a long
          # branch tag pushes past the 255-byte limit, and the image is silently dropped.
          {
            echo "ZONES_IMAGE=$REGISTRY/tempo-zones-antithesis@$DIGEST"
            echo "WORKLOAD_IMAGE=$REGISTRY/tempo-zones-antithesis-workload@$WORKLOAD_DIGEST"
            echo "ZONE_HANDOFF_DIRECT_ONLY=$DIRECT_HANDOFFS"
          } > "$dir/.env"
          printf 'FROM scratch\nCOPY docker-compose.yaml .env /\n' > "$dir/Dockerfile"
          docker build --platform linux/amd64 \
            -t "$REGISTRY/tempo-zones-antithesis-config:$TAG" \
            -t "$REGISTRY/tempo-zones-antithesis-config:$BRANCH" "$dir"
          docker push --all-tags "$REGISTRY/tempo-zones-antithesis-config"
          {
            echo "### Antithesis zones images"
            echo ""
            echo "| Image | Reference |"
            echo "|---|---|"
            echo "| Node image | \`$REGISTRY/tempo-zones-antithesis@$DIGEST\` |"
            echo "| Workload image | \`$REGISTRY/tempo-zones-antithesis-workload@$WORKLOAD_DIGEST\` |"
            echo "| Config image | \`$REGISTRY/tempo-zones-antithesis-config:$TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-config:
    name: Validate published Antithesis zones config
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_config_digest != '' }}
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Check config digest
        env:
          CONFIG_DIGEST: ${{ inputs.validate_config_digest }}
        run: '[[ "$CONFIG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'

      - name: Log in to the Antithesis registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_REGISTRY_KEY }}

      - name: Install snouty
        run: |
          installer="$RUNNER_TEMP/snouty-installer.sh"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/antithesishq/snouty/releases/download/v0.9.1/snouty-installer.sh \
            -o "$installer"
          echo "79cd42188d65b8e10326f21f2a57231d022e465659d9f16754ac75ff606be5e7  $installer" | sha256sum --check
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate exact published images
        env:
          CONFIG_DIGEST: ${{ inputs.validate_config_digest }}
          SNOUTY_CONTAINER_ENGINE: docker
        run: |
          unset ZONES_IMAGE WORKLOAD_IMAGE ZONE_HANDOFF_DIRECT_ONLY
          dir="$RUNNER_TEMP/zones-validation"
          mkdir -p "$dir"
          config="$REGISTRY/tempo-zones-antithesis-config@$CONFIG_DIGEST"
          docker pull "$config"
          container=$(docker create "$config" /bin/true)
          trap 'docker rm -f "$container"' EXIT
          docker cp "$container:/docker-compose.yaml" "$dir/docker-compose.yaml"
          docker cp "$container:/.env" "$dir/.env"
          images=$(docker compose --project-directory "$dir" -f "$dir/docker-compose.yaml" config --images)
          [[ -n "$images" ]]
          while IFS= read -r image; do
            repository="${image%@*}"
            digest="${image##*@}"
            [[ "$repository" == "$REGISTRY/tempo-zones-antithesis" || "$repository" == "$REGISTRY/tempo-zones-antithesis-workload" ]]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done <<< "$images"
          printf '%s\n' "$images"
          docker compose --project-directory "$dir" -f "$dir/docker-compose.yaml" pull
          snouty --version
          snouty validate --help
          snouty validate "$dir" --timeout 5m
