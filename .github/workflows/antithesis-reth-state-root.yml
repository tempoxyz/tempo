name: Antithesis Reth State Root Images

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      # The workload shares Cargo resolution with every root workspace member.
      - "Cargo.toml"
      - "Cargo.lock"
      - "bin/**"
      - "crates/**"
      - "xtask/**"
      - "mainnet-network-identity.json"
      - "testnet-network-identity.json"
      - "contrib/antithesis/reth-state-root/**"
      - "contrib/antithesis/trie-shapes/**"
      - ".github/workflows/antithesis-reth-state-root.yml"
  workflow_dispatch:
    inputs:
      guidance_probe:
        description: Build the isolated guidance probe instead of the trie images (no test run)
        type: boolean
        default: false

# Do not cancel a publication between the workload push and its paired config push.
concurrency:
  group: antithesis-reth-state-root-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: us-central1-docker.pkg.dev/molten-verve-216720/tempo-repository

jobs:
  build-and-push:
    name: Build and push Antithesis trie images
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.guidance_probe != true }}
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-60)
          tag="${branch}-${SHA:0:9}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "tag=$tag"
            echo "branch=$branch"
            echo "image_tags=$REGISTRY/tempo-reth-state-root-antithesis:$tag,$REGISTRY/tempo-reth-state-root-antithesis:$branch"
          } >> "$GITHUB_OUTPUT"

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Log in to the Antithesis registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_REGISTRY_KEY }}

      - name: Build and push workload image
        id: image
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: .
          file: contrib/antithesis/reth-state-root/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.image_tags }}

      - name: Prepare digest-paired configuration
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Fail closed rather than publish a config that silently uses a moving tag.
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          dir="$RUNNER_TEMP/antithesis-reth-state-root-config"
          mkdir -p "$dir"
          cp contrib/antithesis/reth-state-root/docker-compose.yaml contrib/antithesis/reth-state-root/Dockerfile.config "$dir/"
          # Digest only: Antithesis turns a tag@digest reference into a file name, which a long
          # branch tag pushes past the 255-byte limit, and the workload image is silently dropped.
          printf 'RETH_STATE_ROOT_IMAGE=%s/tempo-reth-state-root-antithesis@%s\n' "$REGISTRY" "$DIGEST" > "$dir/.env"

      - name: Build and push config image
        id: config
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: ${{ runner.temp }}/antithesis-reth-state-root-config
          file: ${{ runner.temp }}/antithesis-reth-state-root-config/Dockerfile.config
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/tempo-reth-state-root-antithesis-config:${{ steps.tags.outputs.tag }}
            ${{ env.REGISTRY }}/tempo-reth-state-root-antithesis-config:${{ steps.tags.outputs.branch }}

      - name: Record immutable image pair
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CONFIG_DIGEST: ${{ steps.config.outputs.digest }}
        run: |
          [[ "$CONFIG_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo '### Antithesis reth state root image pair'
            echo ''
            echo "Tag: \`$TAG\`"
            echo "Workload: \`$REGISTRY/tempo-reth-state-root-antithesis@$IMAGE_DIGEST\`"
            echo "Config: \`$REGISTRY/tempo-reth-state-root-antithesis-config@$CONFIG_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  guidance-probe:
    name: Build and push Antithesis guidance probe images
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.guidance_probe == true }}
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve unique tag
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-60)
          printf 'tag=%s-%s-%s-%s\n' "$branch" "${SHA:0:9}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Log in to the Antithesis registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_REGISTRY_KEY }}

      - name: Build and push guidance probe workload
        id: image
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: contrib/antithesis/guidance-probe
          file: contrib/antithesis/guidance-probe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tempo-antithesis-guidance-probe:${{ steps.tags.outputs.tag }}

      - name: Validate published guidance probe runtime
        timeout-minutes: 5
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$REGISTRY/tempo-antithesis-guidance-probe@$DIGEST"
          containers=()
          cleanup() {
            if (( ${#containers[@]} )); then
              docker rm -f "${containers[@]}" > /dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          docker pull "$image"
          for mode in dynamic constant; do
            container="guidance-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$mode"
            containers+=("$container")
            stdout="$RUNNER_TEMP/$container-stdout.jsonl"
            stderr="$RUNNER_TEMP/$container-stderr.log"
            sdk="$RUNNER_TEMP/$container-sdk.jsonl"
            docker run --network none --pull=never -d --name "$container" \
              -e "PROBE_MODE=$mode" -e ANTITHESIS_SDK_LOCAL_OUTPUT=/tmp/sdk.jsonl \
              "$image" > /dev/null
            sleep 1
            [[ "$(docker inspect --format '{{.State.Running}}' "$container")" == true ]]
            docker logs "$container" > "$stdout" 2> "$stderr"
            [[ ! -s "$stdout" ]]
            timeout 10s docker exec "$container" /opt/antithesis/test/v1/main/first_start_workload
            sleep 1
            docker logs "$container" > "$stdout" 2> "$stderr"
            grep -Eq '"actual_state":[0-9]+' "$stdout"
            docker stop --time 5 "$container" > /dev/null
            [[ "$(docker inspect --format '{{.State.ExitCode}}' "$container")" == 0 ]]
            docker cp "$container:/tmp/sdk.jsonl" "$sdk"
            grep -F '"antithesis_setup"' "$sdk" > /dev/null
            grep -F '"antithesis_guidance"' "$sdk" \
              | grep -F '"guidance_type":"json"' \
              | grep -F '"hit":true' \
              | grep -E '"guidance_data":\{"label":"[0-3][0-9a-f]"\}' > /dev/null
            printf 'Validated %s mode: gated startup, first command, telemetry, SDK JSON guidance, clean shutdown (%s)\n' "$mode" "$image"
          done

      - name: Prepare digest-paired probe configurations
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$REGISTRY/tempo-antithesis-guidance-probe@$DIGEST"
          for mode in dynamic constant; do
            dir="$RUNNER_TEMP/antithesis-guidance-probe-$mode-config"
            mkdir -p "$dir"
            source="contrib/antithesis/guidance-probe/config/$mode/docker-compose.yaml"
            grep -Fq 'guidance-probe:0.1.0' "$source"
            sed "s|guidance-probe:0\.1\.0|$image|g" "$source" > "$dir/docker-compose.yaml"
            if grep -Fq 'guidance-probe:0.1.0' "$dir/docker-compose.yaml"; then
              printf 'Unresolved guidance probe image in %s config\n' "$mode" >&2
              exit 1
            fi
            printf 'FROM scratch\nCOPY docker-compose.yaml /\n' > "$dir/Dockerfile.config"
          done

      - name: Validate probe compose setup with snouty
        timeout-minutes: 5
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/guidance-probe-snouty"
          mkdir -p "$tools_dir"
          archive="$tools_dir/snouty.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/antithesishq/snouty/releases/download/v0.9.1/snouty-x86_64-unknown-linux-musl.tar.xz \
            -o "$archive"
          printf '174087ee666c20dc120d45f131023eae112148b9e32bb07c08c0172880bd486b  %s\n' "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$tools_dir"
          snouty=$(find "$tools_dir" -type f -name snouty -print -quit)
          test -n "$snouty" && test -x "$snouty"
          "$snouty" --version
          for mode in dynamic constant; do
            config="$RUNNER_TEMP/antithesis-guidance-probe-$mode-config"
            validation_temp=$(mktemp -d "$RUNNER_TEMP/guidance-probe-$mode-validation.XXXXXX")
            log="$RUNNER_TEMP/guidance-probe-$mode-validation.log"
            SNOUTY_TEMP_DIR="$validation_temp" "$snouty" validate "$config" --timeout 20s 2>&1 | tee "$log"
            grep -F 'Setup validation successful' "$log"
            grep -F 'Found 1 first, 0 driver, 0 anytime, 0 eventually, 0 finally' "$log"
          done

      - name: Build and push dynamic guidance config
        id: dynamic_config
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: ${{ runner.temp }}/antithesis-guidance-probe-dynamic-config
          file: ${{ runner.temp }}/antithesis-guidance-probe-dynamic-config/Dockerfile.config
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tempo-antithesis-guidance-probe-dynamic-config:${{ steps.tags.outputs.tag }}

      - name: Build and push constant guidance config
        id: constant_config
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: ${{ runner.temp }}/antithesis-guidance-probe-constant-config
          file: ${{ runner.temp }}/antithesis-guidance-probe-constant-config/Dockerfile.config
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/tempo-antithesis-guidance-probe-constant-config:${{ steps.tags.outputs.tag }}

      - name: Record immutable guidance probe images
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DYNAMIC_CONFIG_DIGEST: ${{ steps.dynamic_config.outputs.digest }}
          CONSTANT_CONFIG_DIGEST: ${{ steps.constant_config.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$IMAGE_DIGEST" "$DYNAMIC_CONFIG_DIGEST" "$CONSTANT_CONFIG_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          done
          {
            printf '### Antithesis guidance probe image set\n\n'
            printf 'Tag: `%s`\n' "$TAG"
            printf 'Workload (both configs): `%s/tempo-antithesis-guidance-probe@%s`\n' "$REGISTRY" "$IMAGE_DIGEST"
            printf 'Dynamic config: `%s/tempo-antithesis-guidance-probe-dynamic-config@%s`\n' "$REGISTRY" "$DYNAMIC_CONFIG_DIGEST"
            printf 'Constant config: `%s/tempo-antithesis-guidance-probe-constant-config@%s`\n' "$REGISTRY" "$CONSTANT_CONFIG_DIGEST"
          } | tee -a "$GITHUB_STEP_SUMMARY"
