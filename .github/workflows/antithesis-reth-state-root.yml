name: Antithesis Reth State Root Images

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      # The workload shares Cargo resolution with every root workspace member.
      - "Cargo.toml"
      - "Cargo.lock"
      - "bin/**"
      - "crates/**"
      - "xtask/**"
      - "mainnet-network-identity.json"
      - "testnet-network-identity.json"
      - "contrib/antithesis/reth-state-root/**"
      - "contrib/antithesis/trie-shapes/**"
      - ".github/workflows/antithesis-reth-state-root.yml"
  workflow_dispatch:
    inputs:
      workload_digest:
        description: Existing workload digest to reuse for a config-only publication
        type: string
        required: false

# Do not cancel a publication between the workload push and its paired config push.
concurrency:
  group: antithesis-reth-state-root-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: us-central1-docker.pkg.dev/molten-verve-216720/tempo-repository

jobs:
  build-and-push:
    name: Build and push Antithesis trie images
    runs-on: depot-ubuntu-latest-16
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test pinned sparse dependency patch guards
        run: python3 -B contrib/antithesis/reth-state-root/test_patch_sparse_trie.py

      - name: Resolve tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-60)
          tag="${branch}-${SHA:0:9}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "tag=$tag"
            echo "branch=$branch"
            echo "image_tags=$REGISTRY/tempo-reth-state-root-antithesis:$tag,$REGISTRY/tempo-reth-state-root-antithesis:$branch"
          } >> "$GITHUB_OUTPUT"

      - uses: tempoxyz/gh-actions/vendor/depot/setup-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Log in to the Antithesis registry
        uses: tempoxyz/gh-actions/vendor/docker/login-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.ANTITHESIS_REGISTRY_KEY }}

      - name: Build and push workload image
        if: ${{ !inputs.workload_digest }}
        id: image
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: .
          file: contrib/antithesis/reth-state-root/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.image_tags }}

      - name: Smoke-test runtime guidance from the immutable workload
        timeout-minutes: 7
        env:
          DIGEST: ${{ inputs.workload_digest || steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image="$REGISTRY/tempo-reth-state-root-antithesis@$DIGEST"
          docker pull "$image"
          smoke="$RUNNER_TEMP/reth-state-root-smoke"
          mkdir -p "$smoke"
          container="reth-state-root-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          # A finite server round still needs driver requests to build and retire its blocks.
          # Variables in the single-quoted script expand in the container, not on the runner.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=15s 300s docker run --rm --init \
            --name "$container" --network none \
            --mount "type=bind,src=$smoke,dst=/smoke" \
            -e ANTITHESIS_SDK_LOCAL_OUTPUT=/smoke/guidance.jsonl \
            -e SMOKE_CONFIG='{"rounds":1,"blocks":8,"updates":64,"accounts":64,"datadir":"/tmp/state","timeout_secs":30}' \
            --entrypoint /bin/bash "$image" -ceu '
              reth-state-root-antithesis serve "$SMOKE_CONFIG" &
              server=$!
              trap "kill $server 2>/dev/null || true" EXIT
              # Keep command-process catalogue events out of the server-only SDK output.
              env -u ANTITHESIS_SDK_LOCAL_OUTPUT reth-state-root-commands first_genesis
              for _ in {1..8}; do
                env -u ANTITHESIS_SDK_LOCAL_OUTPUT reth-state-root-commands parallel_driver_blocks
              done
              wait "$server"
            '
          python3 - "$smoke/guidance.jsonl" <<'PYTHON'
          import json
          import sys

          fields = {"branch_path_len", "is_root", "state_mask", "revealed_mask", "leaf_mask"}
          tuples = 0
          setup = False
          completed = False
          with open(sys.argv[1], encoding="utf-8") as events:
              for line in events:
                  event = json.loads(line)
                  setup |= event.get("antithesis_setup", {}).get("status") == "complete"
                  assertion = event.get("antithesis_assert", {})
                  if assertion.get("hit"):
                      if assertion.get("assert_type") == "always":
                          assert assertion["condition"], assertion
                      if assertion.get("message") == "Trie workload completes a round":
                          completed |= assertion.get("condition", False)
                  guidance = event.get("antithesis_guidance", {})
                  if guidance.get("message") != "Sparse trie branch shape" or not guidance.get("hit"):
                      continue
                  assert guidance.get("guidance_type") == "json" and guidance.get("maximize") is False, guidance
                  data = guidance["guidance_data"]
                  assert isinstance(data, dict) and set(data) == fields, data
                  length = data["branch_path_len"]
                  assert type(length) is int and 0 <= length < 64, data
                  assert type(data["is_root"]) is bool and data["is_root"] == (length == 0), data
                  for mask in ("state_mask", "revealed_mask", "leaf_mask"):
                      assert type(data[mask]) is int and 0 <= data[mask] <= 0xffff, data
                  assert data["revealed_mask"] & ~data["state_mask"] == 0, data
                  assert data["leaf_mask"] & ~data["revealed_mask"] == 0, data
                  tuples += 1
          assert setup and completed, "Workload did not complete setup and a verified round"
          assert tuples > 0, "No runtime sparse-trie branch tuples in the workload image"
          print(f"Verified {tuples} runtime sparse-trie branch tuples from the immutable workload")
          PYTHON

      - name: Prepare digest-paired configuration
        env:
          DIGEST: ${{ inputs.workload_digest || steps.image.outputs.digest }}
        run: |
          # Fail closed rather than publish a config that silently uses a moving tag.
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          dir="$RUNNER_TEMP/antithesis-reth-state-root-config"
          mkdir -p "$dir"
          cp contrib/antithesis/reth-state-root/docker-compose.yaml contrib/antithesis/reth-state-root/Dockerfile.config "$dir/"
          # Digest only: Antithesis turns a tag@digest reference into a file name, which a long
          # branch tag pushes past the 255-byte limit, and the workload image is silently dropped.
          printf 'RETH_STATE_ROOT_IMAGE=%s/tempo-reth-state-root-antithesis@%s\n' "$REGISTRY" "$DIGEST" > "$dir/.env"

      - name: Build and push config image
        id: config
        uses: tempoxyz/gh-actions/vendor/depot/build-push-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          project: 0c6tg19qsp
          context: ${{ runner.temp }}/antithesis-reth-state-root-config
          file: ${{ runner.temp }}/antithesis-reth-state-root-config/Dockerfile.config
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/tempo-reth-state-root-antithesis-config:${{ steps.tags.outputs.tag }}
            ${{ env.REGISTRY }}/tempo-reth-state-root-antithesis-config:${{ steps.tags.outputs.branch }}

      - name: Record immutable image pair
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          IMAGE_DIGEST: ${{ inputs.workload_digest || steps.image.outputs.digest }}
          CONFIG_DIGEST: ${{ steps.config.outputs.digest }}
        run: |
          [[ "$CONFIG_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo '### Antithesis reth state root image pair'
            echo ''
            echo "Tag: \`$TAG\`"
            echo "Workload: \`$REGISTRY/tempo-reth-state-root-antithesis@$IMAGE_DIGEST\`"
            echo "Config: \`$REGISTRY/tempo-reth-state-root-antithesis-config@$CONFIG_DIGEST\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
