name: Experimental OIDC tooling

permissions: {}

on:
  pull_request:
    paths:
      - examples/oidc/**
      - .github/workflows/oidc-tooling.yml
  push:
    branches: [main]
    paths:
      - examples/oidc/**
      - .github/workflows/oidc-tooling.yml
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: examples/oidc
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/oidc/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
