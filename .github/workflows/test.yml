name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  # Pin vergen's build timestamp so reth-node-core and tempo-node compile identically across runs;
  # otherwise they and every crate depending on them miss sccache on every build.
  SOURCE_DATE_EPOCH: "1700000000"
  # Test builds don't need debuginfo; dropping it halves link output and the target dir.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # rustc links with its bundled lld unless told otherwise; use the mold from setup-mold.
  # Steps that set RUSTFLAGS ignore this and keep linking with lld.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  TEMPO_MAINNET_RPC_URL: ${{ secrets.TEMPO_MAINNET_RPC_URL }}
  TEMPO_TESTNET_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL }}
  TEMPO_DEVNET_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL }}

jobs:
  changes:
    name: Check Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ contains(fromJSON(steps.filter.outputs.changes), 'rust') }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: tempoxyz/gh-actions/actions/changed-paths@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        id: filter
        with:
          # Run the Rust jobs when Rust sources, manifests, Cargo.lock or their CI config change.
          filters: |
            rust:
              - '{bin,crates,examples,scripts,xtask,tips/verify}/**'
              - 'Cargo.lock'
              - '*-network-identity.json'
              - '*.toml'
              - '{.cargo,.config,.github/actions}/**'
              - '.github/scripts/{native-libs.sh,check_no_std.sh,warn_flaky_e2e.py,test_warn_flaky_e2e.py}'
              - '.github/workflows/{test,lint,bench}.yml'

  zones-artifacts:
    name: Build Zones test artifacts
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check out Earn contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tempoxyz/earn
          ref: main
          path: earn
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Restore Earn's solar compiler
        # Present when Earn compiles with solar (earn/solar.lock); solidity-deps.sh builds it with cargo.
        if: ${{ hashFiles('earn/earn/solar.lock') != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: earn/.solar
          key: earn-solar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('earn/earn/solar.lock') }}
      - name: Initialize Earn public dependencies
        # Sets EARN_ROOT to Earn's Foundry project, at the checkout root or in its earn/ directory.
        run: |
          root="$(bash .github/scripts/prepare-earn-checkout.sh earn)"
          echo "EARN_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: nightly-fc14f674bd853bc817c308a5202faa5be8df05e7

      - name: Resolve Solidity cache key
        id: solidity-key
        run: |
          {
            echo "forge-sha=$(forge --version | sed -n 's/^Commit SHA: //p')"
            echo "contracts-tree=$(git rev-parse HEAD:crates/zones/contracts)"
            echo "earn-sha=$(git -C earn rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Solidity artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            earn/cache
            earn/earn/cache
            crates/zones/contracts/cache
            crates/zones/contracts/out
          key: zones-forge-v3-${{ runner.os }}-${{ steps.solidity-key.outputs.forge-sha }}-${{ steps.solidity-key.outputs.contracts-tree }}-${{ steps.solidity-key.outputs.earn-sha }}

      - name: Build Solidity artifacts
        run: bash scripts/build-zones-test-artifacts.sh
      - name: Upload Zones test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zones-test-artifacts
          path: crates/zones/contracts/out
          if-no-files-found: error
          retention-days: 1

  genesis:
    name: Genesis generation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v0.15.0
      - uses: ./.github/actions/native-libs # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          cargo-args: -p tempo-xtask
      - name: Generate genesis
        run: |
          cargo xtask generate-genesis \
            --accounts 100 \
            --no-dkg-in-genesis \
            --output generated \
            --coinbase 0xbba20Bb99dA4E103721B754b25071Fc85e7028A1
      - name: Compare with existing test genesis
        run: |
          # Compare the generated genesis with the existing test-genesis.json
          if ! diff -u crates/node/tests/assets/test-genesis.json generated/genesis.json; then
            echo "Generated genesis differs from existing test-genesis.json"
            echo "Please update the test-genesis.json file with the generated content"
            exit 1
          else
            echo "Generated genesis matches test-genesis.json"
          fi

  test:
    name: test (${{ matrix.partition }}/2)
    if: needs.changes.outputs.rust == 'true'
    needs: [changes, zones-artifacts]
    runs-on: depot-ubuntu-latest-32
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v0.15.0
      - uses: ./.github/actions/native-libs # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          cargo-args: --workspace
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tool: nextest@0.9.127
      - name: Download Zones test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zones-test-artifacts
          path: crates/zones/contracts/out
      - name: Build and compile tests
        run: cargo nextest run --profile ci --workspace --exclude tempo-nitro-attestation-fuzz --lib --bins --tests -E 'not (package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2 --no-run
      - name: Run tests
        run: cargo nextest run --profile ci --workspace --exclude tempo-nitro-attestation-fuzz --lib --bins --tests -E 'not (package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2

  e2e:
    name: e2e (${{ matrix.partition }}/4)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-latest-32
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      # Set to 8 MiB because some tests run into stack overflows with jemalloc
      RUST_MIN_STACK: 8388608
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v0.15.0
      - uses: ./.github/actions/native-libs # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          cargo-args: -p tempo-e2e
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          tool: nextest@0.9.127
      - uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        continue-on-error: true
        with:
          version: "0.12.16"
          enable-cache: false
      - name: Test flaky e2e reporter
        continue-on-error: true
        run: uv run --no-project python -m unittest discover -s .github/scripts -p 'test_warn_flaky_e2e.py'
      - name: Build e2e tests
        run: cargo nextest run --profile ci -p tempo-e2e --partition slice:${{ matrix.partition }}/4 --no-run
      - name: Run e2e tests
        run: cargo nextest run --profile ci -p tempo-e2e --partition slice:${{ matrix.partition }}/4
      - name: Warn about flaky e2e tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run --no-project python .github/scripts/warn_flaky_e2e.py target/nextest/ci/junit.xml
      - name: Upload e2e test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

  cli:
    name: CLI smoke tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v0.15.0
      - uses: ./.github/actions/native-libs # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          cargo-args: -p tempo
      - name: Build tempo
        run: cargo build --bin tempo
      - name: Run CLI tests
        run: ./scripts/test-cli.sh

  tempoup:
    name: tempoup installer tests
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Run tempoup tests
        run: |
          bash -n tempoup/tempoup tempoup/install tempoup/test-tempoup.sh
          shellcheck tempoup/tempoup tempoup/install tempoup/test-tempoup.sh
          ./tempoup/test-tempoup.sh

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          toolchain: "1.96" # MSRV
      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: v0.15.0
      - uses: ./.github/actions/native-libs # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          cargo-args: -p tempo
      - name: Build with MSRV
        run: cargo build --bin tempo
        env:
          RUSTFLAGS: -D warnings

  test-success:
    name: test success
    runs-on: ubuntu-latest
    if: always()
    permissions:
      id-token: write
    needs:
      - changes
      - test
      - e2e
      - cli
      - msrv
      - genesis
    timeout-minutes: 30
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          allowed-skips: ${{ needs.changes.outputs.rust != 'true' && 'genesis,test,e2e,cli,msrv' || '' }}
          jobs: ${{ toJSON(needs) }}
