name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  # Pin vergen's build timestamp so reth-node-core and tempo-node compile identically across runs;
  # otherwise they and every crate depending on them miss sccache on every build.
  SOURCE_DATE_EPOCH: "1700000000"
  TEMPO_MAINNET_RPC_URL: ${{ secrets.TEMPO_MAINNET_RPC_URL }}
  TEMPO_TESTNET_RPC_URL: ${{ secrets.TEMPO_TESTNET_RPC_URL }}
  TEMPO_DEVNET_RPC_URL: ${{ secrets.TEMPO_DEVNET_RPC_URL }}

jobs:
  check-precompiles:
    name: Check precompiles changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      coverage: ${{ steps.check.outputs.coverage }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for precompiles changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Only run coverage on pull_request events when precompiles/contracts changed
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "coverage=false" >> "$GITHUB_OUTPUT"
            echo "Skipping coverage: not a pull_request event (event: $EVENT_NAME)"
          elif git diff --name-only origin/"$BASE_REF"...HEAD | grep -qE '^(crates/(precompiles|contracts)/|tips/verify/)'; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
            echo "Running coverage: precompiles/contracts changed"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
            echo "Skipping coverage: no precompiles/contracts changes"
          fi

  genesis:
    name: Genesis generation
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0
      - name: Generate genesis
        run: |
          cargo xtask generate-genesis \
            --accounts 100 \
            --no-dkg-in-genesis \
            --output generated \
            --coinbase 0xbba20Bb99dA4E103721B754b25071Fc85e7028A1
      - name: Compare with existing test genesis
        run: |
          # Compare the generated genesis with the existing test-genesis.json
          if ! diff -u crates/node/tests/assets/test-genesis.json generated/genesis.json; then
            echo "Generated genesis differs from existing test-genesis.json"
            echo "Please update the test-genesis.json file with the generated content"
            exit 1
          else
            echo "Generated genesis matches test-genesis.json"
          fi

  test:
    name: test (${{ matrix.partition }}/2)
    needs: check-precompiles
    runs-on: depot-ubuntu-latest-32
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          components: ${{ needs.check-precompiles.outputs.coverage == 'true' && 'llvm-tools-preview' || '' }}
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          tool: nextest@0.9.127
      # Build and run tests WITH coverage (only when precompiles changed)
      - name: Build and compile tests with coverage
        if: needs.check-precompiles.outputs.coverage == 'true'
        run: cargo nextest run --workspace --exclude 'zone-*' --exclude 'tempo-zone*' --exclude tempo-vsock-proxy --exclude exithatch --profile ci -E 'not ((package(tempo-xtask) & test(/zones::/)) | package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2 --no-run
        env:
          RUSTFLAGS: -C instrument-coverage
      - name: Run tests with coverage
        if: needs.check-precompiles.outputs.coverage == 'true'
        run: |
          mkdir -p coverage
          cargo nextest run --workspace --exclude 'zone-*' --exclude 'tempo-zone*' --exclude tempo-vsock-proxy --exclude exithatch --profile ci -E 'not ((package(tempo-xtask) & test(/zones::/)) | package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2
        env:
          RUSTFLAGS: -C instrument-coverage
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage/cargo-%p-%m.profraw
      # Build and run tests WITHOUT coverage (when precompiles not changed)
      - name: Build and compile tests
        if: needs.check-precompiles.outputs.coverage != 'true'
        run: cargo nextest run --workspace --exclude 'zone-*' --exclude 'tempo-zone*' --exclude tempo-vsock-proxy --exclude exithatch --profile ci -E 'not ((package(tempo-xtask) & test(/zones::/)) | package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2 --no-run
      - name: Run tests
        if: needs.check-precompiles.outputs.coverage != 'true'
        run: cargo nextest run --workspace --exclude 'zone-*' --exclude 'tempo-zone*' --exclude tempo-vsock-proxy --exclude exithatch --profile ci -E 'not ((package(tempo-xtask) & test(/zones::/)) | package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2
      - name: Generate precompiles coverage profdata
        if: needs.check-precompiles.outputs.coverage == 'true'
        run: |
          LLVM_BIN="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | grep host | cut -d' ' -f2)/bin"
          "$LLVM_BIN/llvm-profdata" merge -sparse coverage/*.profraw -o coverage/cargo-test.profdata
          mkdir -p coverage/precompiles-bin
          # Copy precompiles and contracts test binaries
          find target/debug/deps -name 'tempo_precompiles-*' -type f -executable ! -name '*.d' -exec cp {} coverage/precompiles-bin/ \;
          find target/debug/deps -name 'tempo_contracts-*' -type f -executable ! -name '*.d' -exec cp {} coverage/precompiles-bin/ \;
      - name: Upload precompiles coverage artifacts
        if: needs.check-precompiles.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-test-coverage-${{ matrix.partition }}
          path: |
            coverage/cargo-test.profdata
            coverage/precompiles-bin/
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.partition }}/4)
    runs-on: depot-ubuntu-latest-32
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      # Set to 8 MiB because some tests run into stack overflows with jemalloc
      RUST_MIN_STACK: 8388608
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          tool: nextest@0.9.127
      - uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        continue-on-error: true
        with:
          version: "0.12.16"
          enable-cache: false
      - name: Test flaky e2e reporter
        continue-on-error: true
        run: uv run --no-project python -m unittest discover -s .github/scripts -p 'test_warn_flaky_e2e.py'
      - name: Build e2e tests
        run: cargo nextest run --profile ci -p tempo-e2e --partition slice:${{ matrix.partition }}/4 --no-run
      - name: Run e2e tests
        run: cargo nextest run --profile ci -p tempo-e2e --partition slice:${{ matrix.partition }}/4
      - name: Warn about flaky e2e tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run --no-project python .github/scripts/warn_flaky_e2e.py target/nextest/ci/junit.xml
      - name: Upload e2e test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

  cli:
    name: CLI smoke tests
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0
      - name: Build tempo
        run: cargo build --bin tempo
      - name: Run CLI tests
        run: ./scripts/test-cli.sh

  tempoup:
    name: tempoup installer tests
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Run tempoup tests
        run: |
          bash -n tempoup/tempoup tempoup/install tempoup/test-tempoup.sh
          shellcheck tempoup/tempoup tempoup/install tempoup/test-tempoup.sh
          ./tempoup/test-tempoup.sh

  msrv:
    name: MSRV
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          toolchain: "1.96" # MSRV
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0
      - name: Build with MSRV
        run: cargo build --bin tempo
        env:
          RUSTFLAGS: -D warnings

  zones-build-test-artifacts:
    name: Zones build test artifacts
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Mint read-only Earn token
        id: earn-token
        uses: tempoxyz/gh-actions/actions/github-sts@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          scope: tempoxyz/earn
          policy: zones-read
      - name: Check out Earn contracts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tempoxyz/earn
          ref: main
          path: earn
          token: ${{ steps.earn-token.outputs.token }}
          persist-credentials: false
      - name: Initialize Earn public dependencies
        working-directory: earn
        # PropAMM is private and only needed by Earn's integration tests.
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          tool: nextest@0.9.127
      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: nightly-fc14f674bd853bc817c308a5202faa5be8df05e7

      - name: Resolve Solidity cache key
        id: solidity-key
        run: |
          {
            echo "forge-sha=$(forge --version | sed -n 's/^Commit SHA: //p')"
            echo "contracts-tree=$(git rev-parse HEAD:crates/zones/contracts)"
            echo "earn-sha=$(git -C earn rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Solidity artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            earn/cache
            crates/zones/contracts/cache
            crates/zones/contracts/out
          key: forge-v2-${{ runner.os }}-${{ steps.solidity-key.outputs.forge-sha }}-${{ steps.solidity-key.outputs.contracts-tree }}-${{ steps.solidity-key.outputs.earn-sha }}

      # Earn vendors a partial IZone.sol, so build it first and let the Zones
      # interface artifacts, which the ABI conformance test reads, overwrite it.
      - name: Build Solidity artifacts
        run: |
          forge build \
            --root earn \
            --skip test \
            --skip script \
            --no-lint \
            --out "$GITHUB_WORKSPACE/crates/zones/contracts/out"
          forge build --root crates/zones/contracts --no-lint

      - name: Build and archive tests
        run: cargo nextest archive -p 'zone-*' -p 'tempo-zone*' -p tempo-vsock-proxy -p exithatch -p tempo-xtask -E 'not package(tempo-xtask) | test(/zones::/)' --profile ci --archive-file zones-nextest-archive.tar.zst

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zones-nextest-archive
          path: |
            zones-nextest-archive.tar.zst
            crates/zones/contracts/out
          if-no-files-found: error
          retention-days: 1
          # The nextest archive is already zstd-compressed; recompressing it is
          # slower and does not materially reduce artifact transfer size.
          compression-level: 0

  zones-test:
    env:
      RUST_MIN_STACK: 8388608
    name: Zones test (${{ matrix.partition }}/4)
    runs-on: depot-ubuntu-latest-16
    needs: zones-build-test-artifacts
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      # The run phase consumes prebuilt binaries and does not need Rust/Cargo.
      - name: Prepare nextest install directory
        run: mkdir -p "$HOME/.cargo/bin"

      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          tool: nextest@0.9.127

      - name: Download test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zones-nextest-archive
          path: .

      - name: Run test shard
        run: |
          cargo-nextest nextest run \
            --archive-file zones-nextest-archive.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci \
            --partition hash:${{ matrix.partition }}/4

  test-success:
    name: test success
    runs-on: ubuntu-latest
    if: always()
    permissions:
      id-token: write
    needs:
      - check-precompiles
      - test
      - e2e
      - cli
      - msrv
      - genesis
      - zones-build-test-artifacts
      - zones-test
    timeout-minutes: 30
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          jobs: ${{ toJSON(needs) }}
