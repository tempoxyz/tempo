name: Execution stack debug

permissions: {}

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "180"
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  stack-debug:
    name: DEX T7 stack trace
    runs-on: depot-ubuntu-latest-32
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          toolchain: "1.99.0"
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          version: v0.15.0

      - name: Install debugger if needed
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gdb
          fi

      - name: Build workspace tests with CI feature unification
        run: |
          rustc --version
          cargo test --no-run --message-format json-render-diagnostics

      - name: Capture the first stack fault
        timeout-minutes: 3
        run: |
          ulimit -c 0
          # Preserve libtest's default stack size, including on an owned runner.
          unset RUST_MIN_STACK
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import subprocess
          import sys
          import time

          binaries = [
              path.resolve()
              for path in Path('target/debug/deps').glob('it-*')
              if re.fullmatch(r'it-[0-9a-f]+', path.name)
              and path.is_file()
              and not path.is_symlink()
              and os.access(path, os.X_OK)
          ]
          if len(binaries) != 1:
              raise SystemExit(f'Expected one node integration test executable; found {len(binaries)}')

          commands = [
              'set pagination off',
              'set print thread-events off',
              'set print frame-arguments none',
              'set print entry-values no',
              'set startup-with-shell off',
              'set disable-randomization off',
              'handle SIGSEGV stop print nopass',
              'run',
              'bt 80',
              'info frame',
          ]
          args = ['gdb', '--nx', '--nh', '--quiet', '--batch',
                  '-iex', 'set auto-load off', '-iex', 'set debuginfod enabled off']
          for command in commands:
              args.extend(['-ex', command])
          args.extend([
              '--args', str(binaries[0]), '--exact',
              'gas::stablecoin_dex::test_stablecoin_dex_order_gas_snapshots::t7_with_tip1060',
              '--nocapture',
          ])

          # Stream without retaining a debugger log or core. Reserve room for the
          # terminal status so captured debugger output stays below one MiB.
          output_limit = 1024 * 1024
          diagnostic_limit = output_limit - 1024
          emitted = 0
          failure = None
          deadline = time.monotonic() + 120
          process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                     cwd=Path('crates/node').resolve(), start_new_session=True)
          try:
              with selectors.DefaultSelector() as selector:
                  selector.register(process.stdout, selectors.EVENT_READ)
                  while True:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          failure = 'Debugger exceeded the 120-second deadline'
                          break
                      events = selector.select(timeout=min(remaining, 1))
                      if not events:
                          continue
                      chunk = os.read(process.stdout.fileno(), 65536)
                      if not chunk:
                          break
                      available = diagnostic_limit - emitted
                      sys.stdout.buffer.write(chunk[:available])
                      sys.stdout.buffer.flush()
                      emitted += min(len(chunk), available)
                      if len(chunk) > available:
                          failure = 'Debugger output exceeded the one-MiB limit'
                          break
              if failure is None:
                  try:
                      process.wait(timeout=max(0, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      failure = 'Debugger exceeded the 120-second deadline'
          finally:
              if failure is not None or process.poll() is None:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=5)
              process.stdout.close()

          status = failure or f'GDB exited with status {process.returncode}'
          sys.stdout.buffer.write(('\n' + status + '\n').encode())
          sys.stdout.buffer.flush()
          raise SystemExit(1 if failure else process.returncode)
          PY
