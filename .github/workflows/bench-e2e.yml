name: execution-cost
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  measure:
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      CARGO_HTTP_TIMEOUT: "180"
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: native
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/execution-cost-revm
          path: revm
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0
        with:
          toolchain: nightly
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0
        continue-on-error: true
      - name: Wait for other e2e benchmarks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/tempoxyz/tempo/actions/workflows/bench-e2e.yml/runs?status=in_progress&per_page=100'
          for attempt in range(60):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              runs = json.load(urllib.request.urlopen(req))['workflow_runs']
              other = [r['id'] for r in runs if str(r['id']) != os.environ['GITHUB_RUN_ID']]
              if not other: break
              print('Waiting for other benchmark runs:', other, flush=True)
              time.sleep(60)
          else: raise RuntimeError('Other benchmarks still active; no measurements taken')
          PYTHON
      - name: Build and run controlled measurements
        run: python3 native/scripts/execution-cost-run.py
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-cost
          path: execution-cost-results/
