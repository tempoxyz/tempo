name: Bench Mapping Controls (OVH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-probe:
    name: mapping-controls-ovh
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 45
    env:
      STORAGE_PROBE_CHECKOUT: storage-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out isolated probe sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: ${{ env.STORAGE_PROBE_CHECKOUT }}
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Probe existing OVH mapping behavior
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/$STORAGE_PROBE_CHECKOUT/contrib/bench/storage-probes/run_ovh_storage_probes.sh"

      - name: Upload disk probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tempo-mapping-controls-ovh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tempo-mapping-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
