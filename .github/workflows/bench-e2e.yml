# E2E benchmark job.
#
# Called by bench.yml when mode=e2e. Runs `nu bench-e2e.nu e2e`
# for a baseline/feature comparison using two local validators.

name: bench-e2e

on:
  workflow_dispatch:
    # GitHub Actions supports at most 25 workflow_dispatch inputs; keep this UI-only list capped.
    inputs:
      baseline:
        description: Git ref for the baseline run. Empty = merge-base with main.
        type: string
        required: false
        default: ""
      feature:
        description: Git ref for the feature run. Empty = current branch HEAD.
        type: string
        required: false
        default: ""
      baseline-hardfork:
        description: Latest active hardfork for the baseline run. Empty = latest Tempo hardfork.
        type: string
        required: false
        default: ""
      feature-hardfork:
        description: Latest active hardfork for the feature run. Empty = latest Tempo hardfork.
        type: string
        required: false
        default: ""
      preset:
        description: Benchmark preset or scenario, e.g. default or tip20:recipient=existing,auth=keychain.
        type: string
        required: true
        default: default
      duration:
        description: Benchmark duration in seconds.
        type: string
        required: true
        default: "90"
      bloat:
        description: State bloat size in GiB.
        type: choice
        required: true
        default: "100"
        options:
          - "0"
          - "1"
          - "10"
          - "100"
      tps:
        description: Target transactions per second.
        type: string
        required: true
        default: "50000"
      accounts:
        description: Number of benchmark accounts.
        type: string
        required: true
        default: "1000"
      max-concurrent-requests:
        description: Max concurrent sender requests.
        type: string
        required: true
        default: "100"
      txgen-ref:
        description: Optional ref to pin in tempoxyz/txgen.
        type: string
        required: false
        default: ""
      token-count:
        description: Number of TIP20 tokens to use in txgen presets.
        type: string
        required: true
        default: "4"
      profiling:
        description: Profiling.
        type: choice
        required: true
        default: "off"
        options:
          - "off"
          - disposal-clock
          - producer-isolation
          - pipeline-pressure
          - samply
          - samply-low-rate
          - samply-buffered
          - samply-scheduling
          - kernel-scheduling
          - kernel-scheduling-only
          - tracy
          - both
      otlp:
        description: Export OTLP traces and logs.
        type: boolean
        required: true
        default: true
      valscope:
        description: Generate and publish ValScope static reports.
        type: boolean
        required: true
        default: false
      baseline-args:
        description: Extra args passed only to the baseline node.
        type: string
        required: false
        default: ""
      feature-args:
        description: Extra args passed only to the feature node.
        type: string
        required: false
        default: ""
      gas-limit:
        description: Builder gas limit.
        type: string
        required: true
        default: "1000000000000"
      general-gas-limit:
        description: General non-payment gas limit override.
        type: string
        required: false
        default: "1500000000"
      force-bloat:
        description: Force regeneration of local benchmark state.
        type: boolean
        required: true
        default: false
      no-cache:
        description: Skip binary cache.
        type: boolean
        required: true
        default: false
      no-slack:
        description: Skip Slack notification (manual runs otherwise notify on wins).
        type: boolean
        required: true
        default: false
      bench-args:
        description: Extra bench args.
        type: string
        required: false
        default: ""
      run-pairs:
        description: Number of baseline/feature run pairs.
        type: string
        required: true
        default: "3"
      artifacts-only:
        description: Keep reports/profiles in GitHub artifacts; OTLP remains a separate control.
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      pr:
        type: string
        required: false
      actor:
        type: string
        required: false
      mode:
        type: string
        required: false
        default: e2e
      preset:
        type: string
        required: false
        default: default
      duration:
        type: string
        required: false
        default: "90"
      bloat:
        type: string
        required: false
        default: "100"
      tps:
        type: string
        required: false
        default: "50000"
      accounts:
        type: string
        required: false
        default: "1000"
      max-concurrent-requests:
        type: string
        required: false
        default: "100"
      baseline:
        type: string
        required: false
        default: ""
      feature:
        type: string
        required: false
        default: ""
      baseline-hardfork:
        type: string
        required: false
        default: ""
      feature-hardfork:
        type: string
        required: false
        default: ""
      baseline-features:
        type: string
        required: false
        default: ""
      feature-features:
        type: string
        required: false
        default: ""
      txgen-ref:
        type: string
        required: false
        default: ""
      token-count:
        type: string
        required: false
        default: "4"
      baseline-name:
        type: string
        required: false
        default: ""
      feature-name:
        type: string
        required: false
        default: ""
      samply:
        type: string
        required: false
        default: "false"
      tracy:
        type: string
        required: false
        default: "off"
      tracy-seconds:
        type: string
        required: false
        default: "10"
      tracy-offset:
        type: string
        required: false
        default: ""
      otlp:
        type: string
        required: false
        default: "true"
      valscope:
        type: string
        required: false
        default: "false"
      skip-state-root:
        type: string
        required: false
        default: "false"
      baseline-args:
        type: string
        required: false
        default: ""
      feature-args:
        type: string
        required: false
        default: ""
      gas-limit:
        type: string
        required: false
        default: "1000000000000"
      general-gas-limit:
        type: string
        required: false
        default: "1500000000"
      run-type:
        type: string
        required: false
        default: dispatch
      force-bloat:
        type: string
        required: false
        default: "false"
      no-cache:
        type: string
        required: false
        default: "false"
      no-slack:
        type: string
        required: false
        default: "true"
      artifacts-only:
        description: Keep reports/profiles in GitHub artifacts; OTLP remains a separate control.
        type: boolean
        required: false
        default: false
      slack:
        description: Slack policy (always or on-win); no-slack still overrides.
        type: string
        required: false
        default: always
      metrics:
        type: string
        required: false
        default: "false"
      bench-args:
        type: string
        required: false
        default: ""
      bench-env:
        type: string
        required: false
        default: ""
      baseline-env:
        type: string
        required: false
        default: ""
      feature-env:
        type: string
        required: false
        default: ""
      run-pairs:
        type: string
        required: false
        default: "3"
      run-side:
        type: string
        required: false
        default: comparison
      sequential-peer:
        description: Validate the generated chain with parallel peer A and sequential peer B (feature-only).
        type: boolean
        required: false
        default: false
      sequential-peer-baseline:
        description: Build baseline as the sequential reference peer; requires sequential-peer.
        type: boolean
        required: false
        default: false
      clickhouse-run:
        type: string
        required: false
        default: "feature-1"
      comment-id:
        type: string
        required: false
        default: ""
      pr-head-sha:
        description: Pinned PR head SHA from the ack job.
        type: string
        required: false
        default: ""
      pr-head-ref:
        description: Pinned PR head branch from the ack job.
        type: string
        required: false
        default: ""
    secrets:
      TEMPO_TELEMETRY_URL:
        required: false
      GRAFANA_TEMPO:
        required: false
      CLICKHOUSE_URL:
        required: false
      CLICKHOUSE_USER:
        required: false
      CLICKHOUSE_PASSWORD:
        required: false
      BENCH_VICTORIAMETRICS_URL:
        required: false
      VICTORIAMETRICS_URL:
        required: false
      VICTORIALOGS_URL:
        required: false
      SLACK_BENCH_BOT_TOKEN:
        required: false
      SLACK_BENCH_CHANNEL:
        required: false

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

permissions:
  contents: read
  id-token: write

jobs:
  bench-e2e:
    permissions:
      contents: read
      id-token: write
    name: bench-e2e
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 300
    env:
      BENCH_PR: ${{ inputs.pr }}
      BENCH_ACTOR: ${{ inputs.actor || github.actor }}
      BENCH_MODE: ${{ inputs.mode || 'e2e' }}
      BENCH_PRESET: ${{ inputs.preset }}
      BENCH_DURATION: ${{ inputs.duration }}
      BENCH_BLOAT: ${{ inputs.bloat }}
      BENCH_TPS: ${{ inputs.tps }}
      BENCH_ACCOUNTS: ${{ inputs.accounts || '1000' }}
      BENCH_MAX_CONCURRENT_REQUESTS: ${{ inputs.max-concurrent-requests || '500' }}
      BENCH_BASELINE_HARDFORK: ${{ inputs.baseline-hardfork }}
      BENCH_FEATURE_HARDFORK: ${{ inputs.feature-hardfork }}
      BENCH_TXGEN_REF: ${{ inputs.txgen-ref }}
      BENCH_TOKEN_COUNT: ${{ inputs.token-count || '4' }}
      BENCH_SAMPLY: ${{ inputs.profiling != 'kernel-scheduling-only' && (inputs.profiling == 'samply' || inputs.profiling == 'samply-low-rate' || inputs.profiling == 'samply-buffered' || inputs.profiling == 'samply-scheduling' || inputs.profiling == 'kernel-scheduling' || inputs.profiling == 'both' || inputs.samply == true || inputs.samply == 'true') }}
      BENCH_SAMPLY_ARGS: ${{ inputs.profiling == 'samply-scheduling' && '--per-cpu-threads --cswitch-markers --rate 100' || ((inputs.profiling == 'kernel-scheduling' || inputs.profiling == 'samply-low-rate' || inputs.profiling == 'samply-buffered') && '--rate 100' || '') }}
      BENCH_SAMPLY_BUFFERED: ${{ inputs.profiling == 'samply-buffered' }}
      BENCH_SAMPLY_BINARY: ""
      BENCH_SAMPLY_BINARY_SHA256: ""
      BENCH_SAMPLY_BUILD_MANIFEST: ""
      BENCH_SCHED_TRACE: ${{ inputs.profiling == 'kernel-scheduling' || inputs.profiling == 'kernel-scheduling-only' }}
      BENCH_DISPOSAL_CLOCK: ${{ inputs.profiling == 'disposal-clock' }}
      BENCH_PRODUCER_ISOLATION: ${{ inputs.profiling == 'producer-isolation' }}
      BENCH_PIPELINE_PRESSURE: ${{ inputs.profiling == 'pipeline-pressure' }}
      BENCH_OWNED_DIAGNOSTIC: ${{ inputs.profiling == 'producer-isolation' || inputs.profiling == 'pipeline-pressure' }}
      BENCH_TRACY: ${{ inputs.tracy != '' && inputs.tracy || ((inputs.profiling == 'tracy' || inputs.profiling == 'both') && 'tracy' || ((inputs.profiling == 'off' || inputs.profiling == 'samply') && 'off' || 'off')) }}
      BENCH_TRACY_SECONDS: ${{ inputs.tracy-seconds || '10' }}
      BENCH_TRACY_OFFSET: ${{ inputs.tracy-offset }}
      BENCH_OTLP: ${{ inputs.otlp != false && inputs.otlp != 'false' }}
      # Results/profile publication only; OTLP remains controlled by its own input.
      BENCH_ARTIFACTS_ONLY: ${{ inputs.artifacts-only == true }}
      BENCH_VALSCOPE: ${{ inputs.artifacts-only != true && (inputs.valscope == true || inputs.valscope == 'true') }}
      BENCH_FEATURES: ${{ (inputs.otlp != false && inputs.otlp != 'false') && 'jemalloc,asm-keccak,keccak-cache-global,otlp' || 'jemalloc,asm-keccak,keccak-cache-global' }}
      BENCH_BASELINE_FEATURES: ${{ inputs.baseline-features }}
      BENCH_FEATURE_FEATURES: ${{ inputs.feature-features }}
      BENCH_BASELINE_ARGS: ${{ inputs.baseline-args }}
      BENCH_FEATURE_ARGS: ${{ inputs.feature-args }}
      BENCH_SKIP_STATE_ROOT: ${{ inputs.skip-state-root == true || inputs.skip-state-root == 'true' }}
      BENCH_GAS_LIMIT: ${{ inputs.gas-limit || '1000000000000' }}
      BENCH_GENERAL_GAS_LIMIT: ${{ inputs.general-gas-limit || '1500000000' }}
      BENCH_RUN_TYPE: ${{ inputs.run-type || 'dispatch' }}
      BENCH_FORCE_BLOAT: ${{ inputs.force-bloat || 'false' }}
      BENCH_NO_CACHE: ${{ inputs.no-cache || 'false' }}
      BENCH_NO_SLACK: ${{ (inputs.artifacts-only == true || inputs.sequential-peer || inputs.profiling == 'samply-low-rate' || inputs.profiling == 'samply-buffered' || inputs.profiling == 'samply-scheduling' || inputs.profiling == 'kernel-scheduling' || inputs.profiling == 'kernel-scheduling-only' || inputs.profiling == 'disposal-clock' || inputs.profiling == 'producer-isolation' || inputs.profiling == 'pipeline-pressure') && 'true' || inputs.no-slack }}
      # The reusable input defaults to always. Direct manual dispatch has no slack
      # input and uses win-only notifications, without adding a 26th UI input.
      BENCH_SLACK: ${{ inputs.slack || 'on-win' }}
      BENCH_METRICS: ${{ inputs.artifacts-only != true && (inputs.metrics == true || inputs.metrics == 'true') }}
      BENCH_BENCH_ARGS: ${{ inputs.bench-args }}
      BENCH_BENCH_ENV: ${{ inputs.profiling == 'pipeline-pressure' && 'TXGEN_PIPELINE_PRESSURE=1 TXGEN_PIPELINE_PRESSURE_LABEL=feature-1' || inputs.bench-env }}
      BENCH_BASELINE_ENV: ${{ inputs.baseline-env }}
      BENCH_FEATURE_ENV: ${{ inputs.feature-env }}
      BENCH_RUN_PAIRS: ${{ inputs.run-pairs || '3' }}
      BENCH_RUN_SIDE: ${{ (inputs.profiling == 'producer-isolation' || inputs.profiling == 'pipeline-pressure') && 'feature' || inputs.run-side || 'comparison' }}
      BENCH_SEQUENTIAL_PEER: ${{ inputs.sequential-peer == true }}
      BENCH_SEQUENTIAL_PEER_BASELINE: ${{ inputs.sequential-peer-baseline == true }}
      BENCH_CLICKHOUSE_RUN: ${{ inputs.clickhouse-run || 'feature-1' }}
      BENCHMARK_ID: bench-e2e-${{ github.run_id }}
      BENCH_COMMENT_ID: ${{ inputs.comment-id }}
      BENCH_PR_HEAD_SHA: ${{ inputs.pr-head-sha }}
      BENCH_PR_HEAD_REF: ${{ inputs.pr-head-ref }}
      CLICKHOUSE_URL: ${{ inputs.artifacts-only != true && inputs.profiling != 'producer-isolation' && inputs.profiling != 'pipeline-pressure' && secrets.CLICKHOUSE_URL || '' }}
      CLICKHOUSE_USER: ${{ inputs.artifacts-only != true && inputs.profiling != 'producer-isolation' && inputs.profiling != 'pipeline-pressure' && secrets.CLICKHOUSE_USER || '' }}
      CLICKHOUSE_PASSWORD: ${{ inputs.artifacts-only != true && inputs.profiling != 'producer-isolation' && inputs.profiling != 'pipeline-pressure' && secrets.CLICKHOUSE_PASSWORD || '' }}
      BENCH_VICTORIAMETRICS_URL: ${{ inputs.artifacts-only != true && inputs.profiling != 'producer-isolation' && inputs.profiling != 'pipeline-pressure' && (inputs.metrics == true || inputs.metrics == 'true' || inputs.valscope == true || inputs.valscope == 'true') && secrets.BENCH_VICTORIAMETRICS_URL || '' }}
      VICTORIAMETRICS_URL: ${{ inputs.artifacts-only != true && secrets.VICTORIAMETRICS_URL || '' }}
      VICTORIALOGS_URL: ${{ inputs.artifacts-only != true && secrets.VICTORIALOGS_URL || '' }}
      VALSCOPE_REPORTS_BASE_URL: ${{ vars.VALSCOPE_REPORTS_BASE_URL }}
      SLACK_BENCH_BOT_TOKEN: ${{ inputs.artifacts-only != true && secrets.SLACK_BENCH_BOT_TOKEN || '' }}
      SLACK_BENCH_CHANNEL: ${{ inputs.artifacts-only != true && secrets.SLACK_BENCH_CHANNEL || '' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - name: Validate owned diagnostic controls
        if: env.BENCH_OWNED_DIAGNOSTIC == 'true'
        run: |
          python3 - <<'PY'
          import os, shlex
          pressure = os.environ['BENCH_PIPELINE_PRESSURE'] == 'true'
          expected = {
              'PRESET': 'public-mix', 'DURATION': '90' if pressure else '60', 'BLOAT': '100',
              'TPS': '50000', 'ACCOUNTS': '1000', 'MAX_CONCURRENT_REQUESTS': '100',
              'TOKEN_COUNT': '4', 'RUN_PAIRS': '1', 'RUN_SIDE': 'feature',
              'BASELINE_HARDFORK': 'T14', 'FEATURE_HARDFORK': 'T14',
              'TXGEN_REF': 'ed489fdf5e0bb9a416400f419fdcbb12a8b2f07c' if pressure else '8ca73369c4b42ffffaf40066bbde8673141049c1',
              'GAS_LIMIT': '1000000000000', 'GENERAL_GAS_LIMIT': '1500000000',
              'OTLP': 'true', 'NO_SLACK': 'true', 'VALSCOPE': 'false',
              'METRICS': 'false', 'SAMPLY': 'false', 'TRACY': 'off',
              'SCHED_TRACE': 'false', 'DISPOSAL_CLOCK': 'false',
              'SEQUENTIAL_PEER': 'false', 'SKIP_STATE_ROOT': 'false',
              'FORCE_BLOAT': 'false',
              'BENCH_ENV': 'TXGEN_PIPELINE_PRESSURE=1 TXGEN_PIPELINE_PRESSURE_LABEL=feature-1' if pressure else '',
          }
          for suffix, value in expected.items():
              if os.environ.get('BENCH_' + suffix) != value:
                  raise SystemExit('Producer diagnostic requires BENCH_' + suffix + '=' + value)
          for suffix in ('PR', 'COMMENT_ID', 'BASELINE_ENV', 'FEATURE_ENV',
                         'BENCH_ARGS', 'BASELINE_FEATURES', 'FEATURE_FEATURES'):
              if os.environ.get('BENCH_' + suffix):
                  raise SystemExit('Producer diagnostic forbids BENCH_' + suffix)
          node = ['--execution.threads', '8', '--execution.batch-size', '128',
                  '--execution.capture-window', '128', '--engine.prewarming-threads', '16',
                  '--engine.account-worker-count', '32', '--engine.storage-worker-count', '32',
                  '--log.file.filter=debug']
          for side in ('BASELINE', 'FEATURE'):
              if shlex.split(os.environ['BENCH_' + side + '_ARGS']) != node:
                  raise SystemExit('Producer diagnostic node arguments differ from fixed controls')
          PY

      - name: Reset workspace directory
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE"
          sudo -u actions-runner mkdir -p "$GITHUB_WORKSPACE"

      - name: Configure OTLP telemetry
        if: env.BENCH_OTLP == 'true'
        env:
          TEMPO_TELEMETRY_URL_SECRET: ${{ secrets.TEMPO_TELEMETRY_URL }}
          GRAFANA_TEMPO_SECRET: ${{ secrets.GRAFANA_TEMPO }}
        run: |
          if [ -n "$TEMPO_TELEMETRY_URL_SECRET" ]; then
            echo "::add-mask::$TEMPO_TELEMETRY_URL_SECRET"
            telemetry_base_no_auth="$(printf '%s' "$TEMPO_TELEMETRY_URL_SECRET" | sed -E 's#^(https?://)[^/@]+@#\1#; s#/*$##')"
            echo "::add-mask::$telemetry_base_no_auth"
            printf 'TEMPO_TELEMETRY_URL=%s\n' "$TEMPO_TELEMETRY_URL_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$GRAFANA_TEMPO_SECRET" ]; then
            echo "::add-mask::$GRAFANA_TEMPO_SECRET"
            printf 'GRAFANA_TEMPO=%s\n' "$GRAFANA_TEMPO_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Mask ClickHouse credentials
        if: env.CLICKHOUSE_URL
        run: |
          echo "::add-mask::$CLICKHOUSE_URL"
          echo "::add-mask::$CLICKHOUSE_PASSWORD"

      - name: Mask VictoriaMetrics URL
        if: env.BENCH_VICTORIAMETRICS_URL
        run: echo "::add-mask::$BENCH_VICTORIAMETRICS_URL"

      - name: Mask ValScope VictoriaMetrics URL
        if: env.VICTORIAMETRICS_URL
        run: echo "::add-mask::$VICTORIAMETRICS_URL"

      - name: Mask VictoriaLogs URL
        if: env.VICTORIALOGS_URL
        run: echo "::add-mask::$VICTORIALOGS_URL"

      - name: Clean up previous results
        run: sudo rm -rf bench-results/ 2>/dev/null || true

      - name: Fetch GitHub token via STS
        id: github-sts
        uses: tempoxyz/gh-actions/actions/github-sts@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          policy: bench-e2e

      - name: Fetch ValScope token via STS
        id: valscope-sts
        if: env.BENCH_VALSCOPE == 'true'
        uses: tempoxyz/gh-actions/actions/github-sts@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          scope: tempoxyz/valscope
          policy: tempo-bench-e2e

      - name: Resolve checkout ref
        id: checkout-ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_GITHUB_REF: ${{ github.ref }}
        with:
          script: |
            // workflow_dispatch: always use the branch ref directly
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('ref', process.env.INPUT_GITHUB_REF);
              return;
            }
            // issue_comment: use pinned SHA from ack job
            if (!process.env.BENCH_PR) {
              core.setOutput('ref', process.env.INPUT_GITHUB_REF);
              return;
            }
            const sha = process.env.BENCH_PR_HEAD_SHA;
            if (!sha) {
              core.setFailed('BENCH_PR_HEAD_SHA is not set — ack job must pin the PR head SHA');
              return;
            }
            core.info(`PR #${process.env.BENCH_PR}, using pinned head SHA ${sha}`);
            core.setOutput('ref', sha);

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Validate kernel scheduler tracing
        if: env.BENCH_SCHED_TRACE == 'true'
        run: |
          python3 - <<'PY'
          import os
          max_pairs = 1 if os.environ['BENCH_SAMPLY'] == 'true' else 4
          if int(os.environ['BENCH_DURATION']) < 60 or not 1 <= int(os.environ['BENCH_RUN_PAIRS']) <= max_pairs:
              raise SystemExit(f'Kernel scheduler diagnostics require duration >= 60 and 1..{max_pairs} run pairs.')
          PY
          python3 benchmarks/parallel-execution/scheduler_trace.py preflight --output bench-results/scheduler-preflight.json
          printf 'Kernel scheduler diagnostic: 15s per phase after 20s; Samply=%s; Slack disabled.\n' "$BENCH_SAMPLY" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout ValScope report builder
        if: env.BENCH_VALSCOPE == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tempoxyz/valscope
          ref: main
          path: valscope
          persist-credentials: false
          token: ${{ steps.valscope-sts.outputs.token }}

      - name: Render txgen spec
        run: |
          rm -rf .bench-tmp/txgen-specs
          spec_path="$(nu bench-e2e.nu render-txgen-spec --preset "$BENCH_PRESET" --out-dir ".bench-tmp/txgen-specs" | tail -n 1)"
          if [ -z "$spec_path" ] || [ ! -f "$spec_path" ]; then
            echo "::error::failed to render txgen spec for preset '$BENCH_PRESET'"
            exit 1
          fi

          echo "BENCH_TXGEN_SPEC_PATH=$spec_path" >> "$GITHUB_ENV"
          echo "::group::Rendered txgen spec ($BENCH_PRESET)"
          cat "$spec_path"
          echo "::endgroup::"

      - name: Resolve Tracy capture offset
        if: env.BENCH_TRACY != 'off'
        run: |
          if [ -z "$BENCH_TRACY_OFFSET" ]; then
            if [[ "$BENCH_DURATION" =~ ^[0-9]+$ ]]; then
              echo "BENCH_TRACY_OFFSET=$((BENCH_DURATION / 2))" >> "$GITHUB_ENV"
            else
              echo "BENCH_TRACY_OFFSET=0" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          if [[ "$BENCH_DURATION" =~ ^[0-9]+$ ]] && [[ "$BENCH_TRACY_OFFSET" =~ ^[0-9]+$ ]] && [ "$BENCH_DURATION" -le "$BENCH_TRACY_OFFSET" ]; then
            echo "::notice::tracy-offset ($BENCH_TRACY_OFFSET) is >= duration ($BENCH_DURATION); starting tracy-capture immediately"
            echo "BENCH_TRACY_OFFSET=0" >> "$GITHUB_ENV"
          fi

      - name: Resolve job URL and update status
        if: env.BENCH_COMMENT_ID
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BASELINE_NAME: ${{ inputs.baseline-name }}
          INPUT_FEATURE_NAME: ${{ inputs.feature-name }}
        with:
          github-token: ${{ steps.github-sts.outputs.token }}
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = jobs.jobs.find(j => j.name === 'bench-e2e');
            const jobUrl = job ? job.html_url : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            core.exportVariable('BENCH_JOB_URL', jobUrl);

            const mode = process.env.BENCH_MODE;
            const preset = process.env.BENCH_PRESET;
            const duration = process.env.BENCH_DURATION;
            const bloat = process.env.BENCH_BLOAT;
            const tps = process.env.BENCH_TPS;
            const accounts = process.env.BENCH_ACCOUNTS;
            const maxConcurrentRequests = process.env.BENCH_MAX_CONCURRENT_REQUESTS;
            const baselineHardfork = process.env.BENCH_BASELINE_HARDFORK || '';
            const featureHardfork = process.env.BENCH_FEATURE_HARDFORK || '';
            const baselineFeatureFlags = process.env.BENCH_BASELINE_FEATURES || '';
            const featureFeatureFlags = process.env.BENCH_FEATURE_FEATURES || '';
            const baseline = process.env.INPUT_BASELINE_NAME;
            const feature = process.env.INPUT_FEATURE_NAME;
            const txgenRef = process.env.BENCH_TXGEN_REF || 'default';
            const tokenCount = process.env.BENCH_TOKEN_COUNT || '4';
            const samply = process.env.BENCH_SAMPLY === 'true';
            const samplyNote = (process.env.BENCH_SAMPLY_ARGS
              ? `, samply diagnostic: \`${process.env.BENCH_SAMPLY_ARGS}\`${process.env.BENCH_SCHED_TRACE === 'true' ? ', kernel scheduler trace: `15s`' : ''}`
              : (samply ? ', samply: `enabled`' : ''))
              + (process.env.BENCH_SCHED_TRACE === 'true' && !process.env.BENCH_SAMPLY_ARGS
                ? ', kernel scheduler trace: `15s`, Samply: `disabled`' : '');
            const tracy = process.env.BENCH_TRACY;
            const tracyNote = tracy !== 'off' ? ', tracy: `enabled`' : '';
            const otlp = process.env.BENCH_OTLP === 'true';
            const otlpNote = otlp ? ', otlp: `enabled`' : ', otlp: `disabled`';
            const valscope = process.env.BENCH_VALSCOPE === 'true';
            const valscopeNote = valscope ? ', valscope: `enabled`' : ', valscope: `disabled`';
            const noCache = process.env.BENCH_NO_CACHE === 'true';
            const noCacheNote = noCache ? ', no-cache: `true`' : '';
            const gasLimit = process.env.BENCH_GAS_LIMIT;
            const generalGasLimit = process.env.BENCH_GENERAL_GAS_LIMIT || '';
            const generalGasLimitNote = generalGasLimit ? `, general-gas-limit: \`${generalGasLimit}\`` : '';
            const runPairs = process.env.BENCH_RUN_PAIRS || '2';
            const runSide = process.env.BENCH_RUN_SIDE || 'comparison';
            const hardforkNote = (baselineHardfork || featureHardfork) ? `, baseline-hardfork: \`${baselineHardfork}\`, feature-hardfork: \`${featureHardfork}\`` : '';
            const featureFlagsNote = `${baselineFeatureFlags ? `, baseline-features: \`${baselineFeatureFlags}\`` : ''}${featureFeatureFlags ? `, feature-features: \`${featureFeatureFlags}\`` : ''}`;
            const runSideNote = runSide !== 'comparison' ? `, run-side: \`${runSide}\`` : '';
            core.exportVariable('BENCH_CONFIG', `**Config:** mode: \`${mode}\`, preset: \`${preset}\`, duration: \`${duration}s\`, bloat: \`${bloat} GiB\`, token-count: \`${tokenCount}\`, tps: \`${tps}\`, accounts: \`${accounts}\`, max-concurrent-requests: \`${maxConcurrentRequests}\`, gas-limit: \`${gasLimit}\`${generalGasLimitNote}, run-pairs: \`${runPairs}\`${runSideNote}, baseline: \`${baseline}\`, feature: \`${feature}\`, txgen-ref: \`${txgenRef}\`${hardforkNote}${featureFlagsNote}${samplyNote}${tracyNote}${otlpNote}${valscopeNote}${noCacheNote}`);

            const { buildBody } = require('./.github/scripts/bench-update-status.js');
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: parseInt(process.env.BENCH_COMMENT_ID),
              body: buildBody('Resolving refs...'),
            });

      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          toolchain: 1.98.1
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        continue-on-error: true

      - name: Build buffered Samply recorder
        id: samply-buffered
        if: env.BENCH_SAMPLY_BUFFERED == 'true'
        timeout-minutes: 30
        env:
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -euo pipefail
          samply_dir="$(mktemp -d "$RUNNER_TEMP/tempo-samply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          samply_dir="$(realpath -- "$samply_dir")"
          if ! [[ "$samply_dir" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::Recorder directory cannot be passed safely through the benchmark launch shell"
            exit 1
          fi
          git init "$samply_dir/source"
          git -C "$samply_dir/source" remote add origin https://github.com/mstange/samply
          git -C "$samply_dir/source" fetch --depth 1 origin 247df8fe0fa259ddb5e671bfe3121728e0d6119d
          git -C "$samply_dir/source" checkout --detach FETCH_HEAD
          python3 .github/scripts/bench-samply-buffered.py prepare "$samply_dir/source" "$samply_dir/prepare.json"
          git -C "$samply_dir/source" diff --binary > "$samply_dir/source.patch"
          samply_build=(cargo +1.98.1 build --locked --release --jobs 4 --package samply --bin samply
            --target x86_64-unknown-linux-gnu --target-dir "$samply_dir/target")
          # Avoid the Tempo checkout's Cargo configuration and build/cache paths.
          (cd "$samply_dir/source" && "${samply_build[@]}")
          install -D -m 0755 "$samply_dir/target/x86_64-unknown-linux-gnu/release/samply" "$samply_dir/bin/samply"
          samply_sha="$(sha256sum -- "$samply_dir/bin/samply" | cut -d ' ' -f 1)"
          printf 'binary=%s\nbinary_sha256=%s\n' "$samply_dir/bin/samply" "$samply_sha" >> "$GITHUB_OUTPUT"
          python3 - "$samply_dir" "${samply_build[@]}" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          directory = pathlib.Path(sys.argv[1])
          def sha(path):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()
          preparation = json.loads((directory / 'prepare.json').read_text())
          for row in preparation['files']:
              if sha(directory / 'source' / row['path']) != row['patched_sha256']:
                  raise SystemExit('Patched Samply source changed during build')
          if sha(directory / 'source/Cargo.lock') != preparation['cargo_lock']['sha256']:
              raise SystemExit('Pinned Samply Cargo.lock changed during build')
          configuration = {
              'argv': sys.argv[2:], 'working_directory': str(directory / 'source'),
              'environment': {key: os.environ[key] for key in (
                  'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS')},
              'rustc': subprocess.check_output(['rustc', '+1.98.1', '-vV'], text=True),
              'cargo': subprocess.check_output(['cargo', '+1.98.1', '-V'], text=True),
          }
          manifest = {
              'preparation': preparation, 'preparation_sha256': sha(directory / 'prepare.json'),
              'source_diff_sha256': sha(directory / 'source.patch'),
              'build': configuration,
              'toolchain_sha256': hashlib.sha256(json.dumps({key: configuration[key] for key in ('rustc', 'cargo')}, sort_keys=True).encode()).hexdigest(),
              'build_configuration_sha256': hashlib.sha256(json.dumps(configuration, sort_keys=True).encode()).hexdigest(),
              'binary_path': str(directory / 'bin/samply'), 'binary_sha256': sha(directory / 'bin/samply'),
          }
          (directory / 'build.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          printf 'BENCH_SAMPLY_BINARY=%s\nBENCH_SAMPLY_BINARY_SHA256=%s\nBENCH_SAMPLY_BUILD_MANIFEST=%s\n' \
            "$samply_dir/bin/samply" "$samply_sha" "$samply_dir/build.json" >> "$GITHUB_ENV"

      - name: Validate profiler options
        if: env.BENCH_SAMPLY_ARGS != ''
        run: |
          mkdir -p bench-results
          # Resolve the override before sudo; the login shell receives an absolute argv token.
          samply_binary="$BENCH_SAMPLY_BINARY"
          if [ -z "$samply_binary" ]; then
            samply_binary="$(sudo bash -lc 'command -v samply')"
          elif ! [[ "$samply_binary" =~ ^/[A-Za-z0-9_./-]+$ ]] || [ ! -f "$samply_binary" ] || [ ! -x "$samply_binary" ]; then
            echo "::error::Invalid job-local Samply executable"
            exit 1
          fi
          sudo bash -lc 'exec "$1" --version' _ "$samply_binary" > bench-results/samply-version.txt
          sudo bash -lc 'exec "$1" record --help' _ "$samply_binary" > bench-results/samply-record-help.txt
          python3 - "$samply_binary" "$BENCH_SAMPLY_ARGS" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          binary = pathlib.Path(sys.argv[1]).resolve(strict=True)
          output = pathlib.Path('bench-results')
          help_text = (output / 'samply-record-help.txt').read_text()
          arguments = sys.argv[2].split()
          required = [arg for arg in arguments if arg.startswith('--')] + ['--save-only', '--presymbolicate', '--output']
          missing = [flag for flag in required if not re.search(
              r'^\s*(?:-[^\s,]+,\s*)?' + re.escape(flag) + r'(?=\s|=|$)',
              help_text, re.MULTILINE)]
          with binary.open('rb') as source:
              binary_sha256 = hashlib.file_digest(source, 'sha256').hexdigest()
          buffered = os.environ['BENCH_SAMPLY_BUFFERED'] == 'true'
          provenance = {
              'mode': ('samply-buffered' if buffered
                       else 'kernel-scheduling' if os.environ['BENCH_SCHED_TRACE'] == 'true'
                       else 'samply-scheduling' if '--cswitch-markers' in arguments
                       else 'samply-low-rate'),
              'binary_path': str(binary),
              'binary_sha256': binary_sha256,
              'version': (output / 'samply-version.txt').read_text().strip(),
              'record_help_sha256': hashlib.sha256(help_text.encode()).hexdigest(),
              'additional_record_arguments': arguments,
              'required_options': required,
              'missing_options': missing,
              'launch_context': 'sudo bash -lc',
              'derek_command_supported': False,
              'scope': 'Instrumented profiling diagnostic; accepted-block binding and event loss require a separate audit.',
          }
          if buffered:
              manifest_bytes = pathlib.Path(os.environ['BENCH_SAMPLY_BUILD_MANIFEST']).read_bytes()
              manifest = json.loads(manifest_bytes)
              if (str(binary) != manifest['binary_path']
                      or binary_sha256 != manifest['binary_sha256']
                      or binary_sha256 != os.environ['BENCH_SAMPLY_BINARY_SHA256']
                      or arguments != ['--rate', '100']
                      or os.environ['BENCH_SCHED_TRACE'] != 'false'
                      or os.environ['BENCH_TRACY'] != 'off'
                      or os.environ['BENCH_NO_SLACK'] != 'true'):
                  raise SystemExit('Buffered Samply build identity or diagnostic controls changed')
              provenance['buffered_build'] = manifest
              provenance['build_manifest_sha256'] = hashlib.sha256(manifest_bytes).hexdigest()
              provenance['preflight_binary_verified'] = True
          (output / 'samply-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          if missing:
              sys.exit('::error::Runner samply lacks required options: ' + ', '.join(missing))
          print(json.dumps(provenance, indent=2))
          PY
          printf 'Profiling diagnostic: Samply options `%s`; kernel trace `%s`; Slack disabled.\n' "$BENCH_SAMPLY_ARGS" "$BENCH_SCHED_TRACE" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install txgen
        run: |
          CARGO_BIN_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$CARGO_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$CARGO_BIN_DIR:$PATH"

          TXGEN_GIT_URL="https://github.com/tempoxyz/txgen"
          install_args=(--git "$TXGEN_GIT_URL" --locked)
          if [ "$BENCH_OWNED_DIAGNOSTIC" = "true" ]; then
            install_args+=(--rev "$BENCH_TXGEN_REF" --force)
          elif [ -n "$BENCH_TXGEN_REF" ]; then
            TXGEN_REV="$(git ls-remote "$TXGEN_GIT_URL" "$BENCH_TXGEN_REF" "refs/heads/$BENCH_TXGEN_REF" "refs/tags/$BENCH_TXGEN_REF" | awk 'BEGIN { rev = "" } /\^\{\}$/ { rev = $1; exit } rev == "" { rev = $1 } END { if (rev != "") print rev }')"
            install_args+=(--rev "${TXGEN_REV:-$BENCH_TXGEN_REF}")
          fi

          if [ "$BENCH_OWNED_DIAGNOSTIC" = "true" ]; then
            export PRODUCER_BUILD="$GITHUB_WORKSPACE/bench-results/producer-build"
            export PRODUCER_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            # Keep this producer install independent of compiler wrappers and
            # host flag overrides; subsequent node-build steps retain their env.
            export RUSTC_WRAPPER="" RUSTC_WORKSPACE_WRAPPER="" RUSTFLAGS="" CARGO_ENCODED_RUSTFLAGS=""
            mkdir -p "$PRODUCER_BUILD"
            python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tomllib
          out = pathlib.Path(os.environ['PRODUCER_BUILD'])
          cargo_home = pathlib.Path(os.environ['PRODUCER_CARGO_HOME']).resolve()
          unsupported_env = sorted(name for name, value in os.environ.items() if value and
              (name in ('RUSTC', 'RUSTDOC') or name.startswith(('CARGO_PROFILE_', 'CARGO_TARGET_')) or
               (name.startswith('CARGO_BUILD_') and name != 'CARGO_BUILD_TARGET')))
          (out / 'unsupported-environment-names.json').write_text(json.dumps(unsupported_env) + '\n')
          if unsupported_env:
              raise SystemExit('Unsupported producer compiler environment names; see retained names only')
          starts = [pathlib.Path.cwd().resolve()]
          candidates = list((cargo_home / 'git/checkouts').glob('txgen-*/*'))
          if len(candidates) > 128:
              raise SystemExit('Too many txgen source candidates')
          for candidate in candidates:
              if (candidate / '.git').exists():
                  head = subprocess.check_output(['git', '-C', str(candidate), 'rev-parse', 'HEAD'], text=True, timeout=10).strip()
                  if head == os.environ['BENCH_TXGEN_REF']: starts.append(candidate.resolve())
          searched = set(cargo_home / name for name in ('config', 'config.toml'))
          for start in starts:
              for parent in (start, *start.parents):
                  searched.update(parent / '.cargo' / name for name in ('config', 'config.toml'))
          rows = []
          for path in sorted(searched):
              row = {'path': str(path), 'exists': path.exists()}
              if row['exists']:
                  raw = path.read_bytes()
                  if len(raw) > 1024 * 1024: raise SystemExit('Cargo configuration exceeds evidence bound')
                  value = tomllib.loads(raw.decode())
                  row.update(sha256=hashlib.sha256(raw).hexdigest(), unsupported_sections=[
                      name for name in ('build', 'profile', 'target', 'env', 'unstable') if value.get(name)])
              rows.append(row)
          (out / 'cargo-config-before.json').write_text(json.dumps({'schema_version': 1,
              'cwd': str(pathlib.Path.cwd().resolve()), 'cargo_home': str(cargo_home), 'searched': rows}, indent=2) + '\n')
          if any(row.get('unsupported_sections') for row in rows):
              raise SystemExit('Unsupported Cargo build/profile/target/env/unstable configuration')
          PY
            cargo --version > "$PRODUCER_BUILD/cargo-version.txt"
            rustc -vV > "$PRODUCER_BUILD/rustc-version.txt"
            date +%s%N > "$PRODUCER_BUILD/install-start-ns.txt"
            set +e
            cargo install "${install_args[@]}" txgen-tempo bench-cli 2>&1 | tee "$PRODUCER_BUILD/install.log"
            install_pipeline_status=("${PIPESTATUS[@]}")
            install_status=${install_pipeline_status[0]}
            set -e
            date +%s%N > "$PRODUCER_BUILD/install-finish-ns.txt"
            printf '%s\n' "$install_status" > "$PRODUCER_BUILD/install-exit.txt"
            [ "$install_status" -eq 0 ] || exit "$install_status"
            [ "${install_pipeline_status[1]}" -eq 0 ] || exit "${install_pipeline_status[1]}"
            export PRODUCER_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, sys, tomllib
          sys.path.insert(0, str(pathlib.Path.cwd() / 'benchmarks/parallel-execution'))
          import producer_context
          out = pathlib.Path(os.environ['PRODUCER_BUILD'])
          cargo_home = pathlib.Path(os.environ['PRODUCER_CARGO_HOME']).resolve()
          commit = os.environ['BENCH_TXGEN_REF']
          system = producer_context.System()
          def git(path, *args):
              return producer_context.command(system, ['git', '-C', str(path), *args], 10).strip()
          roots = list((cargo_home / 'git/checkouts').glob('txgen-*/*'))
          discovery = {'schema_version': 1, 'status': 'checking', 'expected_commit': commit,
              'candidate_count': len(roots), 'candidate_limit': 128, 'candidates': [], 'matching_count': None}
          try:
              if len(roots) > 128:
                  raise SystemExit('Too many txgen source candidates')
              matching = []
              for candidate in sorted(roots):
                  row = {'path': str(candidate), 'has_git': (candidate / '.git').exists()}
                  discovery['candidates'].append(row)
                  if row['has_git']:
                      row['head'] = git(candidate, 'rev-parse', 'HEAD')
                      if row['head'] == commit: matching.append(candidate.resolve())
              discovery['matching_count'] = len(matching)
              if len(matching) != 1:
                  raise SystemExit('Expected exactly one matching Cargo git checkout; see checkout-discovery.json')
              source = matching[0]
              discovery['selected_checkout'] = {}
              producer_context.verify_clean_checkout(source, system, discovery['selected_checkout'])
              discovery['status'] = 'verified'
          finally:
              (out / 'checkout-discovery.json').write_text(json.dumps(discovery, indent=2) + '\n')
          def binding(path):
              path = path.resolve()
              if not path.is_file() or path.stat().st_size > 16 * 1024 * 1024:
                  raise SystemExit('Missing or oversized install evidence: ' + str(path))
              return {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          searched = set()
          for start in (pathlib.Path.cwd().resolve(), source):
              for parent in (start, *start.parents):
                  searched.update(parent / '.cargo' / name for name in ('config', 'config.toml'))
          searched.update(cargo_home / name for name in ('config', 'config.toml'))
          before = json.loads((out / 'cargo-config-before.json').read_text())
          before_rows = {row['path']: row for row in before['searched']}
          searched.update(pathlib.Path(path) for path in before_rows)
          configuration = []
          for path in sorted(searched):
              item = {'path': str(path), 'exists': path.exists()}
              if item['exists']:
                  item['sha256'] = binding(path)['sha256']
                  value = tomllib.loads(path.read_text())
                  item['unsupported_sections'] = [name for name in
                      ('build', 'profile', 'target', 'env', 'unstable') if value.get(name)]
                  if item['unsupported_sections']:
                      raise SystemExit('Unsupported Cargo configuration after install')
              if str(path) in before_rows:
                  if item != before_rows[str(path)]: raise SystemExit('Cargo configuration changed during install')
              elif item['exists']:
                  raise SystemExit('Newly discovered source configuration was not checked before install')
              configuration.append(item)
          config = out / 'cargo-config-evidence.json'
          config.write_text(json.dumps({'schema_version': 1, 'cwd': str(pathlib.Path.cwd().resolve()),
              'cargo_home': str(cargo_home), 'source_checkout': str(source), 'searched': configuration,
              'before': binding(out / 'cargo-config-before.json'), 'unsupported_environment_names': []}, indent=2) + '\n')
          shutil.copyfile(cargo_home / '.crates2.json', out / 'crates2.json')
          record = {'schema_version': 1, 'status': 'completed',
              'argv': ['cargo', 'install', '--git', 'https://github.com/tempoxyz/txgen', '--locked',
                       '--rev', commit, '--force', 'txgen-tempo', 'bench-cli'],
              'exit_code': 0, 'log_complete': True,
              'started_realtime_ns': int((out / 'install-start-ns.txt').read_text()),
              'finished_realtime_ns': int((out / 'install-finish-ns.txt').read_text()),
              'source_checkout': str(source), 'log': binding(out / 'install.log'),
              'install_metadata': binding(out / 'crates2.json'),
              'cargo_version': binding(out / 'cargo-version.txt'), 'rustc_version': binding(out / 'rustc-version.txt'),
              'cargo_config_evidence': binding(config),
              'unsupported_environment_names': [],
              'effective_environment': {name: os.environ.get(name, '') for name in
                  ('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'CARGO_BUILD_TARGET')}}
          (out / 'install-record.json').write_text(json.dumps(record, indent=2) + '\n')
          (out / 'source-checkout.txt').write_text(str(source) + '\n')
          PY
            python3 benchmarks/parallel-execution/producer_context.py build --source-revision "$BENCH_TXGEN_REF" \
              --source-checkout "$(cat "$PRODUCER_BUILD/source-checkout.txt")" \
              --txgen-bin "$CARGO_BIN_DIR/txgen-tempo" --bench-bin "$CARGO_BIN_DIR/bench" \
              --install-record "$PRODUCER_BUILD/install-record.json" --output "$PRODUCER_BUILD/build-manifest.json"
            printf 'BENCH_PRODUCER_BUILD=%s\n' "$PRODUCER_BUILD/build-manifest.json" >> "$GITHUB_ENV"
          else
            cargo install "${install_args[@]}" txgen-tempo bench-cli
          fi
          echo "TXGEN_TEMPO_BIN=$CARGO_BIN_DIR/txgen-tempo" >> "$GITHUB_ENV"
          echo "TXGEN_BENCH_BIN=$CARGO_BIN_DIR/bench" >> "$GITHUB_ENV"
          command -v txgen-tempo
          command -v bench

      - name: Install tracy-capture
        if: env.BENCH_TRACY != 'off'
        run: |
          if command -v tracy-capture &>/dev/null; then
            command -v tracy-capture
            exit 0
          fi

          for attempt in 1 2 3; do
            rm -rf /tmp/tracy /tmp/tracy-capture-build
            git clone --depth 1 https://github.com/wolfpld/tracy /tmp/tracy
            if cmake -S /tmp/tracy/capture -B /tmp/tracy-capture-build -DCMAKE_BUILD_TYPE=Release; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to configure tracy-capture"
              exit 1
            fi
            sleep 5
          done
          cmake --build /tmp/tracy-capture-build --parallel

          tracy_capture="$(find /tmp/tracy-capture-build -type f -name tracy-capture -perm -111 | head -n 1)"
          if [ -z "$tracy_capture" ]; then
            echo "::error::failed to build tracy-capture"
            exit 1
          fi

          sudo install "$tracy_capture" /usr/local/bin/tracy-capture
          command -v tracy-capture

      - name: Configure Tracy CPU sampling
        if: env.BENCH_TRACY != 'off'
        run: |
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo sysctl kernel.kptr_restrict=0
          cat /proc/sys/kernel/perf_event_paranoid
          cat /proc/sys/kernel/kptr_restrict

      - name: Resolve PR branches
        id: pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_REF_NAME: ${{ github.ref_name }}
          INPUT_SHA: ${{ github.sha }}
        with:
          script: |
            if (process.env.BENCH_PR) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(process.env.BENCH_PR, 10),
              });
              const ref = process.env.BENCH_PR_HEAD_REF || process.env.INPUT_REF_NAME;
              const sha = process.env.BENCH_PR_HEAD_SHA || process.env.INPUT_SHA;
              core.setOutput('head-ref', ref);
              core.setOutput('head-sha', sha);
              core.setOutput('base-ref', pr.base.ref);
            } else {
              core.setOutput('head-ref', process.env.INPUT_REF_NAME);
              core.setOutput('head-sha', process.env.INPUT_SHA);
              core.setOutput('base-ref', 'main');
            }

      - name: Resolve baseline and feature refs
        id: refs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
         INPUT_BASELINE: ${{ inputs.baseline }}
         INPUT_FEATURE: ${{ inputs.feature }}
         INPUT_BASELINE_NAME: ${{ inputs.baseline-name }}
         INPUT_FEATURE_NAME: ${{ inputs.feature-name }}
         INPUT_SHA: ${{ github.sha }}
         INPUT_PR_HEAD_SHA: ${{ steps.pr-info.outputs.head-sha }}
         INPUT_PR_HEAD_REF: ${{ steps.pr-info.outputs.head-ref }}
         INPUT_PR_BASE_REF: ${{ steps.pr-info.outputs.base-ref }}
        with:
         script: |
           const { execSync } = require('child_process');
           const run = (cmd) => execSync(cmd, { encoding: 'utf8' }).trim();

           const baselineArg = process.env.INPUT_BASELINE;
           const featureArg = process.env.INPUT_FEATURE;
           const baselineNameArg = process.env.INPUT_BASELINE_NAME;
           const featureNameArg = process.env.INPUT_FEATURE_NAME;
           const baseRef = process.env.INPUT_PR_BASE_REF || 'main';

           let baselineRef, baselineName, featureRef, featureName;

           if (baselineArg) {
             try { run(`git fetch origin "${baselineArg}" --quiet`); } catch {}
             try {
               baselineRef = run(`git rev-parse "${baselineArg}"`);
             } catch {
               baselineRef = run(`git rev-parse "origin/${baselineArg}"`);
             }
             baselineName = baselineNameArg || baselineArg;
           } else {
             try {
               run(`git fetch origin "${baseRef}" --quiet`);
               baselineRef = run(`git merge-base HEAD "origin/${baseRef}"`);
             } catch {
               baselineRef = process.env.INPUT_SHA;
             }
             baselineName = baselineNameArg && baselineNameArg !== 'merge-base' ? baselineNameArg : baselineRef;
           }

           if (featureArg) {
             try { run(`git fetch origin "${featureArg}" --quiet`); } catch {}
             try {
               featureRef = run(`git rev-parse "${featureArg}"`);
             } catch {
               featureRef = run(`git rev-parse "origin/${featureArg}"`);
             }
             featureName = featureNameArg || featureArg;
           } else {
             featureRef = process.env.INPUT_PR_HEAD_SHA;
             featureName = featureNameArg || process.env.INPUT_PR_HEAD_REF;
           }

            core.setOutput('baseline-ref', baselineRef);
            core.setOutput('baseline-name', baselineName);
            core.setOutput('feature-ref', featureRef);
            core.setOutput('feature-name', featureName);

      - name: Resolve PR attribution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_FEATURE_REF: ${{ steps.refs.outputs.feature-ref }}
        with:
          script: |
            let pr = process.env.BENCH_PR || '';
            if (!pr) {
              const featureRef = process.env.INPUT_FEATURE_REF;
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: featureRef,
                });
                const openPr = prs.find(candidate => candidate.state === 'open');
                if (openPr) {
                  pr = String(openPr.number);
                  core.info(`Using PR #${pr} for feature ref ${featureRef}`);
                }
              } catch (error) {
                core.info(`No PR associated with feature ref ${featureRef}: ${error.message}`);
              }
            }
            core.exportVariable('BENCH_PR', pr);

      - name: Create dispatch PR comment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BASELINE_NAME: ${{ steps.refs.outputs.baseline-name }}
          INPUT_FEATURE_NAME: ${{ steps.refs.outputs.feature-name }}
        with:
          github-token: ${{ steps.github-sts.outputs.token }}
          script: |
            if (process.env.BENCH_COMMENT_ID || !process.env.BENCH_PR) {
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = jobs.jobs.find(j => j.name === 'bench-e2e');
            const jobUrl = job ? job.html_url : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            core.exportVariable('BENCH_JOB_URL', jobUrl);

            const mode = process.env.BENCH_MODE;
            const preset = process.env.BENCH_PRESET;
            const duration = process.env.BENCH_DURATION;
            const bloat = process.env.BENCH_BLOAT;
            const tps = process.env.BENCH_TPS;
            const accounts = process.env.BENCH_ACCOUNTS;
            const maxConcurrentRequests = process.env.BENCH_MAX_CONCURRENT_REQUESTS;
            const baselineHardfork = process.env.BENCH_BASELINE_HARDFORK || '';
            const featureHardfork = process.env.BENCH_FEATURE_HARDFORK || '';
            const baselineFeatureFlags = process.env.BENCH_BASELINE_FEATURES || '';
            const featureFeatureFlags = process.env.BENCH_FEATURE_FEATURES || '';
            const baseline = process.env.INPUT_BASELINE_NAME;
            const feature = process.env.INPUT_FEATURE_NAME;
            const txgenRef = process.env.BENCH_TXGEN_REF || 'default';
            const tokenCount = process.env.BENCH_TOKEN_COUNT || '4';
            const samply = process.env.BENCH_SAMPLY === 'true';
            const samplyNote = (process.env.BENCH_SAMPLY_ARGS
              ? `, samply diagnostic: \`${process.env.BENCH_SAMPLY_ARGS}\`${process.env.BENCH_SCHED_TRACE === 'true' ? ', kernel scheduler trace: `15s`' : ''}`
              : (samply ? ', samply: `enabled`' : ''))
              + (process.env.BENCH_SCHED_TRACE === 'true' && !process.env.BENCH_SAMPLY_ARGS
                ? ', kernel scheduler trace: `15s`, Samply: `disabled`' : '');
            const tracy = process.env.BENCH_TRACY;
            const tracyNote = tracy !== 'off' ? ', tracy: `enabled`' : '';
            const otlp = process.env.BENCH_OTLP === 'true';
            const otlpNote = otlp ? ', otlp: `enabled`' : ', otlp: `disabled`';
            const valscope = process.env.BENCH_VALSCOPE === 'true';
            const valscopeNote = valscope ? ', valscope: `enabled`' : ', valscope: `disabled`';
            const noCache = process.env.BENCH_NO_CACHE === 'true';
            const noCacheNote = noCache ? ', no-cache: `true`' : '';
            const gasLimit = process.env.BENCH_GAS_LIMIT;
            const generalGasLimit = process.env.BENCH_GENERAL_GAS_LIMIT || '';
            const generalGasLimitNote = generalGasLimit ? `, general-gas-limit: \`${generalGasLimit}\`` : '';
            const runPairs = process.env.BENCH_RUN_PAIRS || '2';
            const runSide = process.env.BENCH_RUN_SIDE || 'comparison';
            const hardforkNote = (baselineHardfork || featureHardfork) ? `, baseline-hardfork: \`${baselineHardfork}\`, feature-hardfork: \`${featureHardfork}\`` : '';
            const featureFlagsNote = `${baselineFeatureFlags ? `, baseline-features: \`${baselineFeatureFlags}\`` : ''}${featureFeatureFlags ? `, feature-features: \`${featureFeatureFlags}\`` : ''}`;
            const runSideNote = runSide !== 'comparison' ? `, run-side: \`${runSide}\`` : '';
            const config = `**Config:** mode: \`${mode}\`, preset: \`${preset}\`, duration: \`${duration}s\`, bloat: \`${bloat} GiB\`, token-count: \`${tokenCount}\`, tps: \`${tps}\`, accounts: \`${accounts}\`, max-concurrent-requests: \`${maxConcurrentRequests}\`, gas-limit: \`${gasLimit}\`${generalGasLimitNote}, run-pairs: \`${runPairs}\`${runSideNote}, baseline: \`${baseline}\`, feature: \`${feature}\`, txgen-ref: \`${txgenRef}\`${hardforkNote}${featureFlagsNote}${samplyNote}${tracyNote}${otlpNote}${valscopeNote}${noCacheNote}`;
            core.exportVariable('BENCH_CONFIG', config);

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.BENCH_PR),
              body: `cc @${process.env.BENCH_ACTOR}\n\n🚀 Benchmark started! [View job](${jobUrl})\n\n⏳ **Status:** Running benchmark...\n\n${config}`,
            });
            core.exportVariable('BENCH_COMMENT_ID', String(comment.id));

      - name: Update status (running benchmark)
        if: success() && env.BENCH_COMMENT_ID
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.github-sts.outputs.token }}
          script: |
            const s = require('./.github/scripts/bench-update-status.js');
            await s({github, context, status: 'Running benchmark...'});

      - name: Prepare producer lifecycle ownership
        id: producer-ownership
        if: env.BENCH_OWNED_DIAGNOSTIC == 'true'
        run: |
          export PRODUCER_STATE="$GITHUB_WORKSPACE/bench-results/producer-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$PRODUCER_STATE"
          python3 - <<'PY'
          import json, os, pathlib, secrets
          directory = pathlib.Path(os.environ['PRODUCER_STATE']).resolve()
          token = secrets.token_hex(16)
          config = {'schema_version': 1, 'run_token': token, 'state_dir': str(directory),
              'control_unit': 'tempo-producer-' + token + '-control.scope',
              'node_units': ['tempo-producer-' + token + '-' + role + '.scope' for role in ('a', 'b')],
              'unit_description': 'tempo-producer:' + token}
          with (directory / 'config.json').open('x') as target:
              json.dump(config, target, indent=2)
              target.write('\n')
          PY
          printf 'BENCH_PRODUCER_LIFECYCLE=%s\n' "$PRODUCER_STATE/config.json" >> "$GITHUB_ENV"
          printf 'TEMPO_PRODUCER_EXCLUSIVITY_EVIDENCE=%s\n' "$PRODUCER_STATE/exclusivity.json" >> "$GITHUB_ENV"
          printf 'state=%s\n' "$PRODUCER_STATE" >> "$GITHUB_OUTPUT"
          # Read only: refuse an already-busy runner; never kill by process name.
          sudo -n python3 - "$PRODUCER_STATE/runner-preflight.json" <<'PY'
          import json, os, pathlib, subprocess, sys, time
          rows = []
          for proc in pathlib.Path('/proc').iterdir():
              if not proc.name.isdecimal():
                  continue
              try:
                  executable = os.readlink(proc / 'exe')
              except FileNotFoundError:
                  continue
              if pathlib.Path(executable.removesuffix(' (deleted)')).name in ('tempo', 'txgen-tempo', 'bench'):
                  rows.append({'pid': int(proc.name), 'executable': executable})
          record = {'captured_realtime_ns': time.time_ns(), 'matching_processes': rows,
              'scope': 'One runner-local executable-name preflight; no process killing or assertion about arbitrary unrelated software.',
              'boot_id': pathlib.Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
              'cpu_topology': json.loads(subprocess.check_output(['lscpu', '--json'], timeout=5, text=True)),
              'launcher_affinity': sorted(os.sched_getaffinity(0)),
              'tools': {name: subprocess.check_output([name, '--version'], timeout=5, text=True)
                        for name in ('systemd-run', 'setpriv')}}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(record, indent=2) + '\n')
          if rows:
              raise SystemExit('Existing Tempo/txgen/bench process prevents producer diagnostic')
          PY
          sudo -n chown "$(id -u):$(id -g)" "$PRODUCER_STATE/runner-preflight.json"

      - name: Refresh producer Actions read token
        id: producer-github-sts
        if: env.BENCH_OWNED_DIAGNOSTIC == 'true'
        uses: tempoxyz/gh-actions/actions/github-sts@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          policy: bench-e2e

      - name: Verify producer task measurement exclusivity
        id: producer-exclusivity
        if: env.BENCH_OWNED_DIAGNOSTIC == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # This existing app policy grants actions:read; reusable callers keep
          # their original GITHUB_TOKEN permissions.
          github-token: ${{ steps.producer-github-sts.outputs.token }}
          script: |
            const fs = require('fs'), path = require('path'), crypto = require('crypto');
            const config = JSON.parse(fs.readFileSync(process.env.BENCH_PRODUCER_LIFECYCLE, 'utf8'));
            const current = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: context.runId})).data;
            if (typeof current.head_branch !== 'string' || !current.head_branch) throw new Error('Current task branch is unbound');
            const raw = {current, pages: [], jobs: []};
            const active = new Map();
            const statuses = ['in_progress', 'queued', 'waiting', 'pending', 'requested'];
            const counts = {};
            for (const status of statuses) {
              let complete = false, count = 0;
              for (let page = 1; page <= 5; page++) {
                const response = (await github.rest.actions.listWorkflowRunsForRepo({
                  ...context.repo, status, per_page: 100, page,
                })).data;
                raw.pages.push({status, page, response});
                count += response.workflow_runs.length;
                for (const run of response.workflow_runs) {
                  const workflow = run.path.split('@')[0];
                  if (run.id !== context.runId && run.head_branch === current.head_branch &&
                      /^\.github\/workflows\/bench[^/]*\.ya?ml$/.test(workflow)) active.set(run.id, run);
                }
                if (response.workflow_runs.length < 100) { complete = true; break; }
              }
              if (!complete) throw new Error('Bounded Actions snapshot pagination incomplete: ' + status);
              counts[status] = count;
            }
            let jobsComplete = false;
            for (let page = 1; page <= 5; page++) {
              const response = (await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100, page,
              })).data;
              raw.jobs.push({page, response});
              if (response.jobs.length < 100) { jobsComplete = true; break; }
            }
            if (!jobsComplete) throw new Error('Bounded Actions jobs snapshot pagination incomplete');
            const jobs = raw.jobs.flatMap(p => p.response.jobs).filter(
              job => job.status === 'in_progress' && job.runner_name === process.env.RUNNER_NAME);
            if (jobs.length !== 1) throw new Error('Cannot bind unique current job and runner');
            const directory = path.dirname(process.env.BENCH_PRODUCER_LIFECYCLE);
            const bytes = Buffer.from(JSON.stringify(raw, null, 2) + '\n');
            if (bytes.length > 16 * 1024 * 1024) throw new Error('Actions snapshot exceeds evidence cap');
            const rawPath = path.join(directory, 'actions-snapshot.json');
            fs.writeFileSync(rawPath, bytes, {flag: 'wx'});
            const proof = {status: 'workflow_attested', workflow_sha: process.env.GITHUB_SHA,
              run_id: String(context.runId), github_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              run_token: config.run_token, runner_name: process.env.RUNNER_NAME,
              job_id: jobs[0].id, job_name: jobs[0].name, runner_id: jobs[0].runner_id,
              runner_group_id: jobs[0].runner_group_id, runner_group_name: jobs[0].runner_group_name,
              captured_realtime_ns: Date.now() * 1000000, head_branch: current.head_branch,
              pagination_complete: true, counts, overlapping_runs: [...active.values()].map(
                run => ({id: run.id, path: run.path, status: run.status, head_sha: run.head_sha})),
              other_owned_measurement_active: active.size !== 0,
              scope: 'Bounded paginated Actions observation of active benchmark workflows on this task branch; root separately serializes owned dispatches. API pages are not an atomic snapshot and do not certify unrelated other-host jobs or future launches.',
              actions_snapshot: {path: rawPath, sha256: crypto.createHash('sha256').update(bytes).digest('hex')}};
            fs.writeFileSync(process.env.TEMPO_PRODUCER_EXCLUSIVITY_EVIDENCE, JSON.stringify(proof, null, 2) + '\n', {flag: 'wx'});
            if (active.size) throw new Error('Another active benchmark on this task branch prevents diagnostic');

      - name: Run e2e benchmark
        id: bench
        env:
          BASELINE_REF: ${{ steps.refs.outputs.baseline-ref }}
          FEATURE_REF: ${{ steps.refs.outputs.feature-ref }}
          BASELINE_NAME: ${{ steps.refs.outputs.baseline-name }}
          FEATURE_NAME: ${{ steps.refs.outputs.feature-name }}
        run: |
          if [ "$BENCH_OTLP" != "true" ]; then
            unset TEMPO_TELEMETRY_URL
            unset GRAFANA_TEMPO
            unset OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            unset OTEL_EXPORTER_OTLP_HEADERS
          fi
          if ! [[ "$BENCH_RUN_PAIRS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::run-pairs must be a positive integer"
            exit 1
          fi
          if [ "$BENCH_RUN_SIDE" != "comparison" ] && [ "$BENCH_RUN_SIDE" != "feature" ] && [ "$BENCH_RUN_SIDE" != "baseline" ]; then
            echo "::error::run-side must be one of: comparison, feature, baseline"
            exit 1
          fi
          if [ "$BENCH_SEQUENTIAL_PEER" = "true" ]; then
            if [ "$BENCH_RUN_SIDE" != "feature" ] || [ "$BENCH_SKIP_STATE_ROOT" = "true" ] || [ "$BENCH_NO_SLACK" != "true" ]; then
              echo "::error::sequential-peer requires feature-only, state-root validation, and no-slack"
              exit 1
            fi
            # Correctness checks must not enter the performance reporting series.
            CLICKHOUSE_URL=""
            unset CLICKHOUSE_USER CLICKHOUSE_PASSWORD
            BENCH_VICTORIAMETRICS_URL=""
          fi
          if [ "$BENCH_SEQUENTIAL_PEER_BASELINE" = "true" ] && [ "$BENCH_SEQUENTIAL_PEER" != "true" ]; then
            echo "::error::sequential-peer-baseline requires sequential-peer"
            exit 1
          fi
          if [ "$BENCH_RUN_SIDE" = "baseline" ] && [ "$BENCH_CLICKHOUSE_RUN" = "feature-1" ]; then
            BENCH_CLICKHOUSE_RUN="baseline-1"
          fi
          if [ "$BENCH_DISPOSAL_CLOCK" = "true" ]; then
            if [ "$BASELINE_REF" != "$FEATURE_REF" ] || [ "$BENCH_RUN_SIDE" != "comparison" ] || [ "$BENCH_OTLP" != "true" ] || [ "$BENCH_SKIP_STATE_ROOT" = "true" ] || [ "$BENCH_VALSCOPE" = "true" ] || [ "$BENCH_METRICS" = "true" ]; then
              echo "::error::disposal-clock requires same-source comparison, unchanged OTLP, state-root validation, and no performance publication"
              exit 1
            fi
            # Keep node tracing and the normal sender metrics collection. This
            # diagnostic must not enter the performance result series or Slack.
            CLICKHOUSE_URL=""
            unset CLICKHOUSE_USER CLICKHOUSE_PASSWORD
            # Pin the same direct compiler path for both freshly built node and
            # clock artifacts; the job normally inherits RUSTC_WRAPPER=sccache.
            export RUSTC_WRAPPER="" RUSTC_WORKSPACE_WRAPPER=""
            # Preserve CI's nonincremental setting for both node and clock builds.
            export CARGO_INCREMENTAL=0
          fi
          if [ "$BENCH_OWNED_DIAGNOSTIC" = "true" ]; then
            if [ "$BASELINE_REF" != "$FEATURE_REF" ]; then
              echo "::error::producer-isolation requires one identical node source"
              exit 1
            fi
            CLICKHOUSE_URL=""
            unset CLICKHOUSE_USER CLICKHOUSE_PASSWORD
            BENCH_VICTORIAMETRICS_URL=""
          fi
          if ! [[ "$BENCH_TOKEN_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::token-count must be a positive integer"
            exit 1
          fi
          if [ "$BENCH_TOKEN_COUNT" -gt 4 ]; then
            echo "::error::token-count must be <= 4, matching the TIP20 tokens available in state bloat"
            exit 1
          fi
          cmd=(nu bench-e2e.nu e2e)
          cmd+=(
            --preset "$BENCH_PRESET"
            --bloat "$BENCH_BLOAT"
            --token-count "$BENCH_TOKEN_COUNT"
            --duration "$BENCH_DURATION"
            --run-pairs "$BENCH_RUN_PAIRS"
            --run-side "$BENCH_RUN_SIDE"
            --tps "$BENCH_TPS"
            --accounts "$BENCH_ACCOUNTS"
            --max-concurrent-requests "$BENCH_MAX_CONCURRENT_REQUESTS"
            --gas-limit "$BENCH_GAS_LIMIT"
            --baseline "$BASELINE_REF"
            --feature "$FEATURE_REF"
            --baseline-name "$BASELINE_NAME"
            --feature-name "$FEATURE_NAME"
            --tune
            --no-default-features
            --features "$BENCH_FEATURES"
            --skip-summary
          )
          [ -n "$BENCH_TXGEN_SPEC_PATH" ] && cmd+=(--preset-path "$BENCH_TXGEN_SPEC_PATH")
          [ "$BENCH_FORCE_BLOAT" = "true" ] && cmd+=(--force-bloat)
          [ "$BENCH_NO_CACHE" = "true" ] && cmd+=(--no-cache)
          [ "$BENCH_ARTIFACTS_ONLY" = "true" ] && cmd+=(--artifacts-only)
          [ "$BENCH_SEQUENTIAL_PEER" = "true" ] && cmd+=(--sequential-peer)
          [ "$BENCH_SEQUENTIAL_PEER_BASELINE" = "true" ] && cmd+=(--sequential-peer-baseline)
          [ "$BENCH_DISPOSAL_CLOCK" = "true" ] && cmd+=(--disposal-clock-calibration)
          if [ "$BENCH_PRODUCER_ISOLATION" = "true" ]; then
            cmd+=(--producer-isolation --producer-build "$BENCH_PRODUCER_BUILD" --producer-lifecycle "$BENCH_PRODUCER_LIFECYCLE")
          fi
          if [ "$BENCH_PIPELINE_PRESSURE" = "true" ]; then
            cmd+=(--pipeline-pressure --producer-build "$BENCH_PRODUCER_BUILD" --producer-lifecycle "$BENCH_PRODUCER_LIFECYCLE")
          fi
          [ "$BENCH_SAMPLY" = "true" ] && cmd+=(--samply)
          [ -n "$BENCH_SAMPLY_ARGS" ] && cmd+=(--samply-args="$BENCH_SAMPLY_ARGS")
          [ "$BENCH_SCHED_TRACE" = "true" ] && cmd+=(--scheduler-trace)
          [ "$BENCH_TRACY" != "off" ] && cmd+=(--tracy "$BENCH_TRACY" --tracy-seconds "$BENCH_TRACY_SECONDS" --tracy-offset "$BENCH_TRACY_OFFSET")
          effective_baseline_args="$BENCH_BASELINE_ARGS"
          effective_feature_args="$BENCH_FEATURE_ARGS"
          if [ "$BENCH_SKIP_STATE_ROOT" = "true" ]; then
            effective_baseline_args="${effective_baseline_args:+$effective_baseline_args }--debug.skip-state-root"
            effective_feature_args="${effective_feature_args:+$effective_feature_args }--debug.skip-state-root"
          fi
          [ -n "$BENCH_GENERAL_GAS_LIMIT" ] && cmd+=(--general-gas-limit "$BENCH_GENERAL_GAS_LIMIT")
          [ -n "$BENCH_BASELINE_HARDFORK" ] && cmd+=(--baseline-hardfork="$BENCH_BASELINE_HARDFORK")
          [ -n "$BENCH_FEATURE_HARDFORK" ] && cmd+=(--feature-hardfork="$BENCH_FEATURE_HARDFORK")
          [ -n "$BENCH_BASELINE_FEATURES" ] && cmd+=(--baseline-features="$BENCH_BASELINE_FEATURES")
          [ -n "$BENCH_FEATURE_FEATURES" ] && cmd+=(--feature-features="$BENCH_FEATURE_FEATURES")
          [ -n "$effective_baseline_args" ] && cmd+=(--baseline-args="$effective_baseline_args")
          [ -n "$effective_feature_args" ] && cmd+=(--feature-args="$effective_feature_args")
          [ -n "$BENCH_BENCH_ARGS" ] && cmd+=(--bench-args="$BENCH_BENCH_ARGS")
          [ -n "$BENCH_BENCH_ENV" ] && cmd+=(--bench-env="$BENCH_BENCH_ENV")
          [ -n "$BENCH_BASELINE_ENV" ] && cmd+=(--baseline-env="$BENCH_BASELINE_ENV")
          [ -n "$BENCH_FEATURE_ENV" ] && cmd+=(--feature-env="$BENCH_FEATURE_ENV")
          { [ "$BENCH_METRICS" = "true" ] || [ "$BENCH_VALSCOPE" = "true" ]; } && [ -n "$BENCH_VICTORIAMETRICS_URL" ] && cmd+=(--victoriametrics-url "$BENCH_VICTORIAMETRICS_URL")
          [ -n "$CLICKHOUSE_URL" ] && cmd+=(--clickhouse-url "$CLICKHOUSE_URL")
          [ -n "$BENCH_RUN_TYPE" ] && cmd+=(--run-type "$BENCH_RUN_TYPE")
          [ -n "$BENCH_CLICKHOUSE_RUN" ] && cmd+=(--clickhouse-run "$BENCH_CLICKHOUSE_RUN")
          if [ "$BENCH_VALSCOPE" = "true" ]; then
            if [ ! -f "valscope/apps/api/Cargo.toml" ]; then
              echo "::error::ValScope static report builder not found"
              exit 1
            fi
            cmd+=(--valscope-static-report --valscope-dir "valscope")
          fi

          quote_arg() {
            local value="$1"
            if [[ "$value" =~ ^[A-Za-z0-9._/:=@+-]+$ ]]; then
              printf '%s' "$value"
            else
              printf "'%s'" "${value//\'/\'\\\'\'}"
            fi
          }

          quote_derek_arg() {
            local arg="$1"
            if [[ "$arg" == *=* ]]; then
              local name="${arg%%=*}"
              local value="${arg#*=}"
              if [[ "$value" =~ ^[A-Za-z0-9._/:=@+-]+$ ]]; then
                printf '%s=%s' "$name" "$value"
              else
                value="${value//\\/\\\\}"
                value="${value//\"/\\\"}"
                printf '%s=\"%s\"' "$name" "$value"
              fi
            else
              quote_arg "$arg"
            fi
          }

          derek_cmd=(derek bench mode="$BENCH_MODE")
          derek_cmd+=(
            preset="$BENCH_PRESET"
            duration="$BENCH_DURATION"
            bloat="$BENCH_BLOAT"
            token-count="$BENCH_TOKEN_COUNT"
            tps="$BENCH_TPS"
            accounts="$BENCH_ACCOUNTS"
            max-concurrent-requests="$BENCH_MAX_CONCURRENT_REQUESTS"
            baseline="$BASELINE_NAME"
            feature="$FEATURE_NAME"
            baseline-hardfork="$BENCH_BASELINE_HARDFORK"
            feature-hardfork="$BENCH_FEATURE_HARDFORK"
            gas-limit="$BENCH_GAS_LIMIT"
            run-pairs="$BENCH_RUN_PAIRS"
            run-side="$BENCH_RUN_SIDE"
            otlp="$BENCH_OTLP"
            metrics="$BENCH_METRICS"
            no-cache="$BENCH_NO_CACHE"
            force-bloat="$BENCH_FORCE_BLOAT"
          )
          [ -n "$BENCH_GENERAL_GAS_LIMIT" ] && derek_cmd+=(general-gas-limit="$BENCH_GENERAL_GAS_LIMIT")
          [ -n "$BENCH_TXGEN_REF" ] && derek_cmd+=(txgen-ref="$BENCH_TXGEN_REF")
          [ "$BENCH_SAMPLY" = "true" ] && derek_cmd+=(samply)
          [ "$BENCH_TRACY" != "off" ] && derek_cmd+=(tracy="$BENCH_TRACY" tracy-seconds="$BENCH_TRACY_SECONDS" tracy-offset="$BENCH_TRACY_OFFSET")
          [ "$BENCH_SKIP_STATE_ROOT" = "true" ] && derek_cmd+=(skip-state-root)
          [ -n "$BENCH_BASELINE_FEATURES" ] && derek_cmd+=(baseline-features="$BENCH_BASELINE_FEATURES")
          [ -n "$BENCH_FEATURE_FEATURES" ] && derek_cmd+=(feature-features="$BENCH_FEATURE_FEATURES")
          [ -n "$BENCH_BASELINE_ARGS" ] && derek_cmd+=(baseline-args="$BENCH_BASELINE_ARGS")
          [ -n "$BENCH_FEATURE_ARGS" ] && derek_cmd+=(feature-args="$BENCH_FEATURE_ARGS")
          [ -n "$BENCH_BENCH_ARGS" ] && derek_cmd+=(bench-args="$BENCH_BENCH_ARGS")
          [ -n "$BENCH_BENCH_ENV" ] && derek_cmd+=(bench-env="$BENCH_BENCH_ENV")
          [ -n "$BENCH_BASELINE_ENV" ] && derek_cmd+=(baseline-env="$BENCH_BASELINE_ENV")
          [ -n "$BENCH_FEATURE_ENV" ] && derek_cmd+=(feature-env="$BENCH_FEATURE_ENV")
          DEREK_BENCH_COMMAND=""
          # The bot parser cannot reproduce artifacts-only, custom Samply options
          # or scheduler/disposal clock controls. Omit unsupported shortcuts from summaries.
          if [ "$BENCH_ARTIFACTS_ONLY" != "true" ] && [ "$BENCH_DISPOSAL_CLOCK" != "true" ] && [ "$BENCH_OWNED_DIAGNOSTIC" != "true" ] && [ "$BENCH_SCHED_TRACE" != "true" ] && [ -z "$BENCH_SAMPLY_ARGS" ]; then
            for arg in "${derek_cmd[@]}"; do
              if [ -n "$DEREK_BENCH_COMMAND" ]; then
                DEREK_BENCH_COMMAND+=" "
              fi
              DEREK_BENCH_COMMAND+="$(quote_derek_arg "$arg")"
            done
          elif [ -n "$BENCH_SAMPLY_ARGS" ] || [ "$BENCH_SCHED_TRACE" = "true" ]; then
            # Preserve the actual Nu argv with protected values referenced by
            # environment variable, never copied into the uploaded artifact.
            mkdir -p bench-results
            {
              printf '#!/usr/bin/env bash\nset -euo pipefail\n'
              printf '# Profiling diagnostic runtime command; run from the same workflow checkout.\n'
              printf '# Protected reporter URLs and extra environment values must be supplied through the named environment variables.\n'
              printf '# This is a Bash/Nu command, not a supported Derek bot command.\n'
              if [ "$BENCH_SAMPLY_BUFFERED" = "true" ]; then
                printf '%s\n' ': "${BENCH_SAMPLY_BINARY:?Set the absolute path to the matching buffered recorder from samply-provenance.json}"'
                printf 'test "$(sha256sum -- "$BENCH_SAMPLY_BINARY" | cut -d " " -f 1)" = %q\n' "$BENCH_SAMPLY_BINARY_SHA256"
                printf '%s\n' 'export BENCH_SAMPLY_BINARY'
              fi
              samply_command_env=""
              for arg in "${cmd[@]}"; do
                if [ -n "$samply_command_env" ]; then
                  printf '"${%s:?}" ' "$samply_command_env"
                  samply_command_env=""
                  continue
                fi
                case "$arg" in
                  --clickhouse-url) samply_command_env=CLICKHOUSE_URL ;;
                  --victoriametrics-url) samply_command_env=BENCH_VICTORIAMETRICS_URL ;;
                  --bench-env=*) printf '%s ' '--bench-env="${BENCH_BENCH_ENV:?}"'; continue ;;
                  --baseline-env=*) printf '%s ' '--baseline-env="${BENCH_BASELINE_ENV:?}"'; continue ;;
                  --feature-env=*) printf '%s ' '--feature-env="${BENCH_FEATURE_ENV:?}"'; continue ;;
                esac
                printf '%q ' "$arg"
              done
              printf '\n'
            } > bench-results/samply-benchmark-command.sh
          fi
          export DEREK_BENCH_COMMAND
          echo "DEREK_BENCH_COMMAND=$DEREK_BENCH_COMMAND" >> "$GITHUB_ENV"

          if [ "$BENCH_OWNED_DIAGNOSTIC" = "true" ]; then
            # Advisory ownership for cooperating diagnostics on this runner. The
            # independently captured Actions evidence has the narrower stated scope.
            exec 200>"$RUNNER_TEMP/tempo-producer-isolation.lock"
            flock -n 200 || { echo '::error::Another producer diagnostic holds the runner lock'; exit 1; }
            # Keep this lock from prestate capture through the entire control
            # invocation. No Nu snapshot/tuning mutation precedes capture.
            sudo -n python3 benchmarks/parallel-execution/producer_lifecycle.py capture \
              --config "$BENCH_PRODUCER_LIFECYCLE"
            mapfile -t ownership < <(python3 - "$BENCH_PRODUCER_LIFECYCLE" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1]))
          print(config['control_unit'])
          print(config['unit_description'])
          PY
            )
            [ "${#ownership[@]}" -eq 2 ]
            # No PAM transition: setpriv restores the runner UID/GID/groups.
            # Runtime evidence records actual inherited constraints after this route.
            # Preserve secrets as environment; never serialize them into argv.
            control_cmd=(sudo -n --preserve-env env PATH="$PATH" systemd-run --scope --slice=system.slice \
              --quiet --collect --same-dir --unit "${ownership[0]}" --description "${ownership[1]}" \
              setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups "${cmd[@]}")
            if [ "$BENCH_PIPELINE_PRESSURE" = "true" ]; then
              timeout --signal=TERM --kill-after=30s 900s "${control_cmd[@]}"
            else
              "${control_cmd[@]}"
            fi
          else
            "${cmd[@]}"
          fi

      - name: Restore producer host and snapshots
        id: producer-cleanup
        if: ${{ always() && env.BENCH_OWNED_DIAGNOSTIC == 'true' && steps.producer-ownership.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          # This step is outside the control scope and must run on cancellation.
          # Settings restoration and proven empty scopes gate every snapshot restore.
          capture_state="$(sudo -n python3 - "$BENCH_PRODUCER_LIFECYCLE" <<'PY'
          import os, pathlib, sys
          prestate = pathlib.Path(sys.argv[1]).parent / 'prestate.json'
          try:
              os.stat(prestate)
          except FileNotFoundError:
              print('absent')
          else:
              print('captured')
          PY
          )"
          if [ "$capture_state" = absent ]; then
            # No capture means the guarded Nu control command was never launched.
            # The outer result still fails unless a complete measurement exists.
            exit 0
          fi
          nu bench-e2e.nu producer-cleanup --lifecycle "$BENCH_PRODUCER_LIFECYCLE"

      - name: Qualify diagnostic cleanup
        if: ${{ always() && env.BENCH_OWNED_DIAGNOSTIC == 'true' && steps.producer-ownership.outcome != 'skipped' }}
        env:
          PRODUCER_BENCH_OUTCOME: ${{ steps.bench.outcome }}
          PRODUCER_CLEANUP_OUTCOME: ${{ steps.producer-cleanup.outcome }}
          PRODUCER_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          if [ -n "${BENCH_PRODUCER_LIFECYCLE:-}" ]; then
            # Change only known regular artifacts, with no recursive traversal
            # or symlink following, so failed root-owned journals can be uploaded.
            sudo -n python3 - "$BENCH_PRODUCER_LIFECYCLE" "$(id -u)" "$(id -g)" <<'PY'
          import os, pathlib, stat, sys
          directory = pathlib.Path(sys.argv[1]).parent
          for name in ('config.json', 'lock', 'prestate.json', 'journal.json', 'runner-preflight.json',
                       'actions-snapshot.json', 'exclusivity.json', 'results-location.json', 'cleanup.json'):
              try:
                  fd = os.open(directory / name, os.O_RDONLY | os.O_NOFOLLOW)
              except FileNotFoundError:
                  continue
              try:
                  if not stat.S_ISREG(os.fstat(fd).st_mode):
                      raise SystemExit('Unexpected lifecycle artifact type')
                  os.fchown(fd, int(sys.argv[2]), int(sys.argv[3]))
              finally:
                  os.close(fd)
          PY
          fi
          python3 - <<'PY'
          import json, os, pathlib, time
          directory = pathlib.Path(os.environ['BENCH_PRODUCER_LIFECYCLE']).parent
          pressure = os.environ['BENCH_PIPELINE_PRESSURE'] == 'true'
          errors = []
          for name in ('PRODUCER_BENCH_OUTCOME', 'PRODUCER_CLEANUP_OUTCOME'):
              if os.environ.get(name) != 'success': errors.append(name + ' was not success')
          if os.environ.get('PRODUCER_CANCELLED') != 'false': errors.append('outer workflow cancelled')
          try:
              journal = json.loads((directory / 'journal.json').read_text())
              cleanup = json.loads((directory / 'cleanup.json').read_text())
              location = json.loads((directory / 'results-location.json').read_text())
              results = pathlib.Path(location['results_dir']) / 'producer-isolation'
              if journal.get('status') != 'restored' or cleanup.get('complete') is not True:
                  errors.append('host/snapshot cleanup was not verified')
              if pressure:
                  # Raw stage records require independent review, even after a
                  # successful pipeline, report and cleanup.
                  report = pathlib.Path(location['results_dir']) / 'report-feature-1.json'
                  if not report.is_file() or report.stat().st_size == 0:
                      errors.append('pipeline report missing')
              else:
                  exit_record = json.loads((results / 'supervisor-exit.json').read_text())
                  result = json.loads((results / 'attempt/result.json').read_text())
                  if exit_record.get('exit_code') != 0:
                      errors.append('helper did not exit zero')
                  if result.get('status') != 'valid_output_measurement' or result.get('cleanup_complete') is not True or result.get('test_limits') is not False:
                      errors.append('helper result does not qualify')
          except Exception as error:
              errors.append(type(error).__name__ + ': ' + str(error))
          verdict = {'status': 'invalid' if errors else ('cleanup_verified_requires_stage_audit' if pressure else 'qualified_diagnostic'), 'errors': errors,
              'captured_realtime_ns': time.time_ns(), 'accepted_chain_capacity_claim': False,
              'performance_series_publication': False, 'slack_publication': False,
              'requires_terminal_workflow_success': True}
          if not errors and not pressure:
              verdict['decision'] = result['decision']
              verdict['accounting'] = result['accounting']
          (directory / 'outer-result.json').write_text(json.dumps(verdict, indent=2) + '\n')
          if errors: raise SystemExit('Producer diagnostic failed outer lifecycle qualification')
          print(json.dumps(verdict, indent=2))
          PY

      - name: Verify buffered recorder after benchmark
        if: ${{ always() && steps.samply-buffered.outputs.binary != '' }}
        env:
          VERIFY_SAMPLY_BINARY: ${{ steps.samply-buffered.outputs.binary }}
          VERIFY_SAMPLY_SHA256: ${{ steps.samply-buffered.outputs.binary_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          output = pathlib.Path('bench-results/samply-provenance.json')
          output.parent.mkdir(exist_ok=True)
          provenance = json.loads(output.read_text()) if output.exists() else {
              'mode': 'samply-buffered', 'preflight_binary_verified': False,
          }
          verification = {
              'binary_path': os.environ['VERIFY_SAMPLY_BINARY'],
              'expected_sha256': os.environ['VERIFY_SAMPLY_SHA256'],
              'scope': 'After benchmark step or prior failure; binary identity only, not capture quality.',
          }
          try:
              with pathlib.Path(verification['binary_path']).open('rb') as source:
                  verification['actual_sha256'] = hashlib.file_digest(source, 'sha256').hexdigest()
          except OSError as error:
              verification['error'] = type(error).__name__
          verification['verified'] = (
              verification.get('actual_sha256') == verification['expected_sha256']
              and provenance.get('binary_sha256', verification['expected_sha256']) == verification['expected_sha256'])
          provenance['post_benchmark_binary_verification'] = verification
          output.write_text(json.dumps(provenance, indent=2) + '\n')
          if not verification['verified']:
              raise SystemExit('Buffered Samply binary changed or disappeared after build')
          print('Buffered Samply binary hash verified after benchmark step or prior failure.')
          PY

      - name: Generate e2e summary
        id: results-dir
        if: success() && env.BENCH_OWNED_DIAGNOSTIC != 'true'
        run: |
          RESULTS_DIR=$(find bench-results -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -z "$RESULTS_DIR" ]; then
            echo "::error::No results directory found"
            exit 1
          fi
          nu bench-e2e.nu summarize "$RESULTS_DIR"
          echo "path=$RESULTS_DIR" >> "$GITHUB_OUTPUT"
          echo "Results directory: $RESULTS_DIR"

      - name: Publish ValScope static reports
        id: publish-valscope-static
        if: success() && env.BENCH_VALSCOPE == 'true' && steps.results-dir.outputs.path != '' && hashFiles('bench-results/*/valscope-static/index.html') != ''
        env:
          BENCH_RESULTS_DIR: ${{ steps.results-dir.outputs.path }}
        run: |
          rm -rf tempo-bench-valscope-static
          cp -a "$BENCH_RESULTS_DIR/valscope-static" tempo-bench-valscope-static
          destination="valscope-bench/valscope-bench-reports-dev/${BENCHMARK_ID}"
          mc cp --recursive tempo-bench-valscope-static/ "$destination"
          if [ -n "${VALSCOPE_REPORTS_BASE_URL:-}" ]; then
            echo "url=${VALSCOPE_REPORTS_BASE_URL%/}/${BENCHMARK_ID}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload results
        if: ${{ always() && (!cancelled() || env.BENCH_DISPOSAL_CLOCK == 'true' || env.BENCH_OWNED_DIAGNOSTIC == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempo-bench-results
          path: bench-results/

      # Benchmark runs can outlive GitHub App tokens' one-hour lifetime.
      # Refresh for comment updates, including failure/cancellation. Manual runs
      # without a comment only write the job summary and use Slack's own token.
      - name: Refresh GitHub token via STS
        id: github-sts-reporting
        if: always() && steps.github-sts.outcome == 'success' && env.BENCH_COMMENT_ID
        timeout-minutes: 2
        uses: tempoxyz/gh-actions/actions/github-sts@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
        with:
          policy: bench-e2e

      - name: Post results to PR
        if: success() && env.BENCH_OWNED_DIAGNOSTIC != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCH_RESULTS_DIR: ${{ steps.results-dir.outputs.path }}
          BENCH_VALSCOPE_PUBLISHED_URL: ${{ steps.publish-valscope-static.outputs.url }}
        with:
          github-token: ${{ steps.github-sts-reporting.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const resultsDir = process.env.BENCH_RESULTS_DIR;

            let summary = '';
            try {
              summary = fs.readFileSync(`${resultsDir}/summary.md`, 'utf8');
            } catch (e) {
              summary = '⚠️ Benchmark completed but failed to read summary.';
            }

            let valscopeLine = '';
            try {
              const publishedUrl = process.env.BENCH_VALSCOPE_PUBLISHED_URL || '';
              const publishedBase = publishedUrl ? (publishedUrl.endsWith('/') ? publishedUrl : `${publishedUrl}/`) : '';
              if (publishedBase) {
                const manifest = JSON.parse(fs.readFileSync(`${resultsDir}/valscope-static/reports.json`, 'utf8'));
                const links = (manifest.runs || []).map(run => {
                  return `[${run.run}](${new URL(run.path, publishedBase).toString()})`;
                });
                if (links.length > 0) {
                  valscopeLine = `- ValScope: ${links.join(' | ')}\n`;
                }
              }
            } catch (e) {}

            // Compute observability URLs from summary.json.
            let grafanaSection = '';
            let resultHeadline = '✅ Benchmark complete!';
            try {
              const meta = JSON.parse(fs.readFileSync(`${resultsDir}/summary.json`, 'utf8'));
              if (meta.classification?.label) {
                resultHeadline = `${meta.classification.emoji || '✅'} Benchmark complete: ${meta.classification.label}`;
              }
              const benchId = meta.benchmark_id;
              const metricsRange = meta.observability_range || {};
              const actualRange = meta.actual_observability_range || metricsRange;
              const metricsFrom = metricsRange.from || (metricsRange.from_ms ? String(metricsRange.from_ms) : '');
              const metricsTo = metricsRange.to || (metricsRange.to_ms ? String(metricsRange.to_ms) : '');
              const actualFrom = actualRange.from || (actualRange.from_ms ? String(actualRange.from_ms) : '');
              const actualTo = actualRange.to || (actualRange.to_ms ? String(actualRange.to_ms) : '');
              if (benchId && metricsFrom && metricsTo && actualFrom && actualTo) {
                const traceqlQuery = `{resource.benchmark_id="${benchId}"}`;
                const grafanaUrl = meta.grafana_url || `https://tempoxyz.grafana.net/d/dffj6qf1o30oowe/performance?orgId=1&from=${encodeURIComponent(metricsFrom)}&to=${encodeURIComponent(metricsTo)}&timezone=browser&var-datasource=efk1hcn87dnnkd&var-filter_label=benchmark_id&var-filter_value=${encodeURIComponent(benchId)}&var-group_by=benchmark_run`;
                const internalPerfUrl = meta.internal_perf_url || '';
                const logsPane = JSON.stringify({
                  pw4: {
                    datasource: 'cfk1hzy08xekgd',
                    queries: [{
                      refId: 'A',
                      datasource: { type: 'victoriametrics-logs-datasource', uid: 'cfk1hzy08xekgd' },
                      editorMode: 'code',
                      expr: `benchmark_id:${benchId}`,
                      queryType: 'instant',
                    }],
                    range: { from: actualFrom, to: actualTo },
                    panelsState: { logs: { sortOrder: 'Descending', columns: ['Time', 'Line'], visualisationType: 'table', labelFieldName: 'labels' } },
                    compact: false,
                  },
                });
                const logsUrl = `https://tempoxyz.grafana.net/explore?schemaVersion=1&panes=${encodeURIComponent(logsPane)}&orgId=1`;
                const tracesPane = JSON.stringify({
                  g39: {
                    datasource: 'dfk1hrnxca9s0a',
                    queries: [{
                      refId: 'A',
                      datasource: { type: 'tempo', uid: 'dfk1hrnxca9s0a' },
                      queryType: 'traceqlSearch',
                      serviceMapUseNativeHistograms: false,
                      filters: [
                        { id: 'benchmark-id', operator: '=', scope: 'resource', tag: 'benchmark_id', value: [benchId], valueType: 'string', isCustomValue: true },
                      ],
                      query: traceqlQuery,
                    }],
                    range: { from: actualFrom, to: actualTo },
                    panelsState: { logs: { visualisationType: 'table' } },
                    compact: false,
                  },
                });
                const tracesUrl = `https://tempoxyz.grafana.net/explore?schemaVersion=1&panes=${encodeURIComponent(tracesPane)}&orgId=1`;
                const internalPerfLine = internalPerfUrl ? `- [Internal dashboard](${internalPerfUrl})\n` : '';
                const grafanaLine = process.env.BENCH_METRICS === 'true' ? `- [Grafana](${grafanaUrl})\n` : '';
                grafanaSection = `\n${internalPerfLine}${grafanaLine}- [Logs](${logsUrl})\n- [Traces](${tracesUrl})\n${valscopeLine}`;
              }
            } catch (e) {}

            let runs = [];
            try {
              runs = fs.readFileSync(`${resultsDir}/run-order.txt`, 'utf8')
                .split(/\r?\n/)
                .map(run => run.trim())
                .filter(run => run && fs.existsSync(`${resultsDir}/report-${run}.json`));
            } catch (e) {}
            if (runs.length === 0) {
              runs = fs.readdirSync(resultsDir)
                .map(name => /^report-(.+)\.json$/.exec(name)?.[1])
                .filter(Boolean)
                .sort();
            }

            // Samply profile links (URLs produced by tempo.nu upload-samply-profile)
            let samplySection = '';
            if (process.env.BENCH_SAMPLY === 'true') {
              const links = [];
              for (const run of runs) {
                for (const role of ['a', 'b']) {
                  try {
                    const url = fs.readFileSync(`${resultsDir}/profile-${run}-${role}-url.txt`, 'utf8').trim();
                    if (url) links.push(`- **${run} / ${role}**: [Firefox Profiler](${url})`);
                  } catch (e) {}
                }
              }
              if (links.length > 0) {
                samplySection = `\n\n### Samply Profiles\n\n${links.join('\n')}\n`;
              }
            }

            // Tracy profile links (URLs produced by tempo.nu upload-tracy-profile).
            // Local e2e enables Tracy only on validator a to keep one node per capture.
            let tracySection = '';
            if (process.env.BENCH_TRACY && process.env.BENCH_TRACY !== 'off') {
              const links = [];
              for (const run of runs) {
                try {
                  const viewerUrl = fs.readFileSync(`${resultsDir}/tracy-${run}-url.txt`, 'utf8').trim();
                  let profileUrl = '';
                  try {
                    profileUrl = fs.readFileSync(`${resultsDir}/tracy-${run}-profile-url.txt`, 'utf8').trim();
                  } catch (e) {}
                  if (viewerUrl) {
                    const profileLink = profileUrl ? ` | [Tracy Profile](${profileUrl})` : '';
                    links.push(`- **${run} / validator a**: [Tracy Viewer](${viewerUrl})${profileLink}`);
                  }
                } catch (e) {}
              }
              if (links.length > 0) {
                tracySection = `\n\n### Tracy Profiles\n\n${links.join('\n')}\n`;
              }
            }

            const jobUrl = process.env.BENCH_JOB_URL || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const observabilityHeading = '\n## Observability\n';
            if (summary.includes(observabilityHeading)) {
              summary = summary.replace(observabilityHeading, () => observabilityHeading + grafanaSection);
            } else if (grafanaSection) {
              summary += observabilityHeading + grafanaSection;
            }
            const body = `cc @${process.env.BENCH_ACTOR}\n\n${resultHeadline} [View job](${jobUrl})\n\n${summary}${samplySection}${tracySection}`;
            const ackCommentId = process.env.BENCH_COMMENT_ID;

            if (ackCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: parseInt(ackCommentId),
                body,
              });
            }

            await core.summary.addRaw(body).write();

      - name: Send Slack notification (success)
        if: success() && steps.results-dir.outputs.path && env.BENCH_NO_SLACK != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCH_WORK_DIR: ${{ steps.results-dir.outputs.path }}
          BENCH_BASELINE_NAME: ${{ steps.refs.outputs.baseline-name }}
          BENCH_FEATURE_NAME: ${{ steps.refs.outputs.feature-name }}
        with:
          script: |
            const notify = require('./.github/scripts/bench-slack-notify.js');
            await notify.e2e.success({ core, context });

      - name: Send Slack notification (failure)
        if: failure() && env.BENCH_NO_SLACK != 'true' && env.BENCH_SLACK != 'on-win'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const notify = require('./.github/scripts/bench-slack-notify.js');
            await notify.e2e.failure({ core, context, failedStep: 'running benchmark' });

      - name: Update status (failed)
        if: failure() && env.BENCH_COMMENT_ID && steps.github-sts-reporting.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.github-sts-reporting.outputs.token }}
          script: |
            const jobUrl = process.env.BENCH_JOB_URL || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: parseInt(process.env.BENCH_COMMENT_ID),
              body: `cc @${process.env.BENCH_ACTOR}\n\n❌ Benchmark failed. [View logs](${jobUrl})`,
            });

      - name: Update status (cancelled)
        if: cancelled() && env.BENCH_COMMENT_ID && steps.github-sts-reporting.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.github-sts-reporting.outputs.token }}
          script: |
            const jobUrl = process.env.BENCH_JOB_URL || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: parseInt(process.env.BENCH_COMMENT_ID),
              body: `cc @${process.env.BENCH_ACTOR}\n\n⚠️ Benchmark cancelled. [View logs](${jobUrl})`,
            });
