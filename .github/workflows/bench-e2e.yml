name: Inspect existing benchmark snapshots

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  inventory:
    name: snapshot inventory (slot ${{ matrix.slot }})
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slot: [1, 2, 3, 4, 5]
    env:
      INVENTORY_SLOT: ${{ matrix.slot }}
      INVENTORY_SOURCE_SHA256: 3d0e85b1774ec7aa2493d062533abcf896ed098d3e3273853948a1c28569c8ec
    steps:
      # No checkout, existing workspace deletion, snapshot command, or dataset read.
      - name: Read bounded snapshot metadata
        id: inventory
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          debug: false
          retries: 0
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const {spawnSync} = require('child_process');
            const need = value => { if (!value) throw new Error(); };
            const keys = (v, names) => v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).sort().join(',') === names.sort().join(',');
            function validate(v, privileged) {
              need(keys(v, ['schema','privileged','schelk_on_path','snapshot_atomic','required_mask','dm_names_distinct','sides','executable_candidates']));
              need(v.schema === 1 && v.privileged === privileged && typeof v.schelk_on_path === 'boolean' && v.snapshot_atomic === false && v.required_mask === 511 && typeof v.dm_names_distinct === 'boolean');
              need(keys(v.executable_candidates, ['cargo_home','home_cargo','usr_local','usr_bin']));
              for (const value of Object.values(v.executable_candidates)) need(typeof value === 'boolean');
              need(Array.isArray(v.sides) && v.sides.length === 2);
              for (const side of v.sides) {
                need(keys(side, ['state','actual_mounted','state_observation_unchanged','mount_observation_unchanged','required','virgin']));
                need(keys(side.state, ['status','mounted','mount_matches','dm_name_valid']));
                need(Number.isInteger(side.state.status) && side.state.status >= 0 && side.state.status <= 4);
                need([0,1,2].includes(side.state.mounted) && [0,1,2].includes(side.actual_mounted));
                for (const value of [side.state.mount_matches,side.state.dm_name_valid,side.state_observation_unchanged,side.mount_observation_unchanged]) need(typeof value === 'boolean');
                need(keys(side.required, ['present','readable','missing','denied','unsafe','other_error']));
                for (const value of Object.values(side.required)) need(Number.isInteger(value) && value >= 0 && value <= 511);
                const virgin = side.virgin;
                need(keys(virgin,['status','ext4','devices_distinct','lock_acquired','state_unchanged','required']));
                need(Number.isInteger(virgin.status) && virgin.status >= 0 && virgin.status <= 7);
                for (const value of [virgin.ext4,virgin.devices_distinct,virgin.lock_acquired,virgin.state_unchanged]) need(typeof value === 'boolean');
                need(keys(virgin.required,['present','missing','unsafe','unavailable']));
                for (const value of Object.values(virgin.required)) need(Number.isInteger(value) && value >= 0 && value <= 511);
                need(Object.values(virgin.required).reduce((mask,value)=>mask|value,0) === 511);
                need(Object.values(virgin.required).reduce((sum,value)=>sum+value,0) === 511);
                if (virgin.status === 0) need(privileged && virgin.ext4 && virgin.devices_distinct && virgin.lock_acquired && virgin.state_unchanged && virgin.required.unavailable === 0);
              }
              return v;
            }
            try {
              const response = await github.rest.repos.getContent({
                ...context.repo, ref: context.sha, path: 'contrib/bench/lifecycle/snapshot_inventory.py',
              });
              const item = response.data;
              need(item.type === 'file' && item.encoding === 'base64' && item.size <= 32768);
              const source = Buffer.from(item.content, 'base64');
              need(source.length === item.size && crypto.createHash('sha256').update(source).digest('hex') === process.env.INVENTORY_SOURCE_SHA256);
              const temporary = fs.realpathSync(process.env.RUNNER_TEMP);
              const directory = fs.mkdtempSync(path.join(temporary, 'tempo-snapshot-inventory-'));
              const identity = fs.lstatSync(directory);
              // Publish ownership before the first file write, including failed writes.
              core.setOutput('directory', directory);
              core.setOutput('owner', JSON.stringify({dev:identity.dev,ino:identity.ino,uid:identity.uid}));
              const helper = path.join(directory, 'inventory.py');
              const output = path.join(directory, 'inventory.json');
              fs.writeFileSync(helper, source, {flag:'wx',mode:0o600});
              function invoke(privileged) {
                const command = privileged ? 'sudo' : '/usr/bin/python3';
                const args = privileged ? ['-n','/usr/bin/python3','-I','-B',helper] : ['-I','-B',helper];
                const result = spawnSync(command,args,{cwd:directory,encoding:'utf8',timeout:45000,maxBuffer:65536});
                need(!result.error && result.status === 0);
                return validate(JSON.parse(result.stdout),privileged);
              }
              const runner = invoke(false);
              const root = invoke(true);
              // Match the actual Nu has-schelk predicate without printing its paths.
              const nu = spawnSync('nu',['--no-config-file','-c','(which schelk | length) > 0 | to json'],{cwd:directory,encoding:'utf8',timeout:10000,maxBuffer:1024});
              need(!nu.error && nu.status === 0);
              const nuVisible = JSON.parse(nu.stdout); need(typeof nuVisible === 'boolean');
              const sudoLookup = spawnSync('sudo',['-n','/bin/sh','-c','command -v schelk >/dev/null'],{cwd:directory,encoding:'utf8',timeout:10000,maxBuffer:1024});
              need(!sudoLookup.error && [0,1,127].includes(sudoLookup.status));
              const sudoVisible = sudoLookup.status === 0;
              need(Number.isSafeInteger(context.runId) && context.runId > 0 && /^[0-9a-f]{40}$/.test(context.sha));
              const attempt = Number(process.env.GITHUB_RUN_ATTEMPT), slot = Number(process.env.INVENTORY_SLOT);
              need(Number.isSafeInteger(attempt) && attempt > 0 && Number.isInteger(slot) && slot >= 1 && slot <= 5);
              const report = {schema:1,workflow_sha:context.sha,source_sha256:process.env.INVENTORY_SOURCE_SHA256,
                run_id:context.runId,run_attempt:attempt,slot,read_only:true,nu_has_schelk:nuVisible,sudo_has_schelk:sudoVisible,runner,root};
              fs.writeFileSync(output,JSON.stringify(report)+'\n',{flag:'wx',mode:0o600});
              core.setOutput('path',output);
              core.info('Closed read-only snapshot inventory prepared');
            } catch (_) {
              core.setFailed('Read-only snapshot inventory unavailable');
            }
      - name: Upload closed snapshot inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapshot-inventory-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
          path: ${{ steps.inventory.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned inventory files
        if: ${{ always() }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          INVENTORY_DIRECTORY: ${{ steps.inventory.outputs.directory }}
          INVENTORY_OWNER: ${{ steps.inventory.outputs.owner }}
        with:
          debug: false
          retries: 0
          script: |
            const fs = require('fs');
            const path = require('path');
            try {
              const directory = process.env.INVENTORY_DIRECTORY;
              if (!directory) { core.info('No owned inventory directory created'); return; }
              const owner = JSON.parse(process.env.INVENTORY_OWNER);
              const temporary = fs.realpathSync(process.env.RUNNER_TEMP);
              if (path.dirname(directory) !== temporary || !/^tempo-snapshot-inventory-[A-Za-z0-9]+$/.test(path.basename(directory))) throw new Error();
              const identity = fs.lstatSync(directory);
              if (!identity.isDirectory() || identity.isSymbolicLink() || identity.dev !== owner.dev || identity.ino !== owner.ino || identity.uid !== owner.uid || identity.uid !== process.getuid()) throw new Error();
              const names = fs.readdirSync(directory);
              if (names.some(name => !['inventory.py','inventory.json'].includes(name))) throw new Error();
              for (const name of names) {
                const file = path.join(directory,name), value = fs.lstatSync(file);
                if (!value.isFile() || value.isSymbolicLink() || value.dev !== identity.dev || value.uid !== identity.uid) throw new Error();
              }
              for (const name of names) fs.unlinkSync(path.join(directory,name));
              const after = fs.lstatSync(directory);
              if (after.dev !== identity.dev || after.ino !== identity.ino) throw new Error();
              fs.rmdirSync(directory);
              core.info(JSON.stringify({schema:1,status:0,removed_files:names.length}));
            } catch (_) { core.setFailed('Owned inventory cleanup failed'); }
