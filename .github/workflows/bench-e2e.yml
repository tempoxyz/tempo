name: Inspect benchmark listeners

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 5
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - name: Inspect benchmark listeners
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          listeners=$(sudo ss -H -ltnp '( sport >= :8000 and sport <= :8651 ) or sport = :9001 or sport = :9101')
          printf '%s\n' "$listeners"
          mapfile -t pids < <(printf '%s\n' "$listeners" | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
          for pid in "${pids[@]}"; do
            sudo ps -o pid,ppid,user,lstart,comm -p "$pid" || true
            sudo readlink "/proc/$pid/exe" || true
            sudo readlink "/proc/$pid/cwd" || true
            sudo readlink "/proc/$pid/fd/1" "/proc/$pid/fd/2" || true
            # Show script paths only; other arguments may contain credentials.
            sudo cat "/proc/$pid/cmdline" | while IFS= read -r -d '' arg; do
              case "$arg" in
                /*.js|/*.mjs|/*.cjs) printf 'Node script: %s\n' "$arg" ;;
              esac
            done
            sudo cat "/proc/$pid/cgroup" || true
            if [[ "$RUNNER_NAME" == ghr-euw-03 && ( "$pid" == 3040777 || "$pid" == 202536 ) ]]; then
              if [[ "$pid" == 3040777 ]]; then
                revision=e813067e922303348ee5aad965f745803cc24f1f
              else
                revision=947d9a3ccb2425a9c94d563fd721cc0e33c89e26
              fi
              expected="/opt/actions-runner/_work/_actions/tempoxyz/gh-actions/$revision/actions/aegis/token-server.cjs"
              ppid=$(sudo ps -o ppid= -p "$pid")
              [[ "${ppid//[[:space:]]/}" == 1 ]]
              [[ "$(sudo readlink "/proc/$pid/exe")" == /opt/actions-runner/externals.2.337.0/node24/bin/node ]]
              [[ "$(sudo readlink "/proc/$pid/cwd")" == '/opt/actions-runner/_work/tempo/tempo (deleted)' ]]
              sudo cat "/proc/$pid/cmdline" | tr '\0' '\n' | grep -Fx -- "$expected" >/dev/null
              sudo kill -TERM "$pid"
              echo "Removed identified legacy orphan PID $pid"
            fi

          done
          # Keep each slot occupied briefly so the matrix samples different hosts.
          sleep 30
