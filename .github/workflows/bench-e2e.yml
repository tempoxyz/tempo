# Diagnostic-only branch override; never merge this replacement into main.
name: bench-capacity-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 10
    steps:
      # No checkout/reset, snapshot restore, build, cache access, or validator process.
      - name: Inspect numeric filesystem capacity
        id: capacity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            try {
              const fs = require('fs');
              const path = require('path');
              const {spawnSync} = require('child_process');
              if (!/^[0-9a-f]{40}$/.test(context.sha)) throw Error('pin');
              const response = await github.rest.repos.getContent({
                ...context.repo, ref: context.sha,
                path: 'contrib/bench/lifecycle/capacity_preflight.py'
              });
              const item = response.data;
              if (item.type !== 'file' || item.encoding !== 'base64' || item.size > 65536) throw Error('source');
              const source = Buffer.from(item.content, 'base64').toString('utf8');
              const result = spawnSync('python3', ['-I', '-c', source], {
                encoding: 'utf8', timeout: 60000, maxBuffer: 65536
              });
              if (result.error || result.status !== 0 || result.stderr) throw Error('probe');
              const report = JSON.parse(result.stdout);
              const roles = ['root', 'workspace', 'runner_temp', 'optional_scratch'];
              if (report.schema !== 1 || !Array.isArray(report.locations) || report.locations.length !== 4) throw Error('schema');
              const fields = ['role','exists','filesystem','total_bytes','free_bytes','read_only','writable','write_tested','status'];
              const statuses = ['unset','invalid_path','missing','redirected','not_directory','changed_directory','read_only','access_denied','write_failed','cleanup_failed','writable','unavailable'];
              const uint = value => value === null || (Number.isSafeInteger(value) && value >= 0);
              const flag = value => value === null || typeof value === 'boolean';
              if (Object.keys(report).sort().join() !== ['locations','schema'].join()) throw Error('keys');
              for (const [i, row] of report.locations.entries()) {
                if (Object.keys(row).sort().join() !== fields.slice().sort().join() || row.role !== roles[i] || !statuses.includes(row.status)) throw Error('row');
                if (typeof row.exists !== 'boolean' || typeof row.write_tested !== 'boolean' || !flag(row.read_only) || !flag(row.writable)) throw Error('flags');
                if (![row.filesystem,row.total_bytes,row.free_bytes].every(uint) || (row.filesystem !== null && (row.filesystem < 1 || row.filesystem > 4))) throw Error('numbers');
              }
              // Upload only the numeric report. Neither the native path nor API errors
              // are printed; a relative owned artifact path avoids exposing checkout names.
              const workspace = process.env.GITHUB_WORKSPACE;
              if (!workspace || fs.realpathSync(workspace) !== path.resolve(workspace)) throw Error('workspace');
              const owned = fs.mkdtempSync(path.join(workspace, '.capacity-preflight-'));
              fs.writeFileSync(path.join(owned, 'capacity.json'), JSON.stringify(report, null, 2), {flag: 'wx', mode: 0o600});
              core.setOutput('artifact-path', path.relative(workspace, path.join(owned, 'capacity.json')));
              core.info(JSON.stringify(report));
            } catch (_) {
              core.setFailed('Numeric capacity preflight unavailable; no benchmark was launched');
            }
      - name: Upload numeric capacity report
        if: steps.capacity.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-capacity-${{ matrix.slot }}
          path: ${{ steps.capacity.outputs.artifact-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
