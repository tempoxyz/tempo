name: execution-cost
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: [self-hosted, Linux, X64, bare-metal-dual-schelk]
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      CARGO_HTTP_TIMEOUT: "180"
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: native
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/execution-cost-revm
          path: revm
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0
        continue-on-error: true
      - name: Build and run controlled measurements
        run: python3 native/scripts/execution-cost-run.py
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-cost
          path: execution-cost-results/
