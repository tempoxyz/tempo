name: Build binaries

permissions: {}

on:
  workflow_dispatch:
    inputs:
      binary:
        default: "tempo"
        description: "Binary to build ('all' builds every listed binary)"
        type: choice
        options:
          - "tempo"
          - "tempo-sidecar"
          - "tempo-zone"
          - "tempo-zone-xtask"
          - "tempo-zone-prover-utils"
          - "tempo-zone-prover-enclave"
          - "tempo-vsock-proxy"
          - "all"
      profile:
        default: "maxperf"
        description: "Build profile"
        type: choice
        options:
          - "release"
          - "maxperf"
          - "profiling"

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    name: Build
    runs-on: depot-ubuntu-latest-16
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        binary: ${{ fromJSON(inputs.binary == 'all' && '["tempo","tempo-sidecar","tempo-zone","tempo-zone-xtask","tempo-zone-prover-utils","tempo-zone-prover-enclave","tempo-vsock-proxy"]' || format('["{0}"]', inputs.binary || 'tempo')) }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/actions/setup-mold@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - name: Build
        env:
          BINARY: ${{ matrix.binary }}
          PROFILE: ${{ inputs.profile || 'dev' }}
        run: cargo build --locked --bin "$BINARY" --profile "$PROFILE"
      - name: Prepare artifact
        env:
          BUILD_PROFILE: ${{ inputs.profile || 'dev' }}
          BIN_NAME: ${{ matrix.binary }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          profile_dir="$BUILD_PROFILE"
          [ "$profile_dir" != dev ] || profile_dir=debug
          output="dist/$BIN_NAME"
          mkdir -p "$output"
          cp "target/$profile_dir/$BIN_NAME" "$output/"
          if [ "$BIN_NAME" = tempo ]; then
            python3 scripts/bundle-history.py --output "$output" --profile "$BUILD_PROFILE"
          fi
          tar czf "dist/$BIN_NAME.tar.gz" -C "$output" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: binary_upload
        with:
          if-no-files-found: "error"
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}.tar.gz
