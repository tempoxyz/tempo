name: Build source-bound benchmark binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuilt-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prebuilt:
    name: Build portable benchmark bundle
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 90
    container:
      image: ubuntu:22.04@sha256:281c5745f657873d78e5531fc5ba8575f46ab7769b94550ac99543f122679986
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates clang curl git libclang-dev \
            libssl-dev libudev-dev pkg-config protobuf-compiler python3
      - name: Checkout producer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: producer
          persist-credentials: false
      - name: Checkout exact validator runtime
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6751d2880e3af0cda0d1b05fd7227645c7a4acf8
          path: runtime
          persist-credentials: false
      - name: Checkout exact workload tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tempoxyz/txgen
          ref: 94f86f186cd18f641eb9699d7e31c9e536de7c17
          path: tools
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          toolchain: 1.98.1
          components: rustfmt
          targets: x86_64-unknown-linux-gnu
      - name: Build and validate private bundle
        env:
          PREBUILT_PRODUCER_SHA: ${{ github.sha }}
          PREBUILT_RUN_ID: ${{ github.run_id }}
          PREBUILT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -I producer/.github/scripts/bench-prebuilt-producer.py \
            --producer producer --runtime runtime --tools tools \
            --output "$RUNNER_TEMP/bench-prebuilt-bundle"
      - name: Upload private prebuilt transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-prebuilt-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-prebuilt-bundle/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
