name: Build source-bound benchmark binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuilt-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prebuilt:
    name: Build portable benchmark bundle
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 90
    container:
      image: ubuntu:22.04@sha256:281c5745f657873d78e5531fc5ba8575f46ab7769b94550ac99543f122679986
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates clang curl git libclang-dev \
            libssl-dev libudev-dev pkg-config protobuf-compiler python3
      - name: Reserve exclusive producer directories
        id: owned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {createHash} = require('node:crypto');
            const {spawnSync} = require('node:child_process');
            const result = await github.rest.repos.getContent({...context.repo,
              path: '.github/scripts/bench-prebuilt-cleanup.py', ref: context.sha});
            if (result.data.encoding !== 'base64' || result.data.size > 65536) throw new Error('cleanup_source_rejected');
            const source = Buffer.from(result.data.content, 'base64');
            if (source.length !== result.data.size || createHash('sha256').update(source).digest('hex') !== 'bf715a33c6edc825c9611d950bb4ad0cbaeee49431ece83c0ab9cdba4b8cddb4') throw new Error('cleanup_source_rejected');
            const child = spawnSync('python3', ['-I', '-c', source.toString(), 'init'], {encoding:'utf8', timeout:30000, maxBuffer:65536});
            if (child.status !== 0 || child.error) throw new Error('cleanup_init_rejected');
            const state = JSON.parse(child.stdout);
            if (state.schema !== 1 || state.roots.length !== 2) throw new Error('cleanup_init_rejected');
            core.setOutput('state', JSON.stringify(state));
            core.setOutput('cleanup_source', source.toString('base64'));
            const work = state.roots[0].parent + '/' + state.roots[0].name;
            const temp = state.roots[1].parent + '/' + state.roots[1].name;
            core.setOutput('relative', state.roots[0].name);
            core.exportVariable('PREBUILT_WORK', work);
            core.exportVariable('PREBUILT_TEMP', temp);
            core.exportVariable('TMPDIR', temp);
            core.exportVariable('CARGO_HOME', temp + '/toolchain-cargo');
            core.exportVariable('RUSTUP_HOME', temp + '/toolchain-rustup');
      - name: Checkout producer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: ${{ steps.owned.outputs.relative }}/producer
          persist-credentials: false
      - name: Checkout exact validator runtime
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f49f8fc4cacdcaaf41119893c28daac19f45f71c
          path: ${{ steps.owned.outputs.relative }}/runtime
          persist-credentials: false
      - name: Checkout exact workload tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tempoxyz/txgen
          ref: 94f86f186cd18f641eb9699d7e31c9e536de7c17
          path: ${{ steps.owned.outputs.relative }}/tools
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          toolchain: 1.98.1
          components: rustfmt
          targets: x86_64-unknown-linux-gnu
      - name: Build and validate private bundle
        env:
          PREBUILT_PRODUCER_SHA: ${{ github.sha }}
          PREBUILT_RUN_ID: ${{ github.run_id }}
          PREBUILT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -I "$PREBUILT_WORK/producer/.github/scripts/bench-prebuilt-producer.py" \
            --producer "$PREBUILT_WORK/producer" --runtime "$PREBUILT_WORK/runtime" --tools "$PREBUILT_WORK/tools" \
            --output "$PREBUILT_TEMP/bundle"
      - name: Upload private prebuilt transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-prebuilt-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PREBUILT_TEMP }}/bundle/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove owned producer files
        if: ${{ always() && steps.owned.outputs.state != '' }}
        timeout-minutes: 8
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREBUILT_OWNED_STATE: ${{ steps.owned.outputs.state }}
          PREBUILT_CLEANUP_SOURCE: ${{ steps.owned.outputs.cleanup_source }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const {spawnSync} = require('node:child_process');
            const encoded = process.env.PREBUILT_CLEANUP_SOURCE;
            if (!encoded || encoded.length > 90000) throw new Error('cleanup_source_rejected');
            const source = Buffer.from(encoded, 'base64');
            if (source.length > 65536 || createHash('sha256').update(source).digest('hex') !== 'bf715a33c6edc825c9611d950bb4ad0cbaeee49431ece83c0ab9cdba4b8cddb4') throw new Error('cleanup_source_rejected');
            const child = spawnSync('python3', ['-I', '-c', source.toString(), 'clean'], {
              input:process.env.PREBUILT_OWNED_STATE, encoding:'utf8', timeout:360000, maxBuffer:65536});
            if (child.stdout) core.info(child.stdout.trim());
            if (child.status !== 0 || child.error) throw new Error('owned_cleanup_failed');
