name: OIDC circuit

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - examples/oidc/**
      - .github/workflows/oidc.yml
  pull_request:
    paths:
      - examples/oidc/**
      - .github/workflows/oidc.yml
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  circuit:
    runs-on: depot-ubuntu-latest-32
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=16384
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: examples/oidc
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@e813067e922303348ee5aad965f745803cc24f1f # 2026-10-02T09-56-31Z-e813067e
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Compile the full RSA circuit
        run: node compile.mjs build
      - name: Test compiled circuit and relay
        run: npm test
        env:
          OIDC_ARTIFACTS: build
          OIDC_WITNESS_PATH: build/valid.wtns
      - name: Check the signed witness against every constraint
        run: npx --no-install snarkjs wtns check build/oidc.r1cs build/valid.wtns
