name: Changelog

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - crates/hardfork/**
      - crates/contracts/**
      - crates/primitives/**
      - crates/chainspec/**
      - crates/alloy/**

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - run: curl -fsSL https://ampcode.com/install.sh | bash

      - uses: tempoxyz/changelogs/check@59d4d403a10ad3072d4f1354c5fe0ac0c34e8a15 # v0.8.2
        with:
          ai: 'amp -x'
          ecosystem: rust
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
