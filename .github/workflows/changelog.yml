name: Changelog

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - crates/hardfork/**
      - crates/contracts/**
      - crates/primitives/**
      - crates/chainspec/**
      - crates/alloy/**

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - run: curl -fsSL https://ampcode.com/install.sh | bash

      - uses: tempoxyz/changelogs/check@4cdda943b3452daf4f6af3dfc25859e03f7b4a31 # 2026-10-21T18-48-43Z-4cdda943
        with:
          ai: 'amp -x'
          ecosystem: rust
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
