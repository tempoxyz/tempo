name: Cargo dependency cooldown

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Reject newly published crates
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@216431dd18ebe7c199654e6c310ed99570ddcc33 # gh-actions#98
        with:
          toolchain: stable
      - name: Enforce Cargo dependency cooldown
        id: cargo_cooldown
        uses: tempoxyz/gh-actions/actions/cargo-cooldown@db0a96e8a2efd76e585c669c1122580087a69b0d # gh-actions#101
        with:
          strict-project-config: "true"
      - name: Export verified Cargo cooldown location
        env:
          VERIFIER_PATH: ${{ steps.cargo_cooldown.outputs.verifier-path }}
          VERIFIER_SHA256: ${{ steps.cargo_cooldown.outputs.verifier-sha256 }}
        run: |
          echo "CARGO_COOLDOWN_BIN=$VERIFIER_PATH" >> "$GITHUB_ENV"
          echo "CARGO_COOLDOWN_SHA256=$VERIFIER_SHA256" >> "$GITHUB_ENV"
      - name: Verify with isolated Cargo policy
        run: .github/scripts/check-cargo-cooldown-lock.sh . cooldown.toml
