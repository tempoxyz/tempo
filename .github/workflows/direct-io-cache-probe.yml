name: direct-io cache probe
on:
  push:
    branches: [onbjerg/static-file-direct-io]
    paths:
      - .github/scripts/bench-cache-snapshot.py
      - .github/scripts/test-bench-cache-snapshot.py
      - .github/workflows/direct-io-cache-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  residency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install file-cache residency utility
        run: sudo apt-get update && sudo apt-get install -y util-linux-extra
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo python3 .github/scripts/test-bench-cache-snapshot.py
