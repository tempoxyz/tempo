# Scheduled replay regression benchmarks.
# State is stored in branch-isolated Actions artifacts for 90 days. Missing or
# expired state uses the existing first-run baseline rules; no state PAT is needed.
#
# Runs nightly per chain: mainnet at 00:00 UTC and testnet at 00:01 UTC.
# The benchmark compares the latest successful nightly Docker commit against
# the last commit that completed this scheduled replay workflow successfully.

name: bench-replay-scheduled

on:
  schedule:
    - cron: "0 0 * * *" # mainnet
    - cron: "1 0 * * *" # testnet
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if no new nightly commit is available"
        required: false
        default: false
        type: boolean
      slack:
        description: "Slack notification policy"
        required: false
        default: "never"
        type: choice
        options:
          - always
          - on-win
          - on-error
          - never
      chain:
        description: "Chain to replay"
        required: false
        default: "mainnet"
        type: choice
        options:
          - mainnet
          - testnet
      blocks:
        description: "Number of blocks to benchmark"
        required: false
        default: "5000"
        type: string
      warmup:
        description: "Number of warmup blocks (default: one-quarter of blocks)"
        required: false
        default: ""
        type: string
      samply:
        description: "Enable samply profiling"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  resolve-refs:
    name: resolve-refs
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
    outputs:
      baseline-ref: ${{ steps.refs.outputs.baseline-ref }}
      baseline-name: ${{ steps.refs.outputs.baseline-name }}
      feature-ref: ${{ steps.refs.outputs.feature-ref }}
      feature-name: ${{ steps.refs.outputs.feature-name }}
      should-skip: ${{ steps.refs.outputs.should-skip }}
      refresh-state: ${{ steps.refs.outputs.refresh-state }}
      is-stale: ${{ steps.refs.outputs.is-stale }}
      stale-age-hours: ${{ steps.refs.outputs.stale-age-hours }}
      nightly-created: ${{ steps.refs.outputs.nightly-created }}
      chain: ${{ steps.config.outputs.chain }}
      blocks: ${{ steps.config.outputs.blocks }}
      warmup: ${{ steps.config.outputs.warmup }}
      samply: ${{ steps.config.outputs.samply }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Resolve inputs
        id: config
        env:
          INPUT_CHAIN: ${{ inputs.chain || '' }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_BLOCKS: ${{ inputs.blocks || '5000' }}
          INPUT_WARMUP: ${{ inputs.warmup || '' }}
          INPUT_SAMPLY: ${{ inputs.samply || 'false' }}
        run: |
          if [ -z "$INPUT_CHAIN" ]; then
            case "$EVENT_SCHEDULE" in
              "0 0 * * *") INPUT_CHAIN="mainnet" ;;
              "1 0 * * *") INPUT_CHAIN="testnet" ;;
              *)
                echo "::error::Unknown scheduled replay cron: $EVENT_SCHEDULE"
                exit 1
                ;;
            esac
          fi

          case "$INPUT_CHAIN" in
            mainnet|testnet) ;;
            *)
              echo "::error::Unknown chain value: $INPUT_CHAIN"
              exit 1
              ;;
          esac

          if ! [[ "$INPUT_BLOCKS" =~ ^[0-9]+$ ]]; then
            echo "::error::blocks must be a non-negative integer"
            exit 1
          fi
          if [ -n "$INPUT_WARMUP" ] && ! [[ "$INPUT_WARMUP" =~ ^[0-9]+$ ]]; then
            echo "::error::warmup must be a non-negative integer"
            exit 1
          fi
          if [ -z "$INPUT_WARMUP" ]; then
            INPUT_WARMUP=$(( INPUT_BLOCKS / 4 ))
          fi

          if [ "$INPUT_SAMPLY" = "true" ]; then
            SAMPLY="true"
          else
            SAMPLY="false"
          fi

          {
            echo "chain=$INPUT_CHAIN"
            echo "blocks=$INPUT_BLOCKS"
            echo "warmup=$INPUT_WARMUP"
            echo "samply=$SAMPLY"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
          BENCH_REPLAY_CHAIN: ${{ steps.config.outputs.chain }}
        run: bash .github/scripts/bench-replay-scheduled-refs.sh "$INPUT_FORCE"

  # Separate from resolve-refs, which save-state needs to succeed to refresh state.
  fail-on-stale:
    needs: resolve-refs
    if: needs.resolve-refs.outputs.is-stale == 'true'
    name: fail-on-stale
    runs-on: ubuntu-latest
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Fail on stale nightly
        run: |
          echo "::error::Nightly Docker build is stale (>24h old). Aborting replay benchmark."
          exit 1

  bench-replay:
    needs: resolve-refs
    if: |
      needs.resolve-refs.outputs.should-skip != 'true' &&
      needs.resolve-refs.outputs.is-stale != 'true'
    name: bench-replay (${{ needs.resolve-refs.outputs.chain }})
    uses: ./.github/workflows/bench-replay.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      chain: ${{ needs.resolve-refs.outputs.chain }}
      pr: ""
      actor: "replay-nightly"
      baseline: ${{ needs.resolve-refs.outputs.baseline-ref }}
      feature: ${{ needs.resolve-refs.outputs.feature-ref }}
      baseline-name: ${{ needs.resolve-refs.outputs.baseline-name }}
      feature-name: ${{ needs.resolve-refs.outputs.feature-name }}
      samply: ${{ needs.resolve-refs.outputs.samply }}
      baseline-args: ""
      feature-args: ""
      blocks: ${{ needs.resolve-refs.outputs.blocks }}
      warmup: ${{ needs.resolve-refs.outputs.warmup }}
      comment-id: ""
      slack: ${{ github.event_name == 'workflow_dispatch' && inputs.slack || 'always' }}
      run-label: ${{ github.event_name == 'schedule' && 'Replay Nightly' || 'Replay Bench' }}
    secrets:
      DEREK_UPDATE_RETH_TOKEN: ${{ secrets.DEREK_UPDATE_RETH_TOKEN }}
      TEMPO_TELEMETRY_URL: ${{ secrets.TEMPO_TELEMETRY_URL }}
      GRAFANA_TEMPO: ${{ secrets.GRAFANA_TEMPO }}
      BENCH_MAINNET_RPC_URL: ${{ secrets.BENCH_MAINNET_RPC_URL }}
      BENCH_TESTNET_RPC_URL: ${{ secrets.BENCH_TESTNET_RPC_URL }}
      SLACK_BENCH_BOT_TOKEN: ${{ secrets.SLACK_BENCH_BOT_TOKEN }}
      SLACK_BENCH_CHANNEL: ${{ secrets.SLACK_BENCH_CHANNEL }}
      CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}

  save-state:
    needs: [resolve-refs, bench-replay]
    # A run skipped or stale on an unchanged nightly re-saves the same state, so a
    # quiet main or Docker outage doesn't age out a baseline that still runs.
    if: |
      !cancelled() &&
      needs.resolve-refs.result == 'success' &&
      (needs.bench-replay.result == 'success' || needs.resolve-refs.outputs.refresh-state == 'true')
    name: save-state
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Prepare benchmark state
        env:
          FEATURE_REF: ${{ needs.resolve-refs.outputs.feature-ref }}
        run: |
          [[ "$FEATURE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/bench-state"
          printf '%s\n' "$FEATURE_REF" > "$RUNNER_TEMP/bench-state/feature-ref"

      - name: Save benchmark state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-state-replay-${{ needs.resolve-refs.outputs.chain }}
          path: ${{ runner.temp }}/bench-state/feature-ref
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  # Pages reth on-call through incident.io on scheduled failures.
  incident-io:
    needs: [resolve-refs, fail-on-stale, bench-replay, save-state]
    if: >-
      !cancelled() &&
      github.event_name == 'schedule' &&
      github.repository == 'tempoxyz/tempo'
    uses: ./.github/workflows/bench-incident-alert.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    permissions:
      id-token: write
    with:
      results: ${{ toJSON(needs) }}
      key: tempo:bench-replay-nightly-${{ needs.resolve-refs.outputs.chain || (github.event.schedule == '1 0 * * *' && 'testnet' || 'mainnet') }}
      name: Nightly ${{ needs.resolve-refs.outputs.chain || (github.event.schedule == '1 0 * * *' && 'testnet' || 'mainnet') }} replay benchmark
      resolve-jobs: bench-replay,save-state
      detail: ${{ needs.resolve-refs.outputs.is-stale == 'true' && format('The nightly Docker build is {0}h old (threshold 24h); check docker.yml.', needs.resolve-refs.outputs.stale-age-hours) || '' }}
      baseline-ref: ${{ needs.resolve-refs.outputs.baseline-ref }}
      feature-ref: ${{ needs.resolve-refs.outputs.feature-ref }}
    secrets:
      INCIDENT_IO_RETH_CI_URL: ${{ secrets.INCIDENT_IO_RETH_CI_URL }}
      INCIDENT_IO_RETH_CI_TOKEN: ${{ secrets.INCIDENT_IO_RETH_CI_TOKEN }}
