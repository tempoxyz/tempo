name: bench-inspect-storage-backing
on:
  push:
    branches: [ejh/20k-tps-10v]
    paths: [.github/workflows/bench-inspect-storage-backing.yml, .github/scripts/bench_storage_backing.py]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure AWS credentials
        uses: tempoxyz/gh-actions/vendor/aws-actions/configure-aws-credentials@3626124474a987bc74b41fc7ae65b2e23f8e4e4e
        with:
          role-to-assume: arn:aws:iam::934822761402:role/benchmark-runner
          aws-region: us-east-1
          role-duration-seconds: 900
      - name: Inspect exact active run database backing metadata
        env:
          AWS_PAGER: ''
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '2'
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, re, subprocess, time
          benchmark = 'bench-e2e-multi-region-33885509741-1'
          bucket = 'tempo-benchmark-artifacts-934822761402-us-east-1'
          key = f'runs/{benchmark}/artifacts/runner/validators.json'
          raw = subprocess.check_output(['aws','s3','cp',f's3://{bucket}/{key}','-',
              '--region','us-east-1','--only-show-errors'], text=True, timeout=30)
          validators = json.loads(raw)
          assert len(validators) == 10 and {item['index'] for item in validators} == set(range(10))
          assert len({item['instance_id'] for item in validators}) == 10
          regions = ('us-east-1','us-west-2','eu-central-1','ap-southeast-1','ap-northeast-1')
          for item in validators:
              assert item['region'] == regions[item['index'] % 5]
              assert re.fullmatch(r'i-[0-9a-f]+', item['instance_id'])
          pathlib.Path('inspection-storage-manifest.json').write_text(json.dumps({
              'benchmark_id': benchmark, 'manifest_sha256': hashlib.sha256(raw.encode()).hexdigest(),
              'identity_validation_passed': True,
              'validators': [{key: item[key] for key in ('index','region','instance_id')} for item in validators]
          }, indent=2))
          source = pathlib.Path('.github/scripts/bench_storage_backing.py').read_text()
          command = "python3 - <<'PY_STORAGE'\n" + source + '\nPY_STORAGE\n'
          source_sha = hashlib.sha256(source.encode()).hexdigest()
          manifest_sha = hashlib.sha256(raw.encode()).hexdigest()
          def inspect(item):
              result = {'benchmark_id': benchmark, 'validator_index': item['index'],
                        'region': item['region'], 'instance_id': item['instance_id'],
                        'probe_source_sha256': source_sha, 'manifest_sha256': manifest_sha}
              try:
                  submitted = json.loads(subprocess.check_output(['aws','ssm','send-command',
                      '--region',item['region'],'--document-name','AWS-RunShellScript',
                      '--instance-ids',item['instance_id'],'--comment',f'{benchmark} read-only storage metadata',
                      '--parameters',json.dumps({'commands':[command], 'executionTimeout':['60']}),
                      '--output','json'], text=True, timeout=30))
                  command_id = submitted['Command']['CommandId']
                  result['command_id'] = command_id
                  for _ in range(30):
                      response = subprocess.run(['aws','ssm','get-command-invocation',
                          '--region',item['region'],'--command-id',command_id,
                          '--instance-id',item['instance_id'],'--output','json'],
                          capture_output=True, text=True, timeout=15)
                      if response.returncode == 0:
                          invocation = json.loads(response.stdout)
                          state = invocation['Status']
                          if state not in ('Pending','InProgress','Delayed'):
                              result['ssm_status'] = state
                              result['response_code'] = invocation.get('ResponseCode')
                              result['execution_started'] = invocation.get('ExecutionStartDateTime')
                              if state == 'Success' and invocation.get('ResponseCode') == 0:
                                  result['metadata'] = json.loads(invocation['StandardOutputContent'])
                              else:
                                  # The node probe deliberately reports only exception type on failure.
                                  result['failure'] = invocation.get('StandardOutputContent','')[:500]
                              break
                      elif 'InvocationDoesNotExist' not in response.stderr:
                          result['ssm_status'] = 'request_failed'
                          result['error'] = response.stderr[-500:]
                          break
                      time.sleep(2)
                  else:
                      result['ssm_status'] = 'inspection_poll_timeout'
              except (subprocess.SubprocessError, ValueError, KeyError) as error:
                  result['ssm_status'] = 'inspection_failed'
                  result['error_type'] = type(error).__name__
              pathlib.Path(f"inspection-storage-node-{item['index']}.json").write_text(json.dumps(result,indent=2))
              return {key: value for key,value in result.items() if key != 'metadata'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
              summary = list(executor.map(inspect,validators))
          print(json.dumps(summary,indent=2))
          assert all(item.get('ssm_status') == 'Success' and item.get('response_code') == 0 for item in summary), 'At least one metadata inspection failed; no permission fallback performed'
          PY
      - name: Upload sanitized storage ancestry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-storage-backing
          path: inspection-storage-*.json
          if-no-files-found: error
          retention-days: 14
