name: Specs

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "tips/verify/**"
      - "crates/alloy/**"
      - "crates/chainspec/**"
      - "crates/contracts/**"
      - "crates/dkg-onchain-artifacts/**"
      - "crates/evm/**"
      - "crates/hardfork/**"
      - "crates/precompiles/**"
      - "crates/precompiles-macros/**"
      - "crates/primitives/**"
      - "crates/revm/**"
      - "scripts/foundry-patch.sh"
      - ".github/workflows/specs.yml"
      - ".github/workflows/update-reth.yml"
  merge_group:
  pull_request:

env:
  # Allow Aegis to finish its 90-second Socket lookup before Cargo times out.
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"

jobs:
  check-specs-changes:
    name: Check specs changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ contains(fromJSON(steps.filter.outputs.changes), 'specs') }}
      foundry_smoke: ${{ contains(fromJSON(steps.filter.outputs.changes), 'foundry_smoke') }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tempoxyz/gh-actions/actions/changed-paths@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        id: filter
        with:
          filters: |
            specs:
              # Dependency updates can change native precompile behavior without Rust source changes.
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'tips/verify/**'
              - 'crates/alloy/**'
              - 'crates/chainspec/**'
              - 'crates/contracts/**'
              - 'crates/dkg-onchain-artifacts/**'
              - 'crates/evm/**'
              - 'crates/hardfork/**'
              - 'crates/precompiles/**'
              - 'crates/precompiles-macros/**'
              - 'crates/primitives/**'
              - 'crates/revm/**'
              - 'scripts/foundry-patch.sh'
              - '.github/workflows/specs.yml'
            foundry_smoke:
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'scripts/foundry-patch.sh'
              - '.github/workflows/specs.yml'
              - '.github/workflows/update-reth.yml'

  foundry-resolver-smoke:
    name: Foundry Resolver Smoke
    needs: check-specs-changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Skip Foundry resolver smoke
        if: needs.check-specs-changes.outputs.foundry_smoke != 'true'
        run: |
          echo "Skipping Foundry resolver smoke: no dependency-sensitive files changed."

      - name: Checkout tempo
        if: needs.check-specs-changes.outputs.foundry_smoke == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: tempo
          persist-credentials: false

      - name: Checkout foundry
        if: needs.check-specs-changes.outputs.foundry_smoke == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: foundry-rs/foundry
          # Keep Foundry on revm 43.0.2 to match the version used by reth and Tempo.
          ref: 4e9eba80e77a8e696a9c888c6af058da65c12fc8
          path: foundry
          persist-credentials: false

      - name: Setup Rust
        if: needs.check-specs-changes.outputs.foundry_smoke == 'true'
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Patch foundry to use checked-out tempo crates
        if: needs.check-specs-changes.outputs.foundry_smoke == 'true'
        env:
          RUSTC_WRAPPER: ""
        run: tempo/scripts/foundry-patch.sh "$GITHUB_WORKSPACE/tempo" "$GITHUB_WORKSPACE/foundry"

  build:
    name: Forge Build
    needs: check-specs-changes
    if: needs.check-specs-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: nightly

      - name: Run Forge build
        working-directory: tips/verify
        run: forge build --sizes

  abi-alignment-check:
    name: ABI Alignment Check
    needs: check-specs-changes
    if: needs.check-specs-changes.outputs.should_run == 'true'
    # Depot keeps the Rust cache out of the repository's 10 GB GitHub cache and
    # gives sccache a shared backend.
    runs-on: depot-ubuntu-latest-4
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: nightly

      - name: Build tempo-std interfaces
        working-directory: tips/verify/lib/tempo-std
        run: forge build --sizes

      - name: Run ABI alignment check
        run: cargo run -p tempo-xtask -- check-abi

  lint:
    name: Forge Fmt
    needs: check-specs-changes
    if: needs.check-specs-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: nightly

      - name: Run Forge fmt check
        working-directory: tips/verify
        run: forge fmt --check

  foundry-build:
    name: Build patched Forge
    needs: check-specs-changes
    if: github.repository == 'tempoxyz/tempo' && needs.check-specs-changes.outputs.should_run == 'true'
    runs-on: depot-ubuntu-latest-8
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout tempo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          path: tempo
          persist-credentials: false

      - name: Checkout foundry
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: foundry-rs/foundry
          # Keep Foundry on revm 43.0.2 to match the version used by reth and Tempo.
          ref: 4e9eba80e77a8e696a9c888c6af058da65c12fc8
          path: foundry
          persist-credentials: false

      - name: Setup Rust
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: tempoxyz/gh-actions/actions/setup-mold@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/mozilla-actions/sccache-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: tempoxyz/gh-actions/vendor/Swatinem/rust-cache@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          workspaces: foundry

      - name: Patch foundry to use checked-out tempo crates
        run: tempo/scripts/foundry-patch.sh "$GITHUB_WORKSPACE/tempo" "$GITHUB_WORKSPACE/foundry"

      - name: Build foundry forge
        working-directory: foundry
        run: cargo build --bin forge --profile release --no-default-features

      - name: Upload patched Forge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patched-forge
          path: foundry/target/release/forge
          retention-days: 1

  foundry-test:
    name: Forge Test (Rust Precompiles, ${{ matrix.profile }})
    needs: [check-specs-changes, foundry-build]
    if: needs.foundry-build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        profile: [default, next]
    runs-on: depot-ubuntu-latest-8
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Checkout tempo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          path: tempo
          persist-credentials: false

      - name: Download patched Forge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patched-forge
          path: foundry/target/release

      - name: Run Forge tests with Rust precompiles
        working-directory: tempo/tips/verify
        env:
          FOUNDRY_PROFILE: ${{ matrix.profile }}
        run: |
          chmod +x ../../../foundry/target/release/forge
          echo "Running Forge tests with the ${{ matrix.profile }} profile"
          ../../../foundry/target/release/forge test -vvv

  specs-success:
    name: specs success
    runs-on: ubuntu-latest
    if: always()
    permissions:
      id-token: write
    needs:
      - check-specs-changes
      - foundry-resolver-smoke
      - build
      - abi-alignment-check
      - lint
      - foundry-build
      - foundry-test
    timeout-minutes: 5
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          allowed-skips: build,abi-alignment-check,lint,foundry-build,foundry-test
          jobs: ${{ toJSON(needs) }}
