# Only the pinned dependency updater on main may create dependency PRs.
subject:
  - repo:tempoxyz/tempo:ref:refs/heads/main
  - repo:tempoxyz@211589300/tempo@994992847:ref:refs/heads/main

claim_pattern:
  repository_id: '994992847'
  event_name: '(schedule|workflow_dispatch)'
  workflow_ref: 'tempoxyz/tempo/\.github/workflows/dependencies\.yml@refs/heads/main'
  job_workflow_ref: 'tempoxyz/gh-actions/\.github/workflows/cargo-update-pr\.yml@75284a9f2d71122060d00c1b37bc0fa99568c5e5'

permissions:
  contents: write
  pull_requests: write
