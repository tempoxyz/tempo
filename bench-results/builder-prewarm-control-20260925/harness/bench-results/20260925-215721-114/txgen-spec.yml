chain_id: 1337
gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000
accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, ${TXGEN_ACCOUNTS}]
artifacts:
  HistoryStatePaths: ../history-state-paths.json
templates:
  history_code_sized:
    type: tempo
    from: { pool: users, select: random }
    gas_limit: 30000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    expiring_nonce: true
    valid_for_secs: 25
    call:
      to: "0x535441544541434345535342454e434800000000"
      abi: HistoryStatePaths
      function: touchSizedCode
      args:
        - { random_bytes: 32 }
        - ${TXGEN_HISTORY_CODE_COUNT}
        - true
        - ${TXGEN_STATE_ACCESSES}
mix:
  - template: history_code_sized
    weight: 100
