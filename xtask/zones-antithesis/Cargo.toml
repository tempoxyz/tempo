[package]
name = "tempo-zones-antithesis"
description = "Antithesis test commands for the zone test environment in contrib/antithesis/zones"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

# The test template's commands, built without coverage instrumentation in its own small binary
# (see contrib/antithesis/zones/Dockerfile), so only the system under test reports coverage.
[dependencies]
tempo-contracts = { workspace = true, features = ["std", "serde", "rpc"] }
tempo-primitives = { workspace = true, features = ["std"] }
zone-precompiles = { workspace = true, features = ["std"] }
zone-rpc.workspace = true

alloy = { workspace = true, features = ["contract", "providers", "reqwest", "reqwest-rustls-tls", "rpc-types", "signer-local", "signer-mnemonic", "signers", "sol-types"] }
antithesis_sdk = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
futures.workspace = true
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "tempo-zones-antithesis"
path = "src/main.rs"
