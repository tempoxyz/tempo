[package]
name = "tempo-xtask"
default-run = "tempo-xtask"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-chainspec = { workspace = true, features = ["cli", "default"] }
tempo-contracts.workspace = true
tempo-primitives = { workspace = true, features = ["reth-codec"] }
tempo-consensus-config.workspace = true
tempo-validator-config.workspace = true
tempo-dkg-onchain-artifacts.workspace = true
tempo-evm = { workspace = true, features = ["genesis"] }
tempo-precompiles = { workspace = true, features = ["test-utils"] }
tempo-revm.workspace = true
tempo-state-bloat.workspace = true

alloy = { workspace = true, features = ["contract", "genesis", "getrandom", "provider-ws", "providers", "rand", "reqwest", "reqwest-rustls-tls", "rpc-types", "signer-local", "signer-mnemonic", "signers", "sol-types"] }
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-json-abi.workspace = true
alloy-primitives = { workspace = true, features = ["asm-keccak"] }
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
commonware-codec.workspace = true
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-math.workspace = true
commonware-runtime = { workspace = true, features = ["external"] }
commonware-storage.workspace = true
commonware-utils.workspace = true
const-hex.workspace = true
eyre.workspace = true
indicatif = { workspace = true, features = ["rayon"] }
itertools.workspace = true
rand_08.workspace = true
rand.workspace = true
rayon.workspace = true
reth-evm.workspace = true
reth-db.workspace = true
reth-db-api.workspace = true
reth-provider.workspace = true
reth-primitives-traits.workspace = true
reth-network-peers = { workspace = true, features = ["secp256k1"] }
revm.workspace = true
secp256k1 = { workspace = true, features = ["rand"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

tempo-alloy.workspace = true

tempo-zone-contracts = { workspace = true, features = ["std", "serde", "rpc"] }
zone-primitives.workspace = true
zone-precompiles = { workspace = true, features = ["std"] }
zone-p2p.workspace = true
zone-rpc.workspace = true
zone-sequencer.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-eth.workspace = true
futures.workspace = true
serde_yaml.workspace = true
toml.workspace = true
zeroize.workspace = true
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[dev-dependencies]
zone-chainspec.workspace = true
tempfile.workspace = true

[[bin]]
name = "tempo-zone-xtask"
path = "src/zones/mod.rs"
