[package]
name = "tempo-pq-oidc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "disable-dev-mode"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"

[features]
verify = ["dep:risc0-zkvm"]

