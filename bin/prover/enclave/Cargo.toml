[package]
name = "tempo-zone-prover-enclave"
description = "AWS Nitro Enclave service for the Tempo Zone SPF"
version = "0.3.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
alloy-genesis = { workspace = true }
zone-chainspec.workspace = true
zone-primitives.workspace = true
zone-prover.workspace = true
zone-spf.workspace = true

tempo-chainspec = { workspace = true }

clap = { workspace = true, features = ["env"] }
serde_json = { workspace = true, default-features = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api.workspace = true
serde_bytes.workspace = true
tokio-vsock.workspace = true

[dev-dependencies]
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp = { workspace = true }
reth-trie-common = { workspace = true, features = ["std"] }
tempo-primitives = { workspace = true, features = ["reth", "reth-codec", "serde", "serde-bincode-compat"] }
