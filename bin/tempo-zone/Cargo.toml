[package]
name = "tempo-zone"
description = "Tempo Zone L2 node binary"
default-run = "tempo-zone"

version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# tempo
zone-node = { workspace = true, features = ["cli"] }

# reth
reth-cli-util.workspace = true
reth-node-core.workspace = true

# alloy
alloy-primitives.workspace = true

# testing
antithesis_sdk = { workspace = true, optional = true }

# tls
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
antithesis-instrumentation = { workspace = true, optional = true }

[[bin]]
name = "tempo-zone"
path = "src/main.rs"

[features]
default = ["asm-keccak", "jemalloc", "keccak-cache-global", "otlp"]

# Report Antithesis SDK assertions. Without it the assertions and their details are compiled out.
fuzz = ["dep:antithesis_sdk", "antithesis_sdk/full", "zone-node/fuzz"]
# Link Antithesis's coverage runtime shim, for binaries built with its sancov flags (see
# contrib/antithesis/zones/Dockerfile). Linux only.
antithesis-coverage = ["dep:antithesis-instrumentation"]

asm-keccak = [
	"alloy-primitives/asm-keccak",
	"reth-node-core/asm-keccak",
	"zone-node/asm-keccak",
]
jemalloc = ["reth-cli-util/jemalloc", "reth-node-core/jemalloc", "zone-node/jemalloc"]
keccak-cache-global = [
	"alloy-primitives/keccak-cache-global",
	"reth-node-core/keccak-cache-global",
	"zone-node/keccak-cache-global",
]
# Export spans to the collector named by --tracing-otlp.
otlp = ["reth-node-core/otlp", "zone-node/otlp"]
# Continuous profiling, enabled at runtime with --pyroscope.enabled.
pyroscope = ["zone-node/pyroscope"]
