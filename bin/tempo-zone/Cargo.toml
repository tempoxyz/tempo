[package]
name = "tempo-zone"
description = "Tempo Zone L2 node binary"
default-run = "tempo-zone"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# tempo
zone-node = { workspace = true, features = ["cli"] }

# reth
reth-cli-util.workspace = true
reth-node-core.workspace = true

# tls
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[[bin]]
name = "tempo-zone"
path = "src/main.rs"

[features]
default = ["asm-keccak", "jemalloc", "keccak-cache-global"]

asm-keccak = ["zone-node/asm-keccak"]
jemalloc = ["reth-cli-util/jemalloc", "zone-node/jemalloc"]
keccak-cache-global = ["zone-node/keccak-cache-global"]
