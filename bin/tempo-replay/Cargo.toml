[package]
name = "tempo-replay"
description = "Finalized Tempo traffic mirroring, auditing, and workload profiling"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tempo-alloy.workspace = true
tempo-chainspec = { workspace = true, features = ["reth"] }
tempo-consensus.workspace = true
tempo-primitives = { workspace = true, features = ["std", "serde"] }

alloy = { workspace = true, features = ["providers", "provider-http", "reqwest-rustls-tls", "rlp", "rpc-types-eth", "transports"] }
anyhow = "1"
bincode = "1.3"
clap.workspace = true
fs4 = "0.13"
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.1", default-features = false, features = ["http-listener"] }
reqwest.workspace = true
reth-primitives-traits.workspace = true
rocksdb = { version = "0.24", default-features = false, features = ["bindgen-runtime", "lz4", "zstd"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio.workspace = true
tokio-util.workspace = true
toml = "1"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
