[patch.crates-io]
# Partitioned ordered index: skip empty partitions in navigation; bounded grafted-tree reads on open; prefetch for merkleization; phase spans; batch node lookups without Weak upgrades; inlined FixedBytes compare; floor-candidate prefetch and graft-node warm-up on the ordered staged path; in-memory graft nodes of committed chunks; parallel ordered merkleize resolve, lookups and op build; ordered staging of ancestor-resolved reads; ancestor-diff scans limited to changed keys' neighbors; current-layer phase spans (klkvr/monorepo, on v2026.9.0).
