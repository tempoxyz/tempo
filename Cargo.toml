  "crates/validator-config",
  "crates/dkg-onchain-artifacts",
  "crates/eyre",
  "crates/ext",
  "crates/evm",
  "crates/hardfork",
  "crates/e2e",
  "crates/faucet",
  "crates/fuzz-harness",
  "crates/fuzz-types",
  "crates/invariants",
  "crates/node",
  "crates/node-launcher",
  "crates/nitro-attestation",
  "crates/nitro-attestation/fuzz",
  "crates/payload/builder",
  "crates/payload/types",
  "crates/precompiles",
  "crates/precompiles-macros",
  "crates/primitives",
  "crates/qmdb-state",
  "crates/contracts",
  "crates/telemetry-util",
  "crates/transaction-pool",
  "crates/state-bloat",
  "xtask",
  "bin/tempo-zone",
  "bin/prover/enclave",
  "bin/prover/utils",
  "bin/prover/vsock-proxy",
  "crates/zones/chainspec",
  "crates/zones/checker",
  "crates/zones/evm",
  "crates/zones/exithatch",
  "crates/zones/l1",
  "crates/zones/node",
  "crates/zones/p2p",
  "crates/zones/payload",
  "crates/zones/precompiles",
  "crates/zones/primitives",
  "crates/zones/prover",
  "crates/zones/rpc",
  "crates/zones/sequencer",
  "crates/zones/spf",
