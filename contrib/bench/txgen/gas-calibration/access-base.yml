# Separate unoptimized artifact; do not pool with optimized GasCalibration timings.
merge:
  chain_id: 1337
  gas:
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
  accounts:
    users:
      mnemonic: "test test test test test test test test test test test junk"
      range: [0, ${TXGEN_ACCOUNTS}]
  artifacts:
    AccessCalibration:
      abi: ./AccessCalibration.json
      bytecode: ./AccessCalibration.json
  setup:
    steps:
      - id: access
        deploy:
          type: eip1559
          from: { pool: users, select: { index: 0 } }
          artifact: AccessCalibration
          gas_limit: 10000000
          constructor_args: []
  templates:
    access:
      type: tempo
      from: { pool: users, select: random }
      gas_limit: 300000
      fee_token: "0x20c0000000000000000000000000000000000000"
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to: { var: setup.access.address }
        abi: AccessCalibration
        args: []
  mix:
    - template: access
      weight: 100
