# Benchmark-only: approve does not trigger TIP-20 fee-token inference.
# fallback.nu drains pathUSD on both sides before measurement.
include:
  - tip20/base.yml
  - tip20/fee-amm-liquidity.yml
  - tip20/auth-direct.yml
  - tip20/nonce-expiring.yml
merge:
  accounts:
    users:
      # Public test mnemonic distinct from genesis, which installs fee preferences.
      mnemonic: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
  templates:
    tip20_transfer:
      call:
        to: "0x20c0000000000000000000000000000000000002"
        function: approve
        args:
          - "0x000000000000000000000000000000000000beef"
          - { uniform: [1, 1000000000000000] }
