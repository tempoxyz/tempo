include:
- ../gas-calibration/access-base.yml
merge:
  templates:
    control:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      calls:
      - to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: control
      - to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: control
    slot_once:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      calls:
      - to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: slotOnce
      - to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: slotOnce
    call_once:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      calls:
      - to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: callOnce
      - to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: callOnce
  mix:
  - template: control
    weight: 1
  - template: slot_once
    weight: 1
  - template: call_once
    weight: 1
