include:
- ../gas-calibration/base.yml
merge:
  templates:
    gas_account_context:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.calibration.address
        abi: GasCalibration
        function: accountContext
        args: []
    gas_arithmetic:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.calibration.address
        abi: GasCalibration
        function: arithmetic
        args:
        - uniform:
          - 1
          - 1000000
        - uniform:
          - 1
          - 1000000
