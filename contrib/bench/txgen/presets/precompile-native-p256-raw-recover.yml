include:
- ../gas-calibration/crypto-base.yml
merge:
  setup:
    steps:
    - id: fixture
      deploy:
        type: eip1559
        from:
          pool: users
          select:
            index: 0
        artifact: PrecompileCalibration
        gas_limit: 10000000
        constructor_args:
        - - '0x5165300000000000000000000000000000000000'
        - - ''
        - - '0x000000000000000000000000e8ca33f128d8f3669a46aaf7fe63502b4e2bce30'
  templates:
    precompile:
      call:
        args:
        - '0x5165300000000000000000000000000000000000'
        - ''
