include:
- ../gas-calibration/access-base.yml
merge:
  templates:
    control:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: control
    slot_once:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: slotOnce
    slot_twice_warm:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: slotTwiceWarm
    slot_twice_cold:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: slotTwiceCold
    call_once:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: callOnce
    call_twice_warm:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: callTwiceWarm
    call_twice_cold:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.access.address
        abi: AccessCalibration
        args: []
        function: callTwiceCold
  mix:
  - template: control
    weight: 1
  - template: slot_once
    weight: 1
  - template: slot_twice_warm
    weight: 1
  - template: slot_twice_cold
    weight: 1
  - template: call_once
    weight: 1
  - template: call_twice_warm
    weight: 1
  - template: call_twice_cold
    weight: 1
