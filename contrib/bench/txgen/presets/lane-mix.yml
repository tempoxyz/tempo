# Plain pathUSD transfers, half with a one-entry access list. Under TIP-1045 any
# transaction with a non-empty access list is general-lane, so the two halves
# split between the payment and general lanes. On mainnet most customer plain
# transfers carry a one-entry access list (one address, one storage key) and land
# in the general lane. Run at mainnet limits to see the general lane cap them, e.g.
# `derek bench preset=lane-mix gas-limit=500M general-gas-limit=30M`.
# Requires txgen with template access_list support.
chain_id: 1337

gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000

accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range:
      - 0
      - ${TXGEN_ACCOUNTS}

artifacts:
  ERC20: ../tip20.abi.json

templates:
  lane_payment_transfer:
    type: tempo
    from: { pool: users, select: random }
    gas_limit: 300000
    fee_token: "0x20c0000000000000000000000000000000000000"
    expiring_nonce: true
    nonce: { uniform: [0, 18446744073709551615] } # TIP-1106, requires T12+
    valid_for_secs: 25
    call:
      to: "0x20c0000000000000000000000000000000000000"
      abi: ERC20
      function: transfer
      args:
        - { pool: { pool: users, select: random } }
        - 1
  lane_access_list_transfer:
    type: tempo
    from: { pool: users, select: random }
    gas_limit: 300000
    fee_token: "0x20c0000000000000000000000000000000000000"
    expiring_nonce: true
    nonce: { uniform: [0, 18446744073709551615] } # TIP-1106, requires T12+
    valid_for_secs: 25
    access_list:
      - address: "0x20c0000000000000000000000000000000000000"
        storage_keys:
          - { random_bytes: 32 }
    call:
      to: "0x20c0000000000000000000000000000000000000"
      abi: ERC20
      function: transfer
      args:
        - { pool: { pool: users, select: random } }
        - 1

mix:
  - template: lane_payment_transfer
    weight: 50
  - template: lane_access_list_transfer
    weight: 50
