# State reads from a hot set: random accounts among 100K bloat accounts, which stay in the page cache after warm-up, so reads cost memory, not disk. Gas per read is the same as state-read-cold.
# Every transaction spends its 10M gas on TIP20 balanceOf reads of state-bloat
# accounts (one cold SLOAD each, ~2.6K gas per read), through the StateReader
# fixture. Run it with general-gas-limit equal to gas-limit so whole blocks fill
# with reads. Requires nonzero bloat: senders are the bloat's signable accounts,
# whose pathUSD pays the fees, so keep --accounts at or below 10000.
chain_id: 1337

gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000

accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range:
      - 0
      - ${TXGEN_ACCOUNTS}

# Unused by the templates; declaring it makes the helper export the bloat's
# existing-account range as TXGEN_EXISTING_RECIPIENTS_START/END.
address_pools:
  existing_recipients:
    fast:
      seed: "test test test test test test test test test test test junk"
      range:
        - ${TXGEN_EXISTING_RECIPIENTS_START}
        - ${TXGEN_EXISTING_RECIPIENTS_END}

artifacts:
  StateReader: ../state-read/StateReader.json

setup:
  steps:
    - id: reader
      deploy:
        type: eip1559
        from: {pool: users, select: {index: 0}}
        artifact: StateReader
        gas_limit: 2000000
        constructor_args: []

templates:
  state_read:
    type: tempo
    from: {pool: users, select: random}
    gas_limit: 10000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    expiring_nonce: true
    nonce: { uniform: [0, 18446744073709551615] } # TIP-1106, requires T12+
    valid_for_secs: 25
    call:
      to: {var: setup.reader.address}
      abi: StateReader
      function: readRandom
      args:
        - choice: ${TXGEN_TIP20_TOKENS}
        # keccak256 of the bloat mnemonic: the seed of its fast address derivation.
        - "0xcb5663e69e67237b807f68117b1d2f7f0f49a1e1d22ac4aa18dfa52527f2feff"
        - 10000
        - 110000
        - {random_bytes: 32}
        - 30000

mix:
  - template: state_read
    weight: 100
