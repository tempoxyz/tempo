# start is bound once per transaction and reused by calldata AND the signed list.
chain_id: 1337
gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000
accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, ${TXGEN_ACCOUNTS}]
artifacts:
  HistoryStatePaths: ../history-state-paths.json
templates:
  declared_write_tx:
    type: tempo
    from: { pool: users, select: random }
    gas_limit: 10000000
    max_fee_per_gas: 100000000000
    max_priority_fee_per_gas: 100000000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    expiring_nonce: true
    valid_for_secs: 25
    access_list:
      - address: "0x535441544541434345535342454e434800000000"
        storage_keys:
          range:
            start: { var: start }
            count: ${TXGEN_STATE_ACCESSES}
    call:
      to: "0x535441544541434345535342454e434800000000"
      abi: HistoryStatePaths
      function: touchDeclaredWrites
      args:
        - { var: start }
        - ${TXGEN_STATE_ACCESSES}
sequences:
  declared_write:
    bindings:
      start:
        u256: { uniform: [0, ${TXGEN_DECLARED_MAX_START}] }
    steps:
      - template: declared_write_tx
mix:
  - sequence: declared_write
    weight: 100
