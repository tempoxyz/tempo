# Forward-looking public workload, weighted by submitted transactions (not gas).
# Transaction shares: plain transfer 25%, memo transfer 40%, mint 1%, MPP 15%,
# zone deposit 5%, zone withdrawal 4%, vault deposit 6%, vault withdrawal 4%.
# These are benchmark assumptions, not a replay of mainnet activity.
# Uses the native MPP open-only preset with txgen main.
# Transfers and mints target prepopulated state-bloat accounts; requires nonzero bloat.
# The helper combines fixture setup and expands per-user/portal templates.
# Ordinary nonces keep transactions ordered after setup without expiry under load.
include:
  - mpp.yml
  - vault/base.yml
  - zones.yml

accounts:
  # Vault deployments pin nonces 0..11 on deployers[0] (index 100001).
  # A separate zone deployer avoids sharing that explicit-nonce lane.
  deployer:
    index: 100002

address_pools:
  existing_recipients:
    fast:
      seed: "test test test test test test test test test test test junk"
      range:
        - ${TXGEN_EXISTING_RECIPIENTS_START}
        - ${TXGEN_EXISTING_RECIPIENTS_END}

artifacts:
  ERC20: ../tip20.abi.json

templates:
  public_transfer:
    type: tempo
    from: {pool: users, select: random}
    gas_limit: 300000
    fee_token: "0x20c0000000000000000000000000000000000000"
    call:
      to:
        choice: ${TXGEN_TIP20_TOKENS}
      abi: ERC20
      function: transfer
      args:
        - {address_pool: {pool: existing_recipients, select: random}}
        - 1
  public_transfer_memo:
    type: tempo
    from: {pool: users, select: random}
    gas_limit: 300000
    fee_token: "0x20c0000000000000000000000000000000000000"
    call:
      to:
        choice: ${TXGEN_TIP20_TOKENS}
      abi: ERC20
      function: transferWithMemo
      args:
        - {address_pool: {pool: existing_recipients, select: random}}
        - 1
        - {random_bytes: 32}
  public_mint:
    type: tempo
    # Dev genesis grants the pathUSD issuer role to users[0].
    from: {pool: users, select: {index: 0}}
    gas_limit: 300000
    fee_token: "0x20c0000000000000000000000000000000000000"
    call:
      to: "0x20c0000000000000000000000000000000000000"
      abi: ERC20
      function: mint
      args:
        - {address_pool: {pool: existing_recipients, select: random}}
        - 1

# The helper copies mpp_open without expiry into public_mpp_open.
sequences:
  mpp_open_only:
    steps:
      - name: open
        template: public_mpp_open

# Each selection emits one transaction, including MPP.
# Zone operations include synthetic settlement through the existing dummy verifier.
mix:
  - template: public_transfer
    weight: 25
  - template: public_transfer_memo
    weight: 40
  - template: public_mint
    weight: 1
  - sequence: mpp_open_only
    weight: 15
  - template: zone_deposit
    weight: 5
  - template: zone_withdraw
    weight: 4
  - template: vault_deposit
    weight: 6
  - template: vault_withdraw
    weight: 4
