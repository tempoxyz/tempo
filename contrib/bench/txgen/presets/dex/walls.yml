      - id: dex_wall_bid_token3
        tx:
          type: eip1559
          from:
            pool: users
            select: { index: 0 }
          gas_limit: 8000000
          call:
            to: "0xdec0000000000000000000000000000000000000"
            abi: StablecoinDEX
            function: placeFlip
            args:
              - "0x20c0000000000000000000000000000000000003"
              - 10000000000
              - true
              - -100
              - 100
      - id: dex_wall_ask_token3
        tx:
          type: eip1559
          from:
            pool: users
