# The helper prepares the encrypted payload with zones/render.py. Use --accounts 1.
chain_id: 1337
gas:
  max_fee_per_gas: 100000000000
  max_priority_fee_per_gas: 100000000000
accounts:
  users:
    mnemonic: "test test test test test test test test test test test junk"
    range: [0, 1]
artifacts:
  ERC20: ../erc20.abi.json
  PortalFixture: ../zones/PortalFixture.json
  SettlementFixture: ../zones/SettlementFixture.json
  ZonePortal: ../zones/portal.abi.json
setup:
  steps:
    - id: settlement
      deploy:
        type: eip1559
        from: {pool: users, select: {index: 0}}
        artifact: SettlementFixture
        gas_limit: 5000000
    - id: portal
      deploy:
        type: eip1559
        from: {pool: users, select: {index: 0}}
        artifact: PortalFixture
        gas_limit: 10000000
        constructor_args: [null, "0x20c0000000000000000000000000000000000000", {var: setup.settlement.address}]
    - id: fund_and_approve
      tx:
        type: tempo
        from: {pool: users, select: {index: 0}}
        gas_limit: 5000000
        fee_token: "0x20c0000000000000000000000000000000000000"
        calls:
          - to: "0x20c0000000000000000000000000000000000000"
            abi: ERC20
            function: transfer
            args: [{var: setup.portal.address}, 0]
          - to: "0x20c0000000000000000000000000000000000000"
            abi: ERC20
            function: approve
            args: [{var: setup.portal.address}, "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"]
templates:
  zone_deposit:
    type: tempo
    from: {pool: users, select: {index: 0}}
    gas_limit: 5000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    calls:
      - to: {var: setup.portal.address}
        abi: ZonePortal
        function: deposit
        args: []
      - to: {var: setup.settlement.address}
        abi: SettlementFixture
        function: settle
        args: [{var: setup.portal.address}, "0x20c0000000000000000000000000000000000000", null, false]
  zone_withdraw:
    type: tempo
    from: {pool: users, select: {index: 0}}
    gas_limit: 5000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    calls:
      - to: {var: setup.settlement.address}
        abi: SettlementFixture
        function: settle
        args: [{var: setup.portal.address}, "0x20c0000000000000000000000000000000000000", null, true]
      - to: {var: setup.portal.address}
        abi: ZonePortal
        function: processWithdrawals
        args: []
mix:
  - template: zone_deposit
    weight: 50
  - template: zone_withdraw
    weight: 50
