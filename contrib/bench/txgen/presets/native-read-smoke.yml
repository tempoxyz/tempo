include:
- ../gas-calibration/native-base.yml
merge:
  templates:
    tip20:
      type: tempo
      from:
        pool: users
        select: random
      gas_limit: 300000
      fee_token: '0x20c0000000000000000000000000000000000000'
      expiring_nonce: true
      valid_for_secs: 10
      call:
        to:
          var: setup.native_reads.address
        abi: NativeReadCalibration
        args: []
        function: tokenBalance
