services:
  reth-proofs:
    image: ${RETH_PROOFS_IMAGE:-tempo-reth-proofs-antithesis:latest}
    container_name: reth-proofs
    hostname: reth-proofs
    init: true
    networks:
      antithesis:
        ipv4_address: 10.20.0.10
    # The binary emits setup_complete after its first database initialization, then runs
    # bounded rounds on fresh databases indefinitely. Antithesis controls kill/restart timing.
    command: ['{}']

# Match the explicit bridge subnet used by the reth-state-root and zones Antithesis configurations.
networks:
  antithesis:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
