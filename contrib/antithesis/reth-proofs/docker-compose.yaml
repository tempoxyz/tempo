services:
  reth-proofs:
    image: ${RETH_PROOFS_IMAGE:-tempo-reth-proofs-antithesis:latest}
    container_name: reth-proofs
    hostname: reth-proofs
    init: true
    # gdb -p from docker exec needs CAP_SYS_PTRACE when the kernel's Yama ptrace_scope is 1.
    cap_add:
      - SYS_PTRACE
    networks:
      antithesis:
        ipv4_address: 10.20.0.10
    # The server emits setup_complete after its first database initialization, then builds
    # blocks and serves proofs when the test template's commands
    # (/opt/antithesis/test/v1/reth_proofs) ask. Antithesis controls kill/restart timing.
    command: ["serve", "{}"]

# Match the explicit bridge subnet used by the reth-state-root and zones Antithesis configurations.
networks:
  antithesis:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
