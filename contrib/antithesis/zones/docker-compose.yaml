# Multi-sequencer zone on a dev-mode Tempo L1:
#
# - l1: Tempo dev node that persists every block, so finalized blocks survive a kill; zone
#   nodes read finalized state over WebSocket
# - provision: creates the zone on L1 with three sequencers (2-of-3 settlement) and writes
#   genesis, keys and the manifest to the shared volume, then exits
# - zone-0..2: the sequencer quorum; zone-0 is the initial leader
# - proxy-0..2: transparent bounded L1/P2P gates, outside Antithesis fault targets
# - zone-rpc: RPC follower outside the quorum that runs the solvency checker
# - workload: waits until the zone replicates, then signals that setup is complete; the test
#   commands in /opt/antithesis/test run here and keep their ledger in /state
#
# Static addresses keep the P2P manifest free of DNS names. Each container also has a fixed MAC
# derived from its IP, so a restarted container keeps its MAC and peers' ARP entries for it stay
# valid; with a fresh MAC, peers that missed the restart keep sending to the old one until their
# ARP entry expires. Every container_name matches its hostname, and init: true keeps the
# entrypoint off PID 1 so core dumps work.

x-zone: &zone
  image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
  entrypoint: ["/opt/zones/zone-node.sh"]
  init: true
  # gdb -p from docker exec needs CAP_SYS_PTRACE when the kernel's Yama ptrace_scope is 1.
  cap_add:
    - SYS_PTRACE
  healthcheck: &rpc-healthcheck
    test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
    interval: 5s
    timeout: 5s
    retries: 3
    start_period: 60s
  depends_on:
    provision:
      condition: service_completed_successfully

x-proxy: &proxy
  image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
  entrypoint: ["/usr/local/bin/tempo-zones-antithesis"]
  init: true
  volumes:
    - fault-control:/fault-control

services:
  l1:
    image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
    container_name: l1
    hostname: l1
    init: true
    # gdb -p from docker exec needs CAP_SYS_PTRACE when the kernel's Yama ptrace_scope is 1.
    cap_add:
      - SYS_PTRACE
    entrypoint: ["/usr/local/bin/tempo"]
    command:
      - node
      - --chain
      - /opt/zones/l1-genesis.json
      - --dev
      - --dev.block-time
      - 500ms
      - --dev.finality-depth
      - "1"
      # Persist each block as soon as it is canonical. With Tempo's default threshold a killed L1
      # restarts behind blocks it already reported finalized and rebuilds them, which zones
      # treat as a finality violation and halt on.
      - --engine.persistence-threshold
      - "0"
      - --engine.memory-block-buffer-target
      - "0"
      - --datadir
      - /data
      - --http
      - --http.addr
      - 0.0.0.0
      - --http.port
      - "8545"
      - --http.api
      - all
      - --ws
      - --ws.addr
      - 0.0.0.0
      - --ws.port
      - "8546"
      - --ws.api
      - all
      # Witness collection proves older L1 checkpoints when a zone node catches up.
      - --rpc.eth-proof-window
      - "100000"
      - --tempo.bootnodes-endpoint
      - none
      - --disable-discovery
      - --no-persist-peers
      - --color
      - never
    volumes:
      - l1-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.10
        mac_address: 02:42:0a:14:00:0a
    healthcheck:
      <<: *rpc-healthcheck
      start_period: 30s

  provision:
    image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
    container_name: provision
    hostname: provision
    init: true
    entrypoint: ["/opt/zones/provision.sh"]
    # provision.sh waits for the L1 RPC itself, with no time limit.
    depends_on:
      - l1
    volumes:
      - shared:/shared
    networks:
      zones:
        ipv4_address: 10.20.0.5
        mac_address: 02:42:0a:14:00:05

  proxy-0:
    <<: *proxy
    container_name: proxy-0
    hostname: proxy-0
    command: ["fault-proxy", "--index", "0"]
    networks:
      zones:
        ipv4_address: 10.20.0.41
        mac_address: 02:42:0a:14:00:29

  proxy-1:
    <<: *proxy
    container_name: proxy-1
    hostname: proxy-1
    command: ["fault-proxy", "--index", "1"]
    networks:
      zones:
        ipv4_address: 10.20.0.42
        mac_address: 02:42:0a:14:00:2a

  proxy-2:
    <<: *proxy
    container_name: proxy-2
    hostname: proxy-2
    command: ["fault-proxy", "--index", "2"]
    networks:
      zones:
        ipv4_address: 10.20.0.43
        mac_address: 02:42:0a:14:00:2b

  zone-0:
    <<: *zone
    container_name: zone-0
    hostname: zone-0
    entrypoint: ["/bin/bash", "/opt/zones/zone-supervisor.sh"]
    command: ["0", "/opt/zones/zone-node.sh", "0"]
    volumes:
      - shared:/shared:ro
      - zone-0-data:/data
      - fault-control:/fault-control
    networks:
      zones:
        ipv4_address: 10.20.0.11
        mac_address: 02:42:0a:14:00:0b

  zone-1:
    <<: *zone
    container_name: zone-1
    hostname: zone-1
    entrypoint: ["/bin/bash", "/opt/zones/zone-supervisor.sh"]
    command: ["1", "/opt/zones/zone-node.sh", "1"]
    volumes:
      - shared:/shared:ro
      - zone-1-data:/data
      - fault-control:/fault-control
    networks:
      zones:
        ipv4_address: 10.20.0.12
        mac_address: 02:42:0a:14:00:0c

  zone-2:
    <<: *zone
    container_name: zone-2
    hostname: zone-2
    entrypoint: ["/bin/bash", "/opt/zones/zone-supervisor.sh"]
    command: ["2", "/opt/zones/zone-node.sh", "2"]
    volumes:
      - shared:/shared:ro
      - zone-2-data:/data
      - fault-control:/fault-control
    networks:
      zones:
        ipv4_address: 10.20.0.13
        mac_address: 02:42:0a:14:00:0d

  zone-rpc:
    <<: *zone
    container_name: zone-rpc
    hostname: zone-rpc
    command: ["rpc"]
    volumes:
      - shared:/shared:ro
      - zone-rpc-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.20
        mac_address: 02:42:0a:14:00:14

  workload:
    # The node image plus the test template; see the workload target in the Dockerfile.
    image: ${WORKLOAD_IMAGE:-tempo-zones-antithesis-workload:latest}
    container_name: workload
    hostname: workload
    init: true
    # gdb -p from docker exec needs CAP_SYS_PTRACE when the kernel's Yama ptrace_scope is 1.
    cap_add:
      - SYS_PTRACE
    entrypoint: ["/opt/zones/workload.sh"]
    environment:
      ZONE_HANDOFF_DIRECT_ONLY: ${ZONE_HANDOFF_DIRECT_ONLY:-false}
    depends_on:
      provision:
        condition: service_completed_successfully
    volumes:
      - shared:/shared:ro
      - workload-state:/state
      - fault-control:/fault-control
    networks:
      zones:
        ipv4_address: 10.20.0.30
        mac_address: 02:42:0a:14:00:1e

volumes:
  shared:
  l1-data:
  zone-0-data:
  zone-1-data:
  zone-2-data:
  zone-rpc-data:
  workload-state:
  fault-control:

networks:
  zones:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
