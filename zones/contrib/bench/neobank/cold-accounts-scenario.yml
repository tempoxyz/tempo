version: 1

chains:
  zone:
    network: tempo
    rpc_url: "${ZONE_REDACTED_RPC_URL}"
    query_rpc_url: "${ZONE_RPC_URL}"
    observation:
      mode: auto
      websocket_url: "${ZONE_WS_RPC_URL}"
      poll_interval: 50ms
    request_auth:
      sender_header:
        name: X-Authorization-Token
        map: "${ZONES_BENCH_ZONE_AUTH_MAP}"
        reload_interval: 1s
    chain_id: ${ZONES_BENCH_EXPECTED_ZONE_CHAIN_ID}
    workload: ./zone-flow.yml

# Zone-only load on uncached Tempo commitments: each instance is one sponsored
# transaction whose 32 calls each load a fresh account, with no L1 deposit or
# withdrawal, so the ZonePortal deposit limit never applies.
scenario:
  name: neobank-cold-accounts
  execution: dag
  timeout: 2m

  bindings:
    account:
      account: { pool: users, select: lease }

  steps:
    - id: cold_account_calls
      submit:
        chain: zone
        template: cold_account_calls
        with:
          from: { var: account.ref }
        await: receipt
      save: cold_account_calls
