# Multi-sequencer zone on a real-consensus Tempo L1:
#
# - l1: certified follower of four validators; existing clients retain the same endpoint
# - provision: creates the zone on L1 with three sequencers (2-of-3 settlement) and writes
#   genesis, keys and the manifest to the shared volume, then exits
# - zone-0..2: the sequencer quorum; zone-0 is the initial leader
# - zone-rpc: RPC follower outside the quorum that re-proves every settled batch with the
#   native prover and runs the solvency checker
# - workload: waits until the zone replicates, then signals that setup is complete; the test
#   commands in /opt/antithesis/test run here and keep their ledger in /state
#
# Static addresses keep the P2P manifest free of DNS names. Every container_name matches its
# hostname, and init: true keeps the entrypoint off PID 1 so core dumps work.

x-zone: &zone
  image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
  entrypoint: ["/opt/zones/zone-node.sh"]
  init: true
  healthcheck: &rpc-healthcheck
    test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
    interval: 5s
    timeout: 5s
    retries: 3
    start_period: 60s
  depends_on:
    provision:
      condition: service_completed_successfully

x-l1: &l1
  image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
  entrypoint: ["/opt/zones/l1-node.sh"]
  init: true
  healthcheck: *rpc-healthcheck

services:
  l1:
    <<: *l1
    container_name: l1
    hostname: l1
    command: ["rpc"]
    depends_on:
      - l1-0
      - l1-1
      - l1-2
      - l1-3
    volumes:
      - l1-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.10

  l1-0:
    <<: *l1
    container_name: l1-0
    hostname: l1-0
    command: ["0"]
    volumes:
      - l1-0-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.41

  l1-1:
    <<: *l1
    container_name: l1-1
    hostname: l1-1
    command: ["1"]
    volumes:
      - l1-1-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.42

  l1-2:
    <<: *l1
    container_name: l1-2
    hostname: l1-2
    command: ["2"]
    volumes:
      - l1-2-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.43

  l1-3:
    <<: *l1
    container_name: l1-3
    hostname: l1-3
    command: ["3"]
    volumes:
      - l1-3-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.44

  provision:
    image: ${ZONES_IMAGE:-tempo-zones-antithesis:latest}
    container_name: provision
    hostname: provision
    init: true
    entrypoint: ["/opt/zones/provision.sh"]
    # provision.sh waits for the L1 RPC itself, with no time limit.
    depends_on:
      - l1
    volumes:
      - shared:/shared
    networks:
      zones:
        ipv4_address: 10.20.0.5

  zone-0:
    <<: *zone
    container_name: zone-0
    hostname: zone-0
    command: ["0"]
    volumes:
      - shared:/shared:ro
      - zone-0-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.11

  zone-1:
    <<: *zone
    container_name: zone-1
    hostname: zone-1
    command: ["1"]
    volumes:
      - shared:/shared:ro
      - zone-1-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.12

  zone-2:
    <<: *zone
    container_name: zone-2
    hostname: zone-2
    command: ["2"]
    volumes:
      - shared:/shared:ro
      - zone-2-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.13

  zone-rpc:
    <<: *zone
    container_name: zone-rpc
    hostname: zone-rpc
    command: ["rpc"]
    volumes:
      - shared:/shared:ro
      - zone-rpc-data:/data
    networks:
      zones:
        ipv4_address: 10.20.0.20

  workload:
    # The node image plus the test template; see the workload target in the Dockerfile.
    image: ${WORKLOAD_IMAGE:-tempo-zones-antithesis-workload:latest}
    container_name: workload
    hostname: workload
    init: true
    entrypoint: ["/opt/zones/workload.sh"]
    depends_on:
      provision:
        condition: service_completed_successfully
    volumes:
      - shared:/shared:ro
      - workload-state:/state
    networks:
      zones:
        ipv4_address: 10.20.0.30

volumes:
  shared:
  l1-data:
  l1-0-data:
  l1-1-data:
  l1-2-data:
  l1-3-data:
  zone-0-data:
  zone-1-data:
  zone-2-data:
  zone-rpc-data:
  workload-state:

networks:
  zones:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
