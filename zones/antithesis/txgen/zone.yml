# Zone side of the zone journeys: a fresh account withdraws part of its deposit back to L1.
chain_id: ${ZONE_CHAIN_ID}

gas:
  max_fee_per_gas: 20000000000
  max_priority_fee_per_gas: 0

accounts:
  fresh:
    mnemonic: "test test test test test test test test test test test junk"
    range: [${ZONE_JOURNEY_FRESH_START}, ${ZONE_JOURNEY_FRESH_END}]

artifacts:
  TIP20: ../../contrib/bench/neobank/abis/tip20.json
  ZoneOutbox: ../../contrib/bench/neobank/abis/zone-outbox.json
  ZoneInbox: ../../contrib/bench/neobank/abis/neobank-zone-inbox.json

setup: { steps: [] }

templates:
  # Envelope only; journey.yml supplies the sender and the approve + requestWithdrawal calls.
  withdraw:
    type: tempo
    from: { pool: fresh, select: random }
    gas_limit: 3000000
    fee_token: "0x20c0000000000000000000000000000000000000"
    expiring_nonce: true
    valid_for_secs: 25

mix: []
