# This workflow is intended for forks or private copies of tempoxyz/zones.
# It keeps their main and release branches aligned with upstream every hour.

name: Sync main and release branches with upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: ${{ github.repository_owner == 'tempoxyz' && github.repository != 'tempoxyz/zones' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Fetch GitHub token via STS
        id: github-sts
        uses: tempoxyz/gh-actions/actions/github-sts@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          policy: sync-from-upstream

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.github-sts.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync main and release branches with upstream
        env:
          APP_TOKEN: ${{ steps.github-sts.outputs.token }}
        run: |
          git remote add upstream https://github.com/tempoxyz/zones.git
          git fetch upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/heads/release/*:refs/remotes/upstream/release/*'
          git checkout main
          git reset --hard upstream/main
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/main:refs/heads/main' \
            '+refs/remotes/upstream/release/*:refs/heads/release/*'
