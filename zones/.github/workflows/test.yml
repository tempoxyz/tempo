name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: "sccache"
  # Pin vergen's build timestamp so reth-node-core and tempo-node compile identically across runs;
  # otherwise they and every crate depending on them miss sccache on every build.
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  build-test-artifacts:
    name: build test artifacts
    # Keep private-copy PR validation while avoiding a full test run for every
    # hourly mirror update to its main branch.
    if: github.repository == 'tempoxyz/zones' || github.event_name != 'push'
    runs-on: depot-ubuntu-latest-16
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Mint read-only Earn token
        id: earn-token
        uses: tempoxyz/gh-actions/actions/github-sts@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          scope: tempoxyz/earn
          policy: zones-read
      - name: Check out Earn contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tempoxyz/earn
          ref: main
          path: earn
          token: ${{ steps.earn-token.outputs.token }}
          persist-credentials: false
      - name: Initialize Earn public dependencies
        working-directory: earn
        # PropAMM is private and only needed by Earn's integration tests.
        run: git submodule update --init lib/forge-std lib/openzeppelin-contracts lib/openzeppelin-contracts-upgradeable
      # Share the root Rust setup and its reviewed action pins.
      - uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          tool: nextest@0.9.124
      - name: Install Foundry
        uses: tempoxyz/gh-actions/actions/setup-foundry@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          version: nightly-fc14f674bd853bc817c308a5202faa5be8df05e7

      - name: Resolve Solidity cache key
        id: solidity-key
        run: |
          {
            echo "forge-sha=$(forge --version | sed -n 's/^Commit SHA: //p')"
            echo "contracts-tree=$(git rev-parse HEAD:crates/contracts)"
            echo "earn-sha=$(git -C earn rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Solidity artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            earn/cache
            crates/contracts/cache
            crates/contracts/out
          key: forge-v2-${{ runner.os }}-${{ steps.solidity-key.outputs.forge-sha }}-${{ steps.solidity-key.outputs.contracts-tree }}-${{ steps.solidity-key.outputs.earn-sha }}

      # Earn vendors a partial IZone.sol, so build it first and let the Zones
      # interface artifacts, which the ABI conformance test reads, overwrite it.
      - name: Build Solidity artifacts
        run: |
          forge build \
            --root earn \
            --skip test \
            --skip script \
            --no-lint \
            --out "$GITHUB_WORKSPACE/crates/contracts/out"
          forge build --root crates/contracts --no-lint

      - name: Build and archive tests
        run: cargo nextest archive --profile ci --archive-file nextest-archive.tar.zst

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: |
            nextest-archive.tar.zst
            crates/contracts/out
          if-no-files-found: error
          retention-days: 1
          # The nextest archive is already zstd-compressed; recompressing it is
          # slower and does not materially reduce artifact transfer size.
          compression-level: 0

  test:
    name: test (${{ matrix.partition }}/4)
    runs-on: depot-ubuntu-latest-16
    needs: build-test-artifacts
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # The run phase consumes prebuilt binaries and does not need Rust/Cargo.
      - name: Prepare nextest install directory
        run: mkdir -p "$HOME/.cargo/bin"

      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          tool: nextest@0.9.124

      - name: Download test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
          path: .

      - name: Run test shard
        run: |
          cargo-nextest nextest run \
            --archive-file nextest-archive.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci \
            --partition hash:${{ matrix.partition }}/4

  test-success:
    name: test success
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.repository == 'tempoxyz/zones' || github.event_name != 'push')
    permissions:
      id-token: write
    needs:
      - build-test-artifacts
      - test
    timeout-minutes: 30
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Decide whether the needed jobs succeeded or failed
        uses: tempoxyz/gh-actions/actions/check-needs@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          jobs: ${{ toJSON(needs) }}
